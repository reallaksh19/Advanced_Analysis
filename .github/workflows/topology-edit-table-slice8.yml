name: Topology Edit Table Slice 8

on:
  push:
    paths:
      - 'public/fixtures/topology-edit-table-q3-exact.staged.json'
      - 'src/workspace/topology-edit/topology-edit-stagedjson-engineering-source.js'
      - 'src/workspace/topology-edit/topology-edit-source-adapter.js'
      - 'src/workspace/topology-edit/export/topology-edit-stagedjson-engineering-writeback.js'
      - 'src/workspace/topology-edit/export/topology-edit-stagedjson-writeback.js'
      - 'src/workspace/topology-edit/export/topology-edit-roundtrip-semantics.js'
      - 'tests/topology-edit-table-q3-fixture.test.mjs'
      - 'tests/topology-edit-table-q3-source-capability.test.mjs'
      - 'tests/topology-edit-roundtrip-semantics.test.mjs'
      - '.github/workflows/topology-edit-table-slice8.yml'
  pull_request:
    paths:
      - 'public/fixtures/topology-edit-table-q3-exact.staged.json'
      - 'src/workspace/topology-edit/**'
      - 'tests/topology-edit-table-q3-fixture.test.mjs'
      - 'tests/topology-edit-table-q3-source-capability.test.mjs'
      - 'tests/topology-edit-stagedjson-roundtrip.test.mjs'
      - 'tests/topology-edit-roundtrip-semantics.test.mjs'
      - 'e2e/topology-edit-table-q3-concurrency.spec.js'
      - '.github/workflows/topology-edit-table-slice8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-stagedjson-engineering-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact HEAD line and architecture guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          files=(
            src/workspace/topology-edit/topology-edit-stagedjson-engineering-source.js
            src/workspace/topology-edit/export/topology-edit-stagedjson-engineering-writeback.js
            tests/topology-edit-table-q3-source-capability.test.mjs
          )
          for file in "${files[@]}"; do
            test "$(git show "HEAD:$file" | wc -l)" -lt 300
            node --check "$file"
          done
          node --check src/workspace/topology-edit/topology-edit-source-adapter.js
          node --check src/workspace/topology-edit/export/topology-edit-stagedjson-writeback.js
          node --check src/workspace/topology-edit/export/topology-edit-roundtrip-semantics.js
          node --check tests/topology-edit-table-q3-fixture.test.mjs
          node --check tests/topology-edit-roundtrip-semantics.test.mjs
          ! grep -REn 'WorkspaceState|loadDataset\(|swapDataset\(|session\.execute\(|new (WebGLRenderer|TopologyEditViewportBackend)' \
            src/workspace/topology-edit/topology-edit-stagedjson-engineering-source.js \
            src/workspace/topology-edit/export/topology-edit-stagedjson-engineering-writeback.js \
            src/workspace/topology-edit/export/topology-edit-stagedjson-writeback.js
          ! grep -REn 'proximity|nearest|distance.*identity|geometry.*identity|last[-_ ]write[-_ ]wins' \
            src/workspace/topology-edit/topology-edit-stagedjson-engineering-source.js \
            src/workspace/topology-edit/export/topology-edit-stagedjson-engineering-writeback.js
          git diff --check
      - name: Q3 canonical import and engineering source roundtrip
        run: |
          node --test tests/topology-edit-table-q3-fixture.test.mjs
          node --test tests/topology-edit-table-q3-source-capability.test.mjs
      - name: Retained StagedJSON and semantic comparison contracts
        run: |
          node --test tests/topology-edit-stagedjson-roundtrip.test.mjs
          node --test tests/topology-edit-roundtrip-semantics.test.mjs
          node --test tests/topology-edit-table-m04-m06-m10.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Bundle ownership contract
        run: node scripts/bundle-chunk-ownership-check.mjs
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production Q3 and concurrency Chromium regression
        run: npx playwright test e2e/topology-edit-table-q3-concurrency.spec.js --project=chromium --workers=1 --retries=0 --reporter=line
      - name: Retained production Table Chromium lifecycle
        run: npx playwright test e2e/topology-edit-table-authority.spec.js --project=chromium --workers=1 --retries=0 --reporter=line
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-table-slice8-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: |
            reports/qualification/topology-edit-table-authority.json
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
