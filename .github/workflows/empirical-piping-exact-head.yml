name: empirical-piping-exact-head

on:
  pull_request:
    paths:
      - 'src/core/empirical-piping-mechanics/**'
      - 'src/core/empirical-support-frame-screen/**'
      - 'src/workspace/engineering-loads/contracts/empirical-sjson-contracts.js'
      - 'src/workspace/engineering-loads/adapters/sjson-to-empirical-piping-request.js'
      - 'src/workspace/engineering-loads/empirical-method-registry.js'
      - 'src/workspace/engineering-loads/empirical-beam-contact-*.js'
      - 'src/workspace/engineering-loads/authorized-empirical-beam-contact-execution.js'
      - 'src/workspace/engineering-loads/empirical-load-calc-scenario-*.js'
      - 'src/workspace/engineering-loads/empirical-result-overlay*.js'
      - 'src/workspace/topology-edit/topology-edit-empirical-result-renderer-v1.js'
      - 'src/workspace/topology-edit/topology-edit-sjson-governed-viewport-backend-v2.js'
      - 'src/workspace/load-calc-consumer-controller.js'
      - 'src/workspace/load-calc-consumer-view.js'
      - 'src/workspace/bootstrap.js'
      - 'benchmarks/empirical-piping/**'
      - 'docs/empirical-piping-agent-qualification-and-work-pack.md'
      - 'docs/empirical-piping-engineering-basis-and-benchmark.md'
      - 'scripts/empirical-piping-*.mjs'
      - 'scripts/empirical-sjson-adapter-contract-check.mjs'
      - 'scripts/empirical-beam-contact-runtime-check.mjs'
      - 'scripts/empirical-beam-contact-elbow-runtime-check.mjs'
      - 'scripts/empirical-load-calc-scenario-check.mjs'
      - 'scripts/empirical-result-overlay-check.mjs'
      - 'scripts/advanced-shell-contract-check.mjs'
      - '.github/workflows/empirical-piping-exact-head.yml'
      - '.github/workflows/empirical-sjson-adapter-wp1.yml'
      - '.github/workflows/empirical-beam-contact-wp2.yml'
      - '.github/workflows/empirical-load-calc-wp3.yml'
      - '.github/workflows/empirical-result-overlays-wp4.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install declared dependencies
        run: npm ci

      - name: Prove exact-head execution
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code

      - name: Enforce changed-path containment
        shell: bash
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > /tmp/empirical-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              src/core/empirical-piping-mechanics/*|src/core/empirical-support-frame-screen/*|src/workspace/engineering-loads/contracts/empirical-sjson-contracts.js|src/workspace/engineering-loads/adapters/sjson-to-empirical-piping-request.js|src/workspace/engineering-loads/empirical-method-registry.js|src/workspace/engineering-loads/empirical-beam-contact-*.js|src/workspace/engineering-loads/authorized-empirical-beam-contact-execution.js|src/workspace/engineering-loads/empirical-load-calc-scenario-*.js|src/workspace/engineering-loads/empirical-result-overlay*.js|src/workspace/topology-edit/topology-edit-empirical-result-renderer-v1.js|src/workspace/topology-edit/topology-edit-sjson-governed-viewport-backend-v2.js|src/workspace/load-calc-consumer-controller.js|src/workspace/load-calc-consumer-view.js|src/workspace/bootstrap.js|benchmarks/empirical-piping/*|docs/empirical-piping-agent-qualification-and-work-pack.md|docs/empirical-piping-engineering-basis-and-benchmark.md|scripts/empirical-piping-*.mjs|scripts/empirical-sjson-adapter-contract-check.mjs|scripts/empirical-beam-contact-runtime-check.mjs|scripts/empirical-beam-contact-elbow-runtime-check.mjs|scripts/empirical-load-calc-scenario-check.mjs|scripts/empirical-result-overlay-check.mjs|scripts/advanced-shell-contract-check.mjs|.github/workflows/empirical-piping-exact-head.yml|.github/workflows/empirical-sjson-adapter-wp1.yml|.github/workflows/empirical-beam-contact-wp2.yml|.github/workflows/empirical-load-calc-wp3.yml|.github/workflows/empirical-result-overlays-wp4.yml) ;;
              *) echo "Forbidden changed path for this work-pack slice: $changed"; exit 1 ;;
            esac
          done < /tmp/empirical-paths.txt

      - name: Source and benchmark isolation
        run: node scripts/empirical-piping-source-boundary-check.mjs

      - name: SJSON adapter contracts
        run: node scripts/empirical-sjson-adapter-contract-check.mjs

      - name: Authorized beam/contact runtime bridge
        run: node scripts/empirical-beam-contact-runtime-check.mjs

      - name: Elbow and region-planarity runtime bridge
        run: node scripts/empirical-beam-contact-elbow-runtime-check.mjs

      - name: Load Calc scenario and UI contracts
        run: node scripts/empirical-load-calc-scenario-check.mjs

      - name: Governed result projection, picking and stale clearing
        run: node scripts/empirical-result-overlay-check.mjs

      - name: Load Calc shell invariants
        run: node scripts/advanced-shell-contract-check.mjs

      - name: Closed-form mechanics
        run: node scripts/empirical-piping-closed-form-check.mjs

      - name: Contact and load-case decomposition
        run: node scripts/empirical-piping-contact-check.mjs

      - name: Member actions and bend station recovery
        run: node scripts/empirical-piping-action-recovery-check.mjs

      - name: Elbow convergence
        run: node scripts/empirical-piping-elbow-convergence-check.mjs

      - name: Table S302.6.3 sustained stress
        run: node scripts/empirical-piping-s302.6.3-check.mjs

      - name: Determinism
        run: node scripts/empirical-piping-determinism-check.mjs

      - name: Anti-drift mutations
        run: node scripts/empirical-piping-anti-drift-check.mjs
