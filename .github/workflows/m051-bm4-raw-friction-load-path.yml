name: M051 BM4 Raw Friction Load Path

on:
  pull_request:
    paths:
      - 'scripts/lfea-m051-bm4-raw-friction-load-path.mjs'
      - '.github/workflows/m051-bm4-raw-friction-load-path.yml'
  workflow_dispatch:

jobs:
  raw-friction-load-path:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and line-count gate
        run: |
          node --check scripts/lfea-m051-bm4-raw-friction-load-path.mjs
          test "$(wc -l < scripts/lfea-m051-bm4-raw-friction-load-path.mjs)" -le 300
      - name: Inventory raw friction restraint load path
        run: node scripts/lfea-m051-bm4-raw-friction-load-path.mjs --report /tmp/m051-raw-friction-load-path.json
      - name: Preserve raw face friction and M036 baselines
        run: |
          node scripts/lfea-m050-bm4-restraint-face-authority.mjs
          node scripts/lfea-m049-bm4-contact-gap-state-rca.mjs
          node scripts/lfea-m040-bm4-friction-check.mjs
          npm run check:lfea-m036
      - name: Upload deterministic M051 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m051-bm4-raw-friction-load-path-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/m051-raw-friction-load-path.json
          if-no-files-found: error
      - name: Verify clean worktree
        run: git diff --exit-code && git status --porcelain | tee /tmp/m051-status && test ! -s /tmp/m051-status
