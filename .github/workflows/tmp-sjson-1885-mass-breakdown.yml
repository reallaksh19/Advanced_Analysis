name: Finalize SJSON node and POS schedule authority

on:
  push:
    branches:
      - agent/sjson-1885-configurable-screening
    paths:
      - .github/workflows/tmp-sjson-1885-mass-breakdown.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sjson-1885-configurable-screening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run corrected POS-trace handoff
        run: python scripts/tmp-finalize-sjson-node-pos-v3.py
