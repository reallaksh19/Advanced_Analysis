name: Finalize governed SJSON mass breakdown

on:
  push:
    branches:
      - agent/sjson-1885-configurable-screening
    paths:
      - .github/workflows/tmp-sjson-1885-mass-breakdown.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sjson-1885-configurable-screening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add mandatory constituent mass ledgers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runner_path = Path('scripts/empirical-sjson-1885-configurable-screening-run.mjs')
          runner = runner_path.read_text()

          old = """    const fz = weightResult.reactionBySite.get(site.key) || 0;
    return {
"""
          new = """    const fz = weightResult.reactionBySite.get(site.key) || 0;
    const verticalMass = weightResult.massBySite.get(site.key) || emptyMass();
    return {
"""
          assert old in runner
          runner = runner.replace(old, new, 1)

          old = """      reactionsKn: {
        FxThermal: round(fx, profile.reporting.roundingDecimals),
        FyThermal: round(fy, profile.reporting.roundingDecimals),
        FzWeight: round(fz, profile.reporting.roundingDecimals),
      },
      componentVectorMagnitudeKn: round(Math.hypot(fx, fy, fz), profile.reporting.roundingDecimals),
"""
          new = """      reactionsKn: {
        FxThermal: round(fx, profile.reporting.roundingDecimals),
        FyThermal: round(fy, profile.reporting.roundingDecimals),
        FzWeight: round(fz, profile.reporting.roundingDecimals),
      },
      verticalMassBreakdown: {
        kg: roundMass(verticalMass, 9),
        gravityMPerS2: profile.weight.gravityMPerS2,
        reactionKn: round(verticalMass.total * profile.weight.gravityMPerS2 / 1000, 6),
      },
      componentVectorMagnitudeKn: round(Math.hypot(fx, fy, fz), profile.reporting.roundingDecimals),
"""
          assert old in runner
          runner = runner.replace(old, new, 1)

          old = """    massByTreatmentKg: mapValues(weightResult.massByTreatmentKg, (value) => round(value, 6)),
    elementCountByTreatment: weightResult.elementCountByTreatment,
  },
"""
          new = """    massByTreatmentKg: mapValues(weightResult.massByTreatmentKg, (value) => round(value, 6)),
    elementCountByTreatment: weightResult.elementCountByTreatment,
    massByConstituentKg: roundMass(weightResult.massByConstituentKg, 9),
    elementMassBreakdown: weightResult.elementMassBreakdown.map(serializeElementMassBreakdown),
    supportMassBreakdown: rows.map((row) => ({
      siteId: row.siteId,
      supportTag: row.supportTag,
      kg: row.verticalMassBreakdown.kg,
      gravityMPerS2: row.verticalMassBreakdown.gravityMPerS2,
      reactionKn: row.verticalMassBreakdown.reactionKn,
    })),
  },
"""
          assert old in runner
          runner = runner.replace(old, new, 1)

          runner = runner.replace(
            "    'Vertical reactions use graph tributary weight, not flexural beam analysis.',\n",
            "    'Vertical reactions use graph tributary weight, not flexural beam analysis.',\n    'Every vertical result includes metal, fluid, insulation, and total mass rates and masses before conversion to force.',\n",
            1,
          )

          replacement = r'''function calculateTributaryWeight(model, sites, sourceIndex, config) {
  const supportSites = sites.filter((site) => site.capabilities.has('REST'));
  const nodalMassKg = new Map([...model.nodes.keys()].map((id) => [id, emptyMass()]));
  const massByTreatmentKg = {};
  const elementCountByTreatment = {};
  const massByConstituentKg = emptyMass();
  const elementMassBreakdown = [];
  for (const edge of model.edges) {
    const source = resolveSourceRecord(edge, sourceIndex);
    const detail = elementMass(edge, source, config);
    addMass(massByConstituentKg, detail.kg);
    massByTreatmentKg[detail.treatment] = (massByTreatmentKg[detail.treatment] || 0) + detail.massKg;
    elementCountByTreatment[detail.treatment] = (elementCountByTreatment[detail.treatment] || 0) + 1;
    addMass(nodalMassKg.get(edge.fromNode), detail.kg, 0.5);
    addMass(nodalMassKg.get(edge.toNode), detail.kg, 0.5);
    elementMassBreakdown.push({
      edgeId: edge.id,
      fromNode: edge.fromNode,
      toNode: edge.toNode,
      sourceType: edge.sourceType,
      sourceName: edge.name,
      treatment: detail.treatment,
      metalBasis: detail.metalBasis,
      metalFactor: detail.metalFactor,
      lengthM: edge.lengthM,
      kgPerM: detail.kgPerM,
      kg: detail.kg,
    });
  }
  const adjacency = buildAdjacency(model.edges);
  const distanceBySupport = new Map(supportSites.map((site) => [site.key, dijkstra(adjacency, site.nodeId)]));
  const massBySite = new Map(supportSites.map((site) => [site.key, emptyMass()]));
  for (const [nodeId, nodeMass] of nodalMassKg) {
    if (nodeMass.total === 0) continue;
    let minimum = Infinity;
    const owners = [];
    for (const site of supportSites) {
      const value = distanceBySupport.get(site.key).get(nodeId) ?? Infinity;
      if (value < minimum - 1e-9) {
        minimum = value;
        owners.length = 0;
        owners.push(site);
      } else if (Math.abs(value - minimum) <= 1e-9) owners.push(site);
    }
    if (!Number.isFinite(minimum) || owners.length === 0) throw new Error(`No connected vertical support found for node ${nodeId}.`);
    for (const owner of owners) addMass(massBySite.get(owner.key), nodeMass, 1 / owners.length);
  }
  const reactionBySite = new Map([...massBySite.entries()].map(([key, mass]) => [
    key,
    mass.total * config.weight.gravityMPerS2 / 1000,
  ]));
  return {
    status: 'CALCULATED_CONFIGURABLE_SCREENING',
    totalMassKg: massByConstituentKg.total,
    totalWeightN: massByConstituentKg.total * config.weight.gravityMPerS2,
    reactionBySite,
    massBySite,
    massByConstituentKg,
    elementMassBreakdown,
    massByTreatmentKg,
    elementCountByTreatment,
  };
}
'''
          runner, count = re.subn(r'function calculateTributaryWeight\(model, sites, sourceIndex, config\) \{.*?\n\}\n\n(?=function calculateThermalAxis)', replacement + '\n', runner, flags=re.S)
          assert count == 1, count

          replacement = r'''function elementMass(edge, source, config) {
  const type = edge.sourceType;
  const lengthM = Math.max(0, edge.lengthM);
  const overrideWeight = configuredComponentWeight(edge, source, config);
  if (type === 'GASK') {
    const gasketMassKg = Math.max(0, Number(config.weight.gasketMassKgPerComponent || 0));
    return buildMassResult({
      lengthM,
      metalKg: gasketMassKg,
      fluidKg: 0,
      insulationKg: 0,
      metalBasis: gasketMassKg > 0 ? 'CONFIGURED_GASKET_LUMPED' : 'ZERO_GASKET',
      metalFactor: null,
      treatment: gasketMassKg > 0 ? 'GASK_CONFIG_OVERRIDE' : 'GASKET_ZERO',
    });
  }
  const section = sectionProperties(edge, source, config);
  const pipeMetalKgPerM = section.areaM2 * section.densityKgM3;
  const insulationThicknessM = (source?.insulationThicknessMm || 0) / 1000;
  const outerM = section.odM;
  const insulationArea = Math.PI / 4 * ((outerM + 2 * insulationThicknessM) ** 2 - outerM ** 2);
  const insulationKgPerM = insulationArea * config.weight.insulationDensityKgM3;
  const fluidArea = Math.PI / 4 * section.idM ** 2;
  const fluidKgPerM = fluidArea * (edge.fluidDensityKgM3 || source?.fluidDensityKgM3 || 0);
  const insulationKg = insulationKgPerM * lengthM;
  const fluidKg = fluidKgPerM * lengthM;
  if (overrideWeight > 0) {
    return buildMassResult({
      lengthM,
      metalKg: overrideWeight,
      fluidKg,
      insulationKg,
      metalBasis: 'CONFIGURED_COMPONENT_DRY_WEIGHT',
      metalFactor: null,
      treatment: `${type}_CONFIG_OVERRIDE`,
    });
  }
  const availableComponentWeight = source?.componentWeightKg || 0;
  if (['FLAN', 'VALV', 'INST'].includes(type) && availableComponentWeight > 0) {
    return buildMassResult({
      lengthM,
      metalKg: availableComponentWeight,
      fluidKg,
      insulationKg,
      metalBasis: 'SOURCE_COMPONENT_DRY_WEIGHT',
      metalFactor: null,
      treatment: `${type}_SOURCE_WEIGHT`,
    });
  }
  const factor = Number(config.weight.pipeEquivalentMassFactorByType?.[type] ?? 1);
  return buildMassResult({
    lengthM,
    metalKg: factor * pipeMetalKgPerM * lengthM,
    fluidKg,
    insulationKg,
    metalBasis: 'PIPE_SECTION_EQUIVALENT',
    metalFactor: factor,
    treatment: ['TEE', 'OLET'].includes(type)
      ? `${type}_PIPE_EQUIVALENT`
      : (['FLAN', 'VALV', 'INST'].includes(type) ? `${type}_PIPE_EQUIVALENT_FALLBACK` : `${type}_PIPE_SPAN`),
  });
}

function buildMassResult({ lengthM, metalKg, fluidKg, insulationKg, metalBasis, metalFactor, treatment }) {
  const kg = {
    metal: metalKg,
    fluid: fluidKg,
    insulation: insulationKg,
    total: metalKg + fluidKg + insulationKg,
  };
  const rate = (massKg) => lengthM > 0 ? massKg / lengthM : (massKg === 0 ? 0 : null);
  const kgPerM = {
    metal: rate(kg.metal),
    fluid: rate(kg.fluid),
    insulation: rate(kg.insulation),
    total: rate(kg.total),
  };
  return { massKg: kg.total, treatment, metalBasis, metalFactor, kgPerM, kg };
}

function emptyMass() { return { metal: 0, fluid: 0, insulation: 0, total: 0 }; }
function addMass(target, source, factor = 1) {
  for (const key of ['metal', 'fluid', 'insulation', 'total']) target[key] += (source[key] || 0) * factor;
  return target;
}
function roundMass(value, decimals) {
  return {
    metal: value.metal == null ? null : round(value.metal, decimals),
    fluid: value.fluid == null ? null : round(value.fluid, decimals),
    insulation: value.insulation == null ? null : round(value.insulation, decimals),
    total: value.total == null ? null : round(value.total, decimals),
  };
}
function serializeElementMassBreakdown(row) {
  return {
    ...row,
    lengthM: round(row.lengthM, 9),
    kgPerM: roundMass(row.kgPerM, 9),
    kg: roundMass(row.kg, 9),
  };
}
'''
          runner, count = re.subn(r'function elementMass\(edge, source, config\) \{.*?\n\}\n\n(?=function configuredComponentWeight)', replacement + '\n', runner, flags=re.S)
          assert count == 1, count
          runner_path.write_text(runner)

          csv_script = r'''import { readFile, writeFile } from 'node:fs/promises';

const [resultPath, supportCsvPath, elementCsvPath] = process.argv.slice(2);
if (!resultPath || !supportCsvPath || !elementCsvPath) {
  throw new Error('Usage: node empirical-sjson-1885-mass-csv.mjs <result.json> <support.csv> <element.csv>');
}
const result = JSON.parse(await readFile(resultPath, 'utf8'));
const value = (input) => input == null ? '' : input;
const csv = (input) => {
  const text = String(value(input));
  return /[",\r\n]/.test(text) ? `"${text.replaceAll('"', '""')}"` : text;
};
const line = (values) => values.map(csv).join(',');

const supportHeaders = [
  'siteId','supportTag','xMm','yMm','zMm','capabilities','directionAxes',
  'FxThermal_kN','FyThermal_kN','metal_kg','fluid_kg','insulation_kg','total_kg',
  'FzWeight_kN','componentVectorMagnitude_kN','thermalMovementX_mm','thermalMovementY_mm',
];
const supportLines = [line(supportHeaders)];
for (const row of result.supportRows) {
  const mass = row.verticalMassBreakdown.kg;
  supportLines.push(line([
    row.siteId,row.supportTag,row.sourceCoordinateMm.x,row.sourceCoordinateMm.y,row.sourceCoordinateMm.z,
    row.capabilities.join('+'),row.inferredDirections.map((item) => `${item.capability}:${item.axis}`).join('+'),
    row.reactionsKn.FxThermal,row.reactionsKn.FyThermal,mass.metal,mass.fluid,mass.insulation,mass.total,
    row.reactionsKn.FzWeight,row.componentVectorMagnitudeKn,row.thermalMovementMm.X,row.thermalMovementMm.Y,
  ]));
}
await writeFile(supportCsvPath, `${supportLines.join('\n')}\n`);

const elementHeaders = [
  'edgeId','fromNode','toNode','sourceType','sourceName','treatment','metalBasis','metalFactor','length_m',
  'metal_kg_per_m','fluid_kg_per_m','insulation_kg_per_m','total_kg_per_m',
  'metal_kg','fluid_kg','insulation_kg','total_kg',
];
const elementLines = [line(elementHeaders)];
for (const row of result.verticalWeight.elementMassBreakdown) {
  elementLines.push(line([
    row.edgeId,row.fromNode,row.toNode,row.sourceType,row.sourceName,row.treatment,row.metalBasis,row.metalFactor,row.lengthM,
    row.kgPerM.metal,row.kgPerM.fluid,row.kgPerM.insulation,row.kgPerM.total,
    row.kg.metal,row.kg.fluid,row.kg.insulation,row.kg.total,
  ]));
}
await writeFile(elementCsvPath, `${elementLines.join('\n')}\n`);
'''
          Path('scripts/empirical-sjson-1885-mass-csv.mjs').write_text(csv_script)

          check_path = Path('scripts/empirical-sjson-1885-configurable-screening-check.mjs')
          check = check_path.read_text()
          anchor = """assertEqual(result.verticalWeight.elementCountByTreatment.INST_PIPE_EQUIVALENT_FALLBACK, 3, 'instrument fallback count');

"""
          addition = r'''assertEqual(result.verticalWeight.elementMassBreakdown.length, 163, 'element mass-breakdown count');
assertEqual(result.verticalWeight.supportMassBreakdown.length, 36, 'support mass-breakdown count');
const globalMass = result.verticalWeight.massByConstituentKg;
assertClose(globalMass.metal + globalMass.fluid + globalMass.insulation, globalMass.total, 2e-6, 'global constituent mass closure');
assertClose(globalMass.total, result.verticalWeight.totalModelMassKg, 2e-6, 'global mass ledger total');
for (const row of result.verticalWeight.elementMassBreakdown) {
  assertEqual(typeof row.metalBasis, 'string', `${row.edgeId} metal basis`);
  assertClose(row.kg.metal + row.kg.fluid + row.kg.insulation, row.kg.total, 3e-6, `${row.edgeId} constituent mass closure`);
  if (row.lengthM > 0) {
    for (const key of ['metal', 'fluid', 'insulation', 'total']) {
      assertClose(row.kgPerM[key] * row.lengthM, row.kg[key], 3e-6, `${row.edgeId} ${key} rate-to-mass closure`);
    }
  }
}
const supportMassTotals = { metal: 0, fluid: 0, insulation: 0, total: 0 };
for (const row of result.supportMassBreakdown) {
  assertClose(row.kg.metal + row.kg.fluid + row.kg.insulation, row.kg.total, 3e-6, `${row.siteId} support constituent closure`);
  assertClose(row.kg.total * row.gravityMPerS2 / 1000, row.reactionKn, 2e-6, `${row.siteId} mass-to-force closure`);
  for (const key of Object.keys(supportMassTotals)) supportMassTotals[key] += row.kg[key];
}
for (const key of Object.keys(supportMassTotals)) {
  assertClose(supportMassTotals[key], globalMass[key], 5e-6, `support allocation ${key} closure`);
}

'''
          assert anchor in check
          check = check.replace(anchor, anchor + addition, 1)
          old = """if (rows.get('N50120').reactionsKn.FzWeight < 1.85) throw new Error('N50120 vertical reaction regressed toward the superseded steel-only value.');
"""
          new = """if (rows.get('N50120').reactionsKn.FzWeight < 1.85) throw new Error('N50120 vertical reaction regressed toward the superseded steel-only value.');
const n50120Mass = rows.get('N50120').verticalMassBreakdown.kg;
if (n50120Mass.metal < 158 || n50120Mass.fluid < 31 || n50120Mass.insulation !== 0) {
  throw new Error(`N50120 mass breakup is not credible: ${JSON.stringify(n50120Mass)}.`);
}
assertClose(n50120Mass.total * result.configurableAssumptions.weight.gravityMPerS2 / 1000, rows.get('N50120').verticalMassBreakdown.reactionKn, 2e-6, 'N50120 mass-to-force chain');
"""
          assert old in check
          check = check.replace(old, new, 1)
          check_path.write_text(check)

          workflow_path = Path('.github/workflows/sjson-1885-configurable-screening.yml')
          workflow = workflow_path.read_text()
          workflow = workflow.replace(
            '      - benchmarks/1885Sjson/empirical-screening-result.configurable.csv\n',
            '      - benchmarks/1885Sjson/empirical-screening-result.configurable.csv\n      - benchmarks/1885Sjson/empirical-screening-element-mass-breakdown.configurable.csv\n',
          )
          workflow = workflow.replace(
            '      - scripts/empirical-sjson-1885-configurable-screening-check.mjs\n',
            '      - scripts/empirical-sjson-1885-configurable-screening-check.mjs\n      - scripts/empirical-sjson-1885-mass-csv.mjs\n',
          )
          old = """          cmp /tmp/result-a.json /tmp/result-b.json
          cmp /tmp/result-a.json benchmarks/1885Sjson/empirical-screening-result.configurable.json
          node scripts/empirical-sjson-1885-configurable-screening-check.mjs /tmp/result-a.json
"""
          new = """          cmp /tmp/result-a.json /tmp/result-b.json
          cmp /tmp/result-a.json benchmarks/1885Sjson/empirical-screening-result.configurable.json
          node scripts/empirical-sjson-1885-mass-csv.mjs /tmp/result-a.json /tmp/support-a.csv /tmp/element-a.csv
          node scripts/empirical-sjson-1885-mass-csv.mjs /tmp/result-b.json /tmp/support-b.csv /tmp/element-b.csv
          cmp /tmp/support-a.csv /tmp/support-b.csv
          cmp /tmp/element-a.csv /tmp/element-b.csv
          cmp /tmp/support-a.csv benchmarks/1885Sjson/empirical-screening-result.configurable.csv
          cmp /tmp/element-a.csv benchmarks/1885Sjson/empirical-screening-element-mass-breakdown.configurable.csv
          node scripts/empirical-sjson-1885-configurable-screening-check.mjs /tmp/result-a.json
"""
          assert old in workflow
          workflow = workflow.replace(old, new, 1)
          workflow = workflow.replace(
            '            benchmarks/1885Sjson/empirical-screening-result.configurable.csv\n',
            '            benchmarks/1885Sjson/empirical-screening-result.configurable.csv\n            benchmarks/1885Sjson/empirical-screening-element-mass-breakdown.configurable.csv\n',
            1,
          )
          workflow_path.write_text(workflow)

          evidence_path = Path('docs/evidence/SJSON_1885_CONFIGURABLE_SCREENING.md')
          evidence = evidence_path.read_text()
          section = r'''## Mandatory vertical mass calculation chain

Every vertical reaction now carries a governed constituent ledger before force conversion:

1. element length in metres;
2. metal, fluid, and insulation mass rates in `kg/m`;
3. metal, fluid, and insulation masses in `kg`;
4. total mass in `kg`;
5. vertical reaction from `total kg × 9.80665 / 1000` in `kN`.

The full 163-element rate-and-mass ledger is published in `empirical-screening-element-mass-breakdown.configurable.csv`. Each of the 36 support rows also publishes allocated metal, fluid, insulation, and total tributary mass. Lumped configured/source component dry weights remain in the metal column with an explicit `metalBasis`; they are not silently represented as pipe-section mass.

For N50120 / PS-12169, the current tributary chain is approximately:

| Constituent | kg/m | Tributary length (m) | kg |
|---|---:|---:|---:|
| Metal | 28.2635 | 5.600014 | 158.276 |
| Fluid | 5.5937 | 5.600014 | 31.325 |
| Insulation | 0.0000 | 5.600014 | 0.000 |
| **Total** | **33.8572** | **5.600014** | **189.601** |

The resulting reaction is `189.601 × 9.80665 / 1000 = 1.859 kN`.

'''
          assert '## Global checks\n' in evidence
          evidence = evidence.replace('## Global checks\n', section + '## Global checks\n', 1)
          evidence_path.write_text(evidence)
          PY
      - name: Materialize exact source and regenerate governed receipts
        run: |
          git show 07ce017eb7113517cc032771f7717f88c0a93d4c:benchmarks/1885Sjson/EnrichedSjson > /tmp/EnrichedSjson
          git show 07ce017eb7113517cc032771f7717f88c0a93d4c:benchmarks/1885Sjson/EnrichedSjson.topology.input.xml > /tmp/EnrichedSjson.topology.input.xml
          node scripts/empirical-sjson-1885-configurable-screening-run.mjs \
            benchmarks/1885Sjson/empirical-screening-profile.config.json \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.topology.input.xml \
            /tmp/result.json
          node scripts/empirical-sjson-1885-mass-csv.mjs \
            /tmp/result.json \
            /tmp/support.csv \
            /tmp/element.csv
          cp /tmp/result.json benchmarks/1885Sjson/empirical-screening-result.configurable.json
          cp /tmp/support.csv benchmarks/1885Sjson/empirical-screening-result.configurable.csv
          cp /tmp/element.csv benchmarks/1885Sjson/empirical-screening-element-mass-breakdown.configurable.csv
          node scripts/empirical-sjson-1885-configurable-screening-check.mjs /tmp/result.json
          git diff --check
      - name: Recalculate twice and compare all ledgers
        run: |
          node scripts/empirical-sjson-1885-configurable-screening-run.mjs \
            benchmarks/1885Sjson/empirical-screening-profile.config.json \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.topology.input.xml \
            /tmp/result-a.json
          node scripts/empirical-sjson-1885-configurable-screening-run.mjs \
            benchmarks/1885Sjson/empirical-screening-profile.config.json \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.topology.input.xml \
            /tmp/result-b.json
          cmp /tmp/result-a.json /tmp/result-b.json
          cmp /tmp/result-a.json benchmarks/1885Sjson/empirical-screening-result.configurable.json
          node scripts/empirical-sjson-1885-mass-csv.mjs /tmp/result-a.json /tmp/support-a.csv /tmp/element-a.csv
          node scripts/empirical-sjson-1885-mass-csv.mjs /tmp/result-b.json /tmp/support-b.csv /tmp/element-b.csv
          cmp /tmp/support-a.csv /tmp/support-b.csv
          cmp /tmp/element-a.csv /tmp/element-b.csv
          cmp /tmp/support-a.csv benchmarks/1885Sjson/empirical-screening-result.configurable.csv
          cmp /tmp/element-a.csv benchmarks/1885Sjson/empirical-screening-element-mass-breakdown.configurable.csv
          node scripts/empirical-sjson-1885-configurable-screening-check.mjs /tmp/result-a.json
      - name: Publish permanent change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-sjson-1885-mass-breakdown.yml
          git add \
            .github/workflows/sjson-1885-configurable-screening.yml \
            benchmarks/1885Sjson/empirical-screening-result.configurable.json \
            benchmarks/1885Sjson/empirical-screening-result.configurable.csv \
            benchmarks/1885Sjson/empirical-screening-element-mass-breakdown.configurable.csv \
            docs/evidence/SJSON_1885_CONFIGURABLE_SCREENING.md \
            scripts/empirical-sjson-1885-configurable-screening-run.mjs \
            scripts/empirical-sjson-1885-configurable-screening-check.mjs \
            scripts/empirical-sjson-1885-mass-csv.mjs
          git commit -m "Require constituent mass breakup for vertical reactions"
          git push origin HEAD:agent/sjson-1885-configurable-screening
