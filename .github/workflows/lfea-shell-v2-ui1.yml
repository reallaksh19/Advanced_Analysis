name: LFEA Shell V2 UI-1

on:
  push:
    branches:
      - codex/lfea-shell-v2-ui1
  pull_request:
    branches:
      - claude/lfea-linear-static-fea-unfwjd
    paths:
      - 'lfea.html'
      - 'vite.config.js'
      - 'vite.lfea.config.js'
      - 'vite.lfea-ui1-test.config.js'
      - 'playwright.lfea-ui1.config.js'
      - 'src/workspace/lfea-shell-v2/**'
      - 'src/workspace/design-tokens/lfea-tokens.js'
      - 'src/workspace/lfea-workbench-controller.js'
      - 'src/workspace/lfea-workbench-controller-utils.js'
      - 'scripts/lfea-shell-v2-*.mjs'
      - 'scripts/lfea-workbench-check.mjs'
      - 'e2e/lfea-shell-v2.spec.js'
      - 'e2e/lfea-workbench.spec.js'
      - 'e2e/fixtures/ui1-linear-piping-run-analysis-stub.js'
      - '.github/workflows/lfea-shell-v2-ui1.yml'

permissions:
  contents: read

env:
  UI1_BASE_SHA: f96e17192bec44e58f662ded614d602815fc32da

jobs:
  ui1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout UI-1 head
        uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 0

      - name: Checkout locked baseline
        uses: actions/checkout@v4
        with:
          ref: claude/lfea-linear-static-fea-unfwjd
          path: baseline

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: head/package-lock.json

      - name: Install head dependencies
        working-directory: head
        run: npm ci

      - name: Install baseline dependencies
        working-directory: baseline
        run: npm ci

      - name: Install Chromium in repository-local Playwright path
        working-directory: head
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx playwright install --with-deps chromium

      - name: LFEA workbench and Shell V2 guards
        working-directory: head
        run: npm run check:lfea-workbench

      - name: Locked-baseline semantic hash equality
        working-directory: head
        env:
          LFEA_UI1_BASELINE_ROOT: ${{ github.workspace }}/baseline
        run: node scripts/lfea-shell-v2-baseline-hash-check.mjs

      - name: Full-app build parity with locked baseline
        shell: bash
        run: |
          set +e
          (cd baseline && npm run build) > baseline-build.log 2>&1
          baseline_status=$?
          (cd head && npm run build) > head-build.log 2>&1
          head_status=$?
          set -e
          echo "baseline full-build status: $baseline_status"
          echo "head full-build status: $head_status"
          if [ "$baseline_status" -ne "$head_status" ]; then
            cat baseline-build.log
            cat head-build.log
            exit 1
          fi
          if [ "$head_status" -ne 0 ]; then
            grep -q 'inputxml-linear-prefea-contract.js' baseline-build.log
            grep -q 'inputxml-linear-prefea-contract.js' head-build.log
            grep -q 'createHash.*not exported' baseline-build.log
            grep -q 'createHash.*not exported' head-build.log
            echo 'Inherited full-app browser build failure matches locked baseline.'
          else
            echo 'Locked baseline and UI-1 head both pass the full production build.'
          fi

      - name: Standalone LFEA production build
        working-directory: head
        run: npx vite build --config vite.lfea.config.js

      - name: Embedded and standalone browser regression
        working-directory: head
        run: node scripts/run-playwright.mjs --config=playwright.lfea-ui1.config.js e2e/lfea-workbench.spec.js e2e/lfea-shell-v2.spec.js --max-failures=1

      - name: Syntax check changed JavaScript
        working-directory: head
        shell: bash
        run: |
          git diff --name-only "$UI1_BASE_SHA"...HEAD -- '*.js' '*.mjs' \
            | while read -r file; do
                [ -z "$file" ] || node --check "$file"
              done

      - name: Whitespace check
        working-directory: head
        run: git diff --check "$UI1_BASE_SHA"...HEAD
