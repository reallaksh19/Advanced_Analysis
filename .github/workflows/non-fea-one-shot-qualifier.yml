name: non-fea-one-shot-qualifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/non-fea-one-shot-qualifier.yml'

permissions:
  contents: write

jobs:
  patch-current-feature-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/load-calc-non-fea-input-check-ui
          fetch-depth: 0

      - name: Repair Phase 3 responsive action layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/workspace/enrichment/non-fea-enrichment-view.js')
          text = path.read_text()

          old_root = '.nfe{height:100%;overflow:auto;padding:16px;box-sizing:border-box;background:#07101e;color:#e2e8f0}'
          new_root = '.nfe{height:100%;overflow:auto;padding:16px 16px 96px;scroll-padding-block:160px 96px;box-sizing:border-box;background:#07101e;color:#e2e8f0}'
          if old_root in text:
              text = text.replace(old_root, new_root, 1)
          elif new_root not in text:
              raise SystemExit('Enrichment scroll-container target not found; refusing broad mutation.')

          old_columns = '.nfe__layout main,.nfe__layout aside{display:flex;flex-direction:column;gap:12px}'
          new_columns = '.nfe__layout main,.nfe__layout aside{display:flex;flex-direction:column;gap:12px;min-width:0}'
          if old_columns in text:
              text = text.replace(old_columns, new_columns, 1)
          elif new_columns not in text:
              raise SystemExit('Enrichment column target not found; refusing broad mutation.')

          old_form = '.nfe-form{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:8px}'
          new_form = '.nfe-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.nfe-form button[type="submit"]{min-height:36px;scroll-margin-block:160px 96px}'
          if old_form in text:
              text = text.replace(old_form, new_form, 1)
          elif new_form not in text:
              raise SystemExit('Enrichment form-grid target not found; refusing broad mutation.')

          path.write_text(text)
          PY
          git diff --check
          if git diff --quiet; then
            echo 'Layout correction already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workspace/enrichment/non-fea-enrichment-view.js
          git commit -m 'fix(non-fea): keep enrichment actions clear of shell overlays'
          git push origin HEAD:feat/load-calc-non-fea-input-check-ui
