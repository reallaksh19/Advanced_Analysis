name: non-fea-one-shot-qualifier

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/non-fea-one-shot-qualifier.yml'

permissions:
  contents: write

jobs:
  patch-current-feature-head:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/load-calc-non-fea-input-check-ui
          fetch-depth: 0

      - name: Give active Load Calc the central viewport
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/workspace/workspace-shell-controller.js')
          text = path.read_text()
          old = """    if (stage) {
      // `.viewport-stage{display:flex}` (an author rule) outranks the UA
      // `[hidden]{display:none}` rule, so the `hidden` attribute alone does
      // not actually hide this element — it must be set inline explicitly.
      stage.hidden = topologyEdit3DActive;
      stage.style.display = topologyEdit3DActive ? 'none' : 'flex';
      stage.style.flex = topologyEdit3DActive ? '0 0 0' : loadCalc ? '1 1 55%' : '1 1 100%';
    }
"""
          new = """    if (stage) {
      // Load Calc owns the central viewport while active. Its Model / 3D
      // sub-tab activates the dedicated topology-edit host, so retaining the
      // read-only workspace stage above every calculation pane creates a
      // nested-scroll collision without adding calculation authority.
      const hideSharedStage = loadCalc || topologyEdit3DActive;
      stage.hidden = hideSharedStage;
      stage.style.display = hideSharedStage ? 'none' : 'flex';
      stage.style.flex = hideSharedStage ? '0 0 0' : '1 1 100%';
    }
"""
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Workspace stage allocation target not found; refusing broad mutation.')
          PY
          git diff --check
          if git diff --quiet; then
            echo 'Load Calc viewport correction already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workspace/workspace-shell-controller.js
          git commit -m 'fix(non-fea): give active Load Calc the central viewport'
          git push origin HEAD:feat/load-calc-non-fea-input-check-ui
