name: Topology Edit Table Slice 5A

on:
  push:
    paths:
      - 'src/workspace/topology-edit/export/topology-edit-source-representability.js'
      - 'src/workspace/topology-edit/export/topology-edit-roundtrip-semantics.js'
      - 'tests/topology-edit-source-representability.test.mjs'
      - 'tests/topology-edit-roundtrip-semantics.test.mjs'
      - '.github/workflows/topology-edit-table-slice5a.yml'
  pull_request:
    paths:
      - 'src/workspace/topology-edit/export/topology-edit-source-representability.js'
      - 'src/workspace/topology-edit/export/topology-edit-roundtrip-semantics.js'
      - 'tests/topology-edit-source-representability.test.mjs'
      - 'tests/topology-edit-roundtrip-semantics.test.mjs'
      - '.github/workflows/topology-edit-table-slice5a.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-source-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact HEAD line and no-mutation gate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          files=(
            src/workspace/topology-edit/export/topology-edit-source-representability.js
            src/workspace/topology-edit/export/topology-edit-roundtrip-semantics.js
            tests/topology-edit-source-representability.test.mjs
            tests/topology-edit-roundtrip-semantics.test.mjs
          )
          for file in "${files[@]}"; do
            test "$(git show "HEAD:$file" | wc -l)" -lt 300
            node --check "$file"
          done
          ! grep -REn 'WorkspaceState|loadDataset\(|swapDataset\(|applyCanonicalTopologyToWorkspaceEntities|session\.execute\(|geometry.*proximity|nearest' \
            src/workspace/topology-edit/export/topology-edit-source-representability.js \
            src/workspace/topology-edit/export/topology-edit-roundtrip-semantics.js
      - name: Representability and semantic comparator contracts
        run: |
          node --test \
            tests/topology-edit-source-representability.test.mjs \
            tests/topology-edit-roundtrip-semantics.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
