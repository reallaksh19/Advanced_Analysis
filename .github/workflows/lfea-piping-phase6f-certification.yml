name: LFEA Piping Phase 6F Certification

on:
  pull_request:
    paths:
      - 'scripts/lfea-piping-internal-evidence-collector.mjs'
      - 'scripts/lfea-piping-internal-evidence-collector-check.mjs'
      - 'scripts/lfea-piping-phase6f-anti-drift-check.mjs'
      - 'scripts/lfea-piping-release-readiness-check.mjs'
      - 'docs/LFEA_PIPING_PHASE6F_INTERNAL_EVIDENCE_COLLECTION.md'
      - 'docs/LFEA_PIPING_PHASE_STATUS.md'
      - 'reports/lfea-piping-phase6f-internal-evidence-collection.json'
      - '.github/workflows/lfea-piping-internal-evidence-collection.yml'
      - '.github/workflows/lfea-piping-phase6f-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lfea-piping-phase6f-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-internal-evidence-collection:
    name: Certify internal evidence collector
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate collector with injected runner
        run: node scripts/lfea-piping-internal-evidence-collector-check.mjs

      - name: Validate Phase 6F containment
        run: node scripts/lfea-piping-phase6f-anti-drift-check.mjs

      - name: Run blocked policy path
        run: npm run check:lfea-piping-release-policy

      - name: Validate phase-to-finding ledger
        run: node scripts/lfea-piping-phase-findings-check.mjs

      - name: Run full repository gate
        run: npm run gate

      - name: Verify clean exact-head checkout
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short)"
