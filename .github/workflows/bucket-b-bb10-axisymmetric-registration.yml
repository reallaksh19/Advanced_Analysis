name: Bucket B BB-10 axisymmetric Q8 registration

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bucket-b-bb10-axisymmetric-registration.yml'
      - 'src/core/bucket-b/axisymmetric-*.js'
      - 'src/core/bucket-b/bb10-check.mjs'
      - 'src/core/bucket-b/registry.js'
      - 'src/core/bucket-b/index.js'
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact repository head to qualify; defaults to the dispatched ref SHA.
        required: false
        type: string
      expected_base_sha:
        description: Exact current-main base SHA for the BB-10 changed-path audit.
        required: true
        type: string
      qualification_mode:
        description: Issue a full BB-10 registration report rather than a downstream numerical replay.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  qualify-bb10:
    name: Exact-head BB-10 axisymmetric registration
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve exact qualification head
        id: refs
        shell: bash
        env:
          DISPATCH_HEAD_SHA: ${{ inputs.expected_head_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          head_sha="${DISPATCH_HEAD_SHA:-${PR_HEAD_SHA:-${GITHUB_SHA}}}"
          if [[ ! "$head_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid exact head SHA: $head_sha" >&2
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.head_sha }}
          fetch-depth: 0

      - name: Resolve exact qualification base
        id: exact_base
        shell: bash
        env:
          DISPATCH_BASE_SHA: ${{ inputs.expected_base_sha }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            base_sha="$DISPATCH_BASE_SHA"
          else
            git fetch --no-tags origin main:refs/remotes/origin/main
            base_sha="$(git merge-base origin/main "$EXPECTED_HEAD_SHA")"
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$base_sha" =~ ^0{40}$ ]]; then
            echo "A valid nonzero 40-character expected base SHA is required." >&2
            exit 1
          fi
          git cat-file -e "${base_sha}^{commit}"
          git merge-base --is-ancestor "$base_sha" "$EXPECTED_HEAD_SHA"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify exact head and base
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.exact_base.outputs.base_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${EXPECTED_HEAD_SHA}^{commit}"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$EXPECTED_BASE_SHA" "$EXPECTED_HEAD_SHA"
          git diff --check "${EXPECTED_BASE_SHA}...${EXPECTED_HEAD_SHA}"

      - name: Classify BB-10 execution mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_QUALIFICATION_MODE: ${{ inputs.qualification_mode }}
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.exact_base.outputs.base_sha }}
        run: |
          set -euo pipefail
          mode='replay'
          if [[ "$EVENT_NAME" == 'workflow_dispatch' && "$DISPATCH_QUALIFICATION_MODE" == 'true' ]]; then
            mode='qualification'
          elif git diff --name-only "${EXPECTED_BASE_SHA}...${EXPECTED_HEAD_SHA}" \
            | grep -qx 'src/core/bucket-b/axisymmetric-bb10-shared-gate-anchor.js'; then
            mode='qualification'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "BB-10 execution mode: $mode"

      - name: Verify retained BB-10 shared-gate anchor ancestry
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          set -euo pipefail
          marker_path='src/core/bucket-b/axisymmetric-bb10-shared-gate-anchor.js'
          marker_commit="$(git log -1 --format=%H -- "$marker_path")"
          if [[ ! "$marker_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Unable to resolve the governed BB-10 shared-gate marker." >&2
            exit 1
          fi
          git cat-file -e "${marker_commit}^{commit}"
          git merge-base --is-ancestor "$marker_commit" "$EXPECTED_HEAD_SHA"

      - name: Run authoritative same-head BB-00 through BB-05 shared gates
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.exact_base.outputs.base_sha }}
          EXPECTED_BASE_REF: ${{ steps.exact_base.outputs.base_sha }}
          STRICT_REPOSITORY_DIFFERENTIAL: '1'
          ENFORCE_CHANGED_PATH_ALLOWLIST: '0'
          REPORT_PATH: reports/bucket-b-bb00-bb05-exact-head-report.json
        run: node scripts/bucket-b-bb00-bb05-check.mjs

      - name: Replay BB-06 planar regression
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          BB06_REPORT_PATH: reports/bucket-b-bb06-lug-clamp-report.json
        run: node src/core/bucket-b/bb06-check.mjs

      - name: Replay BB-07 planar regression
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          BB06_REPORT_PATH: reports/bucket-b-bb06-lug-clamp-report.json
          BB07_REPORT_PATH: reports/bucket-b-bb07-bracket-gusset-report.json
        run: node src/core/bucket-b/bb07-check.mjs

      - name: Run BB-10 exact-head registration
        if: ${{ steps.mode.outputs.mode == 'qualification' }}
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.exact_base.outputs.base_sha }}
          BB10_SHARED_REPORT_PATH: reports/bucket-b-bb00-bb05-exact-head-report.json
          BB06_REPORT_PATH: reports/bucket-b-bb06-lug-clamp-report.json
          BB07_REPORT_PATH: reports/bucket-b-bb07-bracket-gusset-report.json
          BB10_REPORT_PATH: reports/bucket-b-bb10-axisymmetric-registration-report.json
          BB10_CORE_STDOUT_PATH: reports/bucket-b-bb10-core-stdout.json
          BB10_CORE_STDERR_PATH: reports/bucket-b-bb10-core-stderr.log
        run: node src/core/bucket-b/bb10-check.mjs

      - name: Rerun BB-10 and require byte-identical report
        if: ${{ steps.mode.outputs.mode == 'qualification' }}
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.exact_base.outputs.base_sha }}
          BB10_SHARED_REPORT_PATH: reports/bucket-b-bb00-bb05-exact-head-report.json
          BB06_REPORT_PATH: reports/bucket-b-bb06-lug-clamp-report.json
          BB07_REPORT_PATH: reports/bucket-b-bb07-bracket-gusset-report.json
          BB10_REPORT_PATH: reports/bucket-b-bb10-axisymmetric-registration-report-replay.json
          BB10_CORE_STDOUT_PATH: reports/bucket-b-bb10-core-stdout-replay.json
          BB10_CORE_STDERR_PATH: reports/bucket-b-bb10-core-stderr-replay.log
        run: |
          set -euo pipefail
          node src/core/bucket-b/bb10-check.mjs
          cmp reports/bucket-b-bb10-axisymmetric-registration-report.json reports/bucket-b-bb10-axisymmetric-registration-report-replay.json
          cmp reports/bucket-b-bb10-core-stdout.json reports/bucket-b-bb10-core-stdout-replay.json
          cmp reports/bucket-b-bb10-core-stderr.log reports/bucket-b-bb10-core-stderr-replay.log

      - name: Run byte-identical BB-10 downstream core replay
        if: ${{ steps.mode.outputs.mode == 'replay' }}
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.exact_base.outputs.base_sha }}
        run: |
          set -euo pipefail
          mkdir -p reports
          node src/core/bucket-b/bb10-check.mjs --core \
            > reports/bucket-b-bb10-core-stdout.json \
            2> reports/bucket-b-bb10-core-stderr.log
          node src/core/bucket-b/bb10-check.mjs --core \
            > reports/bucket-b-bb10-core-stdout-replay.json \
            2> reports/bucket-b-bb10-core-stderr-replay.log
          cmp reports/bucket-b-bb10-core-stdout.json reports/bucket-b-bb10-core-stdout-replay.json
          cmp reports/bucket-b-bb10-core-stderr.log reports/bucket-b-bb10-core-stderr-replay.log
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          const hash = (path) => `sha256:${createHash('sha256').update(readFileSync(path)).digest('hex')}`;
          const report = {
            schema: 'bucket-b-bb10-downstream-replay/v1',
            exactHeadSha: process.env.EXPECTED_HEAD_SHA,
            baseSha: process.env.EXPECTED_BASE_SHA,
            mode: 'DOWNSTREAM_NUMERICAL_REPLAY_NON_AUTHORIZING',
            coreStdoutHash: hash('reports/bucket-b-bb10-core-stdout.json'),
            coreStderrHash: hash('reports/bucket-b-bb10-core-stderr.log'),
            byteIdentical: true,
            axisymmetricRegistrationAuthorityReissued: false,
          };
          writeFileSync('reports/bucket-b-bb10-downstream-replay.json', `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Upload BB-10 retained qualification or replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucket-b-bb10-axisymmetric-registration-${{ steps.refs.outputs.head_sha }}-${{ github.run_attempt }}
          path: |
            reports/bucket-b-bb00-bb05-exact-head-report.json
            reports/bucket-b-bb06-lug-clamp-report.json
            reports/bucket-b-bb07-bracket-gusset-report.json
            reports/bucket-b-bb10-axisymmetric-registration-report.json
            reports/bucket-b-bb10-axisymmetric-registration-report-replay.json
            reports/bucket-b-bb10-downstream-replay.json
            reports/bucket-b-bb10-core-stdout.json
            reports/bucket-b-bb10-core-stdout-replay.json
            reports/bucket-b-bb10-core-stderr.log
            reports/bucket-b-bb10-core-stderr-replay.log
          if-no-files-found: warn
          retention-days: 30
