name: LAFEA Template B0 Current-Main Requalification

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/lafea-template-b0-current-main.yml'
      - '.github/workflows/lafea-template-stack.yml'
      - '.github/workflows/lafea-hybrid-browser-validation.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/lafea-template-b0-current-main-requalification-check.mjs'
      - 'scripts/lafea-template-stack-check.mjs'
      - 'scripts/lafea-template-t*.mjs'
      - 'scripts/lafea-nonbucket-*.mjs'
      - 'scripts/lafea-nb*.mjs'
      - 'scripts/sequential-sketcher-authoring-bridge*.mjs'
      - 'scripts/first-cut-workbench-launcher*.mjs'
      - 'e2e/fixtures/sequential-authoring-bridge-fixture.js'
      - 'e2e/first-cut-workbench-launcher.spec.js'
      - 'src/core/lafea-application-templates/**'
      - 'src/workspace/lafea-*.js'
  pull_request:
    paths:
      - '.github/workflows/lafea-template-b0-current-main.yml'
      - '.github/workflows/lafea-template-stack.yml'
      - '.github/workflows/lafea-hybrid-browser-validation.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/lafea-template-b0-current-main-requalification-check.mjs'
      - 'scripts/lafea-template-stack-check.mjs'
      - 'scripts/lafea-template-t*.mjs'
      - 'scripts/lafea-nonbucket-*.mjs'
      - 'scripts/lafea-nb*.mjs'
      - 'scripts/sequential-sketcher-authoring-bridge*.mjs'
      - 'scripts/first-cut-workbench-launcher*.mjs'
      - 'e2e/fixtures/sequential-authoring-bridge-fixture.js'
      - 'e2e/first-cut-workbench-launcher.spec.js'
      - 'src/core/lafea-application-templates/**'
      - 'src/workspace/lafea-*.js'

permissions:
  contents: read

concurrency:
  group: lafea-template-b0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bounded-current-main:
    name: B0 bounded current-main certification
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Assert exact checkout and frozen base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e \
            24e2b1c7b7279dedc287432cb5165befbc95dcb6^{commit}
          git merge-base --is-ancestor "$PR_BASE_SHA" "$EXPECTED_HEAD_SHA"
          git merge-base \
            24e2b1c7b7279dedc287432cb5165befbc95dcb6 \
            "$EXPECTED_HEAD_SHA" \
            > lafea-template-b0-retained-pass-merge-base.txt
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        id: npm_ci
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee lafea-template-b0-npm-ci.log

      - name: Run B0 freshness and compatibility check
        id: b0
        if: always() && steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          LAFEA_B0_REPORT_PATH=lafea-template-b0-current-main-report.json \
            node scripts/lafea-template-b0-current-main-requalification-check.mjs \
            2>&1 | tee lafea-template-b0-current-main.log

      - name: Run retained Bucket template stack
        id: template_stack
        if: always() && steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:lafea-template-stack 2>&1 | tee lafea-template-b0-template-stack.log

      - name: Run current non-Bucket authority stack
        id: nonbucket_stack
        if: always() && steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:lafea-nonbucket-stack 2>&1 | tee lafea-template-b0-nonbucket-stack.log

      - name: Build production bundle
        id: build
        if: always() && steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee lafea-template-b0-build.log

      - name: Verify exact patch hygiene and tracked clean tree
        id: hygiene
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
            git diff --check "$PR_BASE_SHA...HEAD"
            test -z "$(git status --porcelain=v1 --untracked-files=no)"
          } 2>&1 | tee lafea-template-b0-hygiene.log

      - name: Write B0 failure matrix
        if: always()
        env:
          OUTCOMES: >-
            {"npmCi":"${{ steps.npm_ci.outcome }}","b0":"${{ steps.b0.outcome }}","templateStack":"${{ steps.template_stack.outcome }}","nonBucketStack":"${{ steps.nonbucket_stack.outcome }}","build":"${{ steps.build.outcome }}","hygiene":"${{ steps.hygiene.outcome }}"}
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const outcomes = JSON.parse(process.env.OUTCOMES);
          const exactHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const failures = Object.entries(outcomes)
            .filter(([, outcome]) => outcome !== 'success')
            .map(([command, outcome]) => ({ command, outcome }));
          const b0Report = fs.existsSync('lafea-template-b0-current-main-report.json')
            ? JSON.parse(fs.readFileSync('lafea-template-b0-current-main-report.json', 'utf8'))
            : null;
          const matrix = {
            schema: 'lafea-template-b0-failure-matrix/v1',
            workPackage: 'B0_CURRENT_MAIN_REQUALIFICATION',
            exactHead,
            expectedHead: process.env.EXPECTED_HEAD_SHA,
            baseSha: process.env.PR_BASE_SHA,
            status: failures.length ? 'FAIL' : 'PASS',
            disposition: failures.length
              ? 'B0_CURRENT_MAIN_NOT_CERTIFIED'
              : 'B0_CURRENT_MAIN_FOUNDATION_REQUALIFIED',
            outcomes,
            failures,
            retainedPassMergeBase: b0Report?.retainedPassMergeBase ?? null,
            retainedPassInCandidateAncestry:
              b0Report?.retainedPassInCandidateAncestry ?? null,
            templateCounts: b0Report?.counts ?? {
              catalogued: 27,
              engineExecutable: 0,
              resultReady: 0,
              releaseQualified: 0,
            },
            t7cAuthority: 'IMPORT_FOR_EDITING_ONLY',
            t7dAuthorized: false,
            productionAuthorityChanged: false,
          };
          fs.writeFileSync(
            'lafea-template-b0-failure-matrix.json',
            `${JSON.stringify(matrix, null, 2)}\n`,
          );
          console.log(JSON.stringify(matrix));
          NODE

      - name: Enforce bounded B0 result
        if: always()
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const matrix = JSON.parse(
            fs.readFileSync('lafea-template-b0-failure-matrix.json', 'utf8'),
          );
          if (matrix.status !== 'PASS') process.exit(1);
          NODE

      - name: Upload exact-head B0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-template-b0-current-main-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lafea-template-b0-*.log
            lafea-template-b0-current-main-report.json
            lafea-template-b0-failure-matrix.json
            lafea-template-b0-retained-pass-merge-base.txt
          if-no-files-found: error
          retention-days: 14

  repository-integration:
    name: B0 repository integration attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        id: npm_ci
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee lafea-template-b0-integration-npm-ci.log

      - name: Run full repository gate for attribution
        id: gate
        if: always() && steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run gate 2>&1 | tee lafea-template-b0-integration-gate.log

      - name: Verify integration checkout and tracked clean tree
        id: hygiene
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
            git diff --check "$PR_BASE_SHA...HEAD"
            test -z "$(git status --porcelain=v1 --untracked-files=no)"
          } 2>&1 | tee lafea-template-b0-integration-hygiene.log

      - name: Write repository integration attribution
        if: always()
        env:
          OUTCOMES: >-
            {"npmCi":"${{ steps.npm_ci.outcome }}","fullGate":"${{ steps.gate.outcome }}","hygiene":"${{ steps.hygiene.outcome }}"}
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const outcomes = JSON.parse(process.env.OUTCOMES);
          const exactHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const failures = Object.entries(outcomes)
            .filter(([, outcome]) => outcome !== 'success')
            .map(([command, outcome]) => ({ command, outcome }));
          const matrix = {
            schema: 'lafea-template-b0-repository-integration/v1',
            exactHead,
            baseSha: process.env.PR_BASE_SHA,
            status: failures.length ? 'FAIL' : 'PASS',
            disposition: failures.length
              ? 'BUCKET_SCOPE_REQUIRES_ATTRIBUTION_REPOSITORY_INTEGRATION_BLOCKED'
              : 'REPOSITORY_INTEGRATION_PASS',
            outcomes,
            failures,
            bucketReleaseQualified: false,
          };
          fs.writeFileSync(
            'lafea-template-b0-repository-integration.json',
            `${JSON.stringify(matrix, null, 2)}\n`,
          );
          console.log(JSON.stringify(matrix));
          NODE

      - name: Upload repository integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-template-b0-repository-integration-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lafea-template-b0-integration-*.log
            lafea-template-b0-repository-integration.json
          if-no-files-found: error
          retention-days: 14
