name: Topology Edit Wave 0

on:
  pull_request:
    paths:
      - ".github/workflows/topology-edit-wave0.yml"
      - "src/vendor/topology-edit/**"
      - "src/workspace/topology-edit/**"
      - "src/workspace/topology-edit-3d-view-controller.js"
      - "scripts/topology-edit-*.mjs"
      - "tests/topology-edit-*.js"
      - "tests/topology-edit-*.mjs"
      - "tests/production-startup.spec.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    name: Governance and anti-drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TOPOLOGY_EDIT_QUALIFICATION_COMMAND: >-
        source-drift; api-drift; prohibited-imports; drift-injection;
        phase-one-smoke; development-startup; production-startup

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Record qualification start
        run: echo "TOPOLOGY_EDIT_QUALIFICATION_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Source authority drift
        run: node scripts/topology-edit-source-drift-check.mjs

      - name: API and behavior disposition drift
        run: node scripts/topology-edit-api-drift-check.mjs

      - name: Prohibited imports and circularity
        run: node scripts/topology-edit-prohibited-imports.mjs

      - name: Intentional drift injection
        run: node --test tests/topology-edit-wave0-drift-injection.test.mjs

      - name: Bounded phase-one smoke contracts
        run: node tests/topology-edit-anti-drift.test.js

      - name: Development and production startup
        run: node --test tests/production-startup.spec.mjs

      - name: Write exact-head qualification evidence
        run: node scripts/topology-edit-write-qualification-evidence.mjs

      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-wave0-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-wave0-evidence.json
          if-no-files-found: error
          retention-days: 30
