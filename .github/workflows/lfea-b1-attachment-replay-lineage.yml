name: LFEA B1 Attachment Replay Lineage

on:
  pull_request:
    paths:
      - 'src/core/centerline-beam-fea/**'
      - 'scripts/lfea-b1-conditioning-check.mjs'
      - 'scripts/lfea-b1-attachment-replay-lineage-check.mjs'
      - '.github/workflows/lfea-b1-attachment-replay-lineage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Existing B-1 conditioning regression
        run: node scripts/lfea-b1-conditioning-check.mjs

      - name: Attachment replay lineage qualification
        run: node scripts/lfea-b1-attachment-replay-lineage-check.mjs
