name: LFEA Phase 6H Demo-Only Certification

on:
  pull_request:
    paths:
      - '.github/workflows/lfea-phase6h-demo-only-certification.yml'
      - 'public/demo-only/lfea-phase6h/**'
      - 'scripts/lfea-phase6h-demo-*.mjs'
      - 'scripts/lfea-phase6h-demo-only-check.mjs'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lfea-phase6h-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-demo-only-boundary:
    name: Demo-only exact-head batch certification
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      SOURCE_ROOT: public/demo-only
      BUILT_ROOT: dist/demo-only
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Assert exact checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: npm ci

      - name: Enforce demo-only source boundary
        shell: bash
        run: node scripts/lfea-phase6h-demo-only-check.mjs

      - name: Test demo loader success and rejection
        shell: bash
        run: node scripts/lfea-phase6h-demo-loader-check.mjs

      - name: Install Chromium
        shell: bash
        run: npx playwright install chromium --with-deps

      - name: Build deployable site
        shell: bash
        run: npm run build

      - name: Verify built demo asset parity
        shell: bash
        run: |
          set -euo pipefail
          for relative in \
            lfea-phase6h/index.html \
            lfea-phase6h/demo.js \
            lfea-phase6h/sample.json
          do
            test -f "$SOURCE_ROOT/$relative"
            test -f "$BUILT_ROOT/$relative"
            cmp "$SOURCE_ROOT/$relative" "$BUILT_ROOT/$relative"
          done
          grep -Fq 'INELIGIBLE_FOR_PROJECT_EVIDENCE' "$BUILT_ROOT/lfea-phase6h/sample.json"
          grep -Fq 'WP-3 REMAINS BLOCKED' "$BUILT_ROOT/lfea-phase6h/index.html"
          ! grep -RFq 'ELIGIBLE_FOR_RELEASE_REVIEW' "$BUILT_ROOT"
          ! grep -RFq 'RELEASE_APPROVED' "$BUILT_ROOT"

      - name: Run focused browser acceptance
        shell: bash
        run: node scripts/lfea-phase6h-demo-browser-check.mjs

      - name: Write exact-head demo report
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { createHash } from 'node:crypto';
          import fs from 'node:fs';
          const hash = (path) => createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const files = [
            'lfea-phase6h/index.html',
            'lfea-phase6h/demo.js',
            'lfea-phase6h/sample.json',
          ];
          const assets = Object.fromEntries(files.map((relative) => [
            relative,
            {
              sourceSha256: hash(`${process.env.SOURCE_ROOT}/${relative}`),
              builtSha256: hash(`${process.env.BUILT_ROOT}/${relative}`),
              identical: true,
            },
          ]));
          const report = {
            schema: 'lfea-phase6h-demo-only-certification/v2',
            exactHead: process.env.EXPECTED_HEAD_SHA,
            status: 'PASS',
            assets,
            loaderValidSample: 'PASS',
            loaderMalformedInput: 'REJECTED_FAIL_CLOSED',
            browserValidSample: 'PASS',
            browserMalformedInput: 'REJECTED_FAIL_CLOSED',
            evidenceEligibility: 'INELIGIBLE_FOR_PROJECT_EVIDENCE',
            wp3: 'BLOCKED_INPUT_REQUIRED',
            phase6h: 'NOT_READY',
            wp4: 'BLOCKED',
            solverInvoked: false,
            materializerInvoked: false,
            releaseAuthorityChanged: false,
          };
          fs.writeFileSync(
            'lfea-phase6h-demo-only-certification.json',
            `${JSON.stringify(report, null, 2)}\n`,
          );
          console.log(JSON.stringify(report));
          NODE

      - name: Verify patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...HEAD"
          test -z "$(git status --short --untracked-files=no)"

      - name: Upload demo-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: lfea-phase6h-demo-only-${{ github.event.pull_request.head.sha || github.sha }}
          path: lfea-phase6h-demo-only-certification.json
          if-no-files-found: error
          retention-days: 14
