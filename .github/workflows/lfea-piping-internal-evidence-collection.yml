name: LFEA Piping Internal Evidence Collection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lfea-piping-internal-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-internal-evidence:
    name: Collect G0-G7 exact-head evidence
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout selected exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Collect exact-head internal evidence
        id: collect
        shell: bash
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/lfea-piping-internal-evidence
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          node scripts/lfea-piping-internal-evidence-collector.mjs \
            --output="$OUTPUT_ROOT" \
            --exact-head="$EXPECTED_HEAD"

      - name: Upload sealed internal evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: lfea-piping-internal-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/lfea-piping-internal-evidence
          if-no-files-found: error
          retention-days: 90

      - name: Upload failed collection evidence
        if: ${{ failure() && steps.collect.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: lfea-piping-internal-evidence-failure-${{ github.sha }}
          path: ${{ runner.temp }}/lfea-piping-internal-evidence
          if-no-files-found: warn
          retention-days: 30
