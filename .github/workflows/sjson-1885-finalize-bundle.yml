name: Finalize SJSON 1885 configurable screening bundle

on:
  push:
    branches:
      - agent/sjson-1885-configurable-screening
    paths:
      - .tmp/sjson-1885-final-bundle.part00
      - .tmp/sjson-1885-final-bundle.part01a
      - .tmp/sjson-1885-final-bundle.part01b
      - .tmp/sjson-1885-final-bundle.part02a
      - .tmp/sjson-1885-final-bundle.part02b
      - .tmp/sjson-1885-final-bundle.part03
      - .github/workflows/sjson-1885-finalize-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify and install exact qualified bundle
        run: |
          cat > /tmp/sjson-1885-bundle.sha256 <<'EOF'
          d9b6f85200f57d6b16a80fa64fb92f52218c11ad353d1dc4796448512fbc6ac6  .tmp/sjson-1885-final-bundle.part00
          300b524726f5b4b476e57b17e0cd933d0dd9cb5289524ecbda0487188dfc9cc3  .tmp/sjson-1885-final-bundle.part01a
          7ba52b515933191aec6d0244e5c8d0851a02b223bde6b81ac8b860a518e02ead  .tmp/sjson-1885-final-bundle.part01b
          57c9f52e0cd64b21d09e6d786054aefc532e9f1caadfd292c0a02d43578d5574  .tmp/sjson-1885-final-bundle.part02a
          09b315fd69cc9dd8136d6b3ebb85677c1199d9d7c8acf6af9f4f2ad899e2cf98  .tmp/sjson-1885-final-bundle.part02b
          465ee9494b5aed9e0b11aadf21a9606b6f9b604286fbf9966a373021fd72406b  .tmp/sjson-1885-final-bundle.part03
          EOF
          sha256sum --check /tmp/sjson-1885-bundle.sha256
          cat \
            .tmp/sjson-1885-final-bundle.part00 \
            .tmp/sjson-1885-final-bundle.part01a \
            .tmp/sjson-1885-final-bundle.part01b \
            .tmp/sjson-1885-final-bundle.part02a \
            .tmp/sjson-1885-final-bundle.part02b \
            .tmp/sjson-1885-final-bundle.part03 \
            | base64 --decode > /tmp/sjson-1885-final-bundle.tar.gz
          tar -xzf /tmp/sjson-1885-final-bundle.tar.gz -C .
          rm -rf .tmp
          rm -f scripts/empirical-sjson-1885-support-inventory.mjs
          rm -f scripts/empirical-sjson-1885-support-inventory-compact.mjs
      - name: Recalculate exact benchmark twice
        run: |
          git show 07ce017eb7113517cc032771f7717f88c0a93d4c:benchmarks/1885Sjson/EnrichedSjson > /tmp/EnrichedSjson
          git show 07ce017eb7113517cc032771f7717f88c0a93d4c:benchmarks/1885Sjson/EnrichedSjson.topology.input.xml > /tmp/EnrichedSjson.topology.input.xml
          node scripts/empirical-sjson-1885-configurable-screening-run.mjs \
            benchmarks/1885Sjson/empirical-screening-profile.config.json \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.topology.input.xml \
            /tmp/result-a.json
          node scripts/empirical-sjson-1885-configurable-screening-run.mjs \
            benchmarks/1885Sjson/empirical-screening-profile.config.json \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.topology.input.xml \
            /tmp/result-b.json
          cmp /tmp/result-a.json /tmp/result-b.json
          cmp /tmp/result-a.json benchmarks/1885Sjson/empirical-screening-result.configurable.json
          node scripts/empirical-sjson-1885-configurable-screening-check.mjs /tmp/result-a.json
      - name: Commit permanent configurable calculation package
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Finalize configurable SJSON 1885 empirical screening" || exit 0
          git push
