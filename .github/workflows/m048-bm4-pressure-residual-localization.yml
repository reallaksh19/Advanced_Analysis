name: M048 BM4 Pressure Residual Localization

on:
  pull_request:
    paths:
      - 'scripts/lfea-m048-bm4-pressure-residual-localization.mjs'
      - '.github/workflows/m048-bm4-pressure-residual-localization.yml'
  workflow_dispatch:

jobs:
  residual-localization:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and line-count gate
        run: |
          node --check scripts/lfea-m048-bm4-pressure-residual-localization.mjs
          test "$(wc -l < scripts/lfea-m048-bm4-pressure-residual-localization.mjs)" -le 300
      - name: Localize residual after pressure elongation
        run: node scripts/lfea-m048-bm4-pressure-residual-localization.mjs --report /tmp/m048-pressure-residual.json
      - name: Preserve pressure rigid component and contact baselines
        run: |
          node scripts/lfea-m047-bm4-pressure-elongation-ab.mjs
          node scripts/lfea-m046-bm4-rigid-boundary-rca.mjs
          node scripts/lfea-m045-bm4-component-hierarchy-v2.mjs
          node scripts/lfea-m040-bm4-friction-check.mjs
          npm run check:lfea-m036
      - name: Upload deterministic M048 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m048-bm4-pressure-residual-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/m048-pressure-residual.json
          if-no-files-found: error
      - name: Verify clean worktree
        run: git diff --exit-code && git status --porcelain | tee /tmp/m048-status && test ! -s /tmp/m048-status
