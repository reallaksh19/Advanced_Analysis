name: LFEA B-2.2 Certification

on:
  push:
    branches:
      - feat/lfea-b2-2-material-resolution
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: B-2.0 baseline
        run: npm run check:lfea-b2.0
      - name: B-2.1 model contract
        run: npm run check:lfea-b2.1
      - name: B-2.4 local-axis authority
        run: npm run check:lfea-b2.4
      - name: B-2.2 material qualification
        run: npm run check:lfea-b2.2
      - name: LFEA core
        run: npm run check:lfea-linear-core
      - name: LFEA workbench
        run: npm run check:lfea-workbench
      - name: Strict syntax
        run: npm run syntax:strict
      - name: Import boundaries
        run: npm run check:imports
      - name: Production build
        run: npm run build
      - name: Full gate
        run: npm run gate
      - name: Whitespace check
        run: git diff --check
      - name: Clean checkout check
        run: test -z "$(git status --short)"
