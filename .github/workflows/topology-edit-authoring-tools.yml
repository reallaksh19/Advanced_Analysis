name: 3D Edit Authoring Tools

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-authoring-tools.yml'
      - '.github/workflows/start-route-production-authoring-exact-head.yml'
      - 'scripts/advanced-shell-contract-check.mjs'
      - 'src/workspace/topology-edit-3d-authoring-controller.js'
      - 'src/workspace/topology-edit-3d-productivity-controller.js'
      - 'src/workspace/topology-edit-3d-sjson-fidelity-controller.js'
      - 'src/workspace/topology-edit/topology-edit-sjson-runtime-authority-v2.js'
      - 'src/workspace/topology-edit/professional/topology-edit-operation-plan.js'
      - 'src/workspace/topology-edit/authoring/topology-edit-authoring-composite-operation.js'
      - 'src/workspace/topology-edit/authoring/topology-edit-authoring-operation-planner.js'
      - 'src/workspace/topology-edit/authoring/topology-edit-authored-bend-geometry.js'
      - 'src/workspace/topology-edit/authoring/topology-edit-start-route-*.js'
      - 'src/workspace/topology-edit/authoring/topology-edit-continue-route-*.js'
      - 'src/workspace/viewport-productivity/topology-edit-authoring-runtime.js'
      - 'src/workspace/viewport-productivity/topology-edit-authoring-styles.js'
      - 'src/workspace/viewport-productivity/topology-edit-start-route-*.js'
      - 'tests/topology-edit-authoring-composite-operation.test.mjs'
      - 'tests/topology-edit-authoring-planner.test.mjs'
      - 'tests/topology-edit-authored-bend-geometry.test.mjs'
      - 'tests/topology-edit-governed-sjson-source-authority.test.mjs'
      - 'tests/topology-edit-start-route-*.test.mjs'
      - 'tests/topology-edit-continue-route-*.test.mjs'
      - 'e2e/topology-edit-authoring-tools.spec.js'
      - 'e2e/topology-edit-authoring-tools-tree.spec.js'
      - 'e2e/topology-edit-start-route-authority.spec.js'
      - 'docs/start-route-production-authoring.md'
      - 'docs/continue-route-core-authority.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-edit-authoring-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  authoring-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSER_CHANNEL: chromium

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify exact authoring sources
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          files=(
            src/workspace/topology-edit-3d-authoring-controller.js
            src/workspace/topology-edit-3d-productivity-controller.js
            src/workspace/topology-edit-3d-sjson-fidelity-controller.js
            src/workspace/topology-edit/topology-edit-sjson-runtime-authority-v2.js
            src/workspace/topology-edit/professional/topology-edit-operation-plan.js
            src/workspace/topology-edit/authoring/topology-edit-authoring-composite-operation.js
            src/workspace/topology-edit/authoring/topology-edit-authoring-operation-planner.js
            src/workspace/topology-edit/authoring/topology-edit-authored-bend-geometry.js
            src/workspace/topology-edit/authoring/topology-edit-start-route-intent.js
            src/workspace/topology-edit/authoring/topology-edit-start-route-plan.js
            src/workspace/topology-edit/authoring/topology-edit-start-route-candidate.js
            src/workspace/topology-edit/authoring/topology-edit-start-route-transaction.js
            src/workspace/topology-edit/authoring/topology-edit-start-route-validation-plan.js
            src/workspace/topology-edit/authoring/topology-edit-continue-route-intent.js
            src/workspace/topology-edit/authoring/topology-edit-continue-route-plan.js
            src/workspace/topology-edit/authoring/topology-edit-continue-route-candidate.js
            src/workspace/topology-edit/authoring/topology-edit-continue-route-transaction.js
            src/workspace/viewport-productivity/topology-edit-authoring-runtime.js
            src/workspace/viewport-productivity/topology-edit-authoring-styles.js
            src/workspace/viewport-productivity/topology-edit-start-route-runtime.js
            src/workspace/viewport-productivity/topology-edit-start-route-hud.js
            src/workspace/viewport-productivity/topology-edit-start-route-authoring-service.js
            src/workspace/viewport-productivity/topology-edit-start-route-authoring-runtime.js
            tests/topology-edit-authoring-composite-operation.test.mjs
            tests/topology-edit-authoring-planner.test.mjs
            tests/topology-edit-authored-bend-geometry.test.mjs
            tests/topology-edit-governed-sjson-source-authority.test.mjs
            tests/topology-edit-start-route-authoring.test.mjs
            tests/topology-edit-start-route-runtime.test.mjs
            tests/topology-edit-start-route-production-adapter.test.mjs
            tests/topology-edit-continue-route-authoring.test.mjs
            e2e/topology-edit-authoring-tools-tree.spec.js
            e2e/topology-edit-start-route-authority.spec.js
          )
          for file in "${files[@]}"; do node --check "$file"; done
          limited=(
            src/workspace/topology-edit-3d-authoring-controller.js
            src/workspace/topology-edit/professional/topology-edit-operation-plan.js
            src/workspace/topology-edit/authoring/topology-edit-operation-graph.js
            src/workspace/topology-edit/authoring/topology-edit-start-route-intent.js
            src/workspace/topology-edit/authoring/topology-edit-start-route-plan.js
            src/workspace/topology-edit/authoring/topology-edit-start-route-candidate.js
            src/workspace/topology-edit/authoring/topology-edit-start-route-transaction.js
            src/workspace/topology-edit/authoring/topology-edit-start-route-validation-plan.js
            src/workspace/topology-edit/authoring/topology-edit-continue-route-intent.js
            src/workspace/topology-edit/authoring/topology-edit-continue-route-plan.js
            src/workspace/topology-edit/authoring/topology-edit-continue-route-candidate.js
            src/workspace/topology-edit/authoring/topology-edit-continue-route-transaction.js
            src/workspace/viewport-productivity/topology-edit-start-route-runtime.js
            src/workspace/viewport-productivity/topology-edit-start-route-hud.js
            src/workspace/viewport-productivity/topology-edit-start-route-authoring-service.js
            src/workspace/viewport-productivity/topology-edit-start-route-authoring-runtime.js
            tests/topology-edit-start-route-authoring.test.mjs
            tests/topology-edit-start-route-runtime.test.mjs
            tests/topology-edit-start-route-production-adapter.test.mjs
            tests/topology-edit-continue-route-authoring.test.mjs
            e2e/topology-edit-start-route-authority.spec.js
          )
          for file in "${limited[@]}"; do test "$(wc -l < "$file")" -lt 300; done
          node scripts/advanced-shell-contract-check.mjs
          git diff --check

      - name: Execute authoring kernel and transaction contracts
        run: |
          set -o pipefail
          node --test --test-reporter=tap \
            tests/topology-edit-authoring-session.test.mjs \
            tests/topology-edit-operation-graph.test.mjs \
            tests/topology-edit-create-node.test.mjs \
            tests/topology-edit-authoring-planner.test.mjs \
            tests/topology-edit-authoring-composite-operation.test.mjs \
            tests/topology-edit-authored-bend-geometry.test.mjs \
            tests/topology-edit-governed-sjson-source-authority.test.mjs \
            tests/topology-edit-professional-operation-transaction.test.mjs \
            tests/topology-edit-wave1-production-integration.test.mjs \
            tests/topology-edit-start-route-authoring.test.mjs \
            tests/topology-edit-start-route-runtime.test.mjs \
            tests/topology-edit-start-route-production-adapter.test.mjs \
            tests/topology-edit-continue-route-authoring.test.mjs \
            2>&1 | tee topology-edit-authoring-tools-test-output.txt
          test "$(grep -c '^ok ' topology-edit-authoring-tools-test-output.txt)" -gt 0

      - name: Execute production Chromium authoring walkthroughs
        run: |
          npx playwright test \
            e2e/topology-edit-authoring-tools-tree.spec.js \
            e2e/topology-edit-start-route-authority.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line

      - name: Upload authoring qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-authoring-tools-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}-${{ github.run_attempt }}
          path: |
            topology-edit-authoring-tools-test-output.txt
            reports/qualification/topology-edit-authoring-tools.json
            reports/qualification/start-route-authoring-core.json
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
