name: M028 Isolated Publisher

on:
  push:
    branches:
      - agent/m028-publish-staging
    paths:
      - '.github/workflows/m028-publish-staging.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .m028-transport/part-* > /tmp/m028.patch.gz.b64
          echo '1ff2f68d37f4010f7f8ba04c8eafd4adb54987ea4090020923c6642fc8600848  /tmp/m028.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/m028.patch.gz.b64 > /tmp/m028.patch.gz
          echo '50396873e46e2b644f3503155ff36601ae8a225e92684aa04b3ecf6f03ff4a7c  /tmp/m028.patch.gz' | sha256sum -c -
          gzip -dc /tmp/m028.patch.gz > /tmp/m028.patch
          echo '9edc73e45bcb0ce54cc3d9e878af476c269138a1dd1ddbb0007bfd75cd9b2291  /tmp/m028.patch' | sha256sum -c -
          git apply --check /tmp/m028.patch
          git apply --index /tmp/m028.patch
          git rm -r .m028-transport .github/workflows/m028-publish-staging.yml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify changed-source syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lfea-m028-bm3-check.mjs
          node --check scripts/lfea-m028-bm3-comparison.mjs
          node --check scripts/lfea-m028-bm3-fixtures.mjs
          node --check src/core/geometry/adapters/inputXmlToCanonicalGeometry.js
          node --check src/core/geometry/adapters/inputxml-unit-system.js
          git diff --check 833b5c51543caf50941957330a208661c9f09954

      - name: Qualify M028 and full linear core
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lfea-m028-bm3-check.mjs
          npm run check:lfea-linear-core
          sha256sum reports/m028-bm3-qualification.json > /tmp/m028-report.sha256
          node scripts/lfea-m028-bm3-check.mjs > /tmp/m028-repeat.log
          sha256sum -c /tmp/m028-report.sha256
          rm reports/m028-bm3-qualification.json

      - name: Assemble exact seven-file candidate
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/m028-qualified-candidate
          rm -rf "$root"
          mkdir -p "$root"
          paths=(
            '.github/workflows/m028-bm3.yml'
            'docs/qualification/M028_BM3_ENGINEERING_RECORD.md'
            'scripts/lfea-m028-bm3-check.mjs'
            'scripts/lfea-m028-bm3-comparison.mjs'
            'scripts/lfea-m028-bm3-fixtures.mjs'
            'src/core/geometry/adapters/inputXmlToCanonicalGeometry.js'
            'src/core/geometry/adapters/inputxml-unit-system.js'
          )
          for path in "${paths[@]}"; do
            test -f "$path"
            mkdir -p "$root/$(dirname "$path")"
            cp "$path" "$root/$path"
          done
          test ! -e .m028-transport
          test ! -e .github/workflows/m028-publish-staging.yml
          (
            cd "$root"
            find . -type f ! -name MANIFEST.sha256 -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          )
          test "$(find "$root" -type f | wc -l)" -eq 8

      - uses: actions/upload-artifact@v4
        with:
          name: m028-qualified-candidate-${{ github.sha }}
          path: /tmp/m028-qualified-candidate
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2
