name: Topology Edit C3D Wave 1 Closing Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/topology-edit-c3d-wave1-closing.yml"
      - "scripts/topology-edit-write-c3d-wave1-closing-evidence.mjs"
      - "src/workspace/topology-edit/topology-edit-viewport-backend.js"
      - "src/workspace/viewport-presentation/**"
      - "tests/topology-edit-c3d-wave0.test.mjs"
      - "tests/topology-edit-c3d-wave1-visibility.test.mjs"
      - "tests/topology-edit-c3d-wave1-sectioning.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  close-wave-1:
    name: Visibility, sectioning, picking, and lifecycle qualification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TOPOLOGY_EDIT_C3D_QUALIFICATION_COMMAND: >-
        c3d-wave0-tests; c3d-wave1-visibility-tests; c3d-wave1-sectioning-tests;
        source-drift; api-drift; prohibited-imports; development-production-startup;
        production-build

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Presentation authority regression tests
        run: node --test tests/topology-edit-c3d-wave0.test.mjs

      - name: Canonical visibility regression tests
        run: node --test tests/topology-edit-c3d-wave1-visibility.test.mjs

      - name: Sectioning and closing qualification tests
        run: node --test tests/topology-edit-c3d-wave1-sectioning.test.mjs

      - name: Retain Wave 0 source authority
        run: node scripts/topology-edit-source-drift-check.mjs

      - name: Retain Wave 0 API authority
        run: node scripts/topology-edit-api-drift-check.mjs

      - name: Retain prohibited-import and circularity gates
        run: node scripts/topology-edit-prohibited-imports.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Development and production startup
        run: node --test tests/production-startup.spec.mjs

      - name: Production build
        run: npm run build

      - name: Write exact-head Wave 1 closing evidence
        run: node scripts/topology-edit-write-c3d-wave1-closing-evidence.mjs

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-c3d-wave1-closing-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-c3d-wave1-closing-evidence.json
          if-no-files-found: error
          retention-days: 30
