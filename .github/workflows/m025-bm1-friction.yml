name: M025 BM1 Coulomb Friction Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/m025-bm1-friction.yml"
      - "package.json"
      - "benchmarks/LFEA/BM1/BM1_InputXML.xml"
      - "benchmarks/LFEA/BM1/BM1_CIIOutput.xml"
      - "reports/lfea-bm1-cii-output-comparison.json"
      - "reports/lfea-bm1-m025-friction-qualification.json"
      - "scripts/m025-apply-work-pack.mjs"
      - "scripts/m025-apply-continuation-patch.mjs"
      - "scripts/m025-stabilize-continuation.mjs"
      - "scripts/lfea-b3.15-bm1-inputxml-fixtures.mjs"
      - "scripts/lfea-b3.15-bm1-inputxml-check.mjs"
      - "scripts/lfea-b3.16-inputxml-ground-truth-check.mjs"
      - "scripts/lfea-b3.17-*.mjs"
      - "scripts/lfea-b3.18-*.mjs"
      - "scripts/lfea-b3.19-*.mjs"
      - "scripts/lfea-bm1-cii-output-comparison*.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qualify-m025:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact candidate branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply M025 integration patches when not committed yet
        run: |
          if grep -q "solveBm1CoulombCases" scripts/lfea-b3.15-bm1-inputxml-fixtures.mjs; then
            echo "M025 base integration already present on branch."
          else
            node scripts/m025-apply-work-pack.mjs
          fi
          if grep -q "thermalScale = thermal" scripts/lfea-b3.15-bm1-inputxml-fixtures.mjs; then
            echo "M025 thermal continuation already present on branch."
          else
            node scripts/m025-apply-continuation-patch.mjs
          fi
          if grep -q "MAX_ITERATIONS_PER_STEP = 240" scripts/lfea-b3.19-bm1-friction.mjs; then
            echo "M025 continuation stabilization already present on branch."
          else
            node scripts/m025-stabilize-continuation.mjs
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Upload runnable exact-head snapshot
        uses: actions/upload-artifact@v4
        with:
          name: m025-runnable-exact-head-${{ github.run_attempt }}
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 2

      - name: Run prerequisite BM1 qualification
        run: |
          npm run check:lfea-b3.15
          npm run check:lfea-b3.16
          npm run check:lfea-b3.17
          npm run check:lfea-b3.18

      - name: Run M025 pointwise audit
        id: m025_audit
        continue-on-error: true
        run: npm run check:lfea-b3.19

      - name: Run existing BM1 comparison
        if: always()
        continue-on-error: true
        run: npm run check:lfea-bm1-cii-comparison

      - name: Upload M025 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m025-bm1-friction-qualification-${{ github.run_attempt }}
          path: |
            reports/lfea-bm1-m025-friction-qualification.json
            reports/lfea-bm1-cii-output-comparison.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce M025 pointwise acceptance
        if: steps.m025_audit.outcome != 'success'
        run: |
          echo "M025 pointwise ±10% audit failed; evidence artifact retained."
          exit 1

      - name: Run complete linear piping core
        run: npm run check:lfea-linear-core

      - name: Commit validated integration and generated proof
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json \
            scripts/lfea-b3.15-bm1-inputxml-fixtures.mjs \
            scripts/lfea-b3.19-bm1-friction.mjs \
            scripts/lfea-bm1-cii-output-comparison.mjs \
            reports/lfea-bm1-cii-output-comparison.json \
            reports/lfea-bm1-m025-friction-qualification.json
          if git diff --cached --quiet; then
            echo "Validated M025 integration already committed."
          else
            git commit -m "M025: integrate validated Coulomb friction solve"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
