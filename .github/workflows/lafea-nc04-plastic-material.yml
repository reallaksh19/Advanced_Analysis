name: LAFEA-NC NC-04 Plastic Material

on:
  pull_request:
    paths:
      - '.github/workflows/lafea-nc04-plastic-material.yml'
      - 'docs/nonlinear-shell-contact/LAFEA_NC04_PLASTIC_MATERIAL.md'
      - 'scripts/lafea-nc04-check.mjs'
      - 'src/core/nonlinear-shell-contact/plastic-material-contract.js'
      - 'src/core/nonlinear-shell-contact/plastic-material-qualification-evaluator.js'
      - 'src/core/nonlinear-shell-contact/nc04-fixtures.js'
      - 'src/core/nonlinear-shell-contact/nc04-negative-controls.js'
      - 'src/core/nonlinear-shell-contact/index.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nc04-contracts:
    if: github.event_name != 'pull_request' || github.base_ref == 'agent/lafea-nc03-elastic-denting'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact stacked head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
      - name: Enforce NC-04 path containment
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA"..HEAD | while read -r path; do
            case "$path" in
              .github/workflows/lafea-nc04-plastic-material.yml|docs/nonlinear-shell-contact/LAFEA_NC04_PLASTIC_MATERIAL.md|scripts/lafea-nc04-check.mjs|src/core/nonlinear-shell-contact/plastic-material-contract.js|src/core/nonlinear-shell-contact/plastic-material-qualification-evaluator.js|src/core/nonlinear-shell-contact/nc04-fixtures.js|src/core/nonlinear-shell-contact/nc04-negative-controls.js|src/core/nonlinear-shell-contact/index.js) ;;
              *) echo "Unexpected NC-04 path: $path" >&2; exit 1 ;;
            esac
          done
      - name: Syntax check
        run: |
          set -euo pipefail
          node --check scripts/lafea-nc04-check.mjs
          for file in src/core/nonlinear-shell-contact/{plastic-material-contract,plastic-material-qualification-evaluator,nc04-fixtures,nc04-negative-controls,index}.js; do node --check "$file"; done
          git diff --check
      - name: Deterministic replay
        run: |
          set -euo pipefail
          node scripts/lafea-nc04-check.mjs --output-dir=artifacts/nc04-a
          node scripts/lafea-nc04-check.mjs --output-dir=artifacts/nc04-b
          cmp artifacts/nc04-a/nc04-report.json artifacts/nc04-b/nc04-report.json
          cmp artifacts/nc04-a/nc04-contract.json artifacts/nc04-b/nc04-contract.json
      - name: Verify clean source tree
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lafea-nc04-${{ env.TARGET_SHA }}-${{ github.run_attempt }}
          path: artifacts
          retention-days: 30
