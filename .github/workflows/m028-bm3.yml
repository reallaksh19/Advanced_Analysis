name: M028 BM3 Qualification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/m028-bm3.yml'
      - 'benchmarks/LFEA/BM3/**'
      - 'docs/qualification/M028_BM3_ENGINEERING_RECORD.md'
      - 'scripts/lfea-m028-bm3-*.mjs'
      - 'src/core/geometry/adapters/inputXmlToCanonicalGeometry.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Verify immutable candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: M028 exact benchmark qualification
        run: node scripts/lfea-m028-bm3-check.mjs

      - name: Complete linear-core regression
        run: npm run check:lfea-linear-core

      - name: Verify deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum reports/m028-bm3-qualification.json > /tmp/m028-report.sha256
          node scripts/lfea-m028-bm3-check.mjs > /tmp/m028-repeat.log
          sha256sum -c /tmp/m028-report.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: m028-bm3-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/m028-bm3-qualification.json
          if-no-files-found: error
          retention-days: 14

      - name: Restore clean worktree after evidence publication
        shell: bash
        run: |
          set -euo pipefail
          rm reports/m028-bm3-qualification.json
          test -z "$(git status --porcelain)"
