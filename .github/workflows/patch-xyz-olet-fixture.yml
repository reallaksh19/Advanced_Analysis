name: Patch XYZ Olet Fixture

on:
  push:
    branches:
      - agent/topology-edit-xyz-10-element-branch-demo
    paths:
      - '.github/workflows/patch-xyz-olet-fixture.yml'

permissions:
  contents: write

jobs:
  patch-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/topology-edit-xyz-10-element-branch-demo
          fetch-depth: 0

      - name: Convert Olet to governed three-port geometry
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('public/fixtures/topology-edit-20-element-demo.staged.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          scenarios = [
              row for row in data['demo']['embeddedScenarios']
              if row.get('id') == 'XYZ-10-COMPONENT-BRANCH'
          ]
          if len(scenarios) != 1:
              raise SystemExit(f'Expected one XYZ scenario, received {len(scenarios)}')
          objects = {row['id']: row for row in scenarios[0]['objects']}

          olet = objects['O-002']
          olet['name'] = 'Olet 02 — DN25 × DN15 XYZ side branch junction'
          olet['nativeParams'] = {
              'startPoint': [7260, 1650, 3450],
              'endPoint': [7460, 1650, 3450],
              'center': [7360, 1650, 3450],
              'branchPoints': [[7360, 1850, 3450]],
              'bore': 25,
              'outerDiameter': 33.4,
              'branchOutsideDiameterMm': 21.3,
          }
          olet['attributes'].update({
              'BRANCH_ID': 'DEMO-L100/XYZ-10',
              'NOMINAL_BORE_MM': 25,
              'BORE': 25,
              'OUTSIDE_DIAMETER_MM': 33.4,
              'OUTSIDE_DIAMETER': 33.4,
              'BRANCH_OUTSIDE_DIAMETER': 21.3,
          })

          valve = objects['V-002']
          valve['nativeParams'].update({
              'startPoint': [7460, 1650, 3450],
              'endPoint': [7760, 1650, 3450],
              'center': [7610, 1650, 3450],
          })

          flange = objects['F-002']
          flange['nativeParams'].update({
              'startPoint': [7760, 1650, 3450],
              'endPoint': [7860, 1650, 3450],
              'center': [7810, 1650, 3450],
          })

          branch_pipe = objects['P-012']
          branch_pipe['nativeParams'].update({
              'startPoint': [7360, 1850, 3450],
              'endPoint': [7360, 2750, 3450],
              'center': [7360, 2300, 3450],
          })

          path.write_text(
              json.dumps(data, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

          node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('public/fixtures/topology-edit-20-element-demo.staged.json','utf8')); const s=data.demo.embeddedScenarios.find(x=>x.id==='XYZ-10-COMPONENT-BRANCH'); const o=s.objects.find(x=>x.id==='O-002'); if(o.nativeParams.branchPoints.length!==1 || o.nativeParams.bore!==25) process.exit(1);"

      - name: Commit corrected fixture and remove migration
        run: |
          rm .github/workflows/patch-xyz-olet-fixture.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fixtures/topology-edit-20-element-demo.staged.json .github/workflows/patch-xyz-olet-fixture.yml
          git commit -m 'Represent XYZ Olet as a three-port junction'
          git push origin HEAD:agent/topology-edit-xyz-10-element-branch-demo
