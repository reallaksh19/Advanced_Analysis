name: LFEA Piping Phase 6G Certification

on:
  pull_request:
    paths:
      - 'scripts/lfea-piping-runtime-bundle-assembler.mjs'
      - 'scripts/lfea-piping-runtime-bundle-assembler-check.mjs'
      - 'scripts/lfea-piping-wp2-runtime-bundle-assembler.mjs'
      - 'scripts/lfea-piping-wp2-runtime-bundle-assembler-check.mjs'
      - 'scripts/lfea-piping-wp3-runtime-bundle-assembler.mjs'
      - 'scripts/lfea-piping-wp3-runtime-bundle-assembler-check.mjs'
      - 'scripts/lfea-piping-phase6g-anti-drift-check.mjs'
      - 'scripts/lfea-piping-release-readiness-check.mjs'
      - 'src/core/linear-piping-project-qualification/external-evidence-handoff.js'
      - 'docs/LFEA_PIPING_PHASE6G_RUNTIME_BUNDLE_ASSEMBLY.md'
      - 'docs/LFEA_PIPING_PHASE_STATUS.md'
      - 'reports/lfea-piping-phase6g-runtime-bundle-assembly.json'
      - '.github/workflows/lfea-piping-runtime-bundle-assembly.yml'
      - '.github/workflows/lfea-piping-phase6g-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lfea-piping-phase6g-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-runtime-bundle-assembly:
    name: Certify runtime bundle assembler
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate runtime bundle assembler
        run: node scripts/lfea-piping-runtime-bundle-assembler-check.mjs

      - name: Validate Phase 6G containment
        run: node scripts/lfea-piping-phase6g-anti-drift-check.mjs

      - name: Run blocked policy path
        run: npm run check:lfea-piping-release-policy

      - name: Validate phase-to-finding ledger
        run: node scripts/lfea-piping-phase-findings-check.mjs

      - name: Run full repository gate
        run: npm run gate

      - name: Verify clean exact-head checkout
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short)"
