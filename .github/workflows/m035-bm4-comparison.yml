name: M035 BM4 CASE 19-21 Before-After Comparison

on:
  pull_request:
    branches:
      - claude/lfea-linear-static-fea-unfwjd
    paths:
      - 'scripts/lfea-m035-bm4-run-analysis.mjs'
      - 'scripts/lfea-m035-bm4-feature-solve-runtime.mjs'
      - 'scripts/lfea-m035-bm4-scope-policy.mjs'
      - 'scripts/lfea-m034-bm4-solve-runtime.mjs'
      - 'scripts/lfea-m034-bm4-output-comparison.mjs'
      - 'scripts/lfea-m034-bm4-solve-fixtures.mjs'
      - 'src/core/linear-fea-b31-factor-calculator/**'
      - 'src/core/linear-fea-piping-components/**'
      - 'src/core/linear-piping-analysis-consumer/inputxml-bend-feature-expansion.js'
      - 'src/core/linear-fea-result-recovery/**'
      - '.github/workflows/m035-bm4-comparison.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m035-bm4-comparison-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 1

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Syntax check comparison runner
        run: node --check scripts/lfea-m035-bm4-run-analysis.mjs

      - name: Run CASE 19/20/21 before-after comparison
        shell: bash
        run: |
          set +e
          node scripts/lfea-m035-bm4-run-analysis.mjs > /tmp/m035-bm4-comparison.log 2>&1
          status=$?
          cat /tmp/m035-bm4-comparison.log
          if [ "$status" -ne 0 ]; then
            message="$(tr '\n' ' ' < /tmp/m035-bm4-comparison.log | head -c 3500)"
            echo "::error file=scripts/lfea-m035-bm4-run-analysis.mjs,line=1,title=M035 BM4 before-after comparison::${message}"
          fi
          exit "$status"

      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m035-bm4-comparison-${{ env.TARGET_HEAD_SHA }}
          path: |
            /tmp/m035-bm4-comparison.log
            reports/m035-bm4-before-after-cases-19-20-21.json
          if-no-files-found: warn
          retention-days: 14
