name: wp5-runtime-analysis-direction-patch

on:
  push:
    branches:
      - agent/empirical-restraint-network-wp5
    paths:
      - 'scripts/wp5-runtime-analysis-direction-patch.mjs'
      - '.github/workflows/wp5-runtime-analysis-direction-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/empirical-restraint-network-wp5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply governed load-case patch
        run: node scripts/wp5-runtime-analysis-direction-patch.mjs
      - name: Commit patched fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/empirical-restraint-network-check.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'Use governed expansion load case in WP5 qualification'
          git push origin HEAD:agent/empirical-restraint-network-wp5
