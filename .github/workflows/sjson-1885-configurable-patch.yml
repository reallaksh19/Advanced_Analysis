name: Patch SJSON 1885 configurable screening

on:
  push:
    branches:
      - agent/sjson-1885-configurable-screening
    paths:
      - .github/workflows/sjson-1885-configurable-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Normalize generic SUPPORT as REST
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/empirical-sjson-1885-configurable-screening-run.mjs')
          text = path.read_text()
          old = "      const capability = String(attrs.SUPPORT_KIND || attrs.SUPPORT_TYPE || '').toUpperCase();\n"
          new = "      const rawCapability = String(attrs.SUPPORT_KIND || attrs.SUPPORT_TYPE || '').toUpperCase();\n      const capability = rawCapability === 'SUPPORT' ? 'REST' : rawCapability;\n"
          if old not in text:
              raise SystemExit('support normalization anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/empirical-sjson-1885-configurable-screening-run.mjs
          git commit -m "Normalize generic support capability as rest"
          git push
