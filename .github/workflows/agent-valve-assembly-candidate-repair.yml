name: Repair valve assembly candidate payload authority

on:
  push:
    branches:
      - agent/valve-assembly-authoring

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/valve-assembly-authoring
          fetch-depth: 0

      - name: Retain resolved payload in candidate authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/workspace/topology-edit/topology-edit-candidate-builder.js',
              "    basis: command.basis, requestHash: command.requestHash,\n    resolutionHash: command.resolutionHash,",
              "    basis: command.basis, resolvedPayload: command.payload,\n    requestHash: command.requestHash, resolutionHash: command.resolutionHash,",
          )

          replace_once(
              'src/workspace/topology-edit/topology-edit-command-effect-validator.js',
              "  const payload = candidate.resolvedCommand?.payload ?? candidate.request?.payload ?? {};",
              "  const payload = candidate.resolvedPayload\n    ?? candidate.resolvedCommand?.payload\n    ?? candidate.request?.payload\n    ?? {};",
          )

          replace_once(
              'src/workspace/topology-edit/topology-edit-inline-component-command.js',
              "  const delta = candidate.topologyDelta;\n  const placement = candidate.resolvedCommand?.payload?.placement ?? 'INTERIOR';",
              "  const delta = candidate.topologyDelta;\n  const resolvedPayload = candidate.resolvedPayload\n    ?? candidate.resolvedCommand?.payload\n    ?? {};\n  const placement = resolvedPayload.placement ?? 'INTERIOR';",
          )
          replace_once(
              'src/workspace/topology-edit/topology-edit-inline-component-command.js',
              "      === semanticHash(candidate.resolvedCommand?.payload?.assemblyBinding ?? null)\n    && componentEdges[0].catalogueBinding?.recordHash\n      === candidate.resolvedCommand?.payload?.catalogueBinding?.recordHash;",
              "      === semanticHash(resolvedPayload.assemblyBinding ?? null)\n    && componentEdges[0].catalogueBinding?.recordHash\n      === resolvedPayload.catalogueBinding?.recordHash;",
          )

          test_path = 'tests/topology-edit-valve-assembly-authoring.test.mjs'
          file = Path(test_path)
          text = file.read_text(encoding='utf-8')
          old = '/must equal exact assembly catalogue evidence/'
          new = '/(?:must equal exact assembly catalogue evidence|no exact flange–valve–flange catalogue assembly fits)/'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'{test_path}: expected two assertion replacements, found {count}')
          file.write_text(text.replace(old, new), encoding='utf-8')
          PY

          node --check src/workspace/topology-edit/topology-edit-candidate-builder.js
          node --check src/workspace/topology-edit/topology-edit-command-effect-validator.js
          node --check src/workspace/topology-edit/topology-edit-inline-component-command.js
          node --check tests/topology-edit-valve-assembly-authoring.test.mjs
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workspace/topology-edit/topology-edit-candidate-builder.js \
            src/workspace/topology-edit/topology-edit-command-effect-validator.js \
            src/workspace/topology-edit/topology-edit-inline-component-command.js \
            tests/topology-edit-valve-assembly-authoring.test.mjs
          git commit -m 'Retain inline placement in candidate authority'
          git push origin HEAD:agent/valve-assembly-authoring
