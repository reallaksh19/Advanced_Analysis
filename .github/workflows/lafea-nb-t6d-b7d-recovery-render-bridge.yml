name: LAFEA NB-T6D B7D Recovery Render Bridge

on:
  pull_request:
    paths:
      - '.github/workflows/lafea-nb-t6d-b7d-recovery-render-bridge.yml'
      - 'src/workspace/lafea-b7d-recovery-render-bridge.js'
      - 'src/workspace/lafea-controlled-continuum-public.js'
      - 'src/workspace/lafea-lug-pinhole-physical-problem-*.js'
      - 'src/workspace/lafea-controlled-continuum-controller.js'
      - 'src/workspace/lafea-recovery-render-*.js'
      - 'src/workspace/lafea-canvas/render-packet-v2-contract.js'
      - 'scripts/lafea-nb-t6d-b7d-recovery-render-bridge-check.mjs'
      - 'scripts/lafea-nonbucket-stack-check.mjs'
      - 'docs/LAFEA_NonBucket_NB-T6D_B7D_Recovery_Render_Bridge.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lafea-nb-t6d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: NB-T6D exact-head recovery-render qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Assert exact checkout and ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$PR_BASE_SHA" "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run NB-T6D recovery-render bridge qualification
        shell: bash
        run: |
          set -o pipefail
          node scripts/lafea-nb-t6d-b7d-recovery-render-bridge-check.mjs \
            2>&1 | tee lafea-nb-t6d-b7d-recovery-render-bridge.log

      - name: Run retained NB-T6C vertical qualification
        run: node scripts/lafea-nb-t6c-physical-problem-batch-check.mjs

      - name: Run retained NB-T4B recovery-render qualification
        run: node scripts/lafea-nb-t4b-recovery-render-check.mjs

      - name: Run retained V2 packet and intake checks
        run: |
          node scripts/lafea-u4c-render-packet-v2-check.mjs
          node scripts/lafea-u4d-render-evidence-intake-check.mjs

      - name: Run non-bucket aggregate
        run: npm run check:lafea-nonbucket-stack

      - name: Run strict syntax checks
        run: npm run syntax:strict

      - name: Run import checks
        run: npm run check:imports

      - name: Build production bundle
        run: npm run build

      - name: Verify patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PR_BASE_SHA...HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload exact-head NB-T6D evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-nb-t6d-${{ github.event.pull_request.head.sha || github.sha }}
          path: lafea-nb-t6d-b7d-recovery-render-bridge.log
          if-no-files-found: error
          retention-days: 30
