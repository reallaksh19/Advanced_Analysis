name: Apply Bucket-01 Convergence Shape Repair

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'Apply Bucket-01 convergence evidence shape repair' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch convergence envelope consumption
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('scripts/lafea-bucket-01-production-lug-probe-receipt.mjs')
          source = path.read_text()

          replacements = [
              (
                  "  const convergence = evaluateLafeaBucket01StressConvergence({\n",
                  "  const stressConvergenceEvidence = evaluateLafeaBucket01StressConvergence({\n",
              ),
              (
                  "      convergence,\n      probeEvidences,\n",
                  "      stressConvergenceEvidence,\n      probeEvidences,\n",
              ),
              (
                  "    convergence,\n    gciTolerance,\n    status: convergence.status,\n    reasons: convergence.reasons,\n",
                  "    convergence: stressConvergenceEvidence.convergence,\n    stressConvergenceEvidenceHash: stressConvergenceEvidence.semanticHash,\n    gciTolerance,\n    status: stressConvergenceEvidence.status,\n    reasons: stressConvergenceEvidence.reasons,\n",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one occurrence, found {count}: {old!r}')
              source = source.replace(old, new)

          path.write_text(source)
          PY

          rm .github/workflows/lafea-bucket-01-fix-convergence-shape.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/lafea-bucket-01-production-lug-probe-receipt.mjs \
            .github/workflows/lafea-bucket-01-fix-convergence-shape.yml
          git commit -m 'Fix Bucket-01 convergence evidence shape'
          git push origin HEAD:${GITHUB_REF_NAME}
