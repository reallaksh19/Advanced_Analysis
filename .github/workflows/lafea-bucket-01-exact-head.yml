name: LAFEA Bucket-01 Exact Head

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run physical-coordinate recovery experiment
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p reports/qualification
          set +e
          python scripts/lafea-bucket-01-physical-recovery-experiment.py \
            > reports/qualification/patch.stdout.log \
            2> reports/qualification/patch.stderr.log
          code=$?
          stage=PATCH
          log=reports/qualification/patch.stderr.log
          if [[ "$code" == "0" ]]; then
            node scripts/lafea-bucket-01-fixed-probe-check.mjs \
              > reports/qualification/fixed.stdout.log \
              2> reports/qualification/fixed.stderr.log
            code=$?; stage=FIXED; log=reports/qualification/fixed.stderr.log
          fi
          if [[ "$code" == "0" ]]; then
            node scripts/lafea-bucket-01-scalable-solver-check.mjs \
              > reports/qualification/scalable.stdout.log \
              2> reports/qualification/scalable.stderr.log
            code=$?; stage=SCALABLE; log=reports/qualification/scalable.stderr.log
          fi
          if [[ "$code" == "0" ]]; then
            node scripts/lafea-bucket-01-kirsch-fixed-probes-check.mjs \
              > reports/qualification/kirsch.stdout.log \
              2> reports/qualification/kirsch.stderr.log
            code=$?; stage=KIRSCH; log=reports/qualification/kirsch.stderr.log
          fi
          if [[ "$code" == "0" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success -f context=lafea/physical-probe-recovery \
              -f description="Fixed-probe and Kirsch qualification passed"
            exit 0
          fi
          detail=$(node -e "const fs=require('fs');const t=fs.readFileSync(process.argv[1],'utf8');process.stdout.write(t.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!/^at\s/.test(s)&&!/^node:/.test(s)).slice(0,16).join(' | ').slice(0,3000))" "$log")
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context="lafea/physical-${stage}" \
            -f description="Physical recovery failed at ${stage}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_error=${encoded}"
          exit "$code"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-physical-recovery-${{ github.sha }}
          path: reports/qualification/
          retention-days: 30
