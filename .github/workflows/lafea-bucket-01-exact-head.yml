name: LAFEA Bucket-01 Exact Head

on:
  push:
    branches:
      - bucket-01-cantilever-benchmark-route
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish runner-started status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=pending
          -f context=lafea/bucket-01-exact-head
          -f description="Runner started"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Patch solver and expose Kirsch convergence evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          solver = Path('src/core/local-continuum/solver.js')
          text = solver.read_text()
          start = text.index('function conjugateGradientSolve(')
          end = text.index('\nfunction applyJacobi(', start)
          block = text[start:end]
          declaration = block.index('  const residualTolerance = tolerance(')
          close = block.index('\n  );', declaration) + len('\n  );')
          block = block[:close] + '\n  const convergenceTarget = residualTolerance / 10;' + block[close:]
          if block.count('finalResidualInfinity > residualTolerance') != 2:
              raise SystemExit('unexpected upper comparison count')
          if block.count('finalResidualInfinity <= residualTolerance') != 2:
              raise SystemExit('unexpected lower comparison count')
          block = block.replace('finalResidualInfinity > residualTolerance', 'finalResidualInfinity > convergenceTarget')
          block = block.replace('finalResidualInfinity <= residualTolerance', 'finalResidualInfinity <= convergenceTarget')
          old = '`Sparse PCG residual ${finalResidualInfinity} exceeds ${residualTolerance} after ${iterations} iterations.`'
          block = block.replace(old, '`Sparse PCG residual ${finalResidualInfinity} exceeds internal target ${convergenceTarget} (acceptance gate ${residualTolerance}) after ${iterations} iterations.`')
          evidence = '      residualTolerance: canonicalNumber(residualTolerance),\n'
          block = block.replace(evidence, '      convergenceTarget: canonicalNumber(convergenceTarget),\n' + evidence)
          solver.write_text(text[:start] + block + text[end:])

          kirsch = Path('scripts/lafea-bucket-01-kirsch-fixed-probes-check.mjs')
          text = kirsch.read_text()
          old = "`${definition.probeId}: ${convergence.reasons.join(', ')}`"
          new = "`${definition.probeId}: ${JSON.stringify(convergence.convergence)}`"
          if text.count(old) != 1:
              raise SystemExit(f'Kirsch convergence assertion marker count={text.count(old)}')
          kirsch.write_text(text.replace(old, new))
          PY

      - name: Validate scalable sparse solver
        run: node scripts/lafea-bucket-01-scalable-solver-check.mjs

      - name: Diagnose governed Kirsch fixed probes
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p reports/qualification
          set +e
          node scripts/lafea-bucket-01-kirsch-fixed-probes-check.mjs \
            > reports/qualification/kirsch.stdout.log \
            2> reports/qualification/kirsch.stderr.log
          exit_code=$?
          if [[ "$exit_code" == "0" ]]; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success \
              -f context="lafea/pcg-headroom-targeted" \
              -f description="Scalable solver and Kirsch checks passed"
            exit 0
          fi
          detail=$(node -e "const fs=require('fs');const t=fs.readFileSync('reports/qualification/kirsch.stderr.log','utf8');const lines=t.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!/^at\s/.test(s)&&!/^node:/.test(s));process.stdout.write(lines.slice(0,12).join(' | ').slice(0,3000))")
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="lafea/kirsch-convergence-detail" \
            -f description="Kirsch convergence evidence retained" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_error=${encoded}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="lafea/bucket-01-exact-head" \
            -f description="Kirsch convergence blocked"
          exit "$exit_code"

      - name: Retain qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-bucket-01-kirsch-convergence-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
