name: LAFEA Bucket-01 Exact Head

on:
  push:
    branches:
      - bucket-01-cantilever-benchmark-route
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish runner-started status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=pending
          -f context=lafea/bucket-01-exact-head
          -f description="Runner started"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run and publish exact-head result
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p reports/qualification
          set +e
          node scripts/lafea-bucket-01-exact-head-check.mjs \
            > reports/qualification/lafea-bucket-01-exact-head.stdout.log \
            2> reports/qualification/lafea-bucket-01-exact-head.stderr.log
          exit_code=$?
          blocker=$(node -e "const fs=require('fs');const p='reports/qualification/lafea-bucket-01-exact-head.json';let t='UNKNOWN';if(fs.existsSync(p)){const r=JSON.parse(fs.readFileSync(p,'utf8'));if(r.blockingCheckIds&&r.blockingCheckIds[0])t=r.blockingCheckIds[0]}process.stdout.write(t)")
          if [[ "$exit_code" == "0" ]]; then
            state=success
            description="Bucket-01 exact-head executable gate passed"
          else
            state=failure
            description="First blocker: ${blocker}"
            safe_blocker=$(printf '%s' "$blocker" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-60)
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context="lafea/blocker/${safe_blocker}" \
              -f description="$description"
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="lafea/bucket-01-exact-head" \
            -f description="$description"
          exit "$exit_code"

      - name: Retain qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-bucket-01-exact-head-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
