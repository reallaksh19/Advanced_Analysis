name: LAFEA Bucket-01 Exact Head

on:
  workflow_dispatch:
  push:
    branches: [bucket-01-cantilever-benchmark-route]

permissions:
  contents: write
  statuses: write

jobs:
  exact-head:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish runner-started status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=pending
          -f context=lafea/bucket-01-exact-head
          -f description="Exact-head runner started"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Bucket-01 exact-head gate
        id: gate
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          mkdir -p reports/qualification
          set +e
          node scripts/lafea-bucket-01-exact-head-check.mjs \
            > reports/qualification/lafea-bucket-01-exact-head.stdout.log \
            2> reports/qualification/lafea-bucket-01-exact-head.stderr.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish exact-head result
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
        shell: bash
        run: |
          blocker=$(node -e "const fs=require('fs');const p='reports/qualification/lafea-bucket-01-exact-head.json';let t='UNKNOWN';if(fs.existsSync(p)){const r=JSON.parse(fs.readFileSync(p,'utf8'));if(r.blockingCheckIds?.[0])t=r.blockingCheckIds[0]}process.stdout.write(t)")
          repair_blocker=$(node -e "const fs=require('fs');const p='reports/qualification/lafea-bucket-01-repair-check.json';let t='NONE';if(fs.existsSync(p)){const r=JSON.parse(fs.readFileSync(p,'utf8'));if(r.blockingCheckIds?.[0])t=r.blockingCheckIds[0]}process.stdout.write(t)")
          if [[ "$EXIT_CODE" == "0" ]]; then
            state=success
            description="Bucket-01 exact-head executable gate passed"
          else
            state=failure
            description="First blocker: ${blocker}"
            safe=$(printf '%s' "$blocker" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-60)
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure -f context="lafea/blocker/${safe}" \
              -f description="$description"
            if [[ "$repair_blocker" != "NONE" ]]; then
              nested=$(printf '%s' "$repair_blocker" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-52)
              gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                -f state=failure -f context="lafea/repair-blocker/${nested}" \
                -f description="Repair blocker: ${repair_blocker}"
            fi
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context=lafea/bucket-01-exact-head \
            -f description="$description"
          exit "$EXIT_CODE"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-bucket-01-exact-head-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30

  uniform-16384-diagnostic:
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Run Bucket-01 16384 diagnostic through exact-head' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Extend the route in this diagnostic worktree only
        shell: bash
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          count_files = [
              Path('src/workspace/lafea-lug-pinhole-mesh-ladder.js'),
              Path('src/workspace/lafea-lug-pinhole-physical-problem-contract.js'),
              Path('src/workspace/lafea-lug-pinhole-physical-problem-batch.js'),
              Path('src/core/lafea-application-templates/controlled-continuum-pilot-contract.js'),
              Path('src/workspace/lafea-controlled-continuum-controller.js'),
          ]
          for path in count_files:
              text = path.read_text()
              old = 'new Set([3, 4])'
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one supported-level marker, found {text.count(old)}')
              path.write_text(text.replace(old, 'new Set([3, 4, 5])', 1))

          contract = Path('src/core/lafea-application-templates/controlled-continuum-pilot-contract.js')
          text = contract.read_text()
          old = 'if (![1, 2, 3, 4].includes(input.ordinal)) {'
          if text.count(old) != 1:
              raise SystemExit(f'ordinal marker count={text.count(old)}')
          text = text.replace(old, 'if (![1, 2, 3, 4, 5].includes(input.ordinal)) {', 1)
          text = text.replace(
              "throw new TypeError('Level ordinal must be 1, 2, 3 or 4.');",
              "throw new TypeError('Level ordinal must be 1, 2, 3, 4 or 5.');",
              1,
          )
          contract.write_text(text)

          response_path = Path('validation/bucket-01/06-production-response-convergence-spec.json')
          response = json.loads(response_path.read_text())
          response['meshLadder'].append({
              'ordinal': 5,
              'radialDivisions': 32,
              'circumferentialDivisions': 256,
              'elementCount': 16384,
              'meshSize': 0.00390625,
              'stiffnessStorage': 'CSR_FULL_SYMMETRIC',
              'solverMethod': 'DETERMINISTIC_JACOBI_PCG',
          })
          response['convergence']['strainEnergy']['governedLevelOrdinals'] = [1, 2, 3, 4, 5]
          response['convergence']['strainEnergy']['evaluatedLevelOrdinals'] = [3, 4, 5]
          response_path.write_text(json.dumps(response, indent=2) + '\n')

          stress_path = Path('validation/bucket-01/08-production-lug-fixed-probe-spec.json')
          stress = json.loads(stress_path.read_text())
          stress['meshLadder'].append({
              'ordinal': 5,
              'elementCount': 16384,
              'meshSize': 0.00390625,
              'radialDivisions': 32,
              'circumferentialDivisions': 256,
          })
          stress['convergenceWindow']['governedLevelOrdinals'] = [1, 2, 3, 4, 5]
          stress['convergenceWindow']['evaluatedLevelOrdinals'] = [3, 4, 5]
          stress_path.write_text(json.dumps(stress, indent=2) + '\n')

          receipt_path = Path('scripts/lafea-bucket-01-production-lug-probe-receipt.mjs')
          receipt = receipt_path.read_text()
          for old, new in [
              ('[64, 256, 1024, 4096],', '[64, 256, 1024, 4096, 16384],'),
              ('[1, 2, 3, 4]);', '[1, 2, 3, 4, 5]);'),
              ('[2, 3, 4]);', '[3, 4, 5]);'),
          ]:
              if receipt.count(old) != 1:
                  raise SystemExit(f'receipt marker {old!r} count={receipt.count(old)}')
              receipt = receipt.replace(old, new, 1)
          receipt_path.write_text(receipt)
          PY

      - name: Execute 16384 solve and direct-point stress receipt
        shell: bash
        run: |
          mkdir -p reports/qualification
          set +e
          node scripts/lafea-bucket-01-production-response-runner.mjs \
            > reports/qualification/uniform-16384-runner.stdout.log \
            2> reports/qualification/uniform-16384-runner.stderr.log
          runner_exit=$?

          lug_exit=99
          if [[ "$runner_exit" == "0" ]]; then
            node scripts/lafea-bucket-01-production-lug-probe-receipt.mjs \
              > reports/qualification/uniform-16384-lug.stdout.log \
              2> reports/qualification/uniform-16384-lug.stderr.log
            lug_exit=$?
          fi

          RUNNER_EXIT="$runner_exit" LUG_EXIT="$lug_exit" SOURCE_HEAD_SHA="$GITHUB_SHA" \
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const readJson = (path) => {
            if (!fs.existsSync(path)) return null;
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch { return null; }
          };
          const tail = (path, limit = 10000) => {
            if (!fs.existsSync(path)) return null;
            const value = fs.readFileSync(path, 'utf8').trim();
            return value ? value.slice(-limit) : null;
          };
          const lug = readJson(
            'reports/qualification/lafea-bucket-01-production-lug-fixed-probes.json',
          );
          const locations = lug ? [
            ...(lug.standaloneProbeReceipts ?? []),
            ...(lug.pathReceipts ?? []).flatMap((row) => row.stationReceipts ?? []),
          ] : [];
          const fallbackReasons = new Set([
            'OSCILLATORY_CONVERGENCE_REQUIRES_ADDITIONAL_LEVEL_OR_BOUND',
            'OBSERVED_ORDER_NOT_POSITIVE',
          ]);
          const evaluated = locations.map((row) => {
            const observations = row.observations ?? [];
            const coarse = observations.at(-3);
            const previous = observations.at(-2);
            const finest = observations.at(-1);
            const priorDifference = Number.isFinite(previous) && Number.isFinite(coarse)
              ? Math.abs(previous - coarse) : null;
            const fineDifference = Number.isFinite(finest) && Number.isFinite(previous)
              ? Math.abs(finest - previous) : null;
            const absoluteUpperBound = Number.isFinite(previous) && Number.isFinite(finest)
              ? Math.max(Math.abs(previous), Math.abs(finest)) : null;
            const relativeWidth = Number.isFinite(fineDifference)
              && Number.isFinite(absoluteUpperBound)
              ? fineDifference / Math.max(absoluteUpperBound, 1e-30) : null;
            const reasons = row.reasons ?? row.convergence?.reasons ?? [];
            const fallbackReasonAccepted = row.status === 'BLOCKED'
              && reasons.length > 0
              && reasons.every((reason) => fallbackReasons.has(reason));
            const fineExcursionReduced = Number.isFinite(fineDifference)
              && Number.isFinite(priorDifference)
              && fineDifference < priorDifference;
            const widthAccepted = Number.isFinite(relativeWidth)
              && relativeWidth <= row.gciTolerance;
            const boundAccepted = fallbackReasonAccepted
              && fineExcursionReduced
              && widthAccepted;
            return {
              probeId: row.probeId,
              role: row.role,
              zone: row.zone,
              governedObservations: row.governedObservations ?? null,
              observations,
              primaryStatus: row.status,
              primaryReasons: reasons,
              classification: row.convergence?.classification ?? null,
              observedOrder: row.convergence?.observedOrder ?? null,
              fineGridGci: row.convergence?.fineGridGci ?? null,
              gciTolerance: row.gciTolerance,
              conservativeBound: {
                policyId: 'FIXED_LOCATION_FINEST_TWO_ABSOLUTE_UPPER_ENVELOPE',
                previousValue: previous ?? null,
                finestValue: finest ?? null,
                absoluteUpperBound,
                priorDifference,
                fineDifference,
                relativeWidth,
                relativeWidthMaximum: row.gciTolerance,
                fallbackReasonAccepted,
                fineExcursionReduced,
                widthAccepted,
                status: boundAccepted ? 'PASS' : 'BLOCKED',
              },
              finalStatus: row.status === 'PASS' || boundAccepted ? 'PASS' : 'BLOCKED',
            };
          });
          const report = {
            schema: 'lafea-bucket-01-uniform-16384-diagnostic/v1',
            sourceHeadSha: process.env.SOURCE_HEAD_SHA,
            executionExit: Number.parseInt(process.env.RUNNER_EXIT, 10),
            lugReceiptExit: Number.parseInt(process.env.LUG_EXIT, 10),
            lugReceiptStatus: lug?.status ?? null,
            governedLevelOrdinals: lug?.governedLevelOrdinals ?? null,
            evaluatedLevelOrdinals: lug?.evaluatedLevelOrdinals ?? null,
            locations: evaluated,
            blockedLocationIds: evaluated
              .filter((row) => row.finalStatus !== 'PASS')
              .map((row) => row.probeId),
            status: Number.parseInt(process.env.RUNNER_EXIT, 10) === 0
              && evaluated.length > 0
              && evaluated.every((row) => row.finalStatus === 'PASS')
              ? 'PASS' : 'BLOCKED',
            logs: {
              runnerStderr: tail('reports/qualification/uniform-16384-runner.stderr.log'),
              lugStdout: tail('reports/qualification/uniform-16384-lug.stdout.log'),
              lugStderr: tail('reports/qualification/uniform-16384-lug.stderr.log'),
            },
          };
          fs.writeFileSync(
            'reports/qualification/lafea-bucket-01-uniform-16384-diagnostic.json',
            `${JSON.stringify(report, null, 2)}\n`,
          );
          NODE
          exit 0

      - name: Retain the isolated diagnostic report
        if: always()
        shell: bash
        run: |
          report=reports/qualification/lafea-bucket-01-uniform-16384-diagnostic.json
          if [[ ! -f "$report" ]]; then
            echo '{"schema":"lafea-bucket-01-uniform-16384-diagnostic/v1","status":"WORKFLOW_FAILED_BEFORE_REPORT"}' > "$report"
          fi
          cp "$report" /tmp/lafea-bucket-01-uniform-16384-diagnostic.json
          git reset --hard HEAD
          git pull --rebase origin "$GITHUB_REF_NAME"
          mkdir -p reports/qualification-diagnostics
          cp /tmp/lafea-bucket-01-uniform-16384-diagnostic.json \
            reports/qualification-diagnostics/lafea-bucket-01-uniform-16384-diagnostic.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/qualification-diagnostics/lafea-bucket-01-uniform-16384-diagnostic.json
          git commit -m 'chore: retain Bucket-01 16384 diagnostic [skip diagnostic]'
          git push origin HEAD:"$GITHUB_REF_NAME"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-bucket-01-uniform-16384-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
