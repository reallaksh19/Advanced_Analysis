name: LAFEA Bucket-01 Exact Head

on:
  push:
    branches:
      - bucket-01-cantilever-benchmark-route
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish runner-started status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=pending
          -f context=lafea/bucket-01-exact-head
          -f description="Runner started"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Patch and diagnose targeted checks
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p reports/qualification
          set +e
          python - <<'PY' > reports/qualification/pcg-patch.stdout.log 2> reports/qualification/pcg-patch.stderr.log
          from pathlib import Path

          path = Path('src/core/local-continuum/solver.js')
          text = path.read_text()
          start = text.index('function conjugateGradientSolve(')
          end = text.index('\nfunction applyJacobi(', start)
          block = text[start:end]

          declaration = block.index('  const residualTolerance = tolerance(')
          close = block.index('\n  );', declaration) + len('\n  );')
          block = block[:close] + '\n  const convergenceTarget = residualTolerance / 10;' + block[close:]

          upper = block.count('finalResidualInfinity > residualTolerance')
          lower = block.count('finalResidualInfinity <= residualTolerance')
          if upper != 2 or lower != 2:
              raise SystemExit(f'comparison counts upper={upper}, lower={lower}')
          block = block.replace('finalResidualInfinity > residualTolerance', 'finalResidualInfinity > convergenceTarget')
          block = block.replace('finalResidualInfinity <= residualTolerance', 'finalResidualInfinity <= convergenceTarget')

          old = '`Sparse PCG residual ${finalResidualInfinity} exceeds ${residualTolerance} after ${iterations} iterations.`'
          if block.count(old) != 1:
              raise SystemExit(f'non-convergence message count={block.count(old)}')
          block = block.replace(old, '`Sparse PCG residual ${finalResidualInfinity} exceeds internal target ${convergenceTarget} (acceptance gate ${residualTolerance}) after ${iterations} iterations.`')

          evidence = '      residualTolerance: canonicalNumber(residualTolerance),\n'
          if block.count(evidence) != 1:
              raise SystemExit(f'evidence marker count={block.count(evidence)}')
          block = block.replace(evidence, '      convergenceTarget: canonicalNumber(convergenceTarget),\n' + evidence)
          path.write_text(text[:start] + block + text[end:])
          PY
          patch_exit=$?
          if [[ "$patch_exit" != "0" ]]; then
            stage=PATCH
            log=reports/qualification/pcg-patch.stderr.log
          else
            node scripts/lafea-bucket-01-scalable-solver-check.mjs \
              > reports/qualification/scalable.stdout.log \
              2> reports/qualification/scalable.stderr.log
            scalable_exit=$?
            if [[ "$scalable_exit" != "0" ]]; then
              stage=SCALABLE
              log=reports/qualification/scalable.stderr.log
            else
              node scripts/lafea-bucket-01-kirsch-fixed-probes-check.mjs \
                > reports/qualification/kirsch.stdout.log \
                2> reports/qualification/kirsch.stderr.log
              kirsch_exit=$?
              if [[ "$kirsch_exit" != "0" ]]; then
                stage=KIRSCH
                log=reports/qualification/kirsch.stderr.log
              else
                gh api --method POST \
                  "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
                  -f state=success \
                  -f context="lafea/pcg-headroom-targeted" \
                  -f description="Scalable solver and Kirsch checks passed"
                exit 0
              fi
            fi
          fi
          detail=$(node -e "const fs=require('fs');const t=fs.existsSync(process.argv[1])?fs.readFileSync(process.argv[1],'utf8'):'missing diagnostic log';const lines=t.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!/^at\s/.test(s)&&!/^node:/.test(s));process.stdout.write(lines.slice(0,18).join(' | ').slice(0,1600))" "$log")
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
          safe=$(printf '%s' "$detail" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-42)
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="lafea/headroom-${stage}/${safe}" \
            -f description="PCG headroom validation failed at ${stage}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_error=${encoded}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="lafea/bucket-01-exact-head" \
            -f description="PCG headroom diagnostic failed at ${stage}"
          exit 1

      - name: Retain qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-bucket-01-headroom-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
