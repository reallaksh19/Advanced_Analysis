name: LAFEA Bucket-01 Load-Driven Nesting Repair

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bucket-01-cantilever-benchmark-route
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repair and publish governed result nesting
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qualification
          publish() {
            state="$1"; context="$2"; description="$3"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${ORIGINAL_SHA}" \
              -f state="$state" -f context="$context" -f description="$description"
          }
          fail() {
            stage="$1"; log="$2"
            detail=$(node -e "const fs=require('fs');const p=process.argv[1];const t=fs.existsSync(p)?fs.readFileSync(p,'utf8'):'missing log';process.stdout.write(t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,20).join(' | ').slice(0,3000))" "$log")
            encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${ORIGINAL_SHA}" \
              -f state=failure -f context="lafea/load-driven-nesting/${stage}" \
              -f description="Load-driven nesting repair failed at ${stage}" \
              -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${ORIGINAL_SHA}?lafea_error=${encoded}"
            exit 1
          }

          publish pending lafea/load-driven-nesting/PATCH "Repairing governed result nesting"
          python - <<'PY' > reports/qualification/load-driven-nesting-patch.stdout.log 2> reports/qualification/load-driven-nesting-patch.stderr.log || true
          from pathlib import Path
          path = Path('src/workspace/lafea-load-driven-pilot-qualification.js')
          text = path.read_text()
          replacements = [
              (
                  '  if (!Array.isArray(resultLoadCase.freeDofIdentities)\n'
                  '    || resultLoadCase.freeDofIdentities.length === 0',
                  '  if (!Array.isArray(resultLoadCase.solverEvidence?.freeDofIdentities)\n'
                  '    || resultLoadCase.solverEvidence.freeDofIdentities.length === 0',
              ),
              (
                  '  const reactionResultant = resultLoadCase.reactions.reduce(',
                  '  const reactionResultant = resultLoadCase.supportReactions.reduce(',
              ),
              (
                  '    freeDofCount: resultLoadCase.freeDofIdentities.length,',
                  '    freeDofCount: resultLoadCase.solverEvidence.freeDofIdentities.length,',
              ),
              (
                  '    constrainedDofCount: resultLoadCase.constrainedDofIdentities.length,',
                  '    constrainedDofCount: resultLoadCase.solverEvidence.constrainedDofIdentities.length,',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'marker count={count}: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          [[ -s reports/qualification/load-driven-nesting-patch.stderr.log ]] \
            && fail PATCH reports/qualification/load-driven-nesting-patch.stderr.log
          publish success lafea/load-driven-nesting/PATCH "Governed result nesting repaired"

          publish pending lafea/load-driven-nesting/T6D "Running load-driven pilot qualification"
          node scripts/lafea-nb-t6d-load-driven-qualification-check.mjs \
            > reports/qualification/load-driven-t6d.stdout.log \
            2> reports/qualification/load-driven-t6d.stderr.log \
            || fail T6D reports/qualification/load-driven-t6d.stderr.log
          publish success lafea/load-driven-nesting/T6D "Load-driven pilot qualification passed"

          publish pending lafea/load-driven-nesting/HANDOFF "Running selected-pilot handoff regressions"
          node scripts/lafea-nb-t6e-evidence-handoff-review-check.mjs \
            > reports/qualification/load-driven-t6e.stdout.log \
            2> reports/qualification/load-driven-t6e.stderr.log \
            || fail HANDOFF reports/qualification/load-driven-t6e.stderr.log
          node scripts/lafea-nb-t6f-read-only-review-session-check.mjs \
            > reports/qualification/load-driven-t6f.stdout.log \
            2> reports/qualification/load-driven-t6f.stderr.log \
            || fail HANDOFF reports/qualification/load-driven-t6f.stderr.log
          publish success lafea/load-driven-nesting/HANDOFF "Selected-pilot handoff regressions passed"

          git add src/workspace/lafea-load-driven-pilot-qualification.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(lafea): read governed load-case evidence fields" \
            > reports/qualification/load-driven-nesting-commit.stdout.log \
            2> reports/qualification/load-driven-nesting-commit.stderr.log \
            || fail COMMIT reports/qualification/load-driven-nesting-commit.stderr.log
          repaired_sha=$(git rev-parse HEAD)
          git push origin HEAD:bucket-01-cantilever-benchmark-route \
            > reports/qualification/load-driven-nesting-push.stdout.log \
            2> reports/qualification/load-driven-nesting-push.stderr.log \
            || fail PUSH reports/qualification/load-driven-nesting-push.stderr.log
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${ORIGINAL_SHA}" \
            -f state=success \
            -f context="lafea/repaired-head/${repaired_sha:0:12}" \
            -f description="Load-driven governed-result repair published" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${repaired_sha}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-load-driven-nesting-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
