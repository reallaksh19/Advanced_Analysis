name: Dependency-Aware Chunk Repair

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bucket-01-cantilever-benchmark-route
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate dependency-aware chunking
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qualification
          fail() {
            stage="$1"; log="$2"
            detail=$(node -e "const fs=require('fs');const p=process.argv[1];const t=fs.existsSync(p)?fs.readFileSync(p,'utf8'):'missing log';process.stdout.write(t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(-40).join(' | ').slice(0,6000))" "$log")
            encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${ORIGINAL_SHA}" \
              -f state=failure -f context="lafea/chunk-aware/${stage}" \
              -f description="Dependency-aware chunking failed at ${stage}" \
              -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${ORIGINAL_SHA}?lafea_error=${encoded}"
            exit 1
          }
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${ORIGINAL_SHA}" \
            -f state=pending -f context=lafea/chunk-aware \
            -f description="Testing dependency-aware manual chunks"

          python - <<'PY' > reports/qualification/chunk-aware-patch.stdout.log 2> reports/qualification/chunk-aware-patch.stderr.log || true
          from pathlib import Path
          path = Path('vite.config.js')
          text = path.read_text()
          marker = "  if (source.includes('/src/core/')) return 'core-application';"
          replacement = """  if (source.includes('/src/core/lafea-application-templates/')) {
            return 'core-lafea-application-templates';
          }
          if (source.includes('/src/core/common-enriched-properties/')) {
            return 'core-common-enriched-properties';
          }
          if (source.includes('/src/core/')) return 'core-application';"""
          if text.count(marker) != 1:
              raise RuntimeError(f'core marker count={text.count(marker)}')
          if text.count('        onlyExplicitManualChunks: true,') != 1:
              raise RuntimeError('manual chunk option marker missing')
          text = text.replace(marker, replacement, 1)
          text = text.replace(
              '        onlyExplicitManualChunks: true,',
              '        onlyExplicitManualChunks: false,',
              1,
          )
          path.write_text(text)
          PY
          [[ -s reports/qualification/chunk-aware-patch.stderr.log ]] \
            && fail PATCH reports/qualification/chunk-aware-patch.stderr.log

          npm run build \
            > reports/qualification/chunk-aware-build.stdout.log \
            2> reports/qualification/chunk-aware-build.stderr.log \
            || fail BUILD reports/qualification/chunk-aware-build.stdout.log

          node --input-type=module <<'NODE' > reports/qualification/chunk-aware-sizes.json
          import fs from 'node:fs';
          import path from 'node:path';
          const assets = path.resolve('dist/assets');
          const rows = fs.readdirSync(assets)
            .filter((name) => name.endsWith('.js'))
            .map((name) => ({ name, bytes: fs.statSync(path.join(assets, name)).size }))
            .sort((a, b) => b.bytes - a.bytes);
          console.log(JSON.stringify(rows.slice(0, 12), null, 2));
          NODE

          git add vite.config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(build): use dependency-aware manual chunks" \
            > reports/qualification/chunk-aware-commit.stdout.log \
            2> reports/qualification/chunk-aware-commit.stderr.log \
            || fail COMMIT reports/qualification/chunk-aware-commit.stderr.log
          repaired_sha=$(git rev-parse HEAD)
          git push origin HEAD:bucket-01-cantilever-benchmark-route \
            > reports/qualification/chunk-aware-push.stdout.log \
            2> reports/qualification/chunk-aware-push.stderr.log \
            || fail PUSH reports/qualification/chunk-aware-push.stderr.log
          largest=$(node -e "const r=require('./reports/qualification/chunk-aware-sizes.json');process.stdout.write(r[0].name+':'+r[0].bytes)")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${ORIGINAL_SHA}" \
            -f state=success \
            -f context="lafea/repaired-head/${repaired_sha:0:12}" \
            -f description="Dependency-aware chunk repair published" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${repaired_sha}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${ORIGINAL_SHA}" \
            -f state=success -f context=lafea/chunk-aware \
            -f description="Production build passed; largest ${largest}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-aware-chunks-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
