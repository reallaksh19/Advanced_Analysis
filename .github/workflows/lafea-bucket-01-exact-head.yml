name: Emitted Chunk Module Profile

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture Rollup module composition
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p reports/qualification
          python - <<'PY'
          from pathlib import Path
          path = Path('vite.config.js')
          text = path.read_text()
          text = text.replace(
              "import { defineConfig } from 'vite';",
              "import fs from 'node:fs';\nimport path from 'node:path';\nimport { defineConfig } from 'vite';",
              1,
          )
          marker = 'export default defineConfig({'
          plugin = '''const emittedChunkProfilePlugin = {
            name: 'emitted-chunk-profile',
            generateBundle(_options, bundle) {
              const rows = Object.values(bundle)
                .filter((entry) => entry.type === 'chunk')
                .map((chunk) => ({
                  fileName: chunk.fileName,
                  name: chunk.name,
                  bytes: Buffer.byteLength(chunk.code),
                  modules: Object.entries(chunk.modules).map(([id, meta]) => ({
                    id: id.replaceAll('\\\\', '/'),
                    renderedLength: meta.renderedLength,
                    originalLength: meta.originalLength,
                  })).sort((a, b) => b.renderedLength - a.renderedLength),
                }));
              fs.mkdirSync(path.resolve('reports/qualification'), { recursive: true });
              fs.writeFileSync(
                path.resolve('reports/qualification/emitted-chunk-profile.json'),
                JSON.stringify(rows, null, 2),
              );
            },
          };

          '''
          if text.count(marker) != 1:
              raise RuntimeError('config marker missing')
          text = text.replace(marker, plugin + marker, 1)
          text = text.replace('  plugins: [],', '  plugins: [emittedChunkProfilePlugin],', 1)
          path.write_text(text)
          PY
          node scripts/advanced-shell-contract-check.mjs
          npx vite build > reports/qualification/emitted-build.stdout.log 2> reports/qualification/emitted-build.stderr.log
          detail=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const rows = JSON.parse(fs.readFileSync('reports/qualification/emitted-chunk-profile.json', 'utf8'));
          const targets = rows.filter((row) => row.name === 'core-application' || row.name === 'workspace-analysis');
          const compact = targets.map((row) => {
            const domains = new Map();
            for (const module of row.modules) {
              let domain = '(other)';
              const core = module.id.match(/\/src\/core\/([^/]+)/u);
              const workspace = module.id.match(/\/src\/workspace\/([^/]+)/u);
              if (core) domain = `core/${core[1]}`;
              else if (workspace) domain = `workspace/${workspace[1]}`;
              const value = domains.get(domain) ?? 0;
              domains.set(domain, value + module.renderedLength);
            }
            return {
              name: row.name,
              bytes: row.bytes,
              topDomains: [...domains.entries()].sort((a, b) => b[1] - a[1]).slice(0, 15),
              topModules: row.modules.slice(0, 18).map((module) => ({
                id: module.id.replace(/^.*\/src\//u, 'src/'),
                renderedLength: module.renderedLength,
              })),
            };
          });
          process.stdout.write(JSON.stringify(compact));
          NODE
          )
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=lafea/emitted-chunk-profile/DETAIL \
            -f description="Captured emitted oversized chunk modules" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_error=${encoded}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emitted-chunk-profile-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
