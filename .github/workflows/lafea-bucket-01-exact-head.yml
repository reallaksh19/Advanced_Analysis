name: LAFEA Bucket-01 Load-Driven Evidence Diagnostic

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture production solver evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p reports/qualification
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/lafea-nb-t6d-load-driven-qualification-check.mjs')
          text = path.read_text()
          marker = 'const positive = executeLoadDriven([1000, 250]);'
          injection = marker + "\nconsole.error('SOLVER_EVIDENCE=' + JSON.stringify(positive.execution.controllerResult.levelResults.map((row) => row.execution.result.loadCaseResults[0].solverEvidence)));"
          if text.count(marker) != 1:
              raise RuntimeError(f'marker count={text.count(marker)}')
          path.write_text(text.replace(marker, injection, 1))
          PY
          set +e
          node scripts/lafea-nb-t6d-load-driven-qualification-check.mjs \
            > reports/qualification/load-driven-evidence.stdout.log \
            2> reports/qualification/load-driven-evidence.stderr.log
          exit_code=$?
          detail=$(node -e "const fs=require('fs');const t=fs.readFileSync('reports/qualification/load-driven-evidence.stderr.log','utf8');const line=t.split(/\r?\n/).find(s=>s.startsWith('SOLVER_EVIDENCE='))||t.slice(0,3000);process.stdout.write(line.slice(0,7000))")
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=lafea/load-driven-evidence/DETAIL \
            -f description="Captured load-driven solver evidence" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_error=${encoded}"
          exit "$exit_code"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-load-driven-evidence-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
