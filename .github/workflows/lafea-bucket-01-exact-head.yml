name: LAFEA Bucket-01 Load-Driven Pilot Diagnostic

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  load-driven-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run load-driven free-DOF pilot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p reports/qualification
          set +e
          node scripts/lafea-nb-t6d-load-driven-qualification-check.mjs \
            > reports/qualification/load-driven-pilot.stdout.log \
            2> reports/qualification/load-driven-pilot.stderr.log
          exit_code=$?
          if [[ "$exit_code" == "0" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success \
              -f context=lafea/load-driven-pilot/PASS \
              -f description="Load-driven free-DOF pilot passed"
          else
            detail=$(node -e "const fs=require('fs');const t=fs.readFileSync('reports/qualification/load-driven-pilot.stderr.log','utf8');process.stdout.write(t.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!/^at\s/.test(s)&&!/^node:/.test(s)).slice(0,20).join(' | ').slice(0,3000))")
            encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
            context=$(printf '%s' "$detail" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-62)
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context="lafea/load-driven-pilot/${context}" \
              -f description="Load-driven free-DOF pilot failed" \
              -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_error=${encoded}"
          fi
          exit "$exit_code"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-load-driven-pilot-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
