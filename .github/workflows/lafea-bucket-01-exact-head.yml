name: Core Application Chunk Profile

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Profile unassigned core domains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p reports/qualification
          node --input-type=module <<'NODE' > reports/qualification/core-chunk-profile.json
          import fs from 'node:fs';
          import path from 'node:path';
          import { manualChunk } from './vite.config.js';

          const root = path.resolve('src/core');
          const rows = new Map();
          function walk(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const target = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(target);
              else if (/\.(?:js|mjs|ts)$/u.test(entry.name)) {
                const chunk = manualChunk(target);
                if (chunk !== 'core-application') continue;
                const relative = path.relative(root, target).replaceAll('\\', '/');
                const domain = relative.includes('/') ? relative.split('/')[0] : '(root)';
                const row = rows.get(domain) ?? { domain, bytes: 0, files: 0 };
                row.bytes += fs.statSync(target).size;
                row.files += 1;
                rows.set(domain, row);
              }
            }
          }
          walk(root);
          const profile = [...rows.values()].sort((a, b) => b.bytes - a.bytes);
          console.log(JSON.stringify({ totalBytes: profile.reduce((s, r) => s + r.bytes, 0), profile }, null, 2));
          NODE
          detail=$(node -e "const p=require('./reports/qualification/core-chunk-profile.json');process.stdout.write(JSON.stringify({totalBytes:p.totalBytes,top:p.profile.slice(0,18)}))")
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=lafea/core-chunk-profile/DETAIL \
            -f description="Profiled core-application source domains" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_error=${encoded}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-application-chunk-profile-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
