name: LAFEA Bucket-01 Production Build Diagnostic

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run production build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p reports/qualification
          set +e
          npm run build \
            > reports/qualification/production-build.stdout.log \
            2> reports/qualification/production-build.stderr.log
          exit_code=$?
          if [[ "$exit_code" == "0" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success -f context=lafea/production-build/PASS \
              -f description="Production build passed"
          else
            detail=$(node -e "const fs=require('fs');const out=fs.readFileSync('reports/qualification/production-build.stdout.log','utf8');const err=fs.readFileSync('reports/qualification/production-build.stderr.log','utf8');const text=(out+'\n'+err).split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(-30).join(' | ').slice(0,5000);process.stdout.write(text)")
            encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
            context=$(printf '%s' "$detail" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-62)
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure -f context="lafea/production-build/${context}" \
              -f description="Production build failed" \
              -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_error=${encoded}"
          fi
          exit "$exit_code"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-production-build-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
