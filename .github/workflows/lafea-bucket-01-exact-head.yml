name: LAFEA Bucket-01 Exact Head

on:
  push:
    branches:
      - bucket-01-cantilever-benchmark-route
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Publish runner-started status
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=pending
          -f context=lafea/bucket-01-exact-head
          -f description="Runner started"

      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Retain rejected Kirsch and equilibrium diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          kirsch = Path('scripts/lafea-bucket-01-kirsch-fixed-probes-check.mjs')
          text = kirsch.read_text()
          old = "  assert.equal(result.qualification.state, QUALIFICATION_STATES.ACCEPTED);"
          new = """  assert.equal(
            result.qualification.state,
            QUALIFICATION_STATES.ACCEPTED,
            `Kirsch level ${definition.ordinal} rejected: ${JSON.stringify(result.diagnostics ?? [])}`,
          );"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one Kirsch qualification assertion, found {text.count(old)}')
          kirsch.write_text(text.replace(old, new))

          solver = Path('src/core/local-continuum/solver.js')
          text = solver.read_text()
          old = """  const totals = equilibriumTotals(dofs, constrained, force, residual);
            const equilibriumLimit = tolerance(
          """
          new = """  const freeTotals = { UX: 0, UY: 0 };
            free.forEach((index) => {
              freeTotals[dofAxis(dofs[index])] += residual[index];
            });
            const totals = equilibriumTotals(dofs, constrained, force, residual);
            const equilibriumLimit = tolerance(
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one equilibrium totals block, found {text.count(old)}')
          text = text.replace(old, new)
          old = "      'Reaction equilibrium did not qualify.',"
          new = "      `Reaction equilibrium did not qualify: freeMaximum=${freeMaximum}, freeLimit=${freeLimit}, freeUX=${freeTotals.UX}, freeUY=${freeTotals.UY}, UX=${totals.UX}, UY=${totals.UY}, limit=${equilibriumLimit}, scale=${scale}.`,"
          if text.count(old) != 1:
              raise SystemExit(f'expected one reaction-equilibrium message, found {text.count(old)}')
          solver.write_text(text.replace(old, new))
          PY

      - name: Diagnose governed Kirsch fixed probes
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p reports/qualification
          set +e
          node scripts/lafea-bucket-01-kirsch-fixed-probes-check.mjs \
            > reports/qualification/lafea-bucket-01-kirsch.stdout.log \
            2> reports/qualification/lafea-bucket-01-kirsch.stderr.log
          exit_code=$?
          if [[ "$exit_code" == "0" ]]; then
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success \
              -f context="lafea/kirsch-fixed-probes" \
              -f description="Kirsch fixed-probe check passed"
            exit 0
          fi
          detail=$(node -e "const fs=require('fs');const p='reports/qualification/lafea-bucket-01-kirsch.stderr.log';const t=fs.existsSync(p)?fs.readFileSync(p,'utf8'):'no stderr';const lines=t.split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!/^at\s/.test(s)&&!/^node:/.test(s));process.stdout.write(lines.slice(0,16).join(' | ').slice(0,1600))")
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
          safe=$(printf '%s' "$detail" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-48)
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="lafea/kirsch-detail/${safe}" \
            -f description="Kirsch fixed-probe assertion" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_error=${encoded}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="lafea/bucket-01-exact-head" \
            -f description="Kirsch diagnostic failed"
          exit "$exit_code"

      - name: Retain qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-bucket-01-kirsch-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
