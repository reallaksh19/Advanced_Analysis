name: LAFEA Bucket-01 PCG Targeted Repair

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bucket-01-cantilever-benchmark-route
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply and publish targeted PCG repair
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qualification
          status() {
            state="$1"; context="$2"; description="$3"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${ORIGINAL_SHA}" \
              -f state="$state" -f context="$context" -f description="$description"
          }
          fail() {
            stage="$1"; log="$2"
            detail=$(node -e "const fs=require('fs');const p=process.argv[1];const t=fs.existsSync(p)?fs.readFileSync(p,'utf8'):'missing log';process.stdout.write(t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,20).join(' | ').slice(0,3000))" "$log")
            encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${ORIGINAL_SHA}" \
              -f state=failure -f context="lafea/pcg-target/${stage}" \
              -f description="Targeted PCG repair failed at ${stage}" \
              -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${ORIGINAL_SHA}?lafea_error=${encoded}"
            exit 1
          }

          status pending lafea/pcg-target/PATCH "Applying reliable residual update"
          python - <<'PY' > reports/qualification/pcg-patch.stdout.log 2> reports/qualification/pcg-patch.stderr.log || true
          from pathlib import Path
          path = Path('src/core/local-continuum/solver.js')
          text = path.read_text()
          old_limit = """  const iterationLimit = Math.min(
              50000,
              Math.max(500, matrix.size * 8),
            );"""
          new_limit = """  const iterationLimit = Math.min(
              50000,
              Math.max(1000, matrix.size * 16),
            );"""
          old_update = """      iterations += 1;
              finalResidualInfinity = maxAbs(residual);
              if (finalResidualInfinity <= convergenceTarget || iterations % 50 === 0) {
                residual = exactResidual(matrix, rightHandSide, solution);
                finalResidualInfinity = maxAbs(residual);
                if (finalResidualInfinity <= convergenceTarget) break;
              }
              preconditioned = applyJacobi(matrix.diagonal, residual);"""
          new_update = """      iterations += 1;
              const recursiveResidualInfinity = maxAbs(residual);
              finalResidualInfinity = recursiveResidualInfinity;
              if (recursiveResidualInfinity <= convergenceTarget || iterations % 100 === 0) {
                const reliableResidual = exactResidual(matrix, rightHandSide, solution);
                const reliableResidualInfinity = maxAbs(reliableResidual);
                finalResidualInfinity = reliableResidualInfinity;
                if (reliableResidualInfinity <= convergenceTarget) {
                  residual = reliableResidual;
                  break;
                }
                if (recursiveResidualInfinity <= convergenceTarget) {
                  residual = reliableResidual;
                  preconditioned = applyJacobi(matrix.diagonal, residual);
                  direction = [...preconditioned];
                  rho = dotVector(residual, preconditioned);
                  if (!(rho > 0) || !Number.isFinite(rho)) {
                    throw singularError(
                      'UNDER_CONSTRAINED_OR_SINGULAR_SYSTEM',
                      'solver',
                      'Sparse PCG reliable-update residual product is not positive.',
                    );
                  }
                  continue;
                }
              }
              preconditioned = applyJacobi(matrix.diagonal, residual);"""
          if text.count(old_limit) != 1:
              raise RuntimeError(f'iteration-limit marker count={text.count(old_limit)}')
          if text.count(old_update) != 1:
              raise RuntimeError(f'residual-update marker count={text.count(old_update)}')
          path.write_text(text.replace(old_limit, new_limit).replace(old_update, new_update))
          PY
          [[ -s reports/qualification/pcg-patch.stderr.log ]] && fail PATCH reports/qualification/pcg-patch.stderr.log
          status success lafea/pcg-target/PATCH "Reliable residual update applied"

          status pending lafea/pcg-target/SCALABLE "Running scalable sparse solver check"
          node scripts/lafea-bucket-01-scalable-solver-check.mjs \
            > reports/qualification/pcg-scalable.stdout.log \
            2> reports/qualification/pcg-scalable.stderr.log \
            || fail SCALABLE reports/qualification/pcg-scalable.stderr.log
          status success lafea/pcg-target/SCALABLE "Scalable sparse solver passed"

          status pending lafea/pcg-target/CANTILEVER "Running governed T6 cantilever"
          node scripts/lafea-bucket-01-cantilever-check.mjs \
            > reports/qualification/pcg-cantilever.stdout.log \
            2> reports/qualification/pcg-cantilever.stderr.log \
            || fail CANTILEVER reports/qualification/pcg-cantilever.stderr.log
          status success lafea/pcg-target/CANTILEVER "Governed T6 cantilever passed"

          status pending lafea/pcg-target/KIRSCH "Running governed Kirsch check"
          node scripts/lafea-bucket-01-kirsch-fixed-probes-check.mjs \
            > reports/qualification/pcg-kirsch.stdout.log \
            2> reports/qualification/pcg-kirsch.stderr.log \
            || fail KIRSCH reports/qualification/pcg-kirsch.stderr.log
          status success lafea/pcg-target/KIRSCH "Governed Kirsch check passed"

          git add src/core/local-continuum/solver.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(lafea): preserve PCG conjugacy during residual checks" \
            > reports/qualification/pcg-commit.stdout.log \
            2> reports/qualification/pcg-commit.stderr.log \
            || fail COMMIT reports/qualification/pcg-commit.stderr.log
          repaired_sha=$(git rev-parse HEAD)
          git push origin HEAD:bucket-01-cantilever-benchmark-route \
            > reports/qualification/pcg-push.stdout.log \
            2> reports/qualification/pcg-push.stderr.log \
            || fail PUSH reports/qualification/pcg-push.stderr.log
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${ORIGINAL_SHA}" \
            -f state=success -f context="lafea/repaired-head/${repaired_sha:0:12}" \
            -f description="Targeted PCG repair published" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${repaired_sha}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-pcg-targeted-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
