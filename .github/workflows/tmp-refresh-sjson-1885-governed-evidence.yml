name: Refresh SJSON 1885 governed evidence once

on:
  push:
    branches:
      - agent/sjson-1885-configurable-screening
    paths:
      - .github/workflows/tmp-refresh-sjson-1885-governed-evidence.yml

permissions:
  contents: write

concurrency:
  group: refresh-sjson-1885-governed-evidence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/sjson-1885-configurable-screening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize exact enriched benchmark sources
        run: |
          git show 07ce017eb7113517cc032771f7717f88c0a93d4c:benchmarks/1885Sjson/EnrichedSjson > /tmp/EnrichedSjson
          git show 07ce017eb7113517cc032771f7717f88c0a93d4c:benchmarks/1885Sjson/EnrichedSjson.topology.input.xml > /tmp/EnrichedSjson.topology.input.xml
      - name: Generate governed POS and screening evidence
        run: |
          node scripts/nonfea-piping-foundation-check.mjs
          node scripts/empirical-sjson-1885-pos-section-material-run.mjs \
            project-data/1885s-nonfea-piping-defaults.json \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.topology.input.xml \
            /tmp/pos-section-material.json
          node scripts/empirical-sjson-1885-pos-section-material-check.mjs \
            /tmp/pos-section-material.json
          node scripts/empirical-pos-section-material-csv.mjs \
            /tmp/pos-section-material.json \
            /tmp/empirical-pos-section-material.csv \
            /tmp/empirical-configured-default-usage.csv
          node scripts/empirical-sjson-1885-configurable-screening-run.mjs \
            benchmarks/1885Sjson/empirical-screening-profile.config.json \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.topology.input.xml \
            /tmp/result-a.json
          node scripts/empirical-sjson-1885-configurable-screening-run.mjs \
            benchmarks/1885Sjson/empirical-screening-profile.config.json \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.topology.input.xml \
            /tmp/result-b.json
          cmp /tmp/result-a.json /tmp/result-b.json
          node scripts/empirical-sjson-1885-configurable-screening-check.mjs /tmp/result-a.json
      - name: Commit exact generated evidence and remove this workflow
        run: |
          cp /tmp/result-a.json benchmarks/1885Sjson/empirical-screening-result.configurable.json
          cp /tmp/empirical-pos-section-material.csv benchmarks/1885Sjson/empirical-pos-section-material.csv
          cp /tmp/empirical-configured-default-usage.csv benchmarks/1885Sjson/empirical-configured-default-usage.csv
          git rm .github/workflows/tmp-refresh-sjson-1885-governed-evidence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add benchmarks/1885Sjson/empirical-screening-result.configurable.json \
            benchmarks/1885Sjson/empirical-pos-section-material.csv \
            benchmarks/1885Sjson/empirical-configured-default-usage.csv
          git diff --cached --check
          git commit -m "Refresh governed 1885S POS and screening evidence"
          git push origin HEAD:agent/sjson-1885-configurable-screening
