name: 3D Edit XYZ Branch Demo

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-xyz-branch-demo.yml'
      - 'public/fixtures/topology-edit-20-element-demo.staged.json'
      - 'src/workspace/tree-panel-events.js'
      - 'tests/topology-edit-xyz-branch-demo.test.mjs'
      - 'tests/topology-edit-20-element-demo-loader.test.mjs'
      - 'e2e/topology-edit-xyz-branch-demo.spec.js'
      - 'docs/topology-edit-xyz-10-element-branch-demo.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-edit-xyz-branch-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  xyz-branch-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSER_CHANNEL: chromium

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify exact XYZ branch sources
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          node --check src/workspace/tree-panel-events.js
          node --check tests/topology-edit-xyz-branch-demo.test.mjs
          node --check e2e/topology-edit-xyz-branch-demo.spec.js
          node -e "const fs=require('node:fs'); const row=JSON.parse(fs.readFileSync('public/fixtures/topology-edit-20-element-demo.staged.json','utf8')); if(row.demo.embeddedScenarios[0].branchElementCount!==10) process.exit(1);"
          git diff --check

      - name: Execute XYZ branch and legacy loader contracts
        run: |
          set -o pipefail
          node --test --test-reporter=tap \
            tests/topology-edit-xyz-branch-demo.test.mjs \
            tests/topology-edit-20-element-demo-loader.test.mjs \
            2>&1 | tee topology-edit-xyz-branch-test-output.txt

      - name: Execute production Chromium XYZ branch walkthrough
        run: |
          npx playwright test \
            e2e/topology-edit-xyz-branch-demo.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line

      - name: Upload XYZ branch qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-xyz-branch-demo-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            topology-edit-xyz-branch-test-output.txt
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
