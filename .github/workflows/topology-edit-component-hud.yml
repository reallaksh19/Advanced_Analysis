name: 3D Edit Component HUD

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-component-hud.yml'
      - 'public/fixtures/topology-edit-professional-spec-catalog.json'
      - 'src/workspace/topology-edit/professional/topology-edit-component-hud-context.js'
      - 'src/workspace/topology-edit/professional/topology-edit-spec-catalog.js'
      - 'src/workspace/topology-edit/professional/topology-edit-compatibility.js'
      - 'src/workspace/viewport-productivity/topology-edit-professional-operation-runtime.js'
      - 'src/workspace/viewport-productivity/topology-edit-professional-operation-state.js'
      - 'src/workspace/viewport-productivity/topology-edit-professional-operation-panel.js'
      - 'src/workspace/viewport-productivity/topology-edit-professional-operation-styles.js'
      - 'tests/topology-edit-component-hud-context.test.mjs'
      - 'tests/topology-edit-professional-engineering-catalog.test.mjs'
      - 'tests/topology-edit-professional-engineering-compatibility.test.mjs'
      - 'e2e/topology-edit-component-hud-catalog.spec.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-edit-component-hud-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-component-hud:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSER_CHANNEL: chromium

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          node --check src/workspace/topology-edit/professional/topology-edit-component-hud-context.js
          node --check src/workspace/viewport-productivity/topology-edit-professional-operation-runtime.js
          node --check src/workspace/viewport-productivity/topology-edit-professional-operation-state.js
          node --check src/workspace/viewport-productivity/topology-edit-professional-operation-panel.js
          node --check src/workspace/viewport-productivity/topology-edit-professional-operation-styles.js
          node --check tests/topology-edit-component-hud-context.test.mjs
          node --check e2e/topology-edit-component-hud-catalog.spec.js
          git diff --check

      - name: Execute catalogue and HUD contracts
        run: |
          node --test \
            tests/topology-edit-component-hud-context.test.mjs \
            tests/topology-edit-professional-engineering-catalog.test.mjs \
            tests/topology-edit-professional-engineering-compatibility.test.mjs

      - name: Execute contextual HUD Chromium qualification
        run: |
          npx playwright test \
            e2e/topology-edit-component-hud-catalog.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-component-hud-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
