name: C3D Wave 3 GPU Picking

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-c3d-wave3-gpu-picking.yml'
      - 'src/workspace/topology-edit/topology-edit-gpu-pick-helpers.js'
      - 'src/workspace/topology-edit/topology-edit-gpu-picker.js'
      - 'src/workspace/topology-edit/topology-edit-viewport-backend.js'
      - 'tests/topology-edit-c3d-wave3-gpu-picking.test.mjs'
      - 'tests/topology-edit-c3d-wave*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-picking:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
      - name: Install locked dependencies
        run: npm ci
      - name: Enforce syntax and coding boundaries
        run: |
          node --check src/workspace/topology-edit/topology-edit-gpu-pick-helpers.js
          node --check src/workspace/topology-edit/topology-edit-gpu-picker.js
          node --check src/workspace/topology-edit/topology-edit-viewport-backend.js
          node --check tests/topology-edit-c3d-wave3-gpu-picking.test.mjs
          test "$(wc -l < src/workspace/topology-edit/topology-edit-gpu-pick-helpers.js)" -le 300
          test "$(wc -l < src/workspace/topology-edit/topology-edit-gpu-picker.js)" -le 300
          test "$(wc -l < src/workspace/topology-edit/topology-edit-viewport-backend.js)" -le 300
      - name: Qualify GPU identity, parity, restoration, and fallback
        run: node --test tests/topology-edit-c3d-wave3-gpu-picking.test.mjs
      - name: Retain C3D presentation, visibility, sectioning, and search
        run: |
          node --test tests/topology-edit-c3d-wave0.test.mjs
          node --test tests/topology-edit-c3d-wave1-visibility.test.mjs
          node --test tests/topology-edit-c3d-wave1-sectioning.test.mjs
          node --test tests/topology-edit-c3d-wave2-search.test.mjs
      - name: Retain Track B autofix and lifecycle authority
        run: |
          node --test tests/topology-edit-wave3b-autofix.test.mjs
          node --test tests/topology-edit-wave3c-autofix-ui.test.mjs
          node --test tests/topology-edit-wave4a-persistence-export.test.mjs
          node --test tests/topology-edit-wave4b-commit-rollback.test.mjs
          node --test tests/topology-edit-wave4c-lifecycle-ui.test.mjs
      - name: Retain source and API governance
        run: |
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs
      - name: Build production bundle
        run: npm run build
      - name: Write exact-head C3D Wave 3 evidence
        run: |
          mkdir -p reports/qualification
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (commit !== process.env.TOPOLOGY_EDIT_TARGET_HEAD_SHA) throw new Error('Exact-head mismatch.');
          const paths = [
            'src/workspace/topology-edit/topology-edit-gpu-pick-helpers.js',
            'src/workspace/topology-edit/topology-edit-gpu-picker.js',
            'src/workspace/topology-edit/topology-edit-viewport-backend.js',
            'tests/topology-edit-c3d-wave3-gpu-picking.test.mjs',
          ];
          const evidence = {
            schema: 'TopologyEditC3DWave3GpuPickingEvidence.v1',
            repository: process.env.GITHUB_REPOSITORY,
            commit,
            status: 'PASS_GPU_COLOR_ID_PICKING_WITH_CPU_POINT_FALLBACK',
            identityAuthority: 'EXACT_PICK_TARGET_AND_INSTANCE_PICK_TABLE',
            gpuIdsAreEngineeringAuthority: false,
            meshNameInferenceAllowed: false,
            proximityRetargetingAllowed: false,
            nonPickableGroupsExcluded: true,
            clippingParityRequired: true,
            commandAuthorityChanged: false,
            persistenceAuthorityChanged: false,
            releaseQualified: false,
            files: Object.fromEntries(paths.map((path) => [
              path,
              createHash('sha256').update(readFileSync(path)).digest('hex'),
            ])),
          };
          writeFileSync(
            'reports/qualification/topology-edit-c3d-wave3-gpu-picking.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE
      - name: Verify patch hygiene
        run: |
          git diff --check "${{ github.event.pull_request.base.sha || github.sha }}...HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        with:
          name: topology-edit-c3d-wave3-gpu-picking-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-c3d-wave3-gpu-picking.json
          if-no-files-found: error
          retention-days: 30
