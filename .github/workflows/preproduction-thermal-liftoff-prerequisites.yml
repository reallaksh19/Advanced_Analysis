name: preproduction-thermal-liftoff-prerequisites

on:
  pull_request:
    branches:
      - agent/preproduction-support-contact-authority-batch
    paths:
      - src/workspace/engineering-loads/preproduction-thermal-liftoff-displacement-authority.js
      - src/workspace/engineering-loads/preproduction-thermal-liftoff-mechanics-authority.js
      - src/workspace/engineering-loads/preproduction-thermal-liftoff-prerequisite-authority.js
      - scripts/preproduction-thermal-liftoff-prerequisites-check.mjs
      - .github/workflows/preproduction-thermal-liftoff-prerequisites.yml

permissions:
  contents: read

jobs:
  qualify-preproduction-thermal-liftoff-prerequisites:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prove exact head and clean worktree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code

      - name: Enforce five-path batch containment
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="$(git rev-parse HEAD)"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/tl-prerequisite-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              src/workspace/engineering-loads/preproduction-thermal-liftoff-displacement-authority.js|src/workspace/engineering-loads/preproduction-thermal-liftoff-mechanics-authority.js|src/workspace/engineering-loads/preproduction-thermal-liftoff-prerequisite-authority.js|scripts/preproduction-thermal-liftoff-prerequisites-check.mjs|.github/workflows/preproduction-thermal-liftoff-prerequisites.yml) ;;
              *) echo "Forbidden changed path for preproduction TL prerequisite batch: $changed"; exit 1 ;;
            esac
          done < /tmp/tl-prerequisite-paths.txt
          test "$(wc -l < /tmp/tl-prerequisite-paths.txt)" -eq 5

      - name: Install dependencies
        run: npm ci

      - name: Syntax check batch
        run: |
          node --check src/workspace/engineering-loads/preproduction-thermal-liftoff-displacement-authority.js
          node --check src/workspace/engineering-loads/preproduction-thermal-liftoff-mechanics-authority.js
          node --check src/workspace/engineering-loads/preproduction-thermal-liftoff-prerequisite-authority.js
          node --check scripts/preproduction-thermal-liftoff-prerequisites-check.mjs

      - name: Requalify current-head support/contact authority
        run: |
          node scripts/preproduction-support-contact-source-guard.mjs
          node scripts/preproduction-support-contact-authority-check.mjs

      - name: Requalify merged standalone Appendix S benchmark evidence
        run: node scripts/empirical-appendix-s-vertical-benchmark.mjs

      - name: Qualify TL-01 TL-02 and reaction-tolerance prerequisite contracts
        run: node scripts/preproduction-thermal-liftoff-prerequisites-check.mjs

      - name: Import graph
        run: npm run check:imports

      - name: Production build
        run: npm run build
