name: 3D Edit Operation-Specific Snapping

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-operation-specific-snapping.yml'
      - 'src/workspace/topology-edit-3d-interaction-controller.js'
      - 'src/workspace/viewport-interaction/topology-edit-operation-snap-index.js'
      - 'tests/topology-edit-operation-specific-snap-index.test.mjs'
      - 'e2e/topology-edit-operation-specific-snapping.spec.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-edit-operation-specific-snapping-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  operation-specific-snapping:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSER_CHANNEL: chromium

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          node --check src/workspace/topology-edit-3d-interaction-controller.js
          node --check src/workspace/viewport-interaction/topology-edit-operation-snap-index.js
          node --check tests/topology-edit-operation-specific-snap-index.test.mjs
          node --check e2e/topology-edit-operation-specific-snapping.spec.js
          git diff --check

      - name: Execute operation feature and deterministic engine contracts
        run: |
          node --test --test-reporter=tap \
            tests/topology-edit-operation-specific-snap-index.test.mjs \
            tests/topology-edit-deterministic-snap-engine.test.mjs \
            tests/topology-edit-snap-spatial-index.test.mjs \
            tests/topology-edit-snap-store-controller.test.mjs

      - name: Execute mounted Chromium operation snap qualification
        run: |
          npx playwright test \
            e2e/topology-edit-operation-specific-snapping.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-operation-specific-snapping-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
