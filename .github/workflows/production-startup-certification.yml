name: Production Startup Certification

on:
  pull_request:
    paths:
      - 'vite.config.js'
      - 'src/**'
      - 'scripts/bundle-chunk-check.mjs'
      - 'scripts/bundle-chunk-ownership-check.mjs'
      - 'tests/production-startup.spec.mjs'
      - '.github/workflows/production-startup-certification.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate chunk ownership policy
        run: node scripts/bundle-chunk-ownership-check.mjs

      - name: Certify development and production startup
        run: node --test tests/production-startup.spec.mjs
