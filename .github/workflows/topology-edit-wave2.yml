name: Topology Edit Wave 2

on:
  pull_request:
    paths:
      - ".github/workflows/topology-edit-wave2.yml"
      - "src/workspace/topology-edit/**"
      - "src/workspace/topology-edit-3d-view-controller.js"
      - "tests/topology-edit-dimension-authority.test.mjs"
      - "tests/topology-edit-fitting-support-*.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-support:
    name: Geometry, support, picking, and build qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Geometry and support contracts
        run: >-
          node --test
          tests/topology-edit-dimension-authority.test.mjs
          tests/topology-edit-fitting-support-geometry.test.mjs
          tests/topology-edit-fitting-support-integration.test.mjs

      - name: Source, API, and import authority
        run: |
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs

      - name: Production build
        run: npm run build

      - name: Write exact-head Wave 2 evidence
        run: |
          mkdir -p reports/qualification
          node --input-type=module - <<'NODE'
          import { writeFileSync } from 'node:fs';
          const evidence = {
            schema: 'TopologyEditWave2Evidence.v1',
            targetHead: process.env.TOPOLOGY_EDIT_TARGET_HEAD_SHA,
            nodeVersion: process.version,
            commands: [
              'dimension-authority-tests',
              'fitting-support-geometry-tests',
              'production-integration-tests',
              'source-api-import-drift',
              'production-build',
            ],
          };
          writeFileSync('reports/qualification/topology-edit-wave2-evidence.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-wave2-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-wave2-evidence.json
          if-no-files-found: error
          retention-days: 30
