name: Topology Edit Wave 2

on:
  push:
    branches:
      - 'agent/wave2-*'
    paths:
      - 'src/workspace/topology-edit/**'
      - 'src/workspace/topology-edit-3d-view-controller.js'
      - 'src/vendor/topology-edit/**'
      - 'scripts/topology-edit-*.mjs'
      - 'tests/topology-edit-*.js'
      - 'tests/topology-edit-*.mjs'
      - '.github/workflows/topology-edit-wave2.yml'
  pull_request:
    paths:
      - 'src/workspace/topology-edit/**'
      - 'src/workspace/topology-edit-3d-view-controller.js'
      - 'src/vendor/topology-edit/**'
      - 'scripts/topology-edit-*.mjs'
      - 'tests/topology-edit-*.js'
      - 'tests/topology-edit-*.mjs'
      - '.github/workflows/topology-edit-wave2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-support:
    name: W2.Q geometry and support authority
    runs-on: ubuntu-24.04
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TOPOLOGY_EDIT_SOURCE_COMPARATOR: c20bb037566d52ba5b789712594b754a5fb94651

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"

      - name: Source authority drift
        run: node scripts/topology-edit-source-drift-check.mjs

      - name: API and behavior disposition drift
        run: node scripts/topology-edit-api-drift-check.mjs

      - name: Wave 1 coding rules
        run: node scripts/topology-edit-wave1-coding-rules-check.mjs

      - name: Wave 2 coding rules
        run: node scripts/topology-edit-wave2-coding-rules-check.mjs

      - name: Prohibited imports and circularity
        run: node scripts/topology-edit-prohibited-imports.mjs

      - name: Syntax
        run: |
          node --check src/workspace/topology-edit-3d-view-controller.js
          node --check src/workspace/topology-edit/topology-edit-component-evidence.js
          node --check src/workspace/topology-edit/topology-edit-fitting-geometry.js
          node --check src/workspace/topology-edit/topology-edit-geometry-math.js
          node --check src/workspace/topology-edit/topology-edit-picking-contract.js
          node --check src/workspace/topology-edit/topology-edit-render-model.js
          node --check src/workspace/topology-edit/topology-edit-viewport-backend.js
          node --check src/workspace/topology-edit/topology-edit-visual-policy.js
          node --check src/workspace/topology-edit/topology-edit-visual-projector.js
          node --check src/workspace/topology-edit/topology-edit-visual-session.js
          node --check src/workspace/topology-edit/support-restraint-family.js
          node --check src/workspace/topology-edit/support-restraint-geometry.js
          node --check src/workspace/topology-edit/support-restraint-projector.js
          node --check src/workspace/topology-edit/visual-geometry-contract.js

      - name: Wave 1 regression contracts
        run: |
          node --test tests/topology-edit-wave1-pure-kernel.test.mjs
          node --test tests/topology-edit-wave1-candidate-certification.test.mjs
          node --test tests/topology-edit-wave1-journal-replay.test.mjs
          node --test tests/topology-edit-wave1-production-integration.test.mjs

      - name: Wave 2 fitting and support contracts
        run: node --test tests/topology-edit-wave2-fitting-support-geometry.test.mjs

      - name: Wave 2 production integration contracts
        run: node --test tests/topology-edit-wave2-production-integration.test.mjs

      - name: Bounded phase-one smoke contracts
        run: node tests/topology-edit-anti-drift.test.js

      - name: Write exact-head qualification evidence
        run: |
          mkdir -p reports/qualification
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const evidence = {
            schema: 'TopologyEditWave2QualificationEvidence.v1',
            wave: 'W2.Q',
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.TOPOLOGY_EDIT_TARGET_HEAD_SHA,
            sourceCommit: process.env.TOPOLOGY_EDIT_SOURCE_COMPARATOR,
            status: 'PASS',
            checks: [
              'source-authority-drift',
              'api-and-disposition-drift',
              'wave1-and-wave2-coding-rules',
              'prohibited-imports-and-cycles',
              'wave1-certified-kernel-regression',
              'fitting-geometry-fidelity',
              'directional-support-and-gap-semantics',
              'canonical-component-support-restraint-picking',
              'production-read-only-visual-consumer',
              'bounded-phase-one-smoke',
            ],
          };
          await writeFile('reports/qualification/topology-edit-wave2-qualification.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload exact-head qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-wave2-qualification-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-wave2-qualification.json
          if-no-files-found: error
          retention-days: 30
