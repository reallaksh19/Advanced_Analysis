name: LAFEA B7C Controlled Continuum Contracts

on:
  pull_request:
    paths:
      - '.github/workflows/lafea-template-b7c-controlled-continuum-contracts.yml'
      - 'src/core/lafea-application-templates/controlled-continuum-pilot-contract.js'
      - 'src/core/lafea-application-templates/index.js'
      - 'scripts/lafea-template-b7c-controlled-continuum-contract-check.mjs'
      - 'docs/LAFEA_Bucket_B7C_Controlled_Continuum_Pilot_Contracts.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: B7C controlled continuum contract qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run B7C contract qualification
        run: node scripts/lafea-template-b7c-controlled-continuum-contract-check.mjs

      - name: Run retained B7B benchmark checks
        run: node scripts/lafea-template-b7b-continuum-benchmark-convergence-check.mjs

      - name: Run retained B7A mapping checks
        run: node scripts/lafea-template-b7a-lug-pinhole-mapping-check.mjs

      - name: Run retained B6 caller-mesh checks
        run: node scripts/lafea-template-b6-caller-mesh-binding-check.mjs

      - name: Run strict syntax checks
        run: npm run syntax:strict

      - name: Run import checks
        run: npm run check:imports

      - name: Build production bundle
        run: npm run build

      - name: Verify patch hygiene
        run: git diff --check
