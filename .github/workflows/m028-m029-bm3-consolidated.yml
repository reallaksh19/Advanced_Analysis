name: M028 M029 BM3 Consolidated Qualification

on:
  pull_request:
    branches:
      - main
      - agent/common-inputxml-restraint-correction
    paths:
      - 'benchmarks/LFEA/BM3/**'
      - 'docs/qualification/M028_M029_BM3_CONSOLIDATED_RECORD.md'
      - 'scripts/lfea-m028-bm3-*.mjs'
      - 'scripts/lfea-m029-bm3-*.mjs'
      - 'scripts/lfea-bm3-consolidated-latest-output-check.mjs'
      - 'scripts/lfea-b3.3-solver-check.mjs'
      - 'scripts/lfea-common-inputxml-restraint-correction-check.mjs'
      - 'src/core/geometry/adapters/inputxml-unit-system.js'
      - 'src/core/linear-fea-solver/**'
      - 'src/core/linear-fea-variable-spring-hanger/**'
      - '.github/workflows/m028-m029-bm3-consolidated.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m028-m029-bm3-consolidated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 1

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Syntax-check consolidated sources
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            scripts/lfea-m028-bm3-check.mjs \
            scripts/lfea-m028-bm3-comparison.mjs \
            scripts/lfea-m028-bm3-fixtures.mjs \
            scripts/lfea-m029-bm3-hangers.mjs \
            scripts/lfea-m029-bm3-hanger-check.mjs \
            scripts/lfea-bm3-consolidated-latest-output-check.mjs \
            scripts/lfea-b3.3-solver-check.mjs \
            src/core/geometry/adapters/inputxml-unit-system.js \
            src/core/linear-fea-solver/solve.js \
            src/core/linear-fea-solver/qualification.js \
            src/core/linear-fea-variable-spring-hanger/catalog.js \
            src/core/linear-fea-variable-spring-hanger/design.js \
            src/core/linear-fea-variable-spring-hanger/compile.js \
            src/core/linear-fea-variable-spring-hanger/recover.js \
            src/core/linear-fea-variable-spring-hanger/index.js; do
            node --check "$file"
          done
          git diff --check

      - name: Common InputXML restraint export correction
        run: node scripts/lfea-common-inputxml-restraint-correction-check.mjs

      - name: Generic grounded-spring solver regression
        run: node scripts/lfea-b3.3-solver-check.mjs

      - name: M028 BM3 source and baseline qualification
        run: node scripts/lfea-m028-bm3-check.mjs

      - name: M029 programmed spring hanger qualification
        run: node scripts/lfea-m029-bm3-hanger-check.mjs

      - name: Latest BM3 strict and diagnostic output policy
        run: node scripts/lfea-bm3-consolidated-latest-output-check.mjs --write

      - name: Full linear-core regression
        run: npm run check:lfea-linear-core

      - name: Verify deterministic evidence
        shell: bash
        run: |
          set -euo pipefail
          sha256sum reports/m029-bm3-hanger-qualification.json > /tmp/m029.sha256
          sha256sum reports/bm3-consolidated-latest-output.json > /tmp/bm3-consolidated.sha256
          node scripts/lfea-m029-bm3-hanger-check.mjs > /tmp/m029-repeat.log
          node scripts/lfea-bm3-consolidated-latest-output-check.mjs --write > /tmp/bm3-repeat.log
          sha256sum -c /tmp/m029.sha256
          sha256sum -c /tmp/bm3-consolidated.sha256

      - name: Upload deterministic BM3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m028-m029-bm3-consolidated-${{ env.TARGET_HEAD_SHA }}
          path: |
            reports/m028-bm3-qualification.json
            reports/m029-bm3-hanger-qualification.json
            reports/bm3-consolidated-latest-output.json
          if-no-files-found: error
          retention-days: 30
