name: Bundle Chunk Certification

on:
  pull_request:
    paths:
      - 'vite.config.js'
      - 'scripts/bundle-chunk-check.mjs'
      - 'scripts/bundle-chunk-ownership-check.mjs'
      - '.github/workflows/bundle-chunk-certification.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Validate chunk ownership and retained policy
        run: node scripts/bundle-chunk-ownership-check.mjs

      - name: Build and certify emitted chunks
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee bundle-chunk-certification.log

      - name: Check exact base-to-head diff
        run: git diff --check "$PR_BASE_SHA...HEAD"

      - name: Require clean checkout
        run: test -z "$(git status --short)"

      - name: Upload chunk certification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-chunk-certification
          path: bundle-chunk-certification.log
          if-no-files-found: error
          retention-days: 7
