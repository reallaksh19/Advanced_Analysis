name: C3D Wave 4 Spatial Issue Review

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-c3d-wave4-issue-review.yml'
      - 'src/workspace/load-calc-consumer-controller.js'
      - 'src/workspace/topology-edit-3d-issue-controller.js'
      - 'src/workspace/topology-edit/topology-edit-canvas-callout.js'
      - 'src/workspace/topology-edit/topology-edit-issue-overlay.js'
      - 'src/workspace/topology-edit/topology-edit-issue-renderer.js'
      - 'src/workspace/topology-edit/topology-edit-viewport-backend.js'
      - 'tests/topology-edit-c3d-wave4-issue-review.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-issue-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce syntax and module boundaries
        run: |
          node --check src/workspace/topology-edit/topology-edit-issue-overlay.js
          node --check src/workspace/topology-edit/topology-edit-issue-renderer.js
          node --check src/workspace/topology-edit/topology-edit-canvas-callout.js
          node --check src/workspace/topology-edit/topology-edit-viewport-backend.js
          node --check src/workspace/topology-edit-3d-issue-controller.js
          node --check src/workspace/load-calc-consumer-controller.js
          test "$(wc -l < src/workspace/topology-edit/topology-edit-issue-overlay.js)" -le 300
          test "$(wc -l < src/workspace/topology-edit/topology-edit-issue-renderer.js)" -le 300
          test "$(wc -l < src/workspace/topology-edit/topology-edit-canvas-callout.js)" -le 300
          test "$(wc -l < src/workspace/topology-edit/topology-edit-viewport-backend.js)" -le 300
          test "$(wc -l < src/workspace/topology-edit-3d-issue-controller.js)" -le 300
          test "$(wc -l < src/workspace/load-calc-consumer-controller.js)" -le 300

      - name: Qualify spatial issue review workflow
        run: node --test tests/topology-edit-c3d-wave4-issue-review.test.mjs

      - name: Retain C3D presentation and productivity
        run: |
          node --test tests/topology-edit-c3d-wave0.test.mjs
          node --test tests/topology-edit-c3d-wave1-visibility.test.mjs
          node --test tests/topology-edit-c3d-wave1-sectioning.test.mjs
          node --test tests/topology-edit-c3d-wave2-search.test.mjs
          node --test tests/topology-edit-c3d-wave3-gpu-picking.test.mjs

      - name: Retain Track B lifecycle authority
        run: |
          node --test tests/topology-edit-wave3b-autofix.test.mjs
          node --test tests/topology-edit-wave3c-autofix-ui.test.mjs
          node --test tests/topology-edit-wave4a-persistence-export.test.mjs
          node --test tests/topology-edit-wave4b-commit-rollback.test.mjs
          node --test tests/topology-edit-wave4c-lifecycle-ui.test.mjs

      - name: Retain governance and production build
        run: |
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs
          npm run build

      - name: Write exact-head evidence
        run: |
          mkdir -p reports/qualification
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (commit !== process.env.TOPOLOGY_EDIT_TARGET_HEAD_SHA) throw new Error('Exact-head mismatch.');
          const paths = [
            'src/workspace/load-calc-consumer-controller.js',
            'src/workspace/topology-edit-3d-issue-controller.js',
            'src/workspace/topology-edit/topology-edit-canvas-callout.js',
            'src/workspace/topology-edit/topology-edit-issue-overlay.js',
            'src/workspace/topology-edit/topology-edit-issue-renderer.js',
            'src/workspace/topology-edit/topology-edit-viewport-backend.js',
            'tests/topology-edit-c3d-wave4-issue-review.test.mjs',
          ];
          const evidence = {
            schema: 'TopologyEditC3DWave4IssueReviewEvidence.v1',
            repository: process.env.GITHUB_REPOSITORY,
            commit,
            status: 'PASS_SPATIAL_ISSUE_REVIEW',
            issueIdentityAuthority: 'GOVERNED_CHECKER_ISSUE_ID_ONLY',
            focusAuthority: 'EXACT_CANONICAL_IDS_ONLY',
            checkerAuthorityChanged: false,
            commandAuthorityChanged: false,
            autofixQualificationChanged: false,
            persistenceAuthorityChanged: false,
            releaseQualified: false,
            files: Object.fromEntries(paths.map((path) => [
              path,
              createHash('sha256').update(readFileSync(path)).digest('hex'),
            ])),
          };
          writeFileSync(
            'reports/qualification/topology-edit-c3d-wave4-issue-review.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-c3d-wave4-issue-review-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-c3d-wave4-issue-review.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify full batch patch hygiene
        run: git diff --check "$BASE_REF...HEAD"
