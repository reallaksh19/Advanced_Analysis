name: C3D Wave 2 Canonical Search

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-c3d-wave2-search.yml'
      - 'src/workspace/topology-edit-3d-search-controller.js'
      - 'src/workspace/load-calc-consumer-controller.js'
      - 'src/workspace/viewport-productivity/topology-edit-search-*.js'
      - 'src/workspace/viewport-productivity/topology-edit-scene-focus.js'
      - 'tests/topology-edit-c3d-wave2-search.test.mjs'
      - 'tests/topology-edit-c3d-wave*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
      - run: npm ci
      - name: Syntax and coding boundaries
        run: |
          node --check src/workspace/viewport-productivity/topology-edit-search-index.js
          node --check src/workspace/viewport-productivity/topology-edit-search-panel.js
          node --check src/workspace/viewport-productivity/topology-edit-scene-focus.js
          node --check src/workspace/topology-edit-3d-search-controller.js
          node --check src/workspace/load-calc-consumer-controller.js
          test "$(wc -l < src/workspace/viewport-productivity/topology-edit-search-index.js)" -le 300
          test "$(wc -l < src/workspace/viewport-productivity/topology-edit-search-panel.js)" -le 300
          test "$(wc -l < src/workspace/viewport-productivity/topology-edit-scene-focus.js)" -le 300
          test "$(wc -l < src/workspace/topology-edit-3d-search-controller.js)" -le 300
      - name: Qualify deterministic search and exact focus
        run: node --test tests/topology-edit-c3d-wave2-search.test.mjs
      - name: Retain C3D presentation, visibility, and sectioning
        run: |
          node --test tests/topology-edit-c3d-wave0.test.mjs
          node --test tests/topology-edit-c3d-wave1-visibility.test.mjs
          node --test tests/topology-edit-c3d-wave1-sectioning.test.mjs
      - name: Retain Track B lifecycle and source authority
        run: |
          node --test tests/topology-edit-wave3b-autofix.test.mjs
          node --test tests/topology-edit-wave3c-autofix-ui.test.mjs
          node --test tests/topology-edit-wave4a-persistence-export.test.mjs
          node --test tests/topology-edit-wave4b-commit-rollback.test.mjs
          node --test tests/topology-edit-wave4c-lifecycle-ui.test.mjs
      - name: Governance and production build
        run: |
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs
          npm run build
      - name: Exact-head evidence
        run: |
          mkdir -p reports/qualification
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (commit !== process.env.TOPOLOGY_EDIT_TARGET_HEAD_SHA) throw new Error('Exact-head mismatch.');
          const paths = [
            'src/workspace/topology-edit-3d-search-controller.js',
            'src/workspace/load-calc-consumer-controller.js',
            'src/workspace/viewport-productivity/topology-edit-search-index.js',
            'src/workspace/viewport-productivity/topology-edit-search-panel.js',
            'src/workspace/viewport-productivity/topology-edit-scene-focus.js',
            'tests/topology-edit-c3d-wave2-search.test.mjs',
          ];
          const evidence = {
            schema: 'TopologyEditC3DWave2SearchEvidence.v1',
            repository: process.env.GITHUB_REPOSITORY,
            commit,
            status: 'PASS_CANONICAL_SEARCH_AND_EXACT_FOCUS',
            identityAuthority: 'CANONICAL_METADATA_ONLY',
            meshInferenceAllowed: false,
            proximityRetargetingAllowed: false,
            commandAuthorityChanged: false,
            persistenceAuthorityChanged: false,
            files: Object.fromEntries(paths.map((path) => [
              path,
              createHash('sha256').update(readFileSync(path)).digest('hex'),
            ])),
          };
          writeFileSync(
            'reports/qualification/topology-edit-c3d-wave2-search.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: topology-edit-c3d-wave2-search-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-c3d-wave2-search.json
          if-no-files-found: error
          retention-days: 30
