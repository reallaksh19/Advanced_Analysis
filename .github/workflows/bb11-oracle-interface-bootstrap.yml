name: BB-11 oracle interface repair bootstrap

on:
  push:
    branches:
      - fix/bb11-governed-oracle-interface-continuity

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TZ: UTC
      LC_ALL: C
      BB11_DIAGNOSTICS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bb11-governed-oracle-interface-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply exact oracle-interface repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path('src/core/bucket-b/flange-hub-independent-oracle.js')
          source = path.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              """function blockMap(block) {
            const outer = profile(block.profile);
            if (block.kind === 'STRIP') {
              return (u, v) => {""",
              """function blockMap(block) {
            if (block.kind === 'STRIP') {
              const outer = profile(block.profile);
              return (u, v) => {""",
              'defer-profile-resolution',
          )

          replace_once(
              """  if (id === 'SMALL_ARC') {
            return arc(
              GEOMETRY.smallCenter,
              6,
              GEOMETRY.smallStartAngle,
              GEOMETRY.smallSweep,
            );
          }""",
              """  if (id === 'SMALL_ARC') {
            const endAngle = Math.atan2(
              GEOMETRY.smallHubTangent.z - GEOMETRY.smallCenter.z,
              GEOMETRY.smallHubTangent.r - GEOMETRY.smallCenter.r,
            );
            return arc(
              GEOMETRY.smallCenter,
              GEOMETRY.smallRadius,
              Math.PI,
              endAngle - Math.PI,
            );
          }""",
              'small-arc-exact-tangent',
          )

          replace_once(
              """  if (id === 'LARGE_ARC') {
            return arc(
              GEOMETRY.largeCenter,
              10,
              GEOMETRY.largeStartAngle,
              GEOMETRY.largeSweep,
            );
          }""",
              """  if (id === 'LARGE_ARC') {
            const startAngle = Math.atan2(
              GEOMETRY.largeHubTangent.z - GEOMETRY.largeCenter.z,
              GEOMETRY.largeHubTangent.r - GEOMETRY.largeCenter.r,
            );
            return arc(
              GEOMETRY.largeCenter,
              GEOMETRY.largeRadius,
              startAngle,
              Math.PI / 2 - startAngle,
            );
          }""",
              'large-arc-exact-tangent',
          )

          replace_once(
              """export function runIndependentFlangeHubOracle(loadCaseId) {""",
              dedent('''
              export function inspectIndependentFlangeHubOracleMesh(levelId = 'O0') {
                const definition = LEVELS.find((row) => row.levelId === levelId);
                if (!definition) throw new TypeError(`ORACLE_UNKNOWN_LEVEL:${levelId}`);
                const mesh = q4Mesh(definition);
                return freeze({
                  schema: 'flange-hub-independent-oracle-mesh-inspection/v1',
                  authority: 'NON_AUTHORIZING_DIAGNOSTIC_ONLY',
                  levelId,
                  refinement: definition.refinement,
                  nodeCount: mesh.nodes.length,
                  elementCount: mesh.elements.length,
                  connectivity: mesh.connectivity,
                  meshHash: oracleHash(mesh),
                });
              }

              export function runIndependentFlangeHubOracle(loadCaseId) {''').lstrip(),
              'mesh-inspection-export',
          )

          replace_once(
              """  return freeze({
            nodes,
            elements: finalElements,
            boundaries: finalBoundaries,
            globalH,
          });
          }

          function blockMap(block) {""",
              dedent('''
                const connectivity = meshConnectivity(nodes, finalElements);
                if (!connectivity.accepted) {
                  throw new RangeError(
                    `ORACLE_DISCONNECTED_MESH:${level.levelId}:`
                    + `${connectivity.componentCount}`,
                  );
                }
                return freeze({
                  nodes,
                  elements: finalElements,
                  boundaries: finalBoundaries,
                  globalH,
                  connectivity,
                });
              }

              function meshConnectivity(nodes, elements) {
                const adjacency = new Map(nodes.map((node) => [node.id, new Set()]));
                const blockIdsByNode = new Map(nodes.map((node) => [node.id, new Set()]));
                elements.forEach((element) => {
                  element.nodeIds.forEach((nodeId) => {
                    blockIdsByNode.get(nodeId).add(element.blockId);
                    element.nodeIds.forEach((otherId) => {
                      if (otherId !== nodeId) adjacency.get(nodeId).add(otherId);
                    });
                  });
                });
                const unvisited = new Set(
                  nodes.filter((node) => blockIdsByNode.get(node.id).size > 0)
                    .map((node) => node.id),
                );
                const components = [];
                while (unvisited.size > 0) {
                  const seed = [...unvisited].sort()[0];
                  const queue = [seed];
                  const nodeIds = [];
                  const blockIds = new Set();
                  unvisited.delete(seed);
                  while (queue.length > 0) {
                    const nodeId = queue.shift();
                    nodeIds.push(nodeId);
                    blockIdsByNode.get(nodeId).forEach((id) => blockIds.add(id));
                    [...adjacency.get(nodeId)].sort().forEach((otherId) => {
                      if (unvisited.delete(otherId)) queue.push(otherId);
                    });
                  }
                  components.push({
                    nodeCount: nodeIds.length,
                    minimumNodeId: [...nodeIds].sort()[0],
                    blockIds: [...blockIds].sort(),
                  });
                }
                components.sort((left, right) => (
                  left.minimumNodeId.localeCompare(right.minimumNodeId)
                ));
                return {
                  componentCount: components.length,
                  components,
                  accepted: components.length === 1,
                };
              }

              function blockMap(block) {''').lstrip(),
              'connectivity-certificate',
          )

          path.write_text(source)

          Path('tests/bucket-b-bb11-independent-oracle-interface.test.mjs').write_text(
            dedent('''
            import assert from 'node:assert/strict';
            import test from 'node:test';
            import {
              inspectIndependentFlangeHubOracleMesh,
              solveIndependentOracleLinearSystem,
            } from '../src/core/bucket-b/flange-hub-independent-oracle.js';

            test('BB-11 independent oracle mesh is one connected component at O0', () => {
              const evidence = inspectIndependentFlangeHubOracleMesh('O0');
              assert.equal(evidence.authority, 'NON_AUTHORIZING_DIAGNOSTIC_ONLY');
              assert.equal(evidence.connectivity.componentCount, 1);
              assert.equal(evidence.connectivity.accepted, true);
              assert.deepEqual(
                evidence.connectivity.components[0].blockIds,
                ['O-B00', 'O-B01', 'O-B02', 'O-B03', 'O-B04', 'O-B05', 'O-B06', 'O-B07'],
              );
            });

            test('BB-11 independent oracle mesh remains connected at O3', () => {
              const evidence = inspectIndependentFlangeHubOracleMesh('O3');
              assert.equal(evidence.connectivity.componentCount, 1);
              assert.equal(evidence.connectivity.accepted, true);
            });

            test('BB-11 independent oracle linear solver retains certified SPD behavior', () => {
              const solved = solveIndependentOracleLinearSystem({
                rows: [
                  [{ column: 0, value: 4 }, { column: 1, value: 1 }],
                  [{ column: 0, value: 1 }, { column: 1, value: 3 }],
                ],
                rhs: [1, 2],
              });
              assert.ok(Math.abs(solved.x[0] - 1 / 11) <= 1e-12);
              assert.ok(Math.abs(solved.x[1] - 7 / 11) <= 1e-12);
              assert.ok(solved.explicitResidualNorm <= 1e-10);
            });
            ''').lstrip(),
          )

          Path('.github/workflows/bb11-governed-oracle-interface.yml').write_text(
            dedent('''
            name: BB-11 governed independent-oracle interface

            on:
              pull_request:
                branches:
                  - agent/bucket-b-bb11-flange-hub
                paths:
                  - src/core/bucket-b/flange-hub-independent-oracle.js
                  - tests/bucket-b-bb11-independent-oracle-interface.test.mjs
                  - .github/workflows/bb11-governed-oracle-interface.yml

            permissions:
              contents: read

            jobs:
              qualify-interface-repair:
                runs-on: ubuntu-24.04
                timeout-minutes: 50
                env:
                  TZ: UTC
                  LC_ALL: C
                steps:
                  - uses: actions/checkout@v4
                    with:
                      fetch-depth: 0
                  - uses: actions/setup-node@v4
                    with:
                      node-version: 22
                      cache: npm
                  - run: npm ci
                  - name: Enforce exact three-file scope
                    shell: bash
                    run: |
                      set -euo pipefail
                      base='${{ github.event.pull_request.base.sha }}'
                      head='${{ github.event.pull_request.head.sha }}'
                      git diff --check "${base}...${head}"
                      mapfile -t paths < <(git diff --name-only "${base}...${head}")
                      test "${#paths[@]}" -eq 3
                      for path in "${paths[@]}"; do
                        case "$path" in
                          src/core/bucket-b/flange-hub-independent-oracle.js|tests/bucket-b-bb11-independent-oracle-interface.test.mjs|.github/workflows/bb11-governed-oracle-interface.yml) ;;
                          *) echo "Unexpected path: $path" >&2; exit 1 ;;
                        esac
                      done
                  - run: node --check src/core/bucket-b/flange-hub-independent-oracle.js
                  - run: node --test tests/bucket-b-bb11-independent-oracle-interface.test.mjs
                  - name: Execute complete independent oracle twice
                    shell: bash
                    run: |
                      set -euo pipefail
                      mkdir -p reports
                      for run in a b; do
                        timeout --signal=TERM --kill-after=60s 40m node --input-type=module > "reports/oracle-${run}.json" <<'NODE'
            import { runIndependentFlangeHubOracle } from './src/core/bucket-b/flange-hub-independent-oracle.js';
            const loadCases = ['FH-PRES-001', 'FH-AXIAL-001', 'FH-GASKET-001'];
            process.stdout.write(JSON.stringify(loadCases.map(runIndependentFlangeHubOracle)));
            NODE
                      done
                      cmp reports/oracle-a.json reports/oracle-b.json
                      node --input-type=module <<'NODE'
            import assert from 'node:assert/strict';
            import { readFile } from 'node:fs/promises';
            const reports = JSON.parse(await readFile('reports/oracle-a.json', 'utf8'));
            reports.forEach((report) => {
              assert.equal(report.status, 'PASS');
              report.levels.forEach((level) => {
                assert.equal(level.meshHash.length > 0, true);
                assert.ok(level.solver.explicitResidualNorm <= 1e-8);
              });
            });
            NODE
                  - uses: actions/upload-artifact@v4
                    with:
                      name: bb11-governed-oracle-interface-${{ github.event.pull_request.head.sha }}
                      path: reports
                      retention-days: 30
            ''').lstrip(),
          )

          Path('.github/workflows/bb11-oracle-interface-bootstrap.yml').unlink()
          PY

      - name: Validate and execute complete oracle
        shell: bash
        run: |
          set -euo pipefail
          node --check src/core/bucket-b/flange-hub-independent-oracle.js
          node --test tests/bucket-b-bb11-independent-oracle-interface.test.mjs
          timeout --signal=TERM --kill-after=60s 40m node --input-type=module > /tmp/oracle.json <<'NODE'
          import { runIndependentFlangeHubOracle } from './src/core/bucket-b/flange-hub-independent-oracle.js';
          const loadCases = ['FH-PRES-001', 'FH-AXIAL-001', 'FH-GASKET-001'];
          process.stdout.write(JSON.stringify(loadCases.map(runIndependentFlangeHubOracle)));
          NODE
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const reports = JSON.parse(await readFile('/tmp/oracle.json', 'utf8'));
          reports.forEach((report) => {
            assert.equal(report.status, 'PASS');
            report.levels.forEach((level) => assert.ok(level.solver.explicitResidualNorm <= 1e-8));
          });
          NODE

      - name: Commit governed repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BB-11 Oracle Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix BB-11 independent oracle interface continuity'
          git push origin HEAD:fix/bb11-governed-oracle-interface-continuity
