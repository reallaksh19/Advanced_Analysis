name: BB-11 oracle interface repair bootstrap

on:
  push:
    branches:
      - fix/bb11-governed-oracle-interface-continuity

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TZ: UTC
      LC_ALL: C
      BB11_DIAGNOSTICS: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bb11-governed-oracle-interface-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply exact oracle-interface repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          path = Path('src/core/bucket-b/flange-hub-independent-oracle.js')
          source = path.read_text()

          def sub_once(pattern, replacement, label):
              global source
              source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')

          sub_once(
              r"function blockMap\(block\) \{\s*const outer = profile\(block\.profile\);\s*if \(block\.kind === 'STRIP'\) \{",
              "function blockMap(block) {\n  if (block.kind === 'STRIP') {\n    const outer = profile(block.profile);",
              'defer-profile-resolution',
          )

          sub_once(
              r"  if \(id === 'SMALL_ARC'\) \{\s*return arc\(\s*GEOMETRY\.smallCenter,\s*6,\s*GEOMETRY\.smallStartAngle,\s*GEOMETRY\.smallSweep,\s*\);\s*\}",
              dedent("""
              if (id === 'SMALL_ARC') {
                const endAngle = Math.atan2(
                  GEOMETRY.smallHubTangent.z - GEOMETRY.smallCenter.z,
                  GEOMETRY.smallHubTangent.r - GEOMETRY.smallCenter.r,
                );
                return arc(
                  GEOMETRY.smallCenter,
                  GEOMETRY.smallRadius,
                  Math.PI,
                  endAngle - Math.PI,
                );
              }
              """).strip(),
              'small-arc-exact-tangent',
          )

          sub_once(
              r"  if \(id === 'LARGE_ARC'\) \{\s*return arc\(\s*GEOMETRY\.largeCenter,\s*10,\s*GEOMETRY\.largeStartAngle,\s*GEOMETRY\.largeSweep,\s*\);\s*\}",
              dedent("""
              if (id === 'LARGE_ARC') {
                const startAngle = Math.atan2(
                  GEOMETRY.largeHubTangent.z - GEOMETRY.largeCenter.z,
                  GEOMETRY.largeHubTangent.r - GEOMETRY.largeCenter.r,
                );
                return arc(
                  GEOMETRY.largeCenter,
                  GEOMETRY.largeRadius,
                  startAngle,
                  Math.PI / 2 - startAngle,
                );
              }
              """).strip(),
              'large-arc-exact-tangent',
          )

          marker = 'export function runIndependentFlangeHubOracle(loadCaseId) {'
          if source.count(marker) != 1:
              raise SystemExit('mesh-inspection-export: marker count mismatch')
          inspection = dedent("""
          export function inspectIndependentFlangeHubOracleMesh(levelId = 'O0') {
            const definition = LEVELS.find((row) => row.levelId === levelId);
            if (!definition) throw new TypeError(`ORACLE_UNKNOWN_LEVEL:${levelId}`);
            const mesh = q4Mesh(definition);
            return freeze({
              schema: 'flange-hub-independent-oracle-mesh-inspection/v1',
              authority: 'NON_AUTHORIZING_DIAGNOSTIC_ONLY',
              levelId,
              refinement: definition.refinement,
              nodeCount: mesh.nodes.length,
              elementCount: mesh.elements.length,
              connectivity: mesh.connectivity,
              meshHash: oracleHash(mesh),
            });
          }

          """).lstrip()
          source = source.replace(marker, inspection + marker, 1)

          sub_once(
              r"  return freeze\(\{\s*nodes,\s*elements: finalElements,\s*boundaries: finalBoundaries,\s*globalH,\s*\}\);\s*\}\s*\nfunction blockMap",
              dedent("""
              const connectivity = meshConnectivity(nodes, finalElements);
              if (!connectivity.accepted) {
                throw new RangeError(
                  `ORACLE_DISCONNECTED_MESH:${level.levelId}:`
                  + `${connectivity.componentCount}`,
                );
              }
              return freeze({
                nodes,
                elements: finalElements,
                boundaries: finalBoundaries,
                globalH,
                connectivity,
              });
            }

            function meshConnectivity(nodes, elements) {
              const adjacency = new Map(nodes.map((node) => [node.id, new Set()]));
              const blockIdsByNode = new Map(nodes.map((node) => [node.id, new Set()]));
              elements.forEach((element) => {
                element.nodeIds.forEach((nodeId) => {
                  blockIdsByNode.get(nodeId).add(element.blockId);
                  element.nodeIds.forEach((otherId) => {
                    if (otherId !== nodeId) adjacency.get(nodeId).add(otherId);
                  });
                });
              });
              const unvisited = new Set(
                nodes.filter((node) => blockIdsByNode.get(node.id).size > 0)
                  .map((node) => node.id),
              );
              const components = [];
              while (unvisited.size > 0) {
                const seed = [...unvisited].sort()[0];
                const queue = [seed];
                const nodeIds = [];
                const blockIds = new Set();
                unvisited.delete(seed);
                while (queue.length > 0) {
                  const nodeId = queue.shift();
                  nodeIds.push(nodeId);
                  blockIdsByNode.get(nodeId).forEach((id) => blockIds.add(id));
                  [...adjacency.get(nodeId)].sort().forEach((otherId) => {
                    if (unvisited.delete(otherId)) queue.push(otherId);
                  });
                }
                components.push({
                  nodeCount: nodeIds.length,
                  minimumNodeId: [...nodeIds].sort()[0],
                  blockIds: [...blockIds].sort(),
                });
              }
              components.sort((left, right) => (
                left.minimumNodeId.localeCompare(right.minimumNodeId)
              ));
              return {
                componentCount: components.length,
                components,
                accepted: components.length === 1,
              };
            }

            function blockMap
              """).strip(),
              'connectivity-certificate',
          )

          path.write_text(source)

          test_source = dedent("""
          import assert from 'node:assert/strict';
          import test from 'node:test';
          import {
            inspectIndependentFlangeHubOracleMesh,
            solveIndependentOracleLinearSystem,
          } from '../src/core/bucket-b/flange-hub-independent-oracle.js';

          test('BB-11 independent oracle mesh is one connected component at O0', () => {
            const evidence = inspectIndependentFlangeHubOracleMesh('O0');
            assert.equal(evidence.authority, 'NON_AUTHORIZING_DIAGNOSTIC_ONLY');
            assert.equal(evidence.connectivity.componentCount, 1);
            assert.equal(evidence.connectivity.accepted, true);
            assert.deepEqual(
              evidence.connectivity.components[0].blockIds,
              ['O-B00', 'O-B01', 'O-B02', 'O-B03', 'O-B04', 'O-B05', 'O-B06', 'O-B07'],
            );
          });

          test('BB-11 independent oracle mesh remains connected at O3', () => {
            const evidence = inspectIndependentFlangeHubOracleMesh('O3');
            assert.equal(evidence.connectivity.componentCount, 1);
            assert.equal(evidence.connectivity.accepted, true);
          });

          test('BB-11 independent oracle linear solver retains certified SPD behavior', () => {
            const solved = solveIndependentOracleLinearSystem({
              rows: [
                [{ column: 0, value: 4 }, { column: 1, value: 1 }],
                [{ column: 0, value: 1 }, { column: 1, value: 3 }],
              ],
              rhs: [1, 2],
            });
            assert.ok(Math.abs(solved.x[0] - 1 / 11) <= 1e-12);
            assert.ok(Math.abs(solved.x[1] - 7 / 11) <= 1e-12);
            assert.ok(solved.explicitResidualNorm <= 1e-10);
          });
          """).lstrip()
          Path('tests/bucket-b-bb11-independent-oracle-interface.test.mjs').write_text(test_source)

          Path('.github/workflows/bb11-oracle-interface-bootstrap.yml').unlink()
          PY

      - name: Validate and execute complete oracle
        shell: bash
        run: |
          set -euo pipefail
          node --check src/core/bucket-b/flange-hub-independent-oracle.js
          node --test tests/bucket-b-bb11-independent-oracle-interface.test.mjs
          timeout --signal=TERM --kill-after=60s 40m node --input-type=module --eval "import { runIndependentFlangeHubOracle } from './src/core/bucket-b/flange-hub-independent-oracle.js'; const ids=['FH-PRES-001','FH-AXIAL-001','FH-GASKET-001']; process.stdout.write(JSON.stringify(ids.map(runIndependentFlangeHubOracle)));" > /tmp/oracle.json
          node --input-type=module --eval "import assert from 'node:assert/strict'; import { readFile } from 'node:fs/promises'; const reports=JSON.parse(await readFile('/tmp/oracle.json','utf8')); reports.forEach((report)=>{ assert.equal(report.status,'PASS'); report.levels.forEach((level)=>assert.ok(level.solver.explicitResidualNorm <= 1e-8)); });"

      - name: Commit governed repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BB-11 Oracle Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix BB-11 independent oracle interface continuity'
          git push origin HEAD:fix/bb11-governed-oracle-interface-continuity
