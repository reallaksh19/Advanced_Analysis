name: LAFEA-NC NC-01 Exact-Head Shell Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/lafea-nc01-shell-formulation.yml"
      - "docs/nonlinear-shell-contact/LAFEA_NC01_SHELL_FORMULATION.md"
      - "scripts/lafea-nc01-check.mjs"
      - "scripts/lafea-nc01-shell-benchmarks.mjs"
      - "scripts/nc01-shell/**"
      - "src/core/nonlinear-shell-contact/shell-formulation-contract.js"
      - "src/core/nonlinear-shell-contact/shell-benchmark-catalog.js"
      - "src/core/nonlinear-shell-contact/shell-qualification-evaluator.js"
      - "src/core/nonlinear-shell-contact/nc01-fixtures.js"
      - "src/core/nonlinear-shell-contact/nc01-negative-controls.js"
      - "src/core/nonlinear-shell-contact/index.js"
      - "tests/nonlinear-shell-contact-nc01-qualification.test.mjs"
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact NC-01 candidate head SHA
        required: true
        type: string
      base_sha:
        description: Exact current-main base SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  exact-head-nc01:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      DISPATCH_HEAD_SHA: ${{ inputs.head_sha }}
      DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
      FOUNDATION_SHA: 18e259f8a18e9011482d3ca4d1b8bd51dbe986f4
      BRIDGE_MERGE_SHA: 18e259f8a18e9011482d3ca4d1b8bd51dbe986f4
      BRIDGE_HEAD_SHA: 48c23d09a7291197dacefd99a2cf1b1caf8bca40
      BRIDGE_RUN_ID: "31021329297"
      BRIDGE_ARTIFACT_ID: "8936729914"
      BRIDGE_ARTIFACT_NAME: lafea-nc-solver-bridge-48c23d09a7291197dacefd99a2cf1b1caf8bca40-1
      BRIDGE_ARTIFACT_DIGEST: "sha256:2b1458c447724d15a2e9178af8302cba91b78593854f8741ffc57a9f0646d28d"
      CUSTODY_HEAD_SHA: 2826cac45acc13fdd9634c861f9910e339f9d5d5
      CUSTODY_RUN_ID: "31020771678"
      CUSTODY_ARTIFACT_ID: "8936496053"
      CUSTODY_ARTIFACT_NAME: lafea-nc-solver-container-2826cac45acc13fdd9634c861f9910e339f9d5d5-1
      CUSTODY_ARTIFACT_DIGEST: "sha256:e14b467cd43f38218f3dba750b6c5f4f1ee83ed8ea9d241bf65673b9e7caf9b8"
      SOLVER_DIGEST: "sha256:9a33d293706a66bee86f2f0ecf996a66758f904c20d61ad8c83ddc0f92ae4b7e"
      SOURCE_COMMIT: cff1bb12ec7d24ad9048a1f54ae243a18d1a0b54

    steps:
      - name: Resolve exact head and base
        id: exact
        shell: bash
        run: |
          set -euo pipefail
          head_sha="${DISPATCH_HEAD_SHA:-${PR_HEAD_SHA:-${GITHUB_SHA}}}"
          base_sha="${DISPATCH_BASE_SHA:-${PR_BASE_SHA:-}}"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.exact.outputs.head_sha }}
          fetch-depth: 0

      - name: Verify live base and phase paths
        shell: bash
        env:
          HEAD_SHA: ${{ steps.exact.outputs.head_sha }}
          BASE_SHA: ${{ steps.exact.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          git merge-base --is-ancestor "$FOUNDATION_SHA" "$BASE_SHA"
          git diff --check "$BASE_SHA...$HEAD_SHA"
          mapfile -t paths < <(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          test "${#paths[@]}" -gt 0
          for path in "${paths[@]}"; do
            case "$path" in
              .github/workflows/lafea-nc01-shell-formulation.yml|\
              docs/nonlinear-shell-contact/LAFEA_NC01_SHELL_FORMULATION.md|\
              scripts/lafea-nc01-check.mjs|\
              scripts/lafea-nc01-shell-benchmarks.mjs|\
              scripts/nc01-shell/*|\
              src/core/nonlinear-shell-contact/shell-formulation-contract.js|\
              src/core/nonlinear-shell-contact/shell-benchmark-catalog.js|\
              src/core/nonlinear-shell-contact/shell-qualification-evaluator.js|\
              src/core/nonlinear-shell-contact/nc01-fixtures.js|\
              src/core/nonlinear-shell-contact/nc01-negative-controls.js|\
              src/core/nonlinear-shell-contact/index.js|\
              tests/nonlinear-shell-contact-nc01-qualification.test.mjs) ;;
              *) echo "NC-01 path violation: $path" >&2; exit 1 ;;
            esac
          done

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libblas3 liblapack3 libgfortran5

      - name: Download and validate governed upstream artifacts
        id: custody
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_artifact() {
            local id="$1" name="$2" digest="$3" run="$4" head="$5"
            local meta
            meta="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id")"
            test "$(jq -r .name <<<"$meta")" = "$name"
            test "$(jq -r .digest <<<"$meta")" = "$digest"
            test "$(jq -r .expired <<<"$meta")" = "false"
            test "$(jq -r .workflow_run.id <<<"$meta")" = "$run"
            test "$(jq -r .workflow_run.head_sha <<<"$meta")" = "$head"
          }
          verify_artifact "$BRIDGE_ARTIFACT_ID" "$BRIDGE_ARTIFACT_NAME" "$BRIDGE_ARTIFACT_DIGEST" "$BRIDGE_RUN_ID" "$BRIDGE_HEAD_SHA"
          verify_artifact "$CUSTODY_ARTIFACT_ID" "$CUSTODY_ARTIFACT_NAME" "$CUSTODY_ARTIFACT_DIGEST" "$CUSTODY_RUN_ID" "$CUSTODY_HEAD_SHA"
          bridge="$RUNNER_TEMP/nc00-bridge"
          custody="$RUNNER_TEMP/solver-custody"
          rm -rf "$bridge" "$custody"
          mkdir -p "$bridge" "$custody" artifacts/nc01-input
          gh run download "$BRIDGE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BRIDGE_ARTIFACT_NAME" --dir "$bridge"
          gh run download "$CUSTODY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$CUSTODY_ARTIFACT_NAME" --dir "$custody"
          solver="$custody/binary/ccx_2.22"
          archive="$custody/source/CalculiX-$SOURCE_COMMIT.tar.gz"
          test -f "$solver"
          test -f "$archive"
          chmod 0755 "$solver"
          test "sha256:$(sha256sum "$solver" | cut -d' ' -f1)" = "$SOLVER_DIGEST"
          node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync(process.argv[1]));if(r.status!=='SOLVER_CUSTODY_QUALIFIED'||r.verifiedEvidenceCount!==8||r.authority.solverCustodyQualified!==true||r.authority.solverBridgeQualified!==false)process.exit(1)" "$custody/reports-container/solver-custody-qualified-report.json"
          node scripts/nc01-shell/prepare-binding.mjs "$bridge" artifacts/nc01-input/upstream-binding.json
          echo "solver=$solver" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Run syntax, unit and negative controls
        run: |
          node --check scripts/lafea-nc01-check.mjs
          node --check scripts/lafea-nc01-shell-benchmarks.mjs
          find scripts/nc01-shell -type f -name "*.mjs" -print0 | sort -z | xargs -0 -n1 node --check
          node --test tests/nonlinear-shell-contact-nc01-qualification.test.mjs

      - name: Execute real shell evidence twice
        id: real
        shell: bash
        env:
          HEAD_SHA: ${{ steps.exact.outputs.head_sha }}
          SOLVER: ${{ steps.custody.outputs.solver }}
          ARCHIVE: ${{ steps.custody.outputs.archive }}
        run: |
          set +e
          rm -rf artifacts/nc01-real-a artifacts/nc01-real-b artifacts/nc01-debug
          mkdir -p artifacts/nc01-debug
          node_bin="$(command -v node)"
          run_one() {
            local tag="$1"
            sudo --preserve-env=HEAD_SHA,SOLVER,ARCHIVE,PATH \
              unshare --net --mount-proc "$node_bin" scripts/lafea-nc01-shell-benchmarks.mjs \
              --solver="$SOLVER" --head-sha="$HEAD_SHA" --source-archive="$ARCHIVE" \
              --output-root="$GITHUB_WORKSPACE/artifacts/nc01-real-$tag" \
              >"artifacts/nc01-debug/real-$tag.stdout.log" \
              2>"artifacts/nc01-debug/real-$tag.stderr.log"
          }
          run_one a
          a=$?
          run_one b
          b=$?
          printf "%s\n" "$a" > artifacts/nc01-debug/real-a.exit-code.txt
          printf "%s\n" "$b" > artifacts/nc01-debug/real-b.exit-code.txt
          if test "$a" = 0 && test "$b" = 0; then
            cmp artifacts/nc01-real-a/real-shell-benchmark-summary.canonical.json artifacts/nc01-real-b/real-shell-benchmark-summary.canonical.json
            diff -ru artifacts/nc01-real-a/evidence artifacts/nc01-real-b/evidence
            test "$(find artifacts/nc01-real-a/evidence -maxdepth 1 -type f -name '*.json' | wc -l)" = 6
          fi
          echo "a=$a" >> "$GITHUB_OUTPUT"
          echo "b=$b" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Evaluate complete qualification twice
        id: evaluate
        shell: bash
        env:
          HEAD_SHA: ${{ steps.exact.outputs.head_sha }}
          REAL_A: ${{ steps.real.outputs.a }}
          REAL_B: ${{ steps.real.outputs.b }}
        run: |
          set +e
          if test "$REAL_A" != 0 || test "$REAL_B" != 0; then
            echo "a=97" >> "$GITHUB_OUTPUT"
            echo "b=97" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/lafea-nc01-check.mjs --head-sha="$HEAD_SHA" --upstream-binding=artifacts/nc01-input/upstream-binding.json --evidence-root=artifacts/nc01-real-a/evidence --output-dir=artifacts/nc01-a >artifacts/nc01-debug/eval-a.stdout.log 2>artifacts/nc01-debug/eval-a.stderr.log
          a=$?
          node scripts/lafea-nc01-check.mjs --head-sha="$HEAD_SHA" --upstream-binding=artifacts/nc01-input/upstream-binding.json --evidence-root=artifacts/nc01-real-b/evidence --output-dir=artifacts/nc01-b >artifacts/nc01-debug/eval-b.stdout.log 2>artifacts/nc01-debug/eval-b.stderr.log
          b=$?
          printf "%s\n" "$a" > artifacts/nc01-debug/eval-a.exit-code.txt
          printf "%s\n" "$b" > artifacts/nc01-debug/eval-b.exit-code.txt
          cmp artifacts/nc01-a/nc01-report.canonical.json artifacts/nc01-b/nc01-report.canonical.json
          echo "a=$a" >> "$GITHUB_OUTPUT"
          echo "b=$b" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify clean source tree
        if: always()
        run: test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload NC-01 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-nc01-debug-${{ steps.exact.outputs.head_sha }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Enforce qualified exact-head result
        env:
          REAL_A: ${{ steps.real.outputs.a }}
          REAL_B: ${{ steps.real.outputs.b }}
          EVAL_A: ${{ steps.evaluate.outputs.a }}
          EVAL_B: ${{ steps.evaluate.outputs.b }}
        run: |
          test "$REAL_A" = "0"
          test "$REAL_B" = "0"
          test "$EVAL_A" = "0"
          test "$EVAL_B" = "0"
          node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('artifacts/nc01-a/nc01-report.json'));if(r.status!=='NC01_QUALIFIED'||r.qualification.authority.shellFormulationQualified!==true||r.qualification.authority.nc02Authorized!==true||r.qualification.authority.productionExecutionAuthorized!==false)process.exit(1)"

      - name: Upload authoritative NC-01 evidence
        uses: actions/upload-artifact@v4
        with:
          name: lafea-nc01-${{ steps.exact.outputs.head_sha }}-${{ github.run_attempt }}
          path: |
            artifacts/nc01-a
            artifacts/nc01-b
            artifacts/nc01-real-a
            artifacts/nc01-real-b
            artifacts/nc01-input
          if-no-files-found: error
          retention-days: 30
