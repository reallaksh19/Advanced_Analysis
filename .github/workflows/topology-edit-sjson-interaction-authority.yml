name: 3D Edit SJSON Interaction Authority

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-edit-sjson-interaction-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-sjson-interaction-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSER_CHANNEL: chromium

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify exact interaction sources
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          node --check src/workspace/topology-edit-3d-sjson-fidelity-controller.js
          node --check src/workspace/topology-edit/topology-edit-sjson-support-glyph-projection-v3.js
          node --check src/workspace/topology-edit/topology-edit-sjson-camera-clipping-v3.js
          node --check src/workspace/topology-edit/topology-edit-sjson-governed-render-common-v2.js
          node --check src/workspace/topology-edit/topology-edit-sjson-governed-route-renderer-v2.js
          node --check src/workspace/topology-edit/topology-edit-sjson-governed-support-renderer-v2.js
          node --check src/workspace/topology-edit/topology-edit-sjson-governed-viewport-backend-v2.js
          node --check src/workspace/topology-edit/topology-edit-gpu-pick-helpers.js
          node --check tests/topology-edit-sjson-interaction-authority-v3.test.mjs
          node --check tests/topology-edit-sjson-governed-viewport-v2.test.mjs
          node --check e2e/topology-edit-sjson-interaction-clipping.spec.js
          node --check e2e/topology-edit-sjson-governed-overlays.spec.js
          git diff --check

      - name: Execute support, picking, clipping, and render contracts
        run: |
          node --test \
            tests/topology-edit-sjson-interaction-authority-v3.test.mjs \
            tests/topology-edit-sjson-governed-viewport-v2.test.mjs \
            tests/topology-edit-sjson-restraint-projection.test.mjs \
            tests/topology-edit-sjson-compact-support-render.test.mjs \
            tests/topology-edit-c3d-wave3-gpu-picking.test.mjs

      - name: Execute real SJSON interaction and clipping qualification
        run: |
          npx playwright test \
            e2e/topology-edit-sjson-interaction-clipping.spec.js \
            e2e/topology-edit-sjson-governed-overlays.spec.js \
            --project=chromium --workers=1 --retries=0 --trace=on --reporter=line

      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-sjson-interaction-authority-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
