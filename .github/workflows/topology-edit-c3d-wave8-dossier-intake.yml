name: C3D Wave 8 Dossier Intake and Reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-c3d-wave8-dossier-intake.yml'
      - 'src/workspace/load-calc-consumer-controller.js'
      - 'src/workspace/topology-edit-3d-dossier-intake-controller.js'
      - 'src/workspace/viewport-productivity/topology-edit-review-dossier-intake.js'
      - 'src/workspace/viewport-productivity/topology-edit-review-dossier-intake-panel.js'
      - 'tests/topology-edit-c3d-wave8-dossier-intake.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dossier-intake-reconciliation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact checkout
        run: |
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          git merge-base --is-ancestor "$BASE_REF" HEAD

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce syntax and bounded modules
        run: |
          node --check src/workspace/viewport-productivity/topology-edit-review-dossier-intake.js
          node --check src/workspace/viewport-productivity/topology-edit-review-dossier-intake-panel.js
          node --check src/workspace/topology-edit-3d-dossier-intake-controller.js
          node --check src/workspace/load-calc-consumer-controller.js
          test "$(wc -l < src/workspace/viewport-productivity/topology-edit-review-dossier-intake.js)" -le 300
          test "$(wc -l < src/workspace/viewport-productivity/topology-edit-review-dossier-intake-panel.js)" -le 300
          test "$(wc -l < src/workspace/topology-edit-3d-dossier-intake-controller.js)" -le 300
          test "$(wc -l < src/workspace/load-calc-consumer-controller.js)" -le 300
          ! grep -R "export default" \
            src/workspace/viewport-productivity/topology-edit-review-dossier-intake.js \
            src/workspace/viewport-productivity/topology-edit-review-dossier-intake-panel.js \
            src/workspace/topology-edit-3d-dossier-intake-controller.js

      - name: Qualify dossier intake and basis reconciliation
        run: node --test tests/topology-edit-c3d-wave8-dossier-intake.test.mjs

      - name: Retain Wave 7 review dossier handoff
        run: node --test tests/topology-edit-c3d-wave7-review-dossier.test.mjs

      - name: Retain C3D review stack through Wave 6
        run: |
          node --test tests/topology-edit-c3d-wave0.test.mjs
          node --test tests/topology-edit-c3d-wave1-visibility.test.mjs
          node --test tests/topology-edit-c3d-wave1-sectioning.test.mjs
          node --test tests/topology-edit-c3d-wave2-search.test.mjs
          node --test tests/topology-edit-c3d-wave3-review.test.mjs
          node --test tests/topology-edit-c3d-wave3-gpu-picking.test.mjs
          node --test tests/topology-edit-c3d-wave4-issue-review.test.mjs
          node --test tests/topology-edit-c3d-wave4-comparison.test.mjs
          node --test tests/topology-edit-c3d-wave5-inspection-measurement.test.mjs
          node --test tests/topology-edit-c3d-wave6-route-trace.test.mjs

      - name: Retain Track B lifecycle authority
        run: |
          node --test tests/topology-edit-wave3-commands.test.mjs
          node --test tests/topology-edit-wave3b-autofix.test.mjs
          node --test tests/topology-edit-wave3c-autofix-ui.test.mjs
          node --test tests/topology-edit-wave4a-persistence-export.test.mjs
          node --test tests/topology-edit-wave4b-commit-rollback.test.mjs
          node --test tests/topology-edit-wave4c-lifecycle-ui.test.mjs

      - name: Retain governance and production build
        run: |
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs
          npm run build

      - name: Retain original W0.1 through W5.5 closure audit
        env:
          TOPOLOGY_EDIT_WAVE5_EXACT_HEAD_STATUS: PASS
        run: node scripts/topology-edit-original-plan-audit.mjs

      - name: Write exact-head evidence
        run: |
          mkdir -p reports/qualification
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (commit !== process.env.TOPOLOGY_EDIT_TARGET_HEAD_SHA) throw new Error('Exact-head mismatch.');
          const paths = [
            'src/workspace/load-calc-consumer-controller.js',
            'src/workspace/topology-edit-3d-dossier-intake-controller.js',
            'src/workspace/viewport-productivity/topology-edit-review-dossier-intake.js',
            'src/workspace/viewport-productivity/topology-edit-review-dossier-intake-panel.js',
            'tests/topology-edit-c3d-wave8-dossier-intake.test.mjs',
            'scripts/topology-edit-original-plan-audit.mjs',
          ];
          const evidence = {
            schema: 'TopologyEditC3DWave8DossierIntakeEvidence.v1',
            repository: process.env.GITHUB_REPOSITORY,
            commit,
            status: 'PASS_DOSSIER_INTAKE_AND_BASIS_RECONCILIATION',
            inputAuthority: 'CALLER_SELECTED_LOCAL_JSON_ONLY',
            integrityAuthority: 'TOPOLOGY_EDIT_REVIEW_DOSSIER_SCHEMA_AND_SEMANTIC_HASH',
            identityAuthority: 'EXACT_CANONICAL_ID_INTERSECTION_ONLY',
            viewpointReplayPolicy: 'CURRENT_BASIS_AND_COMPLETE_COVERAGE_ONLY',
            originalPlanAuditRetained: true,
            topologyAuthorityChanged: false,
            commandAuthorityChanged: false,
            checkerAuthorityChanged: false,
            autofixQualificationChanged: false,
            persistenceAuthorityChanged: false,
            auditExportAuthorityChanged: false,
            workspaceAuthorityChanged: false,
            calculationAuthorityChanged: false,
            releaseQualified: false,
            files: Object.fromEntries(paths.map((file) => [
              file,
              createHash('sha256').update(readFileSync(file)).digest('hex'),
            ])),
          };
          writeFileSync(
            'reports/qualification/topology-edit-c3d-wave8-dossier-intake.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-c3d-wave8-dossier-intake-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: |
            reports/qualification/topology-edit-c3d-wave8-dossier-intake.json
            reports/qualification/topology-edit-original-plan-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify full batch patch hygiene
        run: git diff --check "$BASE_REF...HEAD"
