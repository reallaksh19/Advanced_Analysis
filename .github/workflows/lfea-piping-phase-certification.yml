name: LFEA Piping Phase Certification

on:
  pull_request:
    paths:
      - 'audit-baseline.json'
      - 'release-evidence/lfea-piping-release-evidence.json'
      - 'reports/lfea-piping-phase-findings-ledger.json'
      - 'docs/LFEA_PIPING_100_PERCENT_CLOSURE_POLICY.md'
      - 'docs/LFEA_PIPING_PHASE_STATUS.md'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/lfea-piping-a0-baseline-check.mjs'
      - 'scripts/lfea-piping-release-readiness-check.mjs'
      - 'scripts/lfea-piping-phase-findings-check.mjs'
      - 'scripts/linear-piping-analysis-consumer-*.mjs'
      - 'scripts/linear-piping-interface-*.mjs'
      - 'scripts/linear-piping-nozzle-interface-check.mjs'
      - 'src/core/linear-piping-analysis-consumer/**'
      - 'src/core/linear-piping-interface/**'
      - '.github/workflows/lfea-piping-phase-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lfea-piping-phase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-phase-a0:
    name: Certify exact-head piping phase
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate fail-closed release policy
        run: node scripts/lfea-piping-release-readiness-check.mjs

      - name: Validate phase-to-finding ledger
        run: node scripts/lfea-piping-phase-findings-check.mjs

      - name: Capture exact-head baseline
        run: >-
          node scripts/lfea-piping-a0-baseline-check.mjs
          --release
          --emit=${RUNNER_TEMP}/audit-baseline.runtime.json

      - name: Verify T0 and source orchestration
        run: npm run check:linear-piping-analysis-consumer

      - name: Verify governed interfaces and recovery
        run: npm run check:lfea-interfaces

      - name: Run full repository gate
        run: npm run gate

      - name: Verify clean exact-head checkout
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short)"

      - name: Upload exact-head baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: lfea-piping-phase-${{ github.sha }}
          path: ${{ runner.temp }}/audit-baseline.runtime.json
          if-no-files-found: error
          retention-days: 90
