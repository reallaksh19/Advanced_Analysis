name: LFEA Piping Phase Certification

on:
  pull_request:
    paths:
      - 'audit-baseline.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/lfea-piping-a0-baseline-check.mjs'
      - 'scripts/linear-piping-analysis-consumer-*.mjs'
      - 'src/core/linear-piping-analysis-consumer/**'
      - '.github/workflows/lfea-piping-phase-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lfea-piping-phase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-phase-a0:
    name: Certify exact-head A0 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Capture exact-head baseline
        run: >-
          node scripts/lfea-piping-a0-baseline-check.mjs
          --release
          --emit=${RUNNER_TEMP}/audit-baseline.runtime.json

      - name: Verify T0 piping consumer
        run: npm run check:linear-piping-analysis-consumer

      - name: Run full repository gate
        run: npm run gate

      - name: Verify clean exact-head checkout
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short)"

      - name: Upload exact-head baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: lfea-piping-a0-${{ github.sha }}
          path: ${{ runner.temp }}/audit-baseline.runtime.json
          if-no-files-found: error
          retention-days: 90
