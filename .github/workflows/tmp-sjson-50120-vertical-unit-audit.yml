name: Temporary SJSON N50120 vertical unit audit

on:
  push:
    branches:
      - agent/sjson-1885-configurable-screening
    paths:
      - scripts/tmp-sjson-50120-vertical-unit-audit.mjs
      - .github/workflows/tmp-sjson-50120-vertical-unit-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize exact benchmark sources
        run: |
          git show 07ce017eb7113517cc032771f7717f88c0a93d4c:benchmarks/1885Sjson/EnrichedSjson > /tmp/EnrichedSjson
          git show 07ce017eb7113517cc032771f7717f88c0a93d4c:benchmarks/1885Sjson/EnrichedSjson.topology.input.xml > /tmp/EnrichedSjson.topology.input.xml
      - name: Confirm raw density values and source unit metadata
        run: |
          echo 'RAW_FLUID_DENSITY_VALUES'
          grep -o 'FLUID_DENSITY="[^"]*"' /tmp/EnrichedSjson.topology.input.xml | sort | uniq -c
          echo 'UNIT_METADATA'
          grep -oE '(DENSITY|MASS|LENGTH|FORCE|UNIT)[A-Z0-9_:-]*="[^"]*"' /tmp/EnrichedSjson.topology.input.xml | sort | uniq -c | head -100 || true
      - name: Audit duplicate enriched records for N50120 line
        run: |
          echo 'MATCHING_ENRICHED_RECORDS'
          jq -c '
            .. | objects
            | select(((.name? // "") | tostring | contains("S8810111-91261M7-HC-01/B2 3")))
            | {
                name,
                type,
                attrName: .attributes.NAME,
                insu: .attributes.INSU,
                lpos: .attributes.LPOS,
                pos: .attributes.POS,
                apos: .attributes.APOS,
                enrichedInsulation: .enrichedAttributes.insulationThicknessMm,
                enrichedFluidDensity: .enrichedAttributes.fluidDensityOpeKgM3,
                pipeOdMm: .enrichedAttributes.pipeOdMm,
                wallThicknessMm: .enrichedAttributes.wallThicknessMm
              }' /tmp/EnrichedSjson
      - name: Audit N50120 incident mass and units
        run: |
          node scripts/tmp-sjson-50120-vertical-unit-audit.mjs \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.topology.input.xml
