name: Temporary SJSON N50120 vertical unit audit

on:
  push:
    branches:
      - agent/sjson-1885-configurable-screening
    paths:
      - scripts/tmp-sjson-50120-vertical-unit-audit.mjs
      - .github/workflows/tmp-sjson-50120-vertical-unit-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize exact benchmark sources
        run: |
          git show 07ce017eb7113517cc032771f7717f88c0a93d4c:benchmarks/1885Sjson/EnrichedSjson > /tmp/EnrichedSjson
          git show 07ce017eb7113517cc032771f7717f88c0a93d4c:benchmarks/1885Sjson/EnrichedSjson.topology.input.xml > /tmp/EnrichedSjson.topology.input.xml
      - name: Apply corrected XML density unit scale in working tree
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/empirical-sjson-1885-configurable-screening-run.mjs')
          text = path.read_text()
          old = 'function normalizeFluidDensity(value) { return value < 20 ? value * 1000 : value; }'
          new = 'function normalizeFluidDensity(value) { return value * number(profile.processResolution.inputXmlDensityToKgM3); }'
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one legacy density normalization function.')
          path.write_text(text.replace(old, new))
          PY
          jq '.processResolution.inputXmlDensityUnit = "kg/cm3" | .processResolution.inputXmlDensityToKgM3 = 1000000' \
            benchmarks/1885Sjson/empirical-screening-profile.config.json > /tmp/profile.json
      - name: Recalculate corrected result
        run: |
          node scripts/empirical-sjson-1885-configurable-screening-run.mjs \
            /tmp/profile.json \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.topology.input.xml \
            /tmp/corrected-result.json > /tmp/full-output.log
          echo 'CORRECTED_VERTICAL_SUMMARY_BEGIN'
          jq '{
            verticalWeight,
            resolvedFluidDensity: .sourceResolution.processResolutionAudit.fluidDensity,
            N50120: (.supportRows[] | select(.siteId == "N50120")),
            largestVertical: ([.supportRows[]] | sort_by(.reactionsKn.FzWeight) | reverse | .[:12]),
            largestVectors: ([.supportRows[]] | sort_by(.componentVectorMagnitudeKn) | reverse | .[:12])
          }' /tmp/corrected-result.json
          echo 'CORRECTED_VERTICAL_SUMMARY_END'
      - name: Confirm N50120 local hand check
        run: |
          python - <<'PY'
          import math
          od = 168.3 / 1000
          wall = 7.11 / 1000
          inside = od - 2 * wall
          length = (6.586226999999956 + 4.6138000000000465) / 2
          steel = math.pi / 4 * (od**2 - inside**2) * 7850 * length
          fluid = math.pi / 4 * inside**2 * 300 * length
          reaction = (steel + fluid) * 9.80665 / 1000
          print({'steelMassKg': steel, 'fluidMassKg': fluid, 'correctedLocalReactionKn': reaction})
          PY
