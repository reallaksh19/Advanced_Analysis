name: LAFEA NB-T6A Controlled Continuum Pilot

on:
  pull_request:
    paths:
      - '.github/workflows/lafea-nb-t6a-controlled-continuum-pilot.yml'
      - 'src/workspace/lafea-controlled-continuum-pilot-controller.js'
      - 'src/workspace/lafea-workbench.js'
      - 'scripts/lafea-nb-t6a-controlled-continuum-pilot-check.mjs'
      - 'scripts/lafea-nonbucket-stack-check.mjs'
      - 'scripts/lafea-u3a-public-surface-check.mjs'
      - 'src/core/local-continuum/**'
      - 'src/core/lafea-application-templates/controlled-continuum-pilot-contract.js'
      - 'src/core/lafea-application-templates/continuum-application-mapping-evidence.js'
      - 'src/core/lafea-application-templates/continuum-benchmark-convergence.js'
      - 'src/workspace/lafea-analysis-mesh-evidence.js'
      - 'src/workspace/lafea-lug-pinhole-mapping-evidence.js'
      - 'src/workspace/lafea-source-authority.js'
      - 'src/workspace/lafea-target-compatibility-authority.js'
      - 'docs/LAFEA_NonBucket_NB-T6A_Controlled_Continuum_Pilot.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lafea-nb-t6a-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: NB-T6A exact-head controlled continuum qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Assert exact checkout and base ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$PR_BASE_SHA" "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run NB-T6A controlled continuum qualification
        shell: bash
        run: |
          set -o pipefail
          node scripts/lafea-nb-t6a-controlled-continuum-pilot-check.mjs \
            2>&1 | tee lafea-nb-t6a-controlled-continuum-pilot.log

      - name: Run retained B7A mapping checks
        run: node scripts/lafea-template-b7a-lug-pinhole-mapping-check.mjs

      - name: Run retained B7B benchmark checks
        run: node scripts/lafea-template-b7b-continuum-benchmark-convergence-check.mjs

      - name: Run retained B7C contract checks
        run: node scripts/lafea-template-b7c-controlled-continuum-contract-check.mjs

      - name: Run non-bucket stack
        run: npm run check:lafea-nonbucket-stack

      - name: Run continuum and retained stage checks
        run: npm run check:lafea-core

      - name: Run strict syntax checks
        run: npm run syntax:strict

      - name: Run import checks
        run: npm run check:imports

      - name: Build production bundle
        run: npm run build

      - name: Verify patch hygiene and clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PR_BASE_SHA...HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload exact-head NB-T6A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-nb-t6a-${{ github.event.pull_request.head.sha || github.sha }}
          path: lafea-nb-t6a-controlled-continuum-pilot.log
          if-no-files-found: error
          retention-days: 30
