name: 3D Edit Current Main Closure

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-current-main-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-edit-current-main-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  current-main-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSER_CHANNEL: chromium
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify exact source and patch hygiene
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          git diff --check
          test -s public/Sjson.json
          test -s src/workspace/topology-edit-3d-interaction-controller.js
          test -s src/workspace/viewport-interaction/topology-edit-tangency-clocking-snap-index.js

      - name: Execute qualified production unit matrix
        run: |
          set -euo pipefail
          UNIT_TESTS=(
            tests/topology-edit-20-element-demo-loader.test.mjs
            tests/topology-edit-20-element-demo-repairs.test.mjs
            tests/topology-edit-split-lineage-certification.test.mjs
            tests/topology-edit-sjson-render-authority.test.mjs
            tests/topology-edit-render-fidelity.test.mjs
            tests/topology-edit-render-resource-custom-geometry.test.mjs
            tests/topology-edit-m002-typed-geometry.test.mjs
            tests/topology-edit-m003-support-glyphs.test.mjs
            tests/topology-edit-m003-capability-authority.test.mjs
            tests/topology-edit-component-hud-context.test.mjs
            tests/topology-edit-professional-engineering-catalog.test.mjs
            tests/topology-edit-professional-engineering-compatibility.test.mjs
            tests/topology-edit-inline-component-insertion.test.mjs
            tests/topology-edit-professional-operation-transaction.test.mjs
            tests/topology-edit-professional-validation-blocking.test.mjs
            tests/topology-edit-validation-baseline-authority.test.mjs
            tests/topology-edit-object-tree-model.test.mjs
            tests/topology-edit-selection-contract.test.mjs
            tests/topology-edit-editor-store.test.mjs
            tests/topology-edit-selection-coordinator.test.mjs
            tests/topology-edit-selection-foundation-integration.test.mjs
            tests/topology-edit-navigation-pick-fallback.test.mjs
            tests/topology-edit-snap-spatial-index.test.mjs
            tests/topology-edit-deterministic-snap-engine.test.mjs
            tests/topology-edit-snap-store-controller.test.mjs
            tests/topology-edit-professional-snap-resolver.test.mjs
            tests/topology-edit-professional-snap-collector.test.mjs
            tests/topology-edit-professional-interaction-containment.test.mjs
            tests/topology-edit-operation-specific-snap-index.test.mjs
            tests/topology-edit-tangency-clocking-snap-index.test.mjs
          )
          printf '%s\n' "${UNIT_TESTS[@]}" > topology-edit-unit-files.txt
          node --test --test-reporter=tap "${UNIT_TESTS[@]}" 2>&1 | tee topology-edit-unit-output.txt

      - name: Build production application
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee topology-edit-build-output.txt

      - name: Execute qualified mounted Chromium matrix
        run: |
          set -euo pipefail
          E2E_TESTS=(
            e2e/topology-edit-remount-sjson.spec.js
            e2e/topology-edit-clean-layout.spec.js
            e2e/topology-edit-sjson-render-authority.spec.js
            e2e/topology-edit-component-hud-catalog.spec.js
            e2e/topology-edit-inline-component-insertion.spec.js
            e2e/topology-edit-governed-object-tree.spec.js
            e2e/topology-edit-selection-foundation.spec.js
            e2e/topology-edit-deterministic-snapping.spec.js
            e2e/topology-edit-operation-specific-snapping.spec.js
            e2e/topology-edit-tangency-clocking-snapping.spec.js
            e2e/topology-edit-ray-scan.spec.js
            e2e/topology-edit-tool-audit.spec.js
          )
          printf '%s\n' "${E2E_TESTS[@]}" > topology-edit-e2e-files.txt
          npx playwright test "${E2E_TESTS[@]}" \
            --project=chromium \
            --workers=1 \
            --retries=0 \
            --reporter=line 2>&1 | tee topology-edit-e2e-output.txt

      - name: Upload closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-current-main-closure-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}-${{ github.run_attempt }}
          path: |
            topology-edit-unit-files.txt
            topology-edit-unit-output.txt
            topology-edit-build-output.txt
            topology-edit-e2e-files.txt
            topology-edit-e2e-output.txt
            reports/qualification
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
