name: LAFEA Hybrid Browser Validation

on:
  pull_request:
    paths:
      - 'src/workspace/lafea-canvas/**'
      - 'src/workspace/lafea-*viewport*.js'
      - 'src/workspace/lafea-workbench*.js'
      - 'src/workspace/lafea-render-evidence-intake.js'
      - 'src/workspace/sequential-sketcher/sketcher-authoring-*.js'
      - 'src/workspace/sequential-sketcher/sequential-sketcher-controller.js'
      - 'src/workspace/enrichment/first-cut-workbench-launcher.js'
      - 'src/workspace/bootstrap.js'
      - 'e2e/lafea-hybrid-*.js'
      - 'e2e/fixtures/lafea-hybrid-*.js'
      - 'e2e/fixtures/sequential-authoring-*.js'
      - 'e2e/first-cut-workbench-launcher.spec.js'
      - 'e2e/fixtures/first-cut-workbench-launcher-fixture.js'
      - 'e2e/lafea-hybrid-validation-matrix.json'
      - 'scripts/lafea-u4g-*.mjs'
      - 'scripts/lafea-u4h-*.mjs'
      - 'scripts/lafea-u4i-*.mjs'
      - 'scripts/lafea-u4j-*.mjs'
      - 'scripts/sequential-sketcher-authoring-bridge-*.mjs'
      - 'scripts/first-cut-workbench-launcher-check.mjs'
      - 'scripts/first-cut-workbench-launcher-source-guard.mjs'
      - 'scripts/first-cut-workbench-launcher-browser-source-guard.mjs'
      - 'scripts/run-playwright.mjs'
      - 'docs/LAFEA_Hybrid_Canvas_Remediation_Implementation_Plan.md'
      - '.github/workflows/lafea-hybrid-browser-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact LAFEA hybrid head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Install pinned Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx playwright install chromium --with-deps
      - name: Guard Phase 5 and Phase 6 browser scope
        run: |
          set -o pipefail
          node scripts/lafea-u4h-browser-source-guard.mjs 2>&1 | tee lafea-u4h-source-guard.log
          node scripts/lafea-u4j-source-guard.mjs 2>&1 | tee lafea-u4j-source-guard.log
          node scripts/sequential-sketcher-authoring-bridge-source-guard.mjs 2>&1 | tee sequential-authoring-source-guard.log
          node scripts/first-cut-workbench-launcher-source-guard.mjs 2>&1 | tee first-cut-workbench-launcher-source-guard.log
          node scripts/first-cut-workbench-launcher-browser-source-guard.mjs 2>&1 | tee first-cut-workbench-launcher-browser-source-guard.log
      - name: Recheck live viewport, authoring and enrichment contracts
        run: |
          set -o pipefail
          node scripts/lafea-u4g-live-workbench-viewport-check.mjs 2>&1 | tee lafea-u4g-live-viewport.log
          node scripts/lafea-u4g-controller-render-evidence-check.mjs 2>&1 | tee lafea-u4g-controller-evidence.log
          node scripts/lafea-u4g-source-guard.mjs 2>&1 | tee lafea-u4g-source-guard.log
          node scripts/lafea-u4i-primitive-picker-check.mjs 2>&1 | tee lafea-u4i-primitive-picker.log
          node scripts/lafea-u4i-result-selection-check.mjs 2>&1 | tee lafea-u4i-result-selection.log
          node scripts/lafea-u4i-source-guard.mjs 2>&1 | tee lafea-u4i-source-guard.log
          node scripts/lafea-u4j-diagnostic-field-check.mjs 2>&1 | tee lafea-u4j-diagnostic-field.log
          node scripts/sequential-sketcher-authoring-bridge-check.mjs 2>&1 | tee sequential-authoring-bridge.log
          node scripts/first-cut-workbench-launcher-check.mjs 2>&1 | tee first-cut-workbench-launcher.log
      - name: Run scoped hybrid Chromium validation
        run: |
          set -o pipefail
          node scripts/run-playwright.mjs e2e/lafea-hybrid-workbench.spec.js 2>&1 | tee lafea-u4h-browser.log
      - name: Run first-cut launcher Chromium validation
        run: |
          set -o pipefail
          node scripts/run-playwright.mjs e2e/first-cut-workbench-launcher.spec.js 2>&1 | tee first-cut-workbench-launcher-browser.log
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-hybrid-browser-validation
          path: |
            lafea-u4g-*.log
            lafea-u4h-*.log
            lafea-u4i-*.log
            lafea-u4j-*.log
            sequential-authoring-*.log
            first-cut-workbench-launcher*.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
