name: Topology Edit Wave 4A

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-wave4a.yml'
      - 'src/workspace/topology-edit/topology-edit-persistence.js'
      - 'src/workspace/topology-edit/topology-edit-export.js'
      - 'tests/topology-edit-wave4a-persistence-export.test.mjs'
      - 'tests/topology-edit-wave3b-autofix.test.mjs'
      - 'tests/topology-edit-wave3c-autofix-ui.test.mjs'
      - 'tests/topology-edit-wave1-*.test.mjs'
      - 'scripts/topology-edit-*.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistence-export:
    name: W4A source-bound persistence and prepared export
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Syntax and Wave 4A contracts
        run: |
          node --check src/workspace/topology-edit/topology-edit-persistence.js
          node --check src/workspace/topology-edit/topology-edit-export.js
          node --test tests/topology-edit-wave4a-persistence-export.test.mjs

      - name: Retain Wave 1 through Wave 3 authority
        run: >-
          node --test
          tests/topology-edit-wave1-pure-kernel.test.mjs
          tests/topology-edit-wave1-candidate-certification.test.mjs
          tests/topology-edit-wave1-journal-replay.test.mjs
          tests/topology-edit-wave1-production-integration.test.mjs
          tests/topology-edit-wave3a-checker.test.mjs
          tests/topology-edit-wave3b-autofix.test.mjs
          tests/topology-edit-wave3c-autofix-ui.test.mjs

      - name: Source, API, coding, and import authority
        run: |
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-wave1-coding-rules-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs

      - name: Assert no live workspace commit promotion
        run: |
          ! grep -R "commitDraftToWorkspace" \
            src/workspace/topology-edit/topology-edit-persistence.js \
            src/workspace/topology-edit/topology-edit-export.js
          ! grep -R "WorkspaceState" \
            src/workspace/topology-edit/topology-edit-persistence.js \
            src/workspace/topology-edit/topology-edit-export.js

      - name: Production build
        run: npm run build

      - name: Write exact-head Wave 4A evidence
        run: |
          mkdir -p reports/qualification
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (head !== process.env.TOPOLOGY_EDIT_TARGET_HEAD_SHA) throw new Error('Exact-head mismatch.');
          const paths = [
            'src/workspace/topology-edit/topology-edit-persistence.js',
            'src/workspace/topology-edit/topology-edit-export.js',
            'tests/topology-edit-wave4a-persistence-export.test.mjs',
          ];
          const files = Object.fromEntries(paths.map((path) => [
            path,
            createHash('sha256').update(readFileSync(path)).digest('hex'),
          ]));
          const evidence = {
            schema: 'TopologyEditWave4APersistenceExportEvidence.v1',
            repository: process.env.GITHUB_REPOSITORY,
            commit: head,
            status: 'PASS_PERSISTENCE_AND_PREPARED_EXPORT',
            exactReplayRequired: true,
            sourceAndBaseBound: true,
            dependencyHashesBound: true,
            fullModelStagedJson: true,
            byteDeterministic: true,
            workspaceMutationAuthorized: false,
            files,
          };
          writeFileSync('reports/qualification/topology-edit-wave4a.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-wave4a-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-wave4a.json
          if-no-files-found: error
          retention-days: 30
