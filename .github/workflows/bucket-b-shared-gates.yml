name: Bucket B shared Q8 gates

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/bucket-b-shared-gates.yml'
      - 'docs/Bucket_B_Two_Dimensional_Continuum_FEA_Benchmark_Record_Rev1.md'
      - 'scripts/bucket-b-bb00-bb05-check.mjs'
      - 'src/core/bucket-b/**'
      - 'src/core/local-continuum/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bucket-b-shared-gates.yml'
      - 'docs/Bucket_B_Two_Dimensional_Continuum_FEA_Benchmark_Record_Rev1.md'
      - 'scripts/bucket-b-bb00-bb05-check.mjs'
      - 'src/core/bucket-b/**'
      - 'src/core/local-continuum/**'
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact repository head to qualify; defaults to the dispatched ref SHA.
        required: false
        type: string
      expected_base_sha:
        description: Exact parent/base SHA used for the changed-path and whitespace audit.
        required: true
        type: string
      enforce_changed_path_allowlist:
        description: Enforce the original BB-00 through BB-05 source-scope allowlist for an explicit qualification run.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  qualify:
    name: Exact-head Bucket B qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Resolve exact qualification refs
        id: refs
        shell: bash
        env:
          DISPATCH_HEAD_SHA: ${{ inputs.expected_head_sha }}
          DISPATCH_BASE_SHA: ${{ inputs.expected_base_sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          head_sha="${DISPATCH_HEAD_SHA:-${PR_HEAD_SHA:-${GITHUB_SHA}}}"
          base_sha="${DISPATCH_BASE_SHA:-${PR_BASE_SHA:-${PUSH_BEFORE_SHA:-}}}"
          if [[ ! "$head_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Invalid exact head SHA: $head_sha" >&2
            exit 1
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-fA-F]{40}$ ]] || [[ "$base_sha" =~ ^0{40}$ ]]; then
            echo "A valid nonzero 40-character expected base SHA is required." >&2
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact qualification head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify governed commits exist
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.refs.outputs.base_sha }}
        run: |
          set -euo pipefail
          git cat-file -e "${EXPECTED_HEAD_SHA}^{commit}"
          git cat-file -e "${EXPECTED_BASE_SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Validate patch whitespace
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.refs.outputs.base_sha }}
        run: git diff --check "${EXPECTED_BASE_SHA}...${EXPECTED_HEAD_SHA}"

      - name: Run exact-head shared-gate qualification or downstream replay
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          EXPECTED_BASE_REF: ${{ steps.refs.outputs.base_sha }}
          STRICT_REPOSITORY_DIFFERENTIAL: '1'
          ENFORCE_CHANGED_PATH_ALLOWLIST: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce_changed_path_allowlist && '1' || '0' }}
          REPORT_PATH: reports/bucket-b-bb00-bb05-exact-head-report.json
        run: node scripts/bucket-b-bb00-bb05-check.mjs

      - name: Run BB-06 lug and clamp qualification
        if: ${{ hashFiles('src/core/bucket-b/bb06-check.mjs') != '' }}
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          BB06_REPORT_PATH: reports/bucket-b-bb06-lug-clamp-report.json
        run: node src/core/bucket-b/bb06-check.mjs

      - name: Run BB-07 bracket and gusset qualification
        if: ${{ hashFiles('src/core/bucket-b/bb07-check.mjs') != '' }}
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          BB06_REPORT_PATH: reports/bucket-b-bb06-lug-clamp-report.json
          BB07_REPORT_PATH: reports/bucket-b-bb07-bracket-gusset-report.json
        run: node src/core/bucket-b/bb07-check.mjs

      - name: Run BB-08 pipe and pad qualification
        if: ${{ hashFiles('src/core/bucket-b/bb08-check.mjs') != '' }}
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          BB07_REPORT_PATH: reports/bucket-b-bb07-bracket-gusset-report.json
          BB08_REPORT_PATH: reports/bucket-b-bb08-pipe-pad-report.json
        run: node src/core/bucket-b/bb08-check.mjs

      - name: Run BB-09 nozzle and repad qualification
        if: ${{ hashFiles('src/core/bucket-b/bb09-check.mjs') != '' }}
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          BB08_REPORT_PATH: reports/bucket-b-bb08-pipe-pad-report.json
          BB09_REPORT_PATH: reports/bucket-b-bb09-nozzle-repad-report.json
          BB09_DIAGNOSTIC_PATH: reports/bucket-b-bb09-nozzle-repad-diagnostic.json
        run: |
          set -uo pipefail
          output_file="${RUNNER_TEMP}/bb09-output.log"
          if node src/core/bucket-b/bb09-check.mjs 2>&1 | tee "$output_file"; then
            exit 0
          fi
          message="$(tail -c 3500 "$output_file" | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')"
          echo "::error title=BB-09 qualification failure::${message}"
          exit 1

      - name: Upload qualification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bucket-b-qualification-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/bucket-b-bb00-bb05-exact-head-report.json
            reports/bucket-b-bb06-lug-clamp-report.json
            reports/bucket-b-bb07-bracket-gusset-report.json
            reports/bucket-b-bb08-pipe-pad-report.json
            reports/bucket-b-bb09-nozzle-repad-report.json
            reports/bucket-b-bb09-nozzle-repad-diagnostic.json
          if-no-files-found: warn
