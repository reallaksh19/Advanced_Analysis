name: M032 Exact-Head Accuracy Qualification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/m027-bm2-consolidated.yml'

permissions:
  contents: read

concurrency:
  group: m032-exact-head-accuracy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_HEAD_SHA: 1c07108bdeab4bffe622b15f2f7ae052368ed9a0

    steps:
      - name: Checkout M032 exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 1

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Syntax and baseline contract
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lfea-m032-bm2-accuracy-program-check.mjs
          node --check scripts/lfea-m031-bm2-qualified-check.mjs
          node --check scripts/lfea-m031-bm2-qualified-runtime.mjs
          node --check scripts/lfea-b3.26-bm2-output-comparison-runtime.mjs
          python -m json.tool benchmarks/LFEA/BM2/accuracy-program-baseline-v1.json > /dev/null
          git diff --check

      - name: Reproduce M031 qualified mechanics
        run: node scripts/lfea-m031-bm2-qualified-check.mjs

      - name: Freeze M032 denominator and generate clusters
        run: node scripts/lfea-m032-bm2-accuracy-program-check.mjs --freeze --write

      - name: BM1 comparison regression
        run: npm run check:lfea-bm1-cii-comparison

      - name: BM3 coupled-spring regression
        run: node scripts/lfea-m028-bm3-check.mjs

      - name: BM3 hanger regression
        run: node scripts/lfea-m029-bm3-hanger-check.mjs

      - name: Full linear-core regression
        run: npm run check:lfea-linear-core

      - name: Deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            reports/bm2-accuracy-program-clusters.json \
            reports/bm2-accuracy-program-clusters.csv \
            > /tmp/m032-bm2-accuracy.sha256
          node scripts/lfea-m032-bm2-accuracy-program-check.mjs --freeze --write > /tmp/m032-bm2-accuracy-replay.log
          sha256sum --check /tmp/m032-bm2-accuracy.sha256

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: m032-bm2-accuracy-${{ env.TARGET_HEAD_SHA }}
          path: |
            benchmarks/LFEA/BM2/accuracy-program-baseline-v1.json
            reports/bm2-accuracy-program-clusters.json
            reports/bm2-accuracy-program-clusters.csv
            /tmp/m032-bm2-accuracy.sha256
          if-no-files-found: error
          retention-days: 30
