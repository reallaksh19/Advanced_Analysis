name: Topology Edit Table Slice 5C

on:
  push:
    paths:
      - 'src/workspace/topology-edit/export/topology-edit-stagedjson-writeback.js'
      - 'src/workspace/topology-edit/export/topology-edit-stagedjson-roundtrip.js'
      - 'tests/topology-edit-stagedjson-roundtrip.test.mjs'
      - '.github/workflows/topology-edit-table-slice5c.yml'
  pull_request:
    paths:
      - 'src/workspace/topology-edit/export/topology-edit-stagedjson-writeback.js'
      - 'src/workspace/topology-edit/export/topology-edit-stagedjson-roundtrip.js'
      - 'tests/topology-edit-stagedjson-roundtrip.test.mjs'
      - '.github/workflows/topology-edit-table-slice5c.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-stagedjson-roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact HEAD line and source guards
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          files=(
            src/workspace/topology-edit/export/topology-edit-stagedjson-writeback.js
            src/workspace/topology-edit/export/topology-edit-stagedjson-roundtrip.js
            tests/topology-edit-stagedjson-roundtrip.test.mjs
          )
          for file in "${files[@]}"; do
            test "$(git show "HEAD:$file" | wc -l)" -lt 300
            node --check "$file"
          done
          ! grep -REn 'WorkspaceState|loadDataset\(|swapDataset\(|applyCanonicalTopologyToWorkspaceEntities|session\.execute\(|splice\(' \
            src/workspace/topology-edit/export/topology-edit-stagedjson-*.js
          ! grep -REn 'proximity|nearest|distance.*identity|geometry.*identity' \
            src/workspace/topology-edit/export/topology-edit-stagedjson-*.js
      - name: StagedJSON surgical writeback and production re-import contracts
        run: node --test tests/topology-edit-stagedjson-roundtrip.test.mjs
      - name: Retained source custody and semantic comparator contracts
        run: |
          node --test tests/topology-edit-source-surgical-patch.test.mjs
          node --test tests/topology-edit-source-representability.test.mjs
          node --test tests/topology-edit-roundtrip-semantics.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
        run: npx playwright install --with-deps chromium
      - name: Production Table Canvas Chromium regression
        env:
          PLAYWRIGHT_BROWSERS_PATH: '0'
          TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npx playwright test e2e/topology-edit-table-authority.spec.js --project=chromium --workers=1 --retries=0 --reporter=line
      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-table-slice5c-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            reports/qualification/topology-edit-table-authority.json
            playwright-report
            test-results
          if-no-files-found: warn
