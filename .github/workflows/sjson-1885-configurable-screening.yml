name: SJSON 1885 configurable empirical screening

on:
  push:
    branches:
      - agent/sjson-1885-configurable-screening
    paths:
      - project-data/1885s-nonfea-piping-defaults.json
      - src/workspace/project-data/project-data-fields.js
      - src/workspace/project-data/project-data-contract.js
      - src/core/geometry/nominal-pipe-size-resolution.js
      - src/core/empirical-piping-mechanics/configured-resolution.js
      - src/core/empirical-piping-mechanics/sustained-simple-span.js
      - src/core/empirical-piping-mechanics/vertical-retention.js
      - src/core/empirical-piping-mechanics/index.js
      - src/calc-workspace/cii-standalone-port/core/branch-schedule-resolution.js
      - src/calc-workspace/cii-standalone-port/core/pos-topology-crosswalk.js
      - src/calc-workspace/cii-standalone-port/core/pos-section-source-authority.js
      - src/calc-workspace/cii-standalone-port/core/pos-section-material-resolution.js
      - scripts/nonfea-piping-foundation-check.mjs
      - scripts/empirical-sjson-1885-pos-section-material-run.mjs
      - scripts/empirical-sjson-1885-pos-section-material-check.mjs
      - scripts/empirical-sjson-1885-governed-section-projection.mjs
      - scripts/empirical-sjson-1885-governed-section-projection-check.mjs
      - scripts/empirical-sjson-1885-governed-screening-run.mjs
      - scripts/empirical-sjson-1885-screening-csv.mjs
      - scripts/empirical-pos-section-material-csv.mjs
      - benchmarks/1885Sjson/empirical-screening-profile.config.json
      - benchmarks/1885Sjson/empirical-screening-result.configurable.json
      - benchmarks/1885Sjson/empirical-screening-result.configurable.csv
      - benchmarks/1885Sjson/empirical-pos-section-material.csv
      - benchmarks/1885Sjson/empirical-configured-default-usage.csv
      - docs/evidence/SJSON_1885_CONFIGURABLE_SCREENING.md
      - docs/NonFEAHandcalc_Emperical.md
      - scripts/empirical-sjson-1885-configurable-screening-run.mjs
      - scripts/empirical-sjson-1885-configurable-screening-check.mjs
      - .github/workflows/sjson-1885-configurable-screening.yml
  pull_request:
    paths:
      - project-data/1885s-nonfea-piping-defaults.json
      - src/workspace/project-data/project-data-fields.js
      - src/workspace/project-data/project-data-contract.js
      - src/core/geometry/nominal-pipe-size-resolution.js
      - src/core/empirical-piping-mechanics/configured-resolution.js
      - src/core/empirical-piping-mechanics/sustained-simple-span.js
      - src/core/empirical-piping-mechanics/vertical-retention.js
      - src/core/empirical-piping-mechanics/index.js
      - src/calc-workspace/cii-standalone-port/core/branch-schedule-resolution.js
      - src/calc-workspace/cii-standalone-port/core/pos-topology-crosswalk.js
      - src/calc-workspace/cii-standalone-port/core/pos-section-source-authority.js
      - src/calc-workspace/cii-standalone-port/core/pos-section-material-resolution.js
      - scripts/nonfea-piping-foundation-check.mjs
      - scripts/empirical-sjson-1885-pos-section-material-run.mjs
      - scripts/empirical-sjson-1885-pos-section-material-check.mjs
      - scripts/empirical-sjson-1885-governed-section-projection.mjs
      - scripts/empirical-sjson-1885-governed-section-projection-check.mjs
      - scripts/empirical-sjson-1885-governed-screening-run.mjs
      - scripts/empirical-sjson-1885-screening-csv.mjs
      - scripts/empirical-pos-section-material-csv.mjs
      - benchmarks/1885Sjson/empirical-screening-profile.config.json
      - benchmarks/1885Sjson/empirical-screening-result.configurable.json
      - benchmarks/1885Sjson/empirical-screening-result.configurable.csv
      - benchmarks/1885Sjson/empirical-pos-section-material.csv
      - benchmarks/1885Sjson/empirical-configured-default-usage.csv
      - docs/evidence/SJSON_1885_CONFIGURABLE_SCREENING.md
      - docs/NonFEAHandcalc_Emperical.md
      - scripts/empirical-sjson-1885-configurable-screening-run.mjs
      - scripts/empirical-sjson-1885-configurable-screening-check.mjs
      - .github/workflows/sjson-1885-configurable-screening.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sjson-1885-configurable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calculate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run non-FEA piping foundation hand checks
        run: node scripts/nonfea-piping-foundation-check.mjs
      - name: Materialize exact enriched benchmark sources
        run: |
          git show 07ce017eb7113517cc032771f7717f88c0a93d4c:benchmarks/1885Sjson/EnrichedSjson > /tmp/EnrichedSjson
          git show 07ce017eb7113517cc032771f7717f88c0a93d4c:benchmarks/1885Sjson/EnrichedSjson.topology.input.xml > /tmp/EnrichedSjson.topology.input.xml
      - name: Resolve exact POS section and material authority
        run: |
          node scripts/empirical-sjson-1885-pos-section-material-run.mjs \
            project-data/1885s-nonfea-piping-defaults.json \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.topology.input.xml \
            /tmp/pos-section-material.json
          node scripts/empirical-sjson-1885-pos-section-material-check.mjs \
            /tmp/pos-section-material.json
          node scripts/empirical-pos-section-material-csv.mjs \
            /tmp/pos-section-material.json \
            /tmp/empirical-pos-section-material.csv \
            /tmp/empirical-configured-default-usage.csv
      - name: Project governed POS sections into the calculation topology
        run: |
          node scripts/empirical-sjson-1885-governed-section-projection.mjs \
            /tmp/EnrichedSjson.topology.input.xml \
            /tmp/pos-section-material.json \
            /tmp/EnrichedSjson.governed.topology.input.xml \
            /tmp/governed-section-projection.json
          node scripts/empirical-sjson-1885-governed-section-projection-check.mjs \
            /tmp/governed-section-projection.json \
            /tmp/EnrichedSjson.governed.topology.input.xml
      - name: Recalculate governed benchmark twice
        run: |
          node scripts/empirical-sjson-1885-governed-screening-run.mjs \
            benchmarks/1885Sjson/empirical-screening-profile.config.json \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.governed.topology.input.xml \
            /tmp/governed-section-projection.json \
            /tmp/result-a.json
          node scripts/empirical-sjson-1885-governed-screening-run.mjs \
            benchmarks/1885Sjson/empirical-screening-profile.config.json \
            /tmp/EnrichedSjson \
            /tmp/EnrichedSjson.governed.topology.input.xml \
            /tmp/governed-section-projection.json \
            /tmp/result-b.json
          cmp /tmp/result-a.json /tmp/result-b.json
          node scripts/empirical-sjson-1885-screening-csv.mjs \
            /tmp/result-a.json \
            /tmp/empirical-screening-result.configurable.csv
      - name: Upload recalculated candidate
        uses: actions/upload-artifact@v4
        with:
          name: empirical-sjson-1885-recalculated-candidate
          path: |
            /tmp/result-a.json
            /tmp/result-b.json
            /tmp/empirical-screening-result.configurable.csv
            /tmp/pos-section-material.json
            /tmp/EnrichedSjson.governed.topology.input.xml
            /tmp/governed-section-projection.json
            /tmp/empirical-pos-section-material.csv
            /tmp/empirical-configured-default-usage.csv
          if-no-files-found: error
      - name: Verify governed engineering assertions
        run: node scripts/empirical-sjson-1885-configurable-screening-check.mjs /tmp/result-a.json
      - name: Verify checked-in governed evidence
        run: |
          cmp /tmp/result-a.json benchmarks/1885Sjson/empirical-screening-result.configurable.json
          cmp /tmp/empirical-screening-result.configurable.csv benchmarks/1885Sjson/empirical-screening-result.configurable.csv
      - name: Upload calculation evidence
        uses: actions/upload-artifact@v4
        with:
          name: empirical-sjson-1885-configurable-screening
          path: |
            /tmp/result-a.json
            /tmp/empirical-screening-result.configurable.csv
            /tmp/pos-section-material.json
            /tmp/EnrichedSjson.governed.topology.input.xml
            /tmp/governed-section-projection.json
            /tmp/empirical-pos-section-material.csv
            /tmp/empirical-configured-default-usage.csv
            docs/evidence/SJSON_1885_CONFIGURABLE_SCREENING.md
          if-no-files-found: error
