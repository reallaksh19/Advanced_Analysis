name: LAFEA B0 Every-Main Certification Status

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/lafea-template-b0-main-status.yml'
      - '.github/workflows/lafea-template-b0-current-main.yml'
      - 'scripts/lafea-template-b0-current-main-requalification-check.mjs'
      - 'scripts/lafea-template-stack-check.mjs'
      - 'scripts/lafea-template-t*.mjs'
      - 'scripts/lafea-nonbucket-*.mjs'
      - 'scripts/lafea-nb*.mjs'
      - 'src/core/lafea-application-templates/**'
      - 'src/workspace/lafea-*.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  statuses: write

concurrency:
  group: lafea-b0-main-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-current-main:
    name: B0 every-main exact-head certification
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CANDIDATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      STATUS_CONTEXT: lafea-template-b0/current-main
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Assert exact checkout and frozen base
        id: identity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git cat-file -e \
            24e2b1c7b7279dedc287432cb5165befbc95dcb6^{commit}
          git merge-base --is-ancestor "$CANDIDATE_BASE_SHA" "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node.js
        if: always() && steps.identity.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        id: npm_ci
        if: always() && steps.identity.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee lafea-b0-main-npm-ci.log

      - name: Run B0 freshness and compatibility
        id: b0
        if: always() && steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          LAFEA_B0_REPORT_PATH=lafea-b0-main-report.json \
            node scripts/lafea-template-b0-current-main-requalification-check.mjs \
            2>&1 | tee lafea-b0-main-check.log

      - name: Run retained Bucket template stack
        id: template_stack
        if: always() && steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:lafea-template-stack 2>&1 | tee lafea-b0-main-template-stack.log

      - name: Run current non-Bucket authority stack
        id: nonbucket_stack
        if: always() && steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run check:lafea-nonbucket-stack 2>&1 | tee lafea-b0-main-nonbucket-stack.log

      - name: Build production bundle
        id: build
        if: always() && steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee lafea-b0-main-build.log

      - name: Run full repository gate
        id: repository_gate
        if: always() && steps.npm_ci.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run gate 2>&1 | tee lafea-b0-main-repository-gate.log

      - name: Verify exact patch hygiene and tracked clean tree
        id: hygiene
        if: always() && steps.identity.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
            git diff --check "$CANDIDATE_BASE_SHA...HEAD"
            test -z "$(git status --porcelain=v1 --untracked-files=no)"
          } 2>&1 | tee lafea-b0-main-hygiene.log

      - name: Write exact-head status matrix
        id: matrix
        if: always()
        env:
          OUTCOMES: >-
            {"identity":"${{ steps.identity.outcome }}","npmCi":"${{ steps.npm_ci.outcome }}","b0":"${{ steps.b0.outcome }}","templateStack":"${{ steps.template_stack.outcome }}","nonBucketStack":"${{ steps.nonbucket_stack.outcome }}","build":"${{ steps.build.outcome }}","repositoryGate":"${{ steps.repository_gate.outcome }}","hygiene":"${{ steps.hygiene.outcome }}"}
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const outcomes = JSON.parse(process.env.OUTCOMES);
          const failures = Object.entries(outcomes)
            .filter(([, outcome]) => outcome !== 'success')
            .map(([command, outcome]) => ({ command, outcome }));
          const report = fs.existsSync('lafea-b0-main-report.json')
            ? JSON.parse(fs.readFileSync('lafea-b0-main-report.json', 'utf8'))
            : null;
          const matrix = {
            schema: 'lafea-template-b0-every-main-status/v1',
            exactHead: process.env.EXPECTED_HEAD_SHA,
            baseSha: process.env.CANDIDATE_BASE_SHA,
            eventName: process.env.GITHUB_EVENT_NAME,
            status: failures.length ? 'FAIL' : 'PASS',
            disposition: failures.length
              ? 'CURRENT_MAIN_B0_NOT_CERTIFIED'
              : 'CURRENT_MAIN_B0_CERTIFIED',
            outcomes,
            failures,
            templateCounts: report?.counts ?? null,
            authority: report?.authority ?? null,
          };
          fs.writeFileSync(
            'lafea-b0-main-status-matrix.json',
            `${JSON.stringify(matrix, null, 2)}\n`,
          );
          console.log(JSON.stringify(matrix));
          NODE

      - name: Publish exact-head commit status
        if: always() && steps.matrix.outcome == 'success'
        uses: actions/github-script@v7
        env:
          STATUS_SHA: ${{ env.EXPECTED_HEAD_SHA }}
        with:
          script: |
            const fs = require('fs');
            const matrix = JSON.parse(
              fs.readFileSync('lafea-b0-main-status-matrix.json', 'utf8'),
            );
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: matrix.status === 'PASS' ? 'success' : 'failure',
              context: process.env.STATUS_CONTEXT,
              description: matrix.status === 'PASS'
                ? 'B0 exact-head current-main certification passed'
                : 'B0 exact-head current-main certification failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Upload exact-head B0 status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-b0-every-main-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lafea-b0-main-*.log
            lafea-b0-main-report.json
            lafea-b0-main-status-matrix.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce exact-head B0 result
        if: always()
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const matrix = JSON.parse(
            fs.readFileSync('lafea-b0-main-status-matrix.json', 'utf8'),
          );
          if (matrix.status !== 'PASS') process.exit(1);
          NODE
