name: LAFEA B4 Controlled Analytical Pilots

on:
  pull_request:
    paths:
      - '.github/workflows/lafea-template-b4-analytical-pilots.yml'
      - 'src/workspace/lafea-template-execution-controller.js'
      - 'src/workspace/lafea-template-execution-public.js'
      - 'src/workspace/lafea-workbench.js'
      - 'scripts/lafea-template-b4-analytical-pilot-check.mjs'
      - 'scripts/lafea-u3a-public-surface-check.mjs'
      - 'docs/LAFEA_Bucket_B4_Analytical_Pilot.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lafea-b4-analytical-pilots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: B4 two-pilot controller and independent values
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Assert exact checkout and base ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$PR_BASE_SHA" "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run B4 selected-pilot and independent-value checks
        run: node scripts/lafea-template-b4-analytical-pilot-check.mjs

      - name: Run retained B3 contract checks
        run: node scripts/lafea-template-b3-analytical-execution-contract-check.mjs

      - name: Run retained B2 compatibility checks
        run: node scripts/lafea-template-b2-target-compatibility-check.mjs

      - name: Run retained B1 release/readiness checks
        run: node scripts/lafea-template-b1-release-record-v2-check.mjs

      - name: Run public surface check
        run: node scripts/lafea-u3a-public-surface-check.mjs

      - name: Run non-Bucket authority stack
        run: npm run check:lafea-nonbucket-stack

      - name: Run strict syntax checks
        run: npm run syntax:strict

      - name: Run import checks
        run: npm run check:imports

      - name: Build production bundle
        run: npm run build

      - name: Verify patch hygiene and clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PR_BASE_SHA...HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
