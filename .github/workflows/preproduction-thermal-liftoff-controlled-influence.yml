name: preproduction-thermal-liftoff-controlled-influence

on:
  pull_request:
    branches:
      - agent/preproduction-thermal-liftoff-integrated-tl04-source
    paths:
      - scripts/preproduction-thermal-liftoff-controlled-influence-adapter.mjs
      - scripts/preproduction-thermal-liftoff-controlled-influence-validator.mjs
      - scripts/preproduction-thermal-liftoff-controlled-influence-check.mjs
      - scripts/preproduction-thermal-liftoff-controlled-influence-guard.mjs
      - .github/workflows/preproduction-thermal-liftoff-controlled-influence.yml

permissions:
  contents: read

jobs:
  qualify-preproduction-thermal-liftoff-controlled-influence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prove exact head and clean worktree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code

      - name: Enforce five-path controlled-influence containment
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="$(git rev-parse HEAD)"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/tl-influence-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              scripts/preproduction-thermal-liftoff-controlled-influence-adapter.mjs|scripts/preproduction-thermal-liftoff-controlled-influence-validator.mjs|scripts/preproduction-thermal-liftoff-controlled-influence-check.mjs|scripts/preproduction-thermal-liftoff-controlled-influence-guard.mjs|.github/workflows/preproduction-thermal-liftoff-controlled-influence.yml) ;;
              *) echo "Forbidden changed path for controlled TL influence qualification: $changed"; exit 1 ;;
            esac
          done < /tmp/tl-influence-paths.txt
          test "$(wc -l < /tmp/tl-influence-paths.txt)" -eq 5

      - name: Install dependencies
        run: npm ci

      - name: Syntax check controlled influence batch
        run: |
          node --check scripts/preproduction-thermal-liftoff-controlled-influence-adapter.mjs
          node --check scripts/preproduction-thermal-liftoff-controlled-influence-validator.mjs
          node --check scripts/preproduction-thermal-liftoff-controlled-influence-check.mjs
          node --check scripts/preproduction-thermal-liftoff-controlled-influence-guard.mjs

      - name: Requalify current source and nonlinear stack
        run: |
          node scripts/preproduction-thermal-liftoff-controlled-source-guard.mjs
          node scripts/preproduction-thermal-liftoff-controlled-source-check.mjs
          node scripts/preproduction-thermal-liftoff-active-set-source-guard.mjs
          node scripts/preproduction-thermal-liftoff-active-set-check.mjs

      - name: Requalify LFEA solver and closed-form fixture
        run: node scripts/lfea-b3.3-solver-check.mjs

      - name: Enforce controlled influence source boundary
        run: node scripts/preproduction-thermal-liftoff-controlled-influence-guard.mjs

      - name: Qualify source-backed coupled flexibility matrix
        run: node scripts/preproduction-thermal-liftoff-controlled-influence-check.mjs

      - name: Import graph
        run: npm run check:imports

      - name: Production build
        run: npm run build

      - name: Whitespace check
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "$(git rev-parse HEAD)"
