name: wp6-authority-patch

on:
  push:
    branches:
      - agent/empirical-coupled-network-wp6
    paths:
      - '.github/workflows/wp6-authority-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/empirical-coupled-network-wp6
          fetch-depth: 0

      - name: Extend exact-head qualification for WP6
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/empirical-piping-exact-head.yml')
          text = workflow.read_text()

          def add_after(anchor, addition, label):
              global text
              if addition.strip() in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'{label} anchor not found')
              text = text.replace(anchor, anchor + addition, 1)

          add_after(
              "      - 'src/workspace/engineering-loads/empirical-restraint-network-*.js'\n",
              "      - 'src/workspace/engineering-loads/empirical-coupled-restraint-network-*.js'\n",
              'workflow production path',
          )
          add_after(
              "      - 'scripts/empirical-restraint-network-check.mjs'\n",
              "      - 'scripts/empirical-coupled-restraint-network-check.mjs'\n",
              'workflow script path',
          )
          add_after(
              "      - '.github/workflows/empirical-restraint-network-wp5.yml'\n",
              "      - '.github/workflows/empirical-coupled-restraint-network-wp6.yml'\n",
              'workflow authority path',
          )

          old_case = "src/workspace/engineering-loads/empirical-restraint-network-*.js|src/workspace/topology-edit/"
          new_case = "src/workspace/engineering-loads/empirical-restraint-network-*.js|src/workspace/engineering-loads/empirical-coupled-restraint-network-*.js|src/workspace/topology-edit/"
          if new_case not in text:
              if old_case not in text:
                  raise SystemExit('containment production-path anchor not found')
              text = text.replace(old_case, new_case, 1)

          old_script_case = "scripts/empirical-restraint-network-check.mjs|scripts/advanced-shell-contract-check.mjs"
          new_script_case = "scripts/empirical-restraint-network-check.mjs|scripts/empirical-coupled-restraint-network-check.mjs|scripts/advanced-shell-contract-check.mjs"
          if new_script_case not in text:
              if old_script_case not in text:
                  raise SystemExit('containment script anchor not found')
              text = text.replace(old_script_case, new_script_case, 1)

          old_workflow_case = ".github/workflows/empirical-restraint-network-wp5.yml) ;;"
          new_workflow_case = ".github/workflows/empirical-restraint-network-wp5.yml|.github/workflows/empirical-coupled-restraint-network-wp6.yml) ;;"
          if new_workflow_case not in text:
              if old_workflow_case not in text:
                  raise SystemExit('containment workflow anchor not found')
              text = text.replace(old_workflow_case, new_workflow_case, 1)

          execution_anchor = """      - name: Restricted global restraint-network runtime
                run: node scripts/empirical-restraint-network-check.mjs
          """
          execution_addition = execution_anchor + """
              - name: Coupled branch and loop restraint-network runtime
                run: node scripts/empirical-coupled-restraint-network-check.mjs
          """
          if 'Coupled branch and loop restraint-network runtime' not in text:
              if execution_anchor not in text:
                  raise SystemExit('execution-step anchor not found')
              text = text.replace(execution_anchor, execution_addition, 1)

          workflow.write_text(text)
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/empirical-piping-exact-head.yml
          if git diff --cached --quiet; then
            echo 'WP6 exact-head qualification already patched.'
            exit 0
          fi
          git commit -m 'Add WP6 to empirical exact-head qualification'
          git push origin HEAD:agent/empirical-coupled-network-wp6
