name: M038 BM4 FORCMNT Mechanics

on:
  push:
    branches:
      - codex/m038-bm4-forcmnt-mechanics
  pull_request:
    paths:
      - 'scripts/lfea-m034-bm4-solve-runtime.mjs'
      - 'scripts/lfea-m035-m036-bm4-integration-runtime.mjs'
      - 'scripts/lfea-m038-bm4-forcmnt-authority.mjs'
      - 'scripts/lfea-m038-bm4-forcmnt-check.mjs'
      - '.github/workflows/m038-bm4-forcmnt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forcmnt-mechanics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify FORCMNT mechanics and BM4 evidence
        run: node scripts/lfea-m038-bm4-forcmnt-check.mjs
