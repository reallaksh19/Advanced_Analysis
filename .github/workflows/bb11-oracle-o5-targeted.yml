name: BB-11 targeted O4-O5 oracle tails

on:
  push:
    branches:
      - diagnostic/bb11-oracle-o5-targeted

permissions:
  contents: read

jobs:
  diagnose-tail:
    strategy:
      fail-fast: false
      matrix:
        load_case:
          - FH-AXIAL-001
          - FH-GASKET-001
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TZ: UTC
      LC_ALL: C
      BB11_DIAGNOSTICS: '1'
      NODE_OPTIONS: --max-old-space-size=7168
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/bb11-oracle-o5-targeted
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Materialize repaired O4-O5 oracle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          workflow = Path('.github/workflows/bb11-oracle-interface-bootstrap.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          exec(compile(dedent(workflow[start:end]), '<materializer>', 'exec'))

          path = Path('src/core/bucket-b/flange-hub-independent-oracle.js')
          source = path.read_text()

          source, count = re.subn(
              r"const LEVELS = Object\.freeze\(\[.*?\]\);",
              """const LEVELS = Object.freeze([
            Object.freeze({ levelId: 'O4', refinement: 16 }),
            Object.freeze({ levelId: 'O5', refinement: 32 }),
          ]);""",
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('ORACLE_TARGET_LEVEL_PATCH_FAILED')

          add_new = dedent("""
            const addEdge = (edge, tractionAt, parameterRange = [0, 1]) => {
              const nodes = edge.nodeIds.map((id) => nodeById.get(id));
              const [q0, q1] = parameterRange;
              const half = (q1 - q0) / 2;
              const middle = (q1 + q0) / 2;
              GL4.forEach((gauss) => {
                const q = middle + half * gauss.value;
                const N = [1 - q, q];
                const r = N[0] * nodes[0].r + N[1] * nodes[1].r;
                const z = N[0] * nodes[0].z + N[1] * nodes[1].z;
                const jacobian = Math.hypot(
                  nodes[1].r - nodes[0].r,
                  nodes[1].z - nodes[0].z,
                ) * half;
                const traction = tractionAt(r, z);
                const factor = gauss.weight * 2 * Math.PI * r * jacobian;
                for (let index = 0; index < 2; index += 1) {
                  const node = nodeIndex.get(nodes[index].id);
                  force[2 * node] += N[index] * traction[0] * factor;
                  force[2 * node + 1] += N[index] * traction[1] * factor;
                }
                radial += traction[0] * factor;
                axial += traction[1] * factor;
              });
            };
            const clippedRadialRange = (edge, minimum, maximum) => {
              const nodes = edge.nodeIds.map((id) => nodeById.get(id));
              const first = nodes[0].r;
              const second = nodes[1].r;
              const delta = second - first;
              if (Math.abs(delta) <= 1e-15) return null;
              const lower = Math.max(0, Math.min(1, (minimum - first) / delta));
              const upper = Math.max(0, Math.min(1, (maximum - first) / delta));
              const q0 = Math.min(lower, upper);
              const q1 = Math.max(lower, upper);
              const edgeMinimum = Math.min(first, second);
              const edgeMaximum = Math.max(first, second);
              if (edgeMaximum <= minimum || edgeMinimum >= maximum
                || q1 - q0 <= 1e-15) {
                return null;
              }
              return [q0, q1];
            };
          """).strip('\n')
          source, count = re.subn(
              r"  const addEdge = \(edge, tractionAt\) => \{.*?\n"
              r"  \};\n"
              r"  if \(load\.id === 'FH-PRES-001'\) \{",
              add_new + "\n  if (load.id === 'FH-PRES-001') {",
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('ORACLE_ADD_EDGE_PATCH_FAILED')

          gasket_new = dedent("""
            } else {
              mesh.boundaries.filter((edge) => edge.type === 'FACE')
                .forEach((edge) => {
                  const range = clippedRadialRange(edge, 65, 95);
                  if (range) addEdge(edge, () => [0, -20], range);
                });
            }
          """).strip('\n')
          source, count = re.subn(
              r"  \} else \{\s*"
              r"mesh\.boundaries\s*"
              r"\.filter\(\(edge\) => edge\.type === 'FACE'\s*"
              r"&& edgeRange\(edge, nodeById, 65, 95\)\)\s*"
              r"\.forEach\(\(edge\) => addEdge\(edge, \(\) => \[0, -20\]\)\);\s*"
              r"\}",
              gasket_new,
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('ORACLE_GASKET_CLIPPING_PATCH_FAILED')

          path.write_text(source)
          PY
          node --check src/core/bucket-b/flange-hub-independent-oracle.js

      - name: Execute selected O4-O5 tail
        shell: bash
        env:
          LOAD_CASE_ID: ${{ matrix.load_case }}
        run: |
          set -euo pipefail
          mkdir -p reports
          timeout --signal=TERM --kill-after=60s 45m node --input-type=module <<'NODE' > "reports/${LOAD_CASE_ID}.json"
          import { runIndependentFlangeHubOracle } from './src/core/bucket-b/flange-hub-independent-oracle.js';
          const report = runIndependentFlangeHubOracle(process.env.LOAD_CASE_ID);
          process.stdout.write(JSON.stringify({
            loadCaseId: report.loadCaseId,
            status: report.status,
            convergence: report.convergence,
            levels: report.levels.map((level) => ({
              levelId: level.levelId,
              nodeCount: level.nodeCount,
              elementCount: level.elementCount,
              solver: level.solver,
              appliedResultants: level.appliedResultants,
              axialReaction: level.axialReaction,
              strainEnergy: level.strainEnergy,
              probes: level.probes,
            })),
          }, null, 2));
          NODE
          cat "reports/${LOAD_CASE_ID}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: bb11-oracle-tail-${{ matrix.load_case }}-${{ github.sha }}
          path: reports
          retention-days: 30
