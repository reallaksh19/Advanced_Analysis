name: Restore inline interior diagnostic contract

on:
  push:
    branches:
      - agent/valve-assembly-authoring

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/valve-assembly-authoring
          fetch-depth: 0

      - name: Restore stable fail-closed wording
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/workspace/topology-edit/topology-edit-inline-component-command.js')
          text = path.read_text(encoding='utf-8')
          old = "    fail(`inline ${payload.placement.toLowerCase()} placement does not fit the host edge.`, RangeError);"
          new = "\n".join([
              "    if (payload.placement === 'INTERIOR') {",
              "      fail('inline component must fit strictly inside the host edge for INTERIOR placement.', RangeError);",
              "    }",
              old,
          ])
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one placement diagnostic line, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check src/workspace/topology-edit/topology-edit-inline-component-command.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workspace/topology-edit/topology-edit-inline-component-command.js
          git commit -m 'Preserve inline interior fit diagnostic'
          git push origin HEAD:agent/valve-assembly-authoring
