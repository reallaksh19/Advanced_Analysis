name: Topology Edit Wave 5 Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-wave5.yml'
      - '.github/workflows/topology-edit-c3d-*.yml'
      - '.github/workflows/topology-edit-demo-walkthrough.yml'
      - 'docs/TOPOLOGY_EDIT_ORIGINAL_PLAN_CLOSURE_AUDIT.md'
      - 'e2e/topology-edit-20-element-demo-edit-flow.spec.js'
      - 'e2e/topology-edit-20-element-demo-repair-flow.spec.js'
      - 'public/fixtures/topology-edit-20-element-demo.staged.json'
      - 'scripts/1885s-empirical-qualification.mjs'
      - 'scripts/run-playwright.mjs'
      - 'scripts/topology-edit-original-plan-audit.mjs'
      - 'scripts/topology-edit-wave5-*.mjs'
      - 'scripts/topology-edit-write-wave5-evidence.mjs'
      - 'tests/topology-edit-20-element-demo-*.test.mjs'
      - 'tests/topology-edit-search-composition.test.mjs'
      - 'tests/topology-edit-wave*.mjs'
      - 'tests/topology-edit-c3d-*.test.mjs'
      - 'tests/topology-edit-track-c.test.mjs'
      - 'tests/topology-edit-wave5-browser-harness.js'
      - 'tests/fixtures/topology-edit/1885s/**'
      - 'src/workspace/load-calc-consumer-controller.js'
      - 'src/workspace/topology-edit-3d-*.js'
      - 'src/workspace/viewport-productivity/**'
      - 'src/workspace/viewport-presentation/**'
      - 'src/workspace/topology-edit/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-wave5-release:
    name: Exact-head integrated topology-edit release qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout and base ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          git merge-base --is-ancestor "${{ github.event.pull_request.base.sha || github.sha }}" HEAD

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Retain source, API, syntax, and import authority
        run: |
          npm run syntax:strict
          npm run check:imports
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs

      - name: Qualify Wave 5 contracts and portable fixtures
        run: |
          node --test \
            tests/topology-edit-track-c.test.mjs \
            tests/topology-edit-wave5.test.mjs \
            tests/topology-edit-wave5-track-b-closure.test.mjs
          node scripts/topology-edit-wave5-fixture-check.mjs

      - name: Run original Wave 1 through Wave 4 operation matrix
        run: >-
          node --test
          tests/topology-edit-20-element-demo-loader.test.mjs
          tests/topology-edit-20-element-demo-repairs.test.mjs
          tests/topology-edit-wave1-pure-kernel.test.mjs
          tests/topology-edit-wave1-candidate-certification.test.mjs
          tests/topology-edit-wave1-journal-replay.test.mjs
          tests/topology-edit-wave1-production-integration.test.mjs
          tests/topology-edit-dimension-authority.test.mjs
          tests/topology-edit-fitting-support-geometry.test.mjs
          tests/topology-edit-fitting-support-integration.test.mjs
          tests/topology-edit-wave3a-checker.test.mjs
          tests/topology-edit-wave3-commands.test.mjs
          tests/topology-edit-wave3-exact-gap-modes.test.mjs
          tests/topology-edit-wave3b-autofix.test.mjs
          tests/topology-edit-wave3c-autofix-ui.test.mjs
          tests/topology-edit-wave4a-persistence-export.test.mjs
          tests/topology-edit-wave4b-commit-rollback.test.mjs
          tests/topology-edit-wave4c-lifecycle-ui.test.mjs

      - name: Run complete additive C3D review matrix
        run: >-
          node --test
          tests/topology-edit-c3d-wave0.test.mjs
          tests/topology-edit-c3d-wave1-visibility.test.mjs
          tests/topology-edit-c3d-wave1-sectioning.test.mjs
          tests/topology-edit-c3d-wave2-search.test.mjs
          tests/topology-edit-search-composition.test.mjs
          tests/topology-edit-c3d-wave3-gpu-picking.test.mjs
          tests/topology-edit-c3d-wave3-review.test.mjs
          tests/topology-edit-c3d-wave4-issue-review.test.mjs
          tests/topology-edit-c3d-wave4-comparison.test.mjs
          tests/topology-edit-c3d-wave5-inspection-measurement.test.mjs
          tests/topology-edit-c3d-wave6-route-trace.test.mjs
          tests/topology-edit-c3d-wave7-review-dossier.test.mjs
          tests/topology-edit-c3d-wave8-dossier-intake.test.mjs
          tests/topology-edit-c3d-wave9-review-response.test.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Walk exact-gap user repairs
        run: node scripts/run-playwright.mjs e2e/topology-edit-20-element-demo-edit-flow.spec.js

      - name: Walk bridge and trim user repairs
        run: node scripts/run-playwright.mjs e2e/topology-edit-20-element-demo-repair-flow.spec.js

      - name: Measure exact-head browser performance and lifecycle
        run: node --test tests/topology-edit-wave5-browser.spec.mjs

      - name: Verify development and production startup
        run: node --test tests/production-startup.spec.mjs

      - name: Verify production bundle
        run: npm run build

      - name: Audit original W0.1 through W5.5 closure
        env:
          TOPOLOGY_EDIT_WAVE5_EXACT_HEAD_STATUS: PASS
        run: node scripts/topology-edit-original-plan-audit.mjs

      - name: Write exact-head PASS_RELEASE evidence
        env:
          TOPOLOGY_EDIT_WAVE5_OPERATIONS_STATUS: PASS
          TOPOLOGY_EDIT_WAVE5_DRIFT_STATUS: PASS
        run: node scripts/topology-edit-write-wave5-evidence.mjs

      - name: Verify patch hygiene
        run: |
          git diff --check "${{ github.event.pull_request.base.sha || github.sha }}...HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload Wave 5 evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-wave5-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: |
            reports/qualification/topology-edit-demo-walkthrough.json
            reports/qualification/topology-edit-demo-repairs.json
            reports/qualification/topology-edit-original-plan-audit.json
            reports/qualification/topology-edit-wave5-browser.json
            reports/qualification/topology-edit-wave5-fixtures.json
            reports/qualification/topology-edit-wave5-evidence.json
            test-results/**
          if-no-files-found: error
          retention-days: 30
