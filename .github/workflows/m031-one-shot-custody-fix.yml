name: M031 One-Shot Custody Assertion Fix

on:
  push:
    branches:
      - agent/m031-bm2-strict-gaps
    paths:
      - '.github/workflows/m031-one-shot-custody-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/m031-bm2-strict-gaps
          fetch-depth: 0

      - name: Correct scalar-row custody assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/lfea-bm2-consolidated-latest-output-check.mjs')
          text = path.read_text(encoding='utf-8')
          old = "section[family].rows.length * (family === 'globalForce' || family === 'localForce' ? 12 : 6),"
          new = "section[family].rows.length,"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one custody assertion occurrence, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          node --check scripts/lfea-bm2-consolidated-latest-output-check.mjs
          git diff --check

      - name: Commit correction to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/lfea-bm2-consolidated-latest-output-check.mjs
          git commit -m 'M031: correct retained scalar custody assertion'
          git push origin HEAD:agent/m031-bm2-strict-gaps
