name: 3D Edit Governed Object Tree

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-governed-object-tree.yml'
      - 'src/workspace/topology-edit-3d-professional-controller.js'
      - 'src/workspace/viewport-productivity/topology-edit-object-tree-model.js'
      - 'src/workspace/viewport-productivity/topology-edit-object-tree-runtime.js'
      - 'src/workspace/viewport-productivity/topology-edit-object-tree-styles.js'
      - 'tests/topology-edit-object-tree-model.test.mjs'
      - 'e2e/topology-edit-governed-object-tree.spec.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-edit-governed-object-tree-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  governed-object-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSER_CHANNEL: chromium

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          node --check src/workspace/topology-edit-3d-professional-controller.js
          node --check src/workspace/viewport-productivity/topology-edit-object-tree-model.js
          node --check src/workspace/viewport-productivity/topology-edit-object-tree-runtime.js
          node --check src/workspace/viewport-productivity/topology-edit-object-tree-styles.js
          node --check tests/topology-edit-object-tree-model.test.mjs
          node --check e2e/topology-edit-governed-object-tree.spec.js
          git diff --check

      - name: Execute canonical tree contracts
        run: |
          node --test --test-reporter=tap \
            tests/topology-edit-object-tree-model.test.mjs \
            tests/topology-edit-editor-selection-state.test.mjs \
            tests/topology-edit-editor-selection-coordinator.test.mjs

      - name: Execute mounted Chromium tree qualification
        run: |
          npx playwright test \
            e2e/topology-edit-governed-object-tree.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-governed-object-tree-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
