name: Branch Authoring Bootstrap

on:
  push:
    branches:
      - agent/tee-olet-branch-authoring
    paths:
      - '.github/workflows/branch-authoring-bootstrap.yml'
      - '.github/scripts/branch-authoring-bootstrap.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tee-olet-branch-authoring
          fetch-depth: 0
      - name: Apply E2E assertion correction
        run: |
          set -euo pipefail
          python .github/scripts/branch-authoring-bootstrap.py
          git diff --check
      - name: Commit E2E assertion correction
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/topology-edit-branch-authoring.spec.js
          git commit -m "Align branch browser hash assertion"
          git push origin HEAD:agent/tee-olet-branch-authoring
