name: Branch Authoring Bootstrap

on:
  push:
    branches:
      - agent/tee-olet-branch-authoring
    paths:
      - '.github/workflows/branch-authoring-bootstrap.yml'
      - '.github/scripts/branch-authoring-bootstrap.py'

permissions:
  contents: write

concurrency:
  group: branch-authoring-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/tee-olet-branch-authoring
          fetch-depth: 0
      - name: Apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .github/scripts/branch-authoring-bootstrap.py ]]; then
            echo 'No bootstrap script present.'
            exit 0
          fi
          python .github/scripts/branch-authoring-bootstrap.py
          git diff --check
      - name: Commit staged source patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Integrate governed branch component kernel"
          git push origin HEAD:agent/tee-olet-branch-authoring
