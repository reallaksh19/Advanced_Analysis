name: lfea-linear-core-exact-head

on:
  pull_request:
    paths:
      - 'package.json'
      - 'src/core/centerline-beam-fea/**'
      - 'src/core/linear-fea-*/**'
      - 'src/core/linear-piping-analysis-consumer/**'
      - 'scripts/lfea-b1-conditioning-check.mjs'
      - 'scripts/lfea-linear-core-exact-head-evidence.mjs'
      - 'scripts/linear-piping-inputxml-unit-normalization-check.mjs'
      - 'scripts/lfea-unilateral-*.mjs'
      - 'scripts/lfea-m036-*.mjs'
      - '.github/workflows/lfea-linear-core-exact-head.yml'

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove exact-head execution
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code

      - name: Enforce changed-path containment
        shell: bash
        run: |
          merge_base="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          git diff --name-only "$merge_base" "${{ github.event.pull_request.head.sha }}" > /tmp/lfea-linear-core-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              package.json|src/core/centerline-beam-fea/*|src/core/linear-fea-*/*|src/core/linear-piping-analysis-consumer/*|scripts/lfea-b1-conditioning-check.mjs|scripts/lfea-linear-core-exact-head-evidence.mjs|scripts/linear-piping-inputxml-unit-normalization-check.mjs|scripts/lfea-unilateral-*.mjs|scripts/lfea-m036-*.mjs|.github/workflows/lfea-linear-core-exact-head.yml) ;;
              *) echo "Forbidden changed path for the linear-core qualification slice: $changed"; exit 1 ;;
            esac
          done < /tmp/lfea-linear-core-paths.txt

      - name: InputXML unit normalization with base comparison
        shell: bash
        run: |
          mkdir -p artifacts/lfea-linear-core-exact-head
          set +e
          node scripts/linear-piping-inputxml-unit-normalization-check.mjs > artifacts/lfea-linear-core-exact-head/unit-head.log 2>&1
          head_status=$?
          git worktree add --detach /tmp/lfea-pr-base "${{ github.event.pull_request.base.sha }}" >/dev/null 2>&1
          (cd /tmp/lfea-pr-base && node scripts/linear-piping-inputxml-unit-normalization-check.mjs) > artifacts/lfea-linear-core-exact-head/unit-base.log 2>&1
          base_status=$?
          set -e
          echo "HEAD unit-normalization exit: $head_status"
          cat artifacts/lfea-linear-core-exact-head/unit-head.log
          echo "BASE unit-normalization exit: $base_status"
          cat artifacts/lfea-linear-core-exact-head/unit-base.log
          echo "head_status=$head_status base_status=$base_status" > artifacts/lfea-linear-core-exact-head/unit-status.txt
          if [ "$head_status" -ne 0 ]; then
            message="HEAD=$head_status BASE=$base_status $(tail -n 50 artifacts/lfea-linear-core-exact-head/unit-head.log | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error file=scripts/linear-piping-inputxml-unit-normalization-check.mjs::$message"
            exit "$head_status"
          fi

      - name: Conditioned topology and retained-station custody
        run: node scripts/lfea-b1-conditioning-check.mjs

      - name: DOF conventions and mechanical-model compilation
        run: npm run check:lfea-b2.0 && npm run check:lfea-b2.5

      - name: Physical load cases and element formulations
        run: npm run check:lfea-b3.0 && npm run check:lfea-b3.1 && npm run check:lfea-b3.2

      - name: Assembly, sparse solve, residuals and equilibrium
        run: npm run check:lfea-b3.3

      - name: Emit exact residual, equilibrium and station-custody evidence
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p artifacts/lfea-linear-core-exact-head
          set +e
          node scripts/lfea-linear-core-exact-head-evidence.mjs > artifacts/lfea-linear-core-exact-head/emitter.log 2>&1
          status=$?
          cat artifacts/lfea-linear-core-exact-head/emitter.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 40 artifacts/lfea-linear-core-exact-head/emitter.log | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error file=scripts/lfea-linear-core-exact-head-evidence.mjs::$message"
            exit "$status"
          fi

      - name: Element-end, nodal and code-station recovery
        run: npm run check:lfea-b3.4

      - name: Production linear piping consumer
        run: npm run check:linear-piping-analysis-consumer

      - name: Derived cases and B31 code evaluation
        run: npm run check:lfea-b4.0 && npm run check:lfea-b4.4 && npm run check:lfea-code-application

      - name: Fixed-input commercial benchmark regression
        run: npm run check:lfea-bm1-cii-comparison

      - name: Retain exact-head JSON and CSV evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfea-linear-core-exact-head-${{ github.event.pull_request.head.sha }}
          path: artifacts/lfea-linear-core-exact-head/*
          if-no-files-found: warn
          retention-days: 90

  m036:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove exact-head execution
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code

      - name: M036 anti-drift and boundary guard
        run: node scripts/lfea-unilateral-anti-drift-check.mjs

      - name: M036 closed-form sign and thermal qualification
        run: node scripts/lfea-unilateral-closed-form-check.mjs

      - name: M036 determinism and fail-closed qualification
        run: node scripts/lfea-unilateral-determinism-check.mjs

      - name: M036 BM4 lift-off qualification
        shell: bash
        run: |
          mkdir -p artifacts/lfea-m036
          set +e
          node scripts/lfea-m036-bm4-liftoff-check.mjs > artifacts/lfea-m036/bm4.log 2>&1
          status=$?
          cat artifacts/lfea-m036/bm4.log
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 80 artifacts/lfea-m036/bm4.log | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error file=scripts/lfea-m036-bm4-liftoff-check.mjs::$message"
            exit "$status"
          fi

      - name: Retain M036 benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfea-m036-${{ github.event.pull_request.head.sha }}
          path: artifacts/lfea-m036/*
          if-no-files-found: warn
          retention-days: 90
