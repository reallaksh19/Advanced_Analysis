name: M050 BM4 20295 Node Free Body

on:
  pull_request:
    paths:
      - 'scripts/lfea-m050-bm4-20295-node-free-body.mjs'
      - '.github/workflows/m050-bm4-20295-node-free-body.yml'
  workflow_dispatch:

jobs:
  node-free-body:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce evidence-only M050 diff
        run: |
          git fetch --no-tags --depth=1 origin 68d49eceb29d00adec3c5a6fbf39adda47b599e6
          git diff --name-only 68d49eceb29d00adec3c5a6fbf39adda47b599e6 HEAD | sort > /tmp/m050-paths
          printf '%s\n' \
            .github/workflows/m050-bm4-20295-node-free-body.yml \
            scripts/lfea-m050-bm4-20295-node-free-body.mjs | sort > /tmp/m050-allowed
          diff -u /tmp/m050-allowed /tmp/m050-paths
      - name: Syntax-check M050
        run: node --check scripts/lfea-m050-bm4-20295-node-free-body.mjs
      - name: Run M050 complete node free body
        run: node scripts/lfea-m050-bm4-20295-node-free-body.mjs --report /tmp/m050/lfea-m050-bm4-20295-node-free-body.json
      - name: Preserve M049 through M042 Level-1 boundaries
        run: |
          node scripts/lfea-m049-bm4-upstream-discrepancy-provenance.mjs
          node scripts/lfea-m048-bm4-upstream-bend-transport.mjs
          node scripts/lfea-m047-bm4-bend-station-authority.mjs
          node scripts/lfea-m046-bm4-20340-boundary-authority.mjs
          node scripts/lfea-m045-bm4-axial-discrepancy-transport.mjs
          node scripts/lfea-m044-bm4-axial-end-force-equilibrium.mjs
          node scripts/lfea-m042-bm4-first-divergence-rca.mjs
      - name: Preserve M041/M040 friction fail-closed boundary
        run: |
          node scripts/lfea-m041-contact-friction-check.mjs
          node scripts/lfea-m041-linear-kernel-bridge-check.mjs
          node scripts/lfea-m041-bm4-activation-gate.mjs
          node scripts/lfea-m040-bm4-friction-check.mjs
      - name: Enforce bounded M050 script
        run: |
          lines=$(wc -l < scripts/lfea-m050-bm4-20295-node-free-body.mjs)
          test "$lines" -le 340 || { echo "M050 has $lines lines (>340)"; exit 1; }
      - name: Upload deterministic M050 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m050-bm4-20295-free-body-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/m050/lfea-m050-bm4-20295-node-free-body.json
          if-no-files-found: error
      - name: Verify clean worktree
        run: git diff --exit-code && git status --porcelain | tee /tmp/m050-status && test ! -s /tmp/m050-status
