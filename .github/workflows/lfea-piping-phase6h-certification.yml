name: LFEA Piping Phase 6H Certification

on:
  pull_request:
    paths:
      - 'src/core/linear-piping-project-qualification/external-evidence-handoff.js'
      - 'src/core/linear-piping-project-qualification/index.js'
      - 'scripts/lfea-piping-phase6i-external-handoff-validator.mjs'
      - 'scripts/lfea-piping-phase6i-external-handoff-validator-check.mjs'
      - 'scripts/lfea-piping-external-evidence-materializer.mjs'
      - 'scripts/lfea-piping-external-evidence-materializer-check.mjs'
      - 'scripts/lfea-piping-phase6h-anti-drift-check.mjs'
      - 'scripts/linear-piping-project-qualification-anti-drift-check.mjs'
      - 'scripts/lfea-piping-release-readiness-check.mjs'
      - 'docs/LFEA_PIPING_PHASE6H_EXTERNAL_EVIDENCE_MATERIALIZATION.md'
      - 'docs/LFEA_PIPING_PHASE_STATUS.md'
      - 'reports/lfea-piping-phase6h-external-evidence-materialization.json'
      - '.github/workflows/lfea-piping-external-evidence-materialization.yml'
      - '.github/workflows/lfea-piping-phase6h-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lfea-piping-phase6h-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-external-evidence-materialization:
    name: Certify external evidence materializer
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate external evidence materializer
        run: node scripts/lfea-piping-external-evidence-materializer-check.mjs

      - name: Validate Phase 6H containment
        run: node scripts/lfea-piping-phase6h-anti-drift-check.mjs

      - name: Run blocked policy path
        run: npm run check:lfea-piping-release-policy

      - name: Validate phase-to-finding ledger
        run: node scripts/lfea-piping-phase-findings-check.mjs

      - name: Run full repository gate
        run: npm run gate

      - name: Verify clean exact-head checkout
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short)"
