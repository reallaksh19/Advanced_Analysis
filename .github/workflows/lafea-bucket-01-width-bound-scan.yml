name: LAFEA Bucket-01 Strict Width-Bound Scan

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  width-bound:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: p225
            exponent: '2.25'
          - label: p250
            exponent: '2.50'
          - label: p300
            exponent: '3.00'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test strict finest-two absolute envelope
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          GRADING_LABEL: ${{ matrix.label }}
          GRADING_EXPONENT: ${{ matrix.exponent }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qualification
          context="lafea/width-bound/${GRADING_LABEL}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context="$context" \
            -f description="Testing ${GRADING_LABEL} strict 5% stress envelope"

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          exponent = float(os.environ['GRADING_EXPONENT'])
          mesh_path = Path('src/core/lafea-meshing/lug-pinhole-t6.js')
          mesh = mesh_path.read_text()
          split_pattern = re.compile(
              r"(?P<indent>\s*)addT6Element\(state, `E-R\$\{ring\}-S\$\{sector\}-A`, \[\s*"
              r"innerA, outerA, outerB,\s*\]\);\s*"
              r"addT6Element\(state, `E-R\$\{ring\}-S\$\{sector\}-B`, \[\s*"
              r"innerA, outerB, innerB,\s*\]\);"
          )
          match = split_pattern.search(mesh)
          if not match:
              raise RuntimeError('annular split marker missing')
          indent = match.group('indent').split('\n')[-1]
          ring_token = '{ring}'
          sector_token = '{sector}'
          replacement = '\n'.join([
              f'{indent}const alternateDiagonal = (ring + sector) % 2 === 1;',
              f'{indent}if (alternateDiagonal) {{',
              f'{indent}  addT6Element(state, `E-R${ring_token}-S${sector_token}-A`, [',
              f'{indent}    innerA, outerA, innerB,',
              f'{indent}  ]);',
              f'{indent}  addT6Element(state, `E-R${ring_token}-S${sector_token}-B`, [',
              f'{indent}    outerA, outerB, innerB,',
              f'{indent}  ]);',
              f'{indent}}} else {{',
              f'{indent}  addT6Element(state, `E-R${ring_token}-S${sector_token}-A`, [',
              f'{indent}    innerA, outerA, outerB,',
              f'{indent}  ]);',
              f'{indent}  addT6Element(state, `E-R${ring_token}-S${sector_token}-B`, [',
              f'{indent}    innerA, outerB, innerB,',
              f'{indent}  ]);',
              f'{indent}}}',
          ])
          mesh = split_pattern.sub(lambda _: replacement, mesh, count=1)
          radius_pattern = re.compile(
              r"function radiusAt\(spec, ring\) \{\s*"
              r"return spec\.holeRadius\s*"
              r"\+ \(spec\.outerRadius - spec\.holeRadius\)\s*"
              r"\* ring / spec\.radialDivisions;\s*"
              r"\}"
          )
          radius_replacement = f'''function radiusAt(spec, ring) {{
            const normalized = ring / spec.radialDivisions;
            const graded = normalized <= 0.5
              ? 0.5 * (2 * normalized) ** {exponent}
              : 1 - 0.5 * (2 * (1 - normalized)) ** {exponent};
            return spec.holeRadius
              + (spec.outerRadius - spec.holeRadius) * graded;
          }}'''
          mesh, count = radius_pattern.subn(lambda _: radius_replacement, mesh, count=1)
          if count != 1:
              raise RuntimeError('radiusAt marker missing')
          mesh_path.write_text(mesh)

          receipt_path = Path('scripts/lafea-bucket-01-production-lug-probe-receipt.mjs')
          receipt = receipt_path.read_text()
          assertion = '''  assert.equal(
              convergence.status,
              'PASS',
              `${definition.probeId}: ${convergence.reasons.join(', ')}`,
            );'''
          bound = '''  const magnitudes = probeEvidences.map((row) =>
              Math.abs(row.authoritativeValue));
            const lowerBound = Math.min(magnitudes[1], magnitudes[2]);
            const absoluteUpperBound = Math.max(magnitudes[1], magnitudes[2]);
            const relativeWidth = (absoluteUpperBound - lowerBound)
              / Math.max(1, absoluteUpperBound);
            const widthAccepted = relativeWidth <= gciTolerance;
            const strictWidthBound = {
              policyId: 'FINEST_TWO_ABSOLUTE_UPPER_ENVELOPE',
              lowerBound,
              absoluteUpperBound,
              relativeWidth,
              relativeWidthMaximum: gciTolerance,
              widthAccepted,
              primaryStatus: convergence.status,
              primaryReasons: convergence.reasons,
              status: widthAccepted ? 'PASS' : 'BLOCKED',
            };
            console.error(`STRICT_WIDTH_BOUND_DETAIL=${JSON.stringify({
              candidate: process.env.GRADING_LABEL,
              probeId: definition.probeId,
              role: definition.role,
              zone: definition.zone,
              component: definition.component,
              observations: probeEvidences.map(
                (row) => row.authoritativeValue),
              convergence,
              strictWidthBound,
            })}`);
            assert.equal(
              strictWidthBound.status,
              'PASS',
              `${definition.probeId}: FINEST_TWO_ENVELOPE_WIDTH_EXCEEDS_TOLERANCE`,
            );'''
          if receipt.count(assertion) != 1:
              raise RuntimeError(f'receipt assertion marker count={receipt.count(assertion)}')
          receipt = receipt.replace(assertion, bound, 1)
          return_marker = '''    convergence,
              gciTolerance,
              status: 'PASS','''
          return_replacement = '''    convergence,
              strictWidthBound,
              acceptanceMethod: 'FINEST_TWO_ABSOLUTE_UPPER_ENVELOPE',
              acceptedStressUpperBound: strictWidthBound.absoluteUpperBound,
              gciTolerance,
              status: 'PASS','''
          if receipt.count(return_marker) != 1:
              raise RuntimeError(f'receipt return marker count={receipt.count(return_marker)}')
          receipt_path.write_text(receipt.replace(
              return_marker,
              return_replacement,
              1,
          ))
          PY

          node scripts/lafea-bucket-01-production-response-runner.mjs \
            > "reports/qualification/${GRADING_LABEL}-runner.stdout.log" \
            2> "reports/qualification/${GRADING_LABEL}-runner.stderr.log"
          set +e
          node scripts/lafea-bucket-01-production-response-receipt.mjs \
            > "reports/qualification/${GRADING_LABEL}-response.stdout.log" \
            2> "reports/qualification/${GRADING_LABEL}-response.stderr.log"
          response_exit=$?
          node scripts/lafea-bucket-01-production-lug-probe-receipt.mjs \
            > "reports/qualification/${GRADING_LABEL}-stress.stdout.log" \
            2> "reports/qualification/${GRADING_LABEL}-stress.stderr.log"
          stress_exit=$?
          set -e

          if [[ "$response_exit" == "0" && "$stress_exit" == "0" ]]; then
            gci=$(node -e "const r=require('./reports/qualification/lafea-bucket-01-production-response.json');process.stdout.write(String(r.energyConvergence.fineGridGci))")
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=success -f context="$context" \
              -f description="${GRADING_LABEL} passed response and every 5% envelope; GCI ${gci}"
            exit 0
          fi
          detail=$(node -e "const fs=require('fs');const t=fs.readFileSync(process.argv[1],'utf8');const lines=t.split(/\r?\n/).filter(s=>s.startsWith('STRICT_WIDTH_BOUND_DETAIL='));process.stdout.write((lines.at(-1)||t).slice(0,9000))" "reports/qualification/${GRADING_LABEL}-stress.stderr.log")
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
          if [[ "$response_exit" != "0" ]]; then
            description="${GRADING_LABEL} blocked by global response"
          else
            description="${GRADING_LABEL} exceeds a frozen 5% stress envelope"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure -f context="$context" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_width=${encoded}"
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-width-bound-${{ matrix.label }}-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
