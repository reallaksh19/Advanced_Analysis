name: wp3-qualification-fix-patch

on:
  push:
    branches:
      - agent/empirical-load-calc-configuration-wp3
    paths:
      - 'scripts/wp3-qualification-fix-patch.mjs'
      - '.github/workflows/wp3-qualification-fix-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/empirical-load-calc-configuration-wp3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/wp3-qualification-fix-patch.mjs
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/empirical-load-calc-scenario-check.mjs src/workspace/engineering-loads/empirical-load-calc-scenario-controller.js src/workspace/engineering-loads/empirical-load-calc-scenario-store.js
          git diff --cached --quiet && exit 0
          git commit -m 'Fix WP3 qualification harness and refresh guards'
          git push origin HEAD:agent/empirical-load-calc-configuration-wp3
