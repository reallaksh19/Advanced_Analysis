name: LAFEA Bucket-01 Direct Point Recovery

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  direct-point:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute four-level solve and direct point recovery
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qualification
          context=lafea/direct-point-recovery
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context="$context" \
            -f description="Executing direct T6 fixed-coordinate recovery"
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/lafea-bucket-01-uniform-4096-v2.yml')
          lines = workflow.read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          source = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start + 1:end])
          exec(compile(source, str(workflow), 'exec'))
          PY
          node scripts/lafea-bucket-01-production-response-runner.mjs \
            > reports/qualification/direct-point-runner.stdout.log \
            2> reports/qualification/direct-point-runner.stderr.log
          set +e
          node scripts/lafea-bucket-01-direct-point-recovery-diagnostic.mjs \
            > reports/qualification/direct-point.stdout.log \
            2> reports/qualification/direct-point.stderr.log
          exit_code=$?
          set -e
          detail=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p = 'reports/qualification/lafea-bucket-01-direct-point-recovery.json';
          const report = fs.existsSync(p) ? JSON.parse(fs.readFileSync(p, 'utf8')) : null;
          const compact = report ? {
            status: report.status,
            blockedLocationIds: report.blockedLocationIds,
            receipts: report.receipts.map((row) => ({
              probeId: row.probeId,
              zone: row.zone,
              observations: row.observations,
              primaryStatus: row.convergence.status,
              primaryReasons: row.convergence.reasons,
              fineGridGci: row.convergence.fineGridGci,
              envelopeStatus: row.conservativeEnvelope.status,
              relativeWidth: row.conservativeEnvelope.relativeWidth,
              relativeWidthMaximum: row.conservativeEnvelope.relativeWidthMaximum,
              fineExcursionReduced: row.conservativeEnvelope.fineExcursionReduced,
              status: row.status,
            })),
          } : {
            status: 'REPORT_MISSING',
            stderr: fs.readFileSync('reports/qualification/direct-point.stderr.log', 'utf8').slice(-5000),
          };
          process.stdout.write(JSON.stringify(compact));
          NODE
          )
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1].slice(0,7500)))" "$detail")
          if [[ "$exit_code" == "0" ]]; then
            state=success
            description="Direct T6 point recovery passed all frozen locations"
          else
            state=failure
            description="Direct T6 point recovery blocked; inspect metrics"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="$context" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_direct=${encoded}"
          exit "$exit_code"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-direct-point-recovery-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
