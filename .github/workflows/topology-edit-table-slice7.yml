name: Topology Edit Table Slice 7

on:
  push:
    paths:
      - 'public/fixtures/topology-edit-table-q3-exact.staged.json'
      - 'tests/topology-edit-table-q3-fixture.test.mjs'
      - 'tests/topology-edit-table-q3-source-capability.test.mjs'
      - 'e2e/topology-edit-table-q3-concurrency.spec.js'
      - '.github/workflows/topology-edit-table-slice7.yml'
  pull_request:
    paths:
      - 'public/fixtures/topology-edit-table-q3-exact.staged.json'
      - 'tests/topology-edit-table-q3-fixture.test.mjs'
      - 'tests/topology-edit-table-q3-source-capability.test.mjs'
      - 'e2e/topology-edit-table-q3-concurrency.spec.js'
      - 'src/workspace/topology-edit/table/**'
      - 'src/workspace/viewport-productivity/topology-edit-table-*.js'
      - '.github/workflows/topology-edit-table-slice7.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-q3-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact HEAD line and architecture guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          files=(
            tests/topology-edit-table-q3-fixture.test.mjs
            tests/topology-edit-table-q3-source-capability.test.mjs
            e2e/topology-edit-table-q3-concurrency.spec.js
          )
          for file in "${files[@]}"; do
            test "$(git show "HEAD:$file" | wc -l)" -lt 300
            node --check "$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('public/fixtures/topology-edit-table-q3-exact.staged.json','utf8'))"
          ! grep -REn 'WorkspaceState|loadDataset\(|swapDataset\(|session\.execute\(|new (WebGLRenderer|TopologyEditViewportBackend)' \
            tests/topology-edit-table-q3-fixture.test.mjs \
            tests/topology-edit-table-q3-source-capability.test.mjs \
            e2e/topology-edit-table-q3-concurrency.spec.js
          ! grep -REn 'proximity|nearest|distance.*identity|geometry.*identity|last[-_ ]write[-_ ]wins' \
            tests/topology-edit-table-q3-fixture.test.mjs \
            tests/topology-edit-table-q3-source-capability.test.mjs \
            e2e/topology-edit-table-q3-concurrency.spec.js
          git diff --check
      - name: Source-shaped Q3 fixture and export capability contracts
        run: |
          node --test tests/topology-edit-table-q3-fixture.test.mjs
          node --test tests/topology-edit-table-q3-source-capability.test.mjs
      - name: Retained stale custody and Q3 atomic contracts
        run: |
          node --test tests/topology-edit-table-rebase.test.mjs
          node --test tests/topology-edit-table-m04-m06-m10.test.mjs
          node --test tests/topology-edit-table-transaction.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Bundle ownership contract
        run: node scripts/bundle-chunk-ownership-check.mjs
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production Q3 and R42 R43 Chromium qualification
        run: npx playwright test e2e/topology-edit-table-q3-concurrency.spec.js --project=chromium --workers=1 --retries=0 --reporter=line
      - name: Retained production Table Chromium lifecycle
        run: npx playwright test e2e/topology-edit-table-authority.spec.js --project=chromium --workers=1 --retries=0 --reporter=line
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-table-slice7-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: |
            reports/qualification/topology-edit-table-authority.json
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
