name: Model Load Zone Selector

on:
  pull_request:
    paths:
      - '.github/workflows/model-zone-selector.yml'
      - 'src/workspace/model-zone-selector.js'
      - 'src/workspace/tree-panel.js'
      - 'src/workspace/tree-panel-events.js'
      - 'src/workspace/viewport-panel.js'
      - 'tests/model-zone-selector.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zone-selector:
    name: Source-backed model zone selection
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Syntax and focused contracts
        run: |
          node --check src/workspace/model-zone-selector.js
          node --check src/workspace/tree-panel.js
          node --check src/workspace/tree-panel-events.js
          node --check src/workspace/viewport-panel.js
          node --test tests/model-zone-selector.test.mjs

      - name: Retain workspace import and viewport contracts
        run: |
          node scripts/phase2-workspace-contract-check.mjs
          node scripts/phase4-viewport-picking-contract-check.mjs
          node scripts/w10-staged-model-support-load-contract-check.mjs

      - name: Enforce bounded modules and display-only authority
        run: |
          test "$(wc -l < src/workspace/model-zone-selector.js)" -le 300
          test "$(wc -l < src/workspace/tree-panel.js)" -le 300
          test "$(wc -l < src/workspace/tree-panel-events.js)" -le 300
          test "$(wc -l < src/workspace/viewport-panel.js)" -le 300
          ! grep -E "WorkspaceState\.(loadDataset|clearDataset)|rebuildWorkspaceDataset" src/workspace/model-zone-selector.js
          ! grep -R "export default" src/workspace/model-zone-selector.js src/workspace/tree-panel.js src/workspace/tree-panel-events.js src/workspace/viewport-panel.js

      - name: Production build
        run: npm run build

      - name: Patch hygiene
        run: git diff --check HEAD^
