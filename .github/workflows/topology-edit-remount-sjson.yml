name: 3D Edit SJSON Remount

# Exact-head browser qualification for the production upload/remount lifecycle.
on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-remount-sjson.yml'
      - 'src/workspace/load-calc-consumer-controller.js'
      - 'src/workspace/tree-panel-events.js'
      - 'src/workspace/topology-edit-3d-professional-controller.js'
      - 'src/workspace/topology-edit-3d-sjson-fidelity-controller.js'
      - 'src/workspace/topology-edit/topology-edit-sjson-visual-authority.js'
      - 'src/workspace/topology-edit/topology-edit-sjson-tee-projection.js'
      - 'src/workspace/topology-edit/topology-edit-sjson-point-component-projection.js'
      - 'src/workspace/topology-edit/topology-edit-sjson-parent-branch-diameter.js'
      - 'src/workspace/topology-edit-clean.css'
      - 'e2e/topology-edit-remount-sjson.spec.js'
      - 'e2e/topology-edit-sjson-render-authority.spec.js'
      - 'e2e/topology-edit-clean-layout.spec.js'
      - 'public/Sjson.json'
      - 'public/fixtures/topology-edit-20-element-demo.staged.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-edit-remount-sjson-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-sjson-remount:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSER_CHANNEL: chromium

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify exact source contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          node --check src/workspace/load-calc-consumer-controller.js
          node --check src/workspace/topology-edit-3d-sjson-fidelity-controller.js
          node --check src/workspace/topology-edit/topology-edit-sjson-visual-authority.js
          node --check src/workspace/topology-edit/topology-edit-sjson-tee-projection.js
          node --check src/workspace/topology-edit/topology-edit-sjson-point-component-projection.js
          node --check src/workspace/topology-edit/topology-edit-sjson-parent-branch-diameter.js
          node --check src/workspace/tree-panel-events.js
          node --check e2e/topology-edit-remount-sjson.spec.js
          node --check e2e/topology-edit-sjson-render-authority.spec.js
          git diff --check

      - name: Execute SJSON import and clean-shell remount qualification
        run: |
          npx playwright test \
            e2e/topology-edit-remount-sjson.spec.js \
            e2e/topology-edit-sjson-render-authority.spec.js \
            e2e/topology-edit-clean-layout.spec.js \
            --project=chromium --workers=1 --retries=0 --trace=on --reporter=line

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-remount-sjson-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
