name: M036 branch validation

on:
  push:
    branches:
      - m036-r2-unilateral-contact
  pull_request:
    branches:
      - claude/lfea-linear-static-fea-unfwjd
  workflow_dispatch:

jobs:
  unilateral-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/lfea-unilateral-closed-form-check.mjs
      - run: node scripts/lfea-unilateral-determinism-check.mjs
      - name: BM4 lift-off validation
        shell: bash
        run: |
          set +e
          node scripts/lfea-m036-bm4-liftoff-check.mjs 2>&1 | tee bm4.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            message=$(grep -E 'AssertionError|Error:' bm4.log | tail -n 1 | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error::$message"
            exit "$code"
          fi
          summary=$(grep '^M036_SUMMARY=' bm4.log | tail -n 1 | sed 's/^M036_SUMMARY=//; s/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
          echo "::notice title=M036 BM4 evidence::$summary"
      - run: node scripts/lfea-unilateral-anti-drift-check.mjs
      - run: node scripts/syntax-check.mjs --strict
