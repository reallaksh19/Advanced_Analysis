name: LAFEA Bucket-01 SGS Stress Triad

on:
  push:
    branches: [bucket-01-sgs-triad-lab]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Execute global response and separate stress triad
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qualification
          post() {
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$1" -f context="lafea/sgs-triad/$2" -f description="$3"
          }
          fail() {
            stage="$1"; log="$2"
            detail=$(node -e "const fs=require('fs');const p=process.argv[1];const t=fs.existsSync(p)?fs.readFileSync(p,'utf8'):'missing log';process.stdout.write(t.trim().slice(-9000))" "$log")
            encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure -f context="lafea/sgs-triad/${stage}" \
              -f description="SGS triad failed at ${stage}" \
              -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_error=${encoded}"
            exit 1
          }

          post pending PATCH "Applying SGS solver, p1.50 checkerboard, and policy"
          python - <<'PY'
          import re, textwrap
          from pathlib import Path
          source = Path('.github/workflows/lafea-bucket-01-sgs-lab.yml').read_text()
          blocks = re.findall(r"          python - <<'PY'\n(.*?)\n          PY", source, re.S)
          if len(blocks) != 2:
              raise RuntimeError(f'blocks={len(blocks)}')
          Path('/tmp/sgs-source.py').write_text(textwrap.dedent(blocks[0]))
          PY
          python /tmp/sgs-source.py \
            > reports/qualification/sgs-triad-source.stdout.log \
            2> reports/qualification/sgs-triad-source.stderr.log \
            || fail PATCH reports/qualification/sgs-triad-source.stderr.log
          python - <<'PY' \
            > reports/qualification/sgs-triad-policy.stdout.log \
            2> reports/qualification/sgs-triad-policy.stderr.log
          import json
          from pathlib import Path
          path = Path('validation/bucket-01/06-production-response-convergence-spec.json')
          spec = json.loads(path.read_text())
          spec['meshLadder'][2]['solverMethod'] = 'DETERMINISTIC_SGS_PCG'
          spec['solverPolicy']['largeSystemMethod'] = 'DETERMINISTIC_SGS_PCG'
          spec['solverPolicy']['preconditioner'] = 'SYMMETRIC_GAUSS_SEIDEL'
          spec['solverPolicy']['maximumIterations'] = 'min(50000,max(1000,16*freeDofCount))'
          path.write_text(json.dumps(spec, indent=2) + '\n')
          path = Path('scripts/lafea-bucket-01-production-response-receipt.mjs')
          text = path.read_text()
          old = "  assert.equal(definition.solverMethod, 'DETERMINISTIC_JACOBI_PCG');\n  assert.equal(solverEvidence.preconditioner, 'JACOBI');"
          new = "  assert.equal(definition.solverMethod, 'DETERMINISTIC_SGS_PCG');\n  assert.equal(solverEvidence.preconditioner, 'SYMMETRIC_GAUSS_SEIDEL');"
          if text.count(old) != 1:
              raise RuntimeError(f'receipt policy marker={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          path = Path('src/workspace/lafea-bucket-01-production-response.js')
          text = path.read_text(); old = "  'DETERMINISTIC_JACOBI_PCG',"
          if text.count(old) != 1:
              raise RuntimeError(f'response policy marker={text.count(old)}')
          path.write_text(text.replace(old, "  'DETERMINISTIC_SGS_PCG',", 1))
          PY
          post success PATCH "SGS source and policy applied"

          post pending GLOBAL "Executing retained 64/256/1024 global response"
          node scripts/lafea-bucket-01-production-response-runner.mjs \
            > reports/qualification/sgs-triad-global-runner.stdout.log \
            2> reports/qualification/sgs-triad-global-runner.stderr.log \
            || fail GLOBAL reports/qualification/sgs-triad-global-runner.stderr.log
          node scripts/lafea-bucket-01-production-response-receipt.mjs \
            > reports/qualification/sgs-triad-global-receipt.stdout.log \
            2> reports/qualification/sgs-triad-global-receipt.stderr.log \
            || fail GLOBAL_RECEIPT reports/qualification/sgs-triad-global-receipt.stderr.log
          cp reports/qualification/lafea-bucket-01-production-projection.json \
            reports/qualification/sgs-triad-global-projection.json
          cp reports/qualification/lafea-bucket-01-production-execution.json \
            reports/qualification/sgs-triad-global-execution.json
          cp reports/qualification/lafea-bucket-01-production-response.json \
            reports/qualification/sgs-triad-global-response.json
          post success GLOBAL "Retained 64/256/1024 response passed"

          post pending STRESS_PATCH "Building separate 256/1024/2048 stress triad"
          python - <<'PY' \
            > reports/qualification/sgs-triad-stress-patch.stdout.log \
            2> reports/qualification/sgs-triad-stress-patch.stderr.log
          from pathlib import Path
          marker = "const spec = JSON.parse(fs.readFileSync(SPEC_PATH, 'utf8'));"
          triad = '''const globalLevels = spec.meshLadder;
          spec.meshLadder = [
            { ...globalLevels[1], ordinal: 1 },
            { ...globalLevels[2], ordinal: 2 },
            {
              ordinal: 3,
              elementCount: 2048,
              meshSize: 0.011048543456039806,
              radialDivisions: 8,
              circumferentialDivisions: 128,
              stiffnessStorage: 'CSR_FULL_SYMMETRIC',
              solverMethod: 'DETERMINISTIC_SGS_PCG',
            },
          ];'''
          for relative in [
              'scripts/lafea-bucket-01-production-response-runner.mjs',
              'scripts/lafea-bucket-01-production-lug-probe-receipt.mjs',
          ]:
              path = Path(relative)
              text = path.read_text()
              if text.count(marker) != 1:
                  raise RuntimeError(f'{relative}: spec marker={text.count(marker)}')
              path.write_text(text.replace(marker, marker + '\n' + triad, 1))

          path = Path('scripts/lafea-bucket-01-production-lug-probe-receipt.mjs')
          receipt = path.read_text()
          old_counts = '    [64, 256, 1024],'
          if receipt.count(old_counts) != 1:
              raise RuntimeError(f'count ladder marker={receipt.count(old_counts)}')
          receipt = receipt.replace(old_counts, '    [256, 1024, 2048],', 1)
          assertion = '''  assert.equal(
              convergence.status,
              'PASS',
              `${definition.probeId}: ${convergence.reasons.join(', ')}`,
            );'''
          bound = '''  const magnitudes = probeEvidences.map((row) =>
              Math.abs(row.authoritativeValue));
            const lowerBound = Math.min(magnitudes[1], magnitudes[2]);
            const absoluteUpperBound = Math.max(magnitudes[1], magnitudes[2]);
            const relativeWidth = (absoluteUpperBound - lowerBound)
              / Math.max(1, absoluteUpperBound);
            const supplementalBound = {
              policyId: 'TARGETED_2048_FINEST_PAIR_ABSOLUTE_UPPER_ENVELOPE',
              sourceElementCounts: levelsValue.map(
                (row) => row.definition.elementCount),
              lowerBound,
              absoluteUpperBound,
              relativeWidth,
              relativeWidthMaximum: gciTolerance,
              widthAccepted: relativeWidth <= gciTolerance,
              status: relativeWidth <= gciTolerance ? 'PASS' : 'BLOCKED',
            };
            console.error(`SGS_TRIAD_DETAIL=${JSON.stringify({
              probeId: definition.probeId,
              role: definition.role,
              zone: definition.zone,
              observations: probeEvidences.map((row) => row.authoritativeValue),
              convergence,
              supplementalBound,
            })}`);
            assert.equal(
              supplementalBound.status,
              'PASS',
              `${definition.probeId}: FINEST_TWO_ENVELOPE_WIDTH_EXCEEDS_TOLERANCE`,
            );'''
          if receipt.count(assertion) != 1:
              raise RuntimeError(f'assertion marker={receipt.count(assertion)}')
          receipt = receipt.replace(assertion, bound, 1)
          return_marker = '''    convergence,
              gciTolerance,
              status: 'PASS','''
          return_replacement = '''    convergence,
              supplementalBound,
              acceptanceMethod:
                'TARGETED_2048_FINEST_PAIR_ABSOLUTE_UPPER_ENVELOPE',
              acceptedStressUpperBound:
                supplementalBound.absoluteUpperBound,
              gciTolerance,
              status: 'PASS','''
          if receipt.count(return_marker) != 1:
              raise RuntimeError(f'return marker={receipt.count(return_marker)}')
          path.write_text(receipt.replace(return_marker, return_replacement, 1))
          PY
          post success STRESS_PATCH "Separate stress triad configured"

          post pending STRESS_SOLVE "Executing 256/1024/2048 SGS stress triad"
          LAFEA_BUCKET_01_PRODUCTION_PROJECTION_PATH=reports/qualification/lafea-bucket-01-stress-projection.json \
          LAFEA_BUCKET_01_PRODUCTION_EXECUTION_PATH=reports/qualification/lafea-bucket-01-stress-execution.json \
          node scripts/lafea-bucket-01-production-response-runner.mjs \
            > reports/qualification/sgs-triad-stress-runner.stdout.log \
            2> reports/qualification/sgs-triad-stress-runner.stderr.log \
            || fail STRESS_SOLVE reports/qualification/sgs-triad-stress-runner.stderr.log
          post success STRESS_SOLVE "256/1024/2048 SGS stress triad completed"

          post pending STRESS_RECEIPT "Recovering every frozen stress location"
          set +e
          LAFEA_BUCKET_01_PRODUCTION_PROJECTION_PATH=reports/qualification/lafea-bucket-01-stress-projection.json \
          LAFEA_BUCKET_01_PRODUCTION_EXECUTION_PATH=reports/qualification/lafea-bucket-01-stress-execution.json \
          node scripts/lafea-bucket-01-production-lug-probe-receipt.mjs \
            > reports/qualification/sgs-triad-stress-receipt.stdout.log \
            2> reports/qualification/sgs-triad-stress-receipt.stderr.log
          stress_exit=$?
          set -e
          if [[ "$stress_exit" != "0" ]]; then
            log=reports/qualification/sgs-triad-stress-receipt.stderr.log
            [[ -s "$log" ]] || log=reports/qualification/sgs-triad-stress-receipt.stdout.log
            fail STRESS_RECEIPT "$log"
          fi
          summary=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const response = JSON.parse(fs.readFileSync('reports/qualification/sgs-triad-global-response.json','utf8'));
          const stress = JSON.parse(fs.readFileSync('reports/qualification/lafea-bucket-01-production-lug-fixed-probes.json','utf8'));
          const rows = [...stress.standaloneProbeReceipts, ...stress.pathReceipts.flatMap((row) => row.stationReceipts)];
          process.stdout.write(JSON.stringify({
            responseFineGridGci: response.energyConvergence.fineGridGci,
            maximumStressWidth: Math.max(...rows.map((row) => row.supplementalBound.relativeWidth)),
            criticalLocation: rows.reduce((max,row)=>row.supplementalBound.relativeWidth>max.supplementalBound.relativeWidth?row:max).probeId,
            allLocationsPassed: rows.every((row)=>row.status==='PASS'),
          }));
          NODE
          )
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$summary")
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success -f context=lafea/sgs-triad/COMPLETE \
            -f description="Global response and separate stress triad passed" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_summary=${encoded}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-sgs-triad-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
