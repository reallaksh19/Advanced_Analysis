name: M032 Apply Governed Strict-Parity Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/m032-patch/**'
      - '.github/m032-final.patch.gz.b64'
      - '.github/m032-final-workflow.b64'
      - '.github/m032-final-workflow/**'
      - '.github/workflows/m032-bm3-load-custody.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m032-bm3-apply-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: feature/m032-bm3-hanger-parity

    steps:
      - name: Checkout writable exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact staged head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"
          test -z "$(git status --porcelain)"
          test "$(git branch --show-current)" = "$TARGET_BRANCH"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Reconstruct and validate governed patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/m032-patch/part-* | tr -d '\n' | base64 --decode | gzip -d > /tmp/m032.patch
          test "$(wc -c < /tmp/m032.patch)" -eq 150461
          echo "3aa3dc84ee2991f428e0541b701ff9766b65cdaeefeffc052c2bcac6ca1f761e  /tmp/m032.patch" | sha256sum -c -
          git apply --check /tmp/m032.patch
          cat .github/m032-final-workflow/part-* | tr -d '\n' > /tmp/m032-final-workflow.b64
          test "$(wc -c < /tmp/m032-final-workflow.b64)" -eq 5424
          echo "076028613e0235fa5ca84c311f427b4785d25dffd07c21174c65620e27108743  /tmp/m032-final-workflow.b64" | sha256sum -c -
          base64 --decode /tmp/m032-final-workflow.b64 > /tmp/m032-final-workflow.yml

      - name: Apply governed mechanics and install final workflow
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/m032.patch
          cp /tmp/m032-final-workflow.yml .github/workflows/m032-bm3-load-custody.yml
          rm -rf .github/m032-patch .github/m032-final.patch.gz.b64 .github/m032-final-workflow.b64 .github/m032-final-workflow
          git diff --check

      - name: Validate strict qualification before publishing
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lfea-m029-bm3-hanger-check.mjs
          node scripts/lfea-m032-bm3-load-custody-check.mjs
          node scripts/lfea-m032-bm3-consolidated-latest-output-check.mjs
          npm run check:lfea-bm1-cii-comparison
          npm run check:lfea-linear-core

      - name: Publish governed branch head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(m032): attain strict BM3 hanger parity'
          git push origin "HEAD:$TARGET_BRANCH"
