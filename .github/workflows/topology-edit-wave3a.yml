name: Topology Edit Wave 3A

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-wave3a.yml'
      - 'src/workspace/topology-edit/topology-edit-checker.js'
      - 'src/workspace/topology-edit/support-restraint-family.js'
      - 'tests/topology-edit-wave3a-checker.test.mjs'
      - 'tests/topology-edit-wave1-*.test.mjs'
      - 'tests/topology-edit-fitting-support-*.test.mjs'
      - 'scripts/topology-edit-*.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checker-detection:
    name: W3A pure checker detection
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Syntax and Wave 3A detection contracts
        run: |
          node --check src/workspace/topology-edit/topology-edit-checker.js
          node --test tests/topology-edit-wave3a-checker.test.mjs

      - name: Retain Wave 1 certification authority
        run: >-
          node --test
          tests/topology-edit-wave1-pure-kernel.test.mjs
          tests/topology-edit-wave1-candidate-certification.test.mjs
          tests/topology-edit-wave1-journal-replay.test.mjs
          tests/topology-edit-wave1-production-integration.test.mjs

      - name: Retain Wave 2 geometry and support authority
        run: >-
          node --test
          tests/topology-edit-dimension-authority.test.mjs
          tests/topology-edit-fitting-support-geometry.test.mjs
          tests/topology-edit-fitting-support-integration.test.mjs

      - name: Source, API, and import authority
        run: |
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs

      - name: Production build
        run: npm run build

      - name: Write exact-head Wave 3A evidence
        run: |
          mkdir -p reports/qualification
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (head !== process.env.TOPOLOGY_EDIT_TARGET_HEAD_SHA) throw new Error('Exact-head mismatch.');
          const paths = [
            'src/workspace/topology-edit/topology-edit-checker.js',
            'tests/topology-edit-wave3a-checker.test.mjs',
            '.github/workflows/topology-edit-wave3a.yml',
          ];
          const files = Object.fromEntries(paths.map((path) => {
            const bytes = readFileSync(path);
            return [path, createHash('sha256').update(bytes).digest('hex')];
          }));
          const evidence = {
            schema: 'TopologyEditWave3ADetectionEvidence.v1',
            repository: process.env.GITHUB_REPOSITORY,
            commit: head,
            status: 'PASS_DETECTION_ONLY',
            issueFamilies: 14,
            commandPayloadsAuthorized: false,
            workspaceMutationAuthorized: false,
            files,
          };
          writeFileSync('reports/qualification/topology-edit-wave3a.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-wave3a-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-wave3a.json
          if-no-files-found: error
          retention-days: 30
