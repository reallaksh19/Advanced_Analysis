name: LFEA WP-PF1 exact-head qualification

on:
  pull_request:
    paths:
      - 'src/analyze/analyze-controller.js'
      - 'src/core/linear-fea-solver/**'
      - 'src/core/linear-piping-analysis-consumer/**'
      - 'test/lfea-prefea-gateway.test.js'
      - 'test/lfea-prefea-public-call-sites.test.js'
      - 'scripts/lfea-prefea-qualification.mjs'
      - 'evidence/wp-pf1/**'
      - '.github/workflows/lfea-prefea-exact-head.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      PREFEA_BASE_SHA: 1d7dee134a925846e11f024e8e7f883a53533829
      PREFEA_EVIDENCE_DIR: artifacts/wp-pf1
      PREFEA_CHANGED_PATHS_FILE: artifacts/wp-pf1/changed-paths.txt
    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact head and one-commit custody
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          git cat-file -e "$PREFEA_BASE_SHA^{commit}"
          count="$(git rev-list --count "$PREFEA_BASE_SHA..HEAD")"
          test "$count" = '1'
          test "$(git rev-parse HEAD^)" = "$PREFEA_BASE_SHA"
          echo "PREFEA_HEAD_SHA=$actual" >> "$GITHUB_ENV"
          echo "PREFEA_COMMIT_COUNT=$count" >> "$GITHUB_ENV"
          echo "PREFEA_SOURCE_TREE_SHA=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Enforce changed-path allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PREFEA_EVIDENCE_DIR"
          git diff --name-only "$PREFEA_BASE_SHA..HEAD" | LC_ALL=C sort > "$PREFEA_CHANGED_PATHS_FILE"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/lfea-prefea-exact-head.yml|\
              evidence/wp-pf1/*|\
              scripts/lfea-prefea-qualification.mjs|\
              src/analyze/analyze-controller.js|\
              test/lfea-prefea-gateway.test.js|\
              test/lfea-prefea-public-call-sites.test.js|\
              src/core/linear-fea-solver/index.js|\
              src/core/linear-fea-solver/stiffness-preflight.js|\
              src/core/linear-piping-analysis-consumer/index.js|\
              src/core/linear-piping-analysis-consumer/generic-inputxml-solve.js|\
              src/core/linear-piping-analysis-consumer/inputxml-*.js) ;;
              *) echo "Disallowed changed path: $path" >&2; exit 1 ;;
            esac
          done < "$PREFEA_CHANGED_PATHS_FILE"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run governed pre-FEA and public-call-site controls
        run: node --test test/lfea-prefea-gateway.test.js test/lfea-prefea-public-call-sites.test.js

      - name: Resolve workflow job identity
        id: jobmeta
        uses: actions/github-script@v7
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const current = jobs.find((job) => job.name === 'qualify') ?? jobs[0];
            core.setOutput('job_id', String(current?.id ?? context.job));

      - name: Generate sealed qualification evidence
        env:
          PREFEA_WORKFLOW_JOB_ID: ${{ steps.jobmeta.outputs.job_id }}
        run: node scripts/lfea-prefea-qualification.mjs

      - name: Upload qualification payload
        id: payload
        uses: actions/upload-artifact@v4
        with:
          name: wp-pf1-qualification-payload
          path: artifacts/wp-pf1
          if-no-files-found: error
          retention-days: 30

      - name: Bind artifact receipt
        run: >-
          node scripts/lfea-prefea-qualification.mjs --finalize
          '${{ steps.payload.outputs.artifact-id }}'
          '${{ steps.payload.outputs.artifact-digest }}'

      - name: Upload final exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: wp-pf1-exact-head-evidence
          path: artifacts/wp-pf1
          if-no-files-found: error
          retention-days: 30
