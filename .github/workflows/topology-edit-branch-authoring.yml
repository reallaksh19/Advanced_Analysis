name: 3D Edit Tee Olet Branch Authoring

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-branch-authoring.yml'
      - 'public/fixtures/topology-edit-professional-spec-catalog.json'
      - 'src/workspace/topology-edit/authoring/topology-edit-authoring-session.js'
      - 'src/workspace/topology-edit/authoring/topology-edit-authoring-operation-planner.js'
      - 'src/workspace/topology-edit/authoring/topology-edit-authoring-branch.js'
      - 'src/workspace/topology-edit/authoring/topology-edit-authoring-branch-catalogue.js'
      - 'src/workspace/topology-edit/authoring/topology-edit-authoring-branch-geometry.js'
      - 'src/workspace/topology-edit/professional/topology-edit-operation-plan.js'
      - 'src/workspace/topology-edit/topology-edit-branch-component-command.js'
      - 'src/workspace/topology-edit/topology-edit-command-contract.js'
      - 'src/workspace/topology-edit/topology-edit-command-resolver.js'
      - 'src/workspace/topology-edit/topology-edit-pure-reducer.js'
      - 'src/workspace/topology-edit/topology-edit-command-effect-validator.js'
      - 'src/workspace/viewport-productivity/topology-edit-component-authoring-runtime.js'
      - 'src/workspace/topology-edit-3d-authoring-controller.js'
      - 'tests/topology-edit-branch-authoring.test.mjs'
      - 'tests/topology-edit-authoring-branch-catalogue.test.mjs'
      - 'tests/topology-edit-authoring-branch-geometry.test.mjs'
      - 'tests/topology-edit-branch-component-command.test.mjs'
      - 'e2e/topology-edit-branch-authoring.spec.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-edit-branch-authoring-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSER_CHANNEL: chromium

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify exact branch authoring sources
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          node --check src/workspace/topology-edit/authoring/topology-edit-authoring-session.js
          node --check src/workspace/topology-edit/authoring/topology-edit-authoring-operation-planner.js
          node --check src/workspace/topology-edit/authoring/topology-edit-authoring-branch.js
          node --check src/workspace/topology-edit/authoring/topology-edit-authoring-branch-catalogue.js
          node --check src/workspace/topology-edit/authoring/topology-edit-authoring-branch-geometry.js
          node --check src/workspace/topology-edit/topology-edit-branch-component-command.js
          node --check src/workspace/topology-edit/topology-edit-command-contract.js
          node --check src/workspace/topology-edit/topology-edit-command-resolver.js
          node --check src/workspace/topology-edit/topology-edit-pure-reducer.js
          node --check src/workspace/topology-edit/topology-edit-command-effect-validator.js
          node --check src/workspace/viewport-productivity/topology-edit-component-authoring-runtime.js
          node --check tests/topology-edit-branch-authoring.test.mjs
          node --check e2e/topology-edit-branch-authoring.spec.js
          git diff --check

      - name: Execute governed branch authoring contracts
        run: |
          set -o pipefail
          node --test --test-reporter=tap \
            tests/topology-edit-authoring-branch-geometry.test.mjs \
            tests/topology-edit-authoring-branch-catalogue.test.mjs \
            tests/topology-edit-branch-component-command.test.mjs \
            tests/topology-edit-branch-authoring.test.mjs \
            tests/topology-edit-authoring-session.test.mjs \
            tests/topology-edit-authoring-composite-operation.test.mjs \
            2>&1 | tee topology-edit-branch-authoring-test-output.txt

      - name: Execute production Chromium Tee and Olet walkthroughs
        run: |
          npx playwright test \
            e2e/topology-edit-branch-authoring.spec.js \
            --project=chromium --workers=1 --retries=0 --reporter=line

      - name: Upload branch authoring qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-branch-authoring-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            topology-edit-branch-authoring-test-output.txt
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 30
