name: M027 BM2 Junction Surface Nodes

on:
  pull_request:
    paths:
      - '.github/workflows/m027-bm2-junction-surface-nodes.yml'
      - 'scripts/lfea-b3.28-bm2-junction-source-audit.mjs'
      - 'scripts/lfea-b3.28-bm2-junction-surface-node-runtime.mjs'
      - 'scripts/lfea-b3.28-bm2-junction-surface-node-check.mjs'
      - 'benchmarks/LFEA/BM2/Input_BM2.xml'
      - 'benchmarks/LFEA/BM2/Output_BM2.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m027-bm2-junction-surface-nodes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  junction-surface-nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"
          node --check scripts/lfea-b3.28-bm2-junction-source-audit.mjs
          git diff --check

      - name: Audit B31J junction topology
        run: node scripts/lfea-b3.28-bm2-junction-source-audit.mjs

      - name: Qualify surface-node transformation
        if: ${{ hashFiles('scripts/lfea-b3.28-bm2-junction-surface-node-check.mjs') != '' }}
        run: node scripts/lfea-b3.28-bm2-junction-surface-node-check.mjs

      - name: Linear-core regression aggregate
        if: ${{ hashFiles('scripts/lfea-b3.28-bm2-junction-surface-node-check.mjs') != '' }}
        run: npm run check:lfea-linear-core

      - name: Publish surface-node evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m027-bm2-junction-surface-nodes
          path: reports/lfea-bm2-junction-surface-nodes.json
          if-no-files-found: warn
          retention-days: 30
