name: Topology Edit Track C Foundation

on:
  pull_request:
    paths:
      - ".github/workflows/topology-edit-track-c.yml"
      - "src/workspace/topology-edit/topology-edit-scope-contract.js"
      - "src/workspace/topology-edit/topology-edit-large-model-controller.js"
      - "src/workspace/topology-edit/topology-edit-worker-client.js"
      - "src/workspace/topology-edit/topology-edit-worker.js"
      - "tests/topology-edit-track-c.test.mjs"
      - "tests/fixtures/topology-edit/large-model/**"
      - "scripts/topology-edit-write-track-c-evidence.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-track-c-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Record qualification start
        run: echo "TOPOLOGY_EDIT_QUALIFICATION_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Retain Wave 0 governance gates
        run: |
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs

      - name: Run portable Track C qualification
        run: node --test tests/topology-edit-track-c.test.mjs

      - name: Write exact-head Track C evidence
        run: node scripts/topology-edit-write-track-c-evidence.mjs

      - name: Upload Track C evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-track-c-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-track-c-evidence.json
          if-no-files-found: error
          retention-days: 30
