name: 3D Edit Sjson Render Authority

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: topology-edit-sjson-render-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chromium-sjson-render-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_BROWSER_CHANNEL: chromium

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify exact source contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          node --check src/core/support-restraints/attachment-resolution-helpers.js
          node --check src/workspace/dataset-adapter.js
          node --check src/workspace/dataset-types.js
          node --check src/workspace/load-calc-consumer-controller.js
          node --check src/workspace/workspace-shell-controller.js
          node --check src/workspace/topology-edit-3d-sjson-fidelity-controller.js
          node --check src/workspace/topology-edit/topology-edit-candidate-builder.js
          node --check src/workspace/topology-edit/topology-edit-checker-lineage.js
          node --check src/workspace/topology-edit/topology-edit-source-adapter.js
          node --check src/workspace/topology-edit/topology-edit-render-model.js
          node --check src/workspace/topology-edit/topology-edit-typed-viewport-backend.js
          node --check src/workspace/topology-edit/topology-edit-support-viewport-backend.js
          node --check src/workspace/topology-edit/topology-edit-sjson-edit-draft-projection.js
          node --check src/workspace/topology-edit/topology-edit-sjson-governed-projection-v2.js
          node --check src/workspace/topology-edit/topology-edit-sjson-governed-render-common-v2.js
          node --check src/workspace/topology-edit/topology-edit-sjson-governed-route-renderer-v2.js
          node --check src/workspace/topology-edit/topology-edit-sjson-governed-support-renderer-v2.js
          node --check src/workspace/topology-edit/topology-edit-sjson-governed-issue-renderer-v2.js
          node --check src/workspace/topology-edit/topology-edit-sjson-governed-viewport-backend-v2.js
          node --check src/workspace/topology-edit/topology-edit-sjson-runtime-authority-v2.js
          node --check src/workspace/topology-edit/topology-edit-sjson-fidelity-evidence-v2.js
          node --check src/workspace/topology-edit/topology-edit-sjson-benchmark-camera.js
          node --check src/workspace/topology-edit/topology-edit-sjson-visual-authority.js
          node --check src/workspace/topology-edit/topology-edit-sjson-tee-projection.js
          node --check src/workspace/topology-edit/topology-edit-sjson-point-component-projection.js
          node --check src/workspace/topology-edit/topology-edit-sjson-parent-branch-diameter.js
          node --check src/workspace/topology-edit/topology-edit-sjson-support-parent-branch-diameter.js
          node --check src/workspace/topology-edit/topology-edit-sjson-restraint-projection.js
          node --check tests/topology-edit-sjson-production-editability.test.mjs
          node --check tests/topology-edit-sjson-governed-projection-v2.test.mjs
          node --check tests/topology-edit-sjson-governed-viewport-v2.test.mjs
          node --check e2e/topology-edit-sjson-governed-overlays.spec.js
          node --check e2e/topology-edit-sjson-edit-draft-visual.spec.js
          node --check e2e/topology-edit-sjson-render-authority.spec.js
          node --check e2e/topology-edit-sjson-screen-bounds.spec.js
          node --check e2e/topology-edit-clean-layout.spec.js
          git diff --check

      - name: Execute canonical, governed projection, support, and lineage tests
        run: |
          node --test \
            tests/topology-edit-sjson-production-editability.test.mjs \
            tests/topology-edit-sjson-governed-projection-v2.test.mjs \
            tests/topology-edit-sjson-governed-viewport-v2.test.mjs \
            tests/topology-edit-sjson-edit-draft-projection.test.mjs \
            tests/topology-edit-sjson-edit-draft-viewport.test.mjs \
            tests/topology-edit-split-lineage-certification.test.mjs \
            tests/topology-edit-sjson-render-authority.test.mjs \
            tests/topology-edit-sjson-fidelity.test.mjs \
            tests/topology-edit-sjson-restraint-projection.test.mjs \
            tests/topology-edit-sjson-benchmark-camera.test.mjs \
            tests/topology-edit-sjson-compact-support-render.test.mjs \
            tests/topology-edit-20-element-demo-loader.test.mjs \
            tests/topology-edit-render-fidelity.test.mjs \
            tests/topology-edit-m003-capability-authority.test.mjs

      - name: Execute real Sjson Chromium/WebGL qualification
        run: |
          npx playwright test \
            e2e/topology-edit-sjson-governed-overlays.spec.js \
            e2e/topology-edit-sjson-edit-draft-visual.spec.js \
            e2e/topology-edit-sjson-render-authority.spec.js \
            e2e/topology-edit-sjson-screen-bounds.spec.js \
            e2e/topology-edit-clean-layout.spec.js \
            --project=chromium --workers=1 --retries=0 --trace=on --reporter=line

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-sjson-render-authority-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
            Temp/3D EDIT RENDER/EXPECTED.png
          if-no-files-found: warn
          retention-days: 30
