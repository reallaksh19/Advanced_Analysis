name: Materialize valve assembly patch

on:
  push:
    branches:
      - agent/valve-assembly-authoring

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v4
        with:
          ref: agent/valve-assembly-authoring
          fetch-depth: 0

      - name: Materialize reviewed patch
        run: |
          set -euo pipefail
          cat .agent-payload/part-* | base64 -d > /tmp/valve-assembly-payload.tar.gz
          tar -xzf /tmp/valve-assembly-payload.tar.gz
          rm -rf .agent-payload .github/workflows/agent-valve-assembly-bootstrap.yml
          while IFS= read -r file; do
            node --check "$file"
          done < <(find src e2e tests -type f \( -name '*.js' -o -name '*.mjs' \) | sort)
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement governed valve assembly authoring'
          git push origin HEAD:agent/valve-assembly-authoring
