name: Topology Edit Wave 3C

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-wave3c.yml'
      - 'src/workspace/topology-edit-3d-view-controller.js'
      - 'src/workspace/topology-edit/topology-edit-certified-session.js'
      - 'src/workspace/topology-edit/topology-edit-viewport-backend.js'
      - 'tests/topology-edit-wave3c-autofix-ui.test.mjs'
      - 'tests/topology-edit-wave3b-autofix.test.mjs'
      - 'tests/topology-edit-wave1-*.test.mjs'
      - 'tests/topology-edit-fitting-support-*.test.mjs'
      - 'scripts/topology-edit-*.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix-ui:
    name: W3C certified autofix production UI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Syntax and Wave 3C contracts
        run: |
          node --check src/workspace/topology-edit-3d-view-controller.js
          node --check src/workspace/topology-edit/topology-edit-certified-session.js
          node --check src/workspace/topology-edit/topology-edit-viewport-backend.js
          node --test tests/topology-edit-wave3c-autofix-ui.test.mjs

      - name: Retain Wave 3B certification authority
        run: node --test tests/topology-edit-wave3b-autofix.test.mjs

      - name: Retain Wave 1 and Wave 2 authority
        run: >-
          node --test
          tests/topology-edit-wave1-pure-kernel.test.mjs
          tests/topology-edit-wave1-candidate-certification.test.mjs
          tests/topology-edit-wave1-journal-replay.test.mjs
          tests/topology-edit-wave1-production-integration.test.mjs
          tests/topology-edit-fitting-support-geometry.test.mjs
          tests/topology-edit-fitting-support-integration.test.mjs

      - name: Source, API, coding, and import authority
        run: |
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-wave1-coding-rules-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs

      - name: Production build
        run: npm run build

      - name: Write exact-head Wave 3C evidence
        run: |
          mkdir -p reports/qualification
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (head !== process.env.TOPOLOGY_EDIT_TARGET_HEAD_SHA) throw new Error('Exact-head mismatch.');
          const paths = [
            'src/workspace/topology-edit-3d-view-controller.js',
            'src/workspace/topology-edit/topology-edit-certified-session.js',
            'src/workspace/topology-edit/topology-edit-viewport-backend.js',
            'tests/topology-edit-wave3c-autofix-ui.test.mjs',
          ];
          const files = Object.fromEntries(paths.map((path) => [
            path,
            createHash('sha256').update(readFileSync(path)).digest('hex'),
          ]));
          const evidence = {
            schema: 'TopologyEditWave3CAutofixUiEvidence.v1',
            repository: process.env.GITHUB_REPOSITORY,
            commit: head,
            status: 'PASS_CERTIFIED_AUTOFIX_UI',
            sourceEvidenceRequired: true,
            ghostNonPickable: true,
            previewCancellationOnStateChange: true,
            exactCandidateAcceptance: true,
            workspaceMutationAuthorized: false,
            files,
          };
          writeFileSync('reports/qualification/topology-edit-wave3c.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-wave3c-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-wave3c.json
          if-no-files-found: error
          retention-days: 30
