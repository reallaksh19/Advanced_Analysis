name: preproduction-thermal-liftoff-tl05-correlation

on:
  pull_request:
    branches:
      - agent/preproduction-thermal-liftoff-controlled-influence
    paths:
      - src/workspace/engineering-loads/preproduction-thermal-liftoff-benchmark-authority.js
      - scripts/preproduction-thermal-liftoff-tl05-exhaustive-oracle.mjs
      - scripts/preproduction-thermal-liftoff-tl05-correlation-check.mjs
      - scripts/preproduction-thermal-liftoff-tl05-correlation-guard.mjs
      - .github/workflows/preproduction-thermal-liftoff-tl05-correlation.yml

permissions:
  contents: read

jobs:
  qualify-preproduction-thermal-liftoff-tl05-correlation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prove exact head and clean worktree
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git diff --exit-code

      - name: Enforce five-path TL-05 containment
        shell: bash
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="$(git rev-parse HEAD)"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/tl05-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              src/workspace/engineering-loads/preproduction-thermal-liftoff-benchmark-authority.js|scripts/preproduction-thermal-liftoff-tl05-exhaustive-oracle.mjs|scripts/preproduction-thermal-liftoff-tl05-correlation-check.mjs|scripts/preproduction-thermal-liftoff-tl05-correlation-guard.mjs|.github/workflows/preproduction-thermal-liftoff-tl05-correlation.yml) ;;
              *) echo "Forbidden changed path for TL-05 benchmark batch: $changed"; exit 1 ;;
            esac
          done < /tmp/tl05-paths.txt
          test "$(wc -l < /tmp/tl05-paths.txt)" -eq 5

      - name: Install dependencies
        run: npm ci

      - name: Syntax check TL-05 batch
        run: |
          node --check src/workspace/engineering-loads/preproduction-thermal-liftoff-benchmark-authority.js
          node --check scripts/preproduction-thermal-liftoff-tl05-exhaustive-oracle.mjs
          node --check scripts/preproduction-thermal-liftoff-tl05-correlation-check.mjs
          node --check scripts/preproduction-thermal-liftoff-tl05-correlation-guard.mjs

      - name: Requalify upstream source and nonlinear authority stack
        run: |
          node scripts/preproduction-thermal-liftoff-controlled-source-guard.mjs
          node scripts/preproduction-thermal-liftoff-controlled-source-check.mjs
          node scripts/preproduction-thermal-liftoff-controlled-influence-guard.mjs
          node scripts/preproduction-thermal-liftoff-controlled-influence-check.mjs
          node scripts/preproduction-thermal-liftoff-active-set-source-guard.mjs
          node scripts/preproduction-thermal-liftoff-active-set-check.mjs

      - name: Enforce independent TL-05 source boundary
        run: node scripts/preproduction-thermal-liftoff-tl05-correlation-guard.mjs

      - name: Qualify zero-parity and nonlinear correlation programme
        run: node scripts/preproduction-thermal-liftoff-tl05-correlation-check.mjs

      - name: Import graph
        run: npm run check:imports

      - name: Production build
        run: npm run build

      - name: Whitespace check
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "$(git rev-parse HEAD)"
