name: LAFEA Bucket-01 Production Qualification

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  retained-production-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Publish retained-evidence start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=lafea/bucket-01-retained-production-evidence \
            -f description="Executing 1024-element response and fixed lug probes"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute retained production evidence
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qualification
          run_stage() {
            stage="$1"
            script="$2"
            printf '%s' "$stage" > reports/qualification/retained-current-stage.txt
            node "$script" \
              > "reports/qualification/retained-${stage}.stdout.log" \
              2> "reports/qualification/retained-${stage}.stderr.log"
          }
          run_stage exact-head scripts/lafea-bucket-01-exact-head-check.mjs
          run_stage expected-values scripts/lafea-bucket-01-expected-value-registry-check.mjs
          run_stage production-execution scripts/lafea-bucket-01-production-response-runner.mjs
          run_stage production-response scripts/lafea-bucket-01-production-response-receipt.mjs
          run_stage kirsch-stress scripts/lafea-bucket-01-kirsch-fixed-probes-check.mjs
          run_stage production-lug-stress scripts/lafea-bucket-01-production-lug-probe-receipt.mjs
          run_stage final-adjudication-contract scripts/lafea-bucket-01-final-adjudication-contract-check.mjs
      - name: Emit external authority request
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          printf '%s' authority-request > reports/qualification/retained-current-stage.txt
          node --input-type=module \
            > reports/qualification/lafea-bucket-01-code-basis-authority-request.json \
            2> reports/qualification/retained-authority-request.stderr.log <<'NODE'
          import fs from 'node:fs';
          import { canonicalLafeaSha256 } from './src/workspace/lafea-canonical-sha256.js';
          const template = JSON.parse(fs.readFileSync('validation/bucket-01/09-code-basis-intake-template.json', 'utf8'));
          const probeSpec = JSON.parse(fs.readFileSync('validation/bucket-01/08-production-lug-fixed-probe-spec.json', 'utf8'));
          const base = {
            schema: 'lafea-bucket-01-code-basis-authority-request/v1',
            exactHeadSha: process.env.EXPECTED_HEAD_SHA,
            benchmarkId: 'C2D-LUG-PINHOLE-01',
            target: 'C2D-LUG-PINHOLE -> LAFEA.3',
            probeSpecHash: canonicalLafeaSha256(probeSpec),
            intakeTemplateHash: canonicalLafeaSha256(template),
            requiredSecretName: 'LAFEA_BUCKET_01_APPROVED_CODE_BASIS_JSON',
            requiredAuthoritySource: 'EXTERNAL_ENGINEERING_AUTHORITY',
            status: 'APPROVED_CODE_BASIS_REQUIRED',
          };
          console.log(JSON.stringify({ ...base, evidenceHash: canonicalLafeaSha256(base) }, null, 2));
          NODE
      - name: Publish retained-evidence success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=lafea/bucket-01-retained-production-evidence \
            -f description="1024-element response and fixed lug probes retained"
      - name: Publish retained-evidence failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          stage=$(cat reports/qualification/retained-current-stage.txt 2>/dev/null || printf unknown)
          log="reports/qualification/retained-${stage}.stderr.log"
          if [[ ! -f "$log" ]]; then
            log="reports/qualification/retained-${stage}.stdout.log"
          fi
          detail=$(node -e "const fs=require('fs');const p=process.argv[1];const t=fs.existsSync(p)?fs.readFileSync(p,'utf8'):'missing diagnostic log';process.stdout.write(t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(-20).join(' | ').slice(0,3500))" "$log")
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
          safe=$(printf '%s' "$stage" | tr -c 'A-Za-z0-9._-' '-' | cut -c1-45)
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="lafea/retained-failure/${safe}" \
            -f description="Retained production evidence failed at ${stage}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_error=${encoded}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=lafea/bucket-01-retained-production-evidence \
            -f description="Retained production evidence failed at ${stage}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-bucket-01-retained-production-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: error
          retention-days: 90

  qualification-replay:
    if: github.event_name == 'workflow_dispatch'
    needs: retained-production-evidence
    strategy:
      fail-fast: false
      matrix:
        replay_id: [REPLAY-01, REPLAY-02, REPLAY-03]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Publish replay start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context="lafea/bucket-01-${{ matrix.replay_id }}" \
            -f description="Executing isolated production replay"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize approved code-basis input
        env:
          APPROVED_CODE_BASIS_JSON: ${{ secrets.LAFEA_BUCKET_01_APPROVED_CODE_BASIS_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APPROVED_CODE_BASIS_JSON}" ]]; then
            echo "Repository secret LAFEA_BUCKET_01_APPROVED_CODE_BASIS_JSON is required." >&2
            exit 78
          fi
          mkdir -p external/qualification
          printf '%s' "${APPROVED_CODE_BASIS_JSON}" \
            > external/qualification/lafea-bucket-01-approved-code-basis-input.json
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))" \
            external/qualification/lafea-bucket-01-approved-code-basis-input.json
      - name: Run isolated production replay
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          LAFEA_BUCKET_01_REPLAY_ID: ${{ matrix.replay_id }}
          LAFEA_BUCKET_01_CODE_BASIS_INPUT_PATH: external/qualification/lafea-bucket-01-approved-code-basis-input.json
        run: node scripts/lafea-bucket-01-production-replay.mjs
      - name: Stage replay bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p replay-bundle/reports
          cp -R reports/qualification replay-bundle/reports/
          cp reports/qualification/lafea-bucket-01-replay-row.json replay-bundle/
      - name: Publish replay success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context="lafea/bucket-01-${{ matrix.replay_id }}" \
            -f description="Isolated production replay passed"
      - name: Publish replay failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context="lafea/bucket-01-${{ matrix.replay_id }}" \
            -f description="Replay blocked; verify approved code-basis secret and logs"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-bucket-01-replay-${{ matrix.replay_id }}-${{ github.sha }}
          path: replay-bundle/
          if-no-files-found: warn
          retention-days: 90

  finalize-production-qualification:
    if: github.event_name == 'workflow_dispatch'
    needs: qualification-replay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Publish final qualification start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=lafea/bucket-01-production-ready \
            -f description="Assembling final replay custody and qualification"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: lafea-bucket-01-replay-*-${{ github.sha }}
          path: external/qualification/replays
          merge-multiple: false
      - name: Assemble final replay custody and qualification
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          LAFEA_BUCKET_01_REPLAY_BUNDLE_ROOT: external/qualification/replays
        run: node scripts/lafea-bucket-01-finalize-production-qualification.mjs
      - name: Publish production-ready success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context=lafea/bucket-01-production-ready \
            -f description="Bucket-01 qualified with code authority and three isolated replays"
      - name: Publish production-ready failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context=lafea/bucket-01-production-ready \
            -f description="Final Bucket-01 qualification failed closed"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-bucket-01-final-qualification-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 90
