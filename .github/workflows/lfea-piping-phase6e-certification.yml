name: LFEA Piping Phase 6E Certification

on:
  pull_request:
    paths:
      - 'scripts/lfea-piping-release-readiness-check.mjs'
      - 'scripts/lfea-piping-release-orchestrator.mjs'
      - 'scripts/lfea-piping-release-orchestration-check.mjs'
      - 'scripts/lfea-piping-wp3-runtime-bundle-intake.mjs'
      - 'scripts/lfea-piping-wp3-runtime-bundle-intake-check.mjs'
      - 'scripts/lfea-piping-phase6e-anti-drift-check.mjs'
      - 'src/core/linear-piping-project-qualification/external-evidence-handoff.js'
      - 'docs/LFEA_PIPING_PHASE6E_RUNTIME_RELEASE_BUNDLE.md'
      - 'docs/LFEA_PIPING_PHASE_STATUS.md'
      - 'reports/lfea-piping-phase6e-runtime-release-bundle.json'
      - '.github/workflows/lfea-piping-phase6e-certification.yml'
      - '.github/workflows/lfea-piping-runtime-release-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lfea-piping-phase6e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-runtime-release-orchestration:
    name: Certify runtime release orchestration
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate runtime release orchestration
        run: node scripts/lfea-piping-release-orchestration-check.mjs

      - name: Validate Phase 6E containment
        run: node scripts/lfea-piping-phase6e-anti-drift-check.mjs

      - name: Run blocked policy path
        run: npm run check:lfea-piping-release-policy

      - name: Validate phase-to-finding ledger
        run: node scripts/lfea-piping-phase-findings-check.mjs

      - name: Run full repository gate
        run: npm run gate

      - name: Verify clean exact-head checkout
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short)"
