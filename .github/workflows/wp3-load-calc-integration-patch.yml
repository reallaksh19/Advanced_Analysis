name: wp3-load-calc-integration-patch

on:
  push:
    branches:
      - agent/empirical-load-calc-configuration-wp3
    paths:
      - 'scripts/wp3-load-calc-integration-patch.mjs'
      - '.github/workflows/wp3-load-calc-integration-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/empirical-load-calc-configuration-wp3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/wp3-load-calc-integration-patch.mjs
      - shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/workspace/load-calc-consumer-view.js src/workspace/load-calc-consumer-controller.js src/workspace/bootstrap.js
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate empirical scenario workflow into Load Calc'
          git push origin HEAD:agent/empirical-load-calc-configuration-wp3
