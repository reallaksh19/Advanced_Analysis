name: M035 Feature Mechanics Qualification

on:
  pull_request:
    branches:
      - claude/lfea-linear-static-fea-unfwjd
    paths:
      - 'src/core/linear-piping-analysis-consumer/inputxml-bend-feature-expansion.js'
      - 'src/core/linear-piping-analysis-consumer/inputxml-feature-mechanics-preparation.js'
      - 'src/core/linear-piping-analysis-consumer/index.js'
      - 'src/core/linear-fea-piping-components/directional-branch-flexibility.js'
      - 'src/core/linear-fea-piping-components/index.js'
      - 'src/core/linear-fea-reducer-condensation/**'
      - 'scripts/lfea-m035-generic-bend-integration-check.mjs'
      - 'scripts/lfea-m035-b31j-directional-tee-check.mjs'
      - 'scripts/lfea-m035-reducer-sampling-qualification-check.mjs'
      - 'scripts/lfea-m035-feature-mechanics-preparation-check.mjs'
      - 'scripts/lfea-m035-bm4-scope-policy.mjs'
      - 'scripts/lfea-m035-bm4-scope-policy-check.mjs'
      - 'scripts/lfea-m035-bm4-bend-authority-check.mjs'
      - '.github/workflows/m035-bm4-bend-scope.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m035-feature-mechanics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 1

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Syntax and M035 scope isolation
        shell: bash
        run: |
          set -euo pipefail
          node --check src/core/linear-piping-analysis-consumer/inputxml-bend-feature-expansion.js
          node --check src/core/linear-piping-analysis-consumer/inputxml-feature-mechanics-preparation.js
          node --check src/core/linear-fea-piping-components/directional-branch-flexibility.js
          node --check src/core/linear-fea-reducer-condensation/reducer-condensation.js
          node --check src/core/linear-fea-reducer-condensation/sampling-qualification.js
          node --check scripts/lfea-m035-generic-bend-integration-check.mjs
          node --check scripts/lfea-m035-b31j-directional-tee-check.mjs
          node --check scripts/lfea-m035-reducer-sampling-qualification-check.mjs
          node --check scripts/lfea-m035-feature-mechanics-preparation-check.mjs
          node --check scripts/lfea-m035-bm4-scope-policy.mjs
          node --check scripts/lfea-m035-bm4-scope-policy-check.mjs
          node --check scripts/lfea-m035-bm4-bend-authority-check.mjs
          node scripts/lfea-m035-bm4-scope-policy-check.mjs

      - name: Generic bend feature integration
        shell: bash
        run: |
          set +e
          node scripts/lfea-m035-generic-bend-integration-check.mjs > /tmp/m035-generic-bend.log 2>&1
          status=$?
          cat /tmp/m035-generic-bend.log
          if [ "$status" -ne 0 ]; then
            message="$(tr '\n' ' ' < /tmp/m035-generic-bend.log | head -c 3500)"
            echo "::error file=scripts/lfea-m035-generic-bend-integration-check.mjs,line=1,title=M035 generic bend integration::${message}"
          fi
          exit "$status"

      - name: Generic B31J directional tee mechanics
        shell: bash
        run: |
          set +e
          node scripts/lfea-m035-b31j-directional-tee-check.mjs > /tmp/m035-tee.log 2>&1
          status=$?
          cat /tmp/m035-tee.log
          if [ "$status" -ne 0 ]; then
            message="$(tr '\n' ' ' < /tmp/m035-tee.log | head -c 3500)"
            echo "::error file=scripts/lfea-m035-b31j-directional-tee-check.mjs,line=1,title=M035 B31J tee mechanics::${message}"
          fi
          exit "$status"

      - name: Generic reducer sampling qualification
        shell: bash
        run: |
          set +e
          node scripts/lfea-m035-reducer-sampling-qualification-check.mjs > /tmp/m035-reducer.log 2>&1
          status=$?
          cat /tmp/m035-reducer.log
          if [ "$status" -ne 0 ]; then
            message="$(tr '\n' ' ' < /tmp/m035-reducer.log | head -c 3500)"
            echo "::error file=scripts/lfea-m035-reducer-sampling-qualification-check.mjs,line=1,title=M035 reducer sampling::${message}"
          fi
          exit "$status"

      - name: Mixed feature mechanics preparation
        shell: bash
        run: |
          set +e
          node scripts/lfea-m035-feature-mechanics-preparation-check.mjs > /tmp/m035-feature-preparation.log 2>&1
          status=$?
          cat /tmp/m035-feature-preparation.log
          if [ "$status" -ne 0 ]; then
            message="$(tr '\n' ' ' < /tmp/m035-feature-preparation.log | head -c 3500)"
            echo "::error file=scripts/lfea-m035-feature-mechanics-preparation-check.mjs,line=1,title=M035 feature preparation::${message}"
          fi
          exit "$status"

      - name: B31 bend authority audit
        shell: bash
        run: |
          set +e
          node scripts/lfea-m035-bm4-bend-authority-check.mjs > /tmp/m035-bend-audit.log 2>&1
          status=$?
          cat /tmp/m035-bend-audit.log
          if [ "$status" -ne 0 ]; then
            message="$(tr '\n' ' ' < /tmp/m035-bend-audit.log | head -c 3500)"
            echo "::error file=scripts/lfea-m035-bm4-bend-authority-check.mjs,line=1,title=M035 bend authority audit::${message}"
          fi
          exit "$status"

      - name: Upload M035 mechanics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m035-feature-mechanics-${{ env.TARGET_HEAD_SHA }}
          path: |
            /tmp/m035-generic-bend.log
            /tmp/m035-tee.log
            /tmp/m035-reducer.log
            /tmp/m035-feature-preparation.log
            /tmp/m035-bend-audit.log
          if-no-files-found: warn
          retention-days: 7

      - name: Existing component regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run check:lfea-b3.1
          npm run check:lfea-b3.2
          npm run check:lfea-b3.19
          npm run check:lfea-b3.23
          npm run check:lfea-b3.18
          npm run check:lfea-bm1-cii-comparison

      - name: BM2 and BM3 solver regressions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/lfea-b3.26-bm2-solve-comparison-check.mjs
          node scripts/lfea-m028-bm3-check.mjs
