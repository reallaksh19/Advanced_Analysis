name: Topology Edit Table Slice 5B

on:
  push:
    paths:
      - 'src/workspace/topology-edit/export/topology-edit-source-surgical-patch.js'
      - 'tests/topology-edit-source-surgical-patch.test.mjs'
      - '.github/workflows/topology-edit-table-slice5b.yml'
  pull_request:
    paths:
      - 'src/workspace/topology-edit/export/topology-edit-source-surgical-patch.js'
      - 'tests/topology-edit-source-surgical-patch.test.mjs'
      - '.github/workflows/topology-edit-table-slice5b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-surgical-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Exact HEAD line and source guard
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          files=(
            src/workspace/topology-edit/export/topology-edit-source-surgical-patch.js
            tests/topology-edit-source-surgical-patch.test.mjs
          )
          for file in "${files[@]}"; do
            test "$(git show "HEAD:$file" | wc -l)" -lt 300
            node --check "$file"
          done
          ! grep -REn 'WorkspaceState|loadDataset\(|swapDataset\(|applyCanonicalTopologyToWorkspaceEntities|session\.execute\(|delete[ (]|splice\(' \
            src/workspace/topology-edit/export/topology-edit-source-surgical-patch.js
      - name: Surgical source custody contracts
        run: node --test tests/topology-edit-source-surgical-patch.test.mjs
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
