name: LFEA-007 Retirement Certification

on:
  pull_request:
    paths:
      - '.github/workflows/lfea-007-certification.yml'
      - '.github/workflows/lfea-007-retirement-certification.yml'
      - 'docs/LFEA_007_RETIREMENT_DECISION.md'
      - 'docs/element-fea/LFEA-007_APPLICATION_CONSUMER.md'
      - 'e2e/lfea-007-local-fea-consumer.spec.js'
      - 'reports/lfea-piping-phase-findings-ledger.json'
      - 'scripts/lfea-007-*.mjs'
      - 'src/core/workspace-consumers/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lfea-007-retirement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-retirement:
    name: Certify formal LFEA-007 retirement
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify retirement boundary
        run: node scripts/lfea-007-retirement-check.mjs

      - name: Verify Section 9 phase ledger
        run: node scripts/lfea-piping-phase-findings-check.mjs

      - name: Run full repository gate
        run: npm run gate

      - name: Verify clean exact-head checkout
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short)"
