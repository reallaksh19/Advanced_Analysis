name: LFEA BM4 Cases 19-21 Exact-Head Benchmark

on:
  pull_request:
    paths:
      - 'benchmarks/LFEA/BM4/**'
      - 'scripts/lfea-bm4-intake-run.mjs'
      - 'scripts/lfea-bm4-case19-21-benchmark.mjs'
      - '.github/workflows/lfea-bm4-intake.yml'
      - 'src/core/geometry/adapters/**'
      - 'src/core/geometry/model-health/**'
      - 'src/core/linear-piping-analysis-consumer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bm4-benchmark:
    name: BM4 non-friction CASE 19 SUS, CASE 20 OPE, CASE 21 EXP
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact pull-request head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Retrieve authoritative BM4 reference output
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/git/blobs/5be0cc70f0d608b0afdfb9878e4085982192bc72" \
            --output benchmarks/LFEA/BM4/Output_BM4.xml
          test "$(git hash-object benchmarks/LFEA/BM4/Output_BM4.xml)" = "5be0cc70f0d608b0afdfb9878e4085982192bc72"

      - name: Syntax check BM4 runners
        run: |
          node --check scripts/lfea-bm4-intake-run.mjs
          node --check scripts/lfea-bm4-case19-21-benchmark.mjs

      - name: Run BM4 intake and retain disposition
        id: intake
        shell: bash
        run: |
          mkdir -p reports
          set +e
          node scripts/lfea-bm4-intake-run.mjs 2>&1 | tee reports/bm4-intake-run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run only CASE 19 SUS, CASE 20 OPE, and CASE 21 EXP
        id: benchmark
        shell: bash
        run: |
          set +e
          node scripts/lfea-bm4-case19-21-benchmark.mjs 2>&1 | tee reports/bm4-case19-21-benchmark.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run linear-core regression
        run: npm run check:lfea-linear-core

      - name: Upload BM4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfea-bm4-case19-21-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            reports/bm4-intake-model-health.json
            reports/bm4-intake-run.log
            reports/bm4-case19-21-benchmark.json
            reports/bm4-case19-21-benchmark.log
          if-no-files-found: error

      - name: Enforce BM4 benchmark disposition
        if: always()
        shell: bash
        run: |
          test "${{ steps.intake.outputs.exit_code }}" = "0"
          test "${{ steps.benchmark.outputs.exit_code }}" = "0"
