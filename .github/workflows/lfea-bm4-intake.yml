name: LFEA BM4 Exact-Head Intake

on:
  pull_request:
    paths:
      - 'benchmarks/LFEA/BM4/**'
      - 'scripts/lfea-bm4-intake-run.mjs'
      - '.github/workflows/lfea-bm4-intake.yml'
      - 'src/core/geometry/adapters/**'
      - 'src/core/geometry/model-health/**'
      - 'src/core/linear-piping-analysis-consumer/inputxml-model-health.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bm4-intake:
    name: BM4 intake and model health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact pull-request head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check BM4 runner
        run: node --check scripts/lfea-bm4-intake-run.mjs

      - name: Run BM4 intake and retain disposition
        id: bm4
        shell: bash
        run: |
          mkdir -p reports
          set +e
          node scripts/lfea-bm4-intake-run.mjs 2>&1 | tee reports/bm4-intake-run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run linear-core regression
        run: npm run check:lfea-linear-core

      - name: Upload BM4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lfea-bm4-intake-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            reports/bm4-intake-model-health.json
            reports/bm4-intake-run.log
          if-no-files-found: error

      - name: Enforce BM4 intake disposition
        if: always()
        shell: bash
        run: |
          test "${{ steps.bm4.outputs.exit_code }}" = "0"
