name: FEA benchmark and pre-FEA focused qualification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/core/fea-benchmarks/**'
      - 'src/core/linear-piping-analysis-consumer/inputxml-linear-prefea*.js'
      - 'test/fea-benchmark-qualification.test.js'
      - 'test/lfea-prefea-engineering-checks.test.js'
      - '.github/workflows/fea-benchmark-prefea-focused.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run focused benchmark qualification tests
        run: node --test test/fea-benchmark-qualification.test.js
      - name: Run focused pre-FEA engineering tests
        run: node --test test/lfea-prefea-engineering-checks.test.js
