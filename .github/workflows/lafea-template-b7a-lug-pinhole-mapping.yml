name: LAFEA B7A Lug-Pinhole Mapping Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/lafea-template-b7a-lug-pinhole-mapping.yml'
      - 'src/core/lafea-application-templates/continuum-application-mapping-evidence.js'
      - 'src/core/lafea-application-templates/caller-mesh-binding.js'
      - 'src/core/lafea-application-templates/index.js'
      - 'src/workspace/lafea-lug-pinhole-mapping-evidence.js'
      - 'src/workspace/lafea-analysis-mesh-evidence.js'
      - 'scripts/lafea-template-b7a-lug-pinhole-mapping-check.mjs'
      - 'scripts/lafea-template-b6-caller-mesh-binding-check.mjs'
      - 'scripts/lafea-nb-t4a-analysis-mesh-evidence-check.mjs'
      - 'docs/LAFEA_Bucket_B7A_Lug_Pinhole_Mapping_Evidence.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lafea-b7a-lug-pinhole-mapping-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: B7A material, load-edge and boundary mapping evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Assert exact checkout and base ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$PR_BASE_SHA" "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run B7A mapping qualification
        shell: bash
        run: |
          set -o pipefail
          node scripts/lafea-template-b7a-lug-pinhole-mapping-check.mjs \
            2>&1 | tee lafea-b7a-lug-pinhole-mapping.log

      - name: Run retained B6 caller-mesh checks
        run: node scripts/lafea-template-b6-caller-mesh-binding-check.mjs

      - name: Run retained NB-T4A mesh-evidence checks
        run: node scripts/lafea-nb-t4a-analysis-mesh-evidence-check.mjs

      - name: Run retained B2 compatibility checks
        run: node scripts/lafea-template-b2-target-compatibility-check.mjs

      - name: Run retained B1 release-record checks
        run: node scripts/lafea-template-b1-release-record-v2-check.mjs

      - name: Run strict syntax checks
        run: npm run syntax:strict

      - name: Run import checks
        run: npm run check:imports

      - name: Build production bundle
        run: npm run build

      - name: Verify patch hygiene and clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PR_BASE_SHA...HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload exact-head B7A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-b7a-lug-pinhole-${{ github.event.pull_request.head.sha || github.sha }}
          path: lafea-b7a-lug-pinhole-mapping.log
          if-no-files-found: error
          retention-days: 30
