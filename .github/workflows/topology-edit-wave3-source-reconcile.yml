name: Topology Edit Wave 3 Source Reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-wave3-source-reconcile.yml'
      - 'src/workspace/topology-edit/**'
      - 'tests/topology-edit-wave3*.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-compatible-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
      - run: npm ci
      - name: Authority and syntax gates
        run: |
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-wave1-coding-rules-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs
          for file in \
            topology-edit-command-contract.js topology-edit-command-resolver.js \
            topology-edit-pure-reducer.js topology-edit-canonical-state.js \
            topology-edit-candidate-builder.js topology-edit-candidate-validator.js \
            topology-edit-command-effect-validator.js topology-edit-autofix-controller.js; do
            node --check "src/workspace/topology-edit/$file"
          done
      - name: Exact source contracts and retained authority
        run: |
          node --test tests/topology-edit-wave3-commands.test.mjs
          node --test tests/topology-edit-wave3b-autofix.test.mjs
          node --test tests/topology-edit-wave3c-autofix-ui.test.mjs
          node --test tests/topology-edit-wave1-pure-kernel.test.mjs
          node --test tests/topology-edit-wave1-candidate-certification.test.mjs
          node --test tests/topology-edit-wave1-journal-replay.test.mjs
          node --test tests/topology-edit-wave4a-persistence-export.test.mjs
          node --test tests/topology-edit-wave4b-commit-rollback.test.mjs
      - run: npm run build
      - name: Exact-head receipt
        run: |
          mkdir -p reports/qualification
          printf '{"schema":"TopologyEditWave3SourceReconciliation.v1","commit":"%s","status":"PASS_SOURCE_COMPATIBLE_AUTHORITY"}\n' \
            "$(git rev-parse HEAD)" > reports/qualification/topology-edit-wave3-source-reconciliation.json
      - uses: actions/upload-artifact@v4
        with:
          name: topology-edit-wave3-source-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-wave3-source-reconciliation.json
          if-no-files-found: error
