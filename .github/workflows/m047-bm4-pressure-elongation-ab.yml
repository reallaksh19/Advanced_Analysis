name: M047 BM4 Pressure Elongation A-B

on:
  pull_request:
    paths:
      - 'scripts/lfea-m047-bm4-pressure-elongation-runtime.mjs'
      - 'scripts/lfea-m047-bm4-pressure-elongation-ab.mjs'
      - '.github/workflows/m047-bm4-pressure-elongation-ab.yml'
  workflow_dispatch:

jobs:
  pressure-elongation-ab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and line-count gate
        run: |
          node --check scripts/lfea-m047-bm4-pressure-elongation-runtime.mjs
          node --check scripts/lfea-m047-bm4-pressure-elongation-ab.mjs
          test "$(wc -l < scripts/lfea-m047-bm4-pressure-elongation-runtime.mjs)" -le 300
          test "$(wc -l < scripts/lfea-m047-bm4-pressure-elongation-ab.mjs)" -le 300
      - name: Run pressure-elongation falsification A-B
        run: node scripts/lfea-m047-bm4-pressure-elongation-ab.mjs --report /tmp/m047-pressure-elongation.json
      - name: Preserve rigid/component/axial baselines
        run: |
          node scripts/lfea-m046-bm4-rigid-boundary-rca.mjs
          node scripts/lfea-m045-bm4-component-hierarchy-v2.mjs
          node scripts/lfea-m043-bm4-axial-force-source-rca.mjs
          npm run check:lfea-m036
      - name: Upload deterministic M047 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m047-bm4-pressure-elongation-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/m047-pressure-elongation.json
          if-no-files-found: error
      - name: Verify clean worktree
        run: git diff --exit-code && git status --porcelain | tee /tmp/m047-status && test ! -s /tmp/m047-status
