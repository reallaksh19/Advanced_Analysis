name: LAFEA B7F Current-Main Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/lafea-template-b7f-current-main-qualification.yml'
      - 'scripts/lafea-template-b7f-current-main-qualification-check.mjs'
      - 'docs/LAFEA_Bucket_B7F_Current_Main_Qualification.md'
      - '.github/workflows/lafea-template-b7e-b7-gate-closure.yml'
      - 'scripts/lafea-template-b7e-b7-gate-closure-check.mjs'
      - 'scripts/lafea-nonbucket-stack-check.mjs'
      - 'scripts/lafea-nb-t6*.mjs'
      - 'scripts/lafea-template-b7*.mjs'
      - 'src/workspace/lafea-*.js'
      - 'src/core/local-continuum/**'
      - 'src/core/lafea-application-templates/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lafea-b7f-current-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-preflight:
    name: B7F runner allocation preflight
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Record hosted runner allocation
        shell: bash
        run: |
          set -euo pipefail
          printf 'runner_os=%s\nrunner_arch=%s\nevent=%s\nref=%s\nsha=%s\n' \
            "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_EVENT_NAME" "$GITHUB_REF" "$GITHUB_SHA"

  qualify:
    name: B7F exact-head current-main qualification
    needs: runner-preflight
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '07af67696bede4a809f3a61d1670609a5888b4fe' }}
      B7E_REPORT_PATH: reports/qualification/lafea-b7e-b7-gate-closure.json
      B7F_REPORT_PATH: reports/qualification/lafea-b7f-current-main-qualification.json

    steps:
      - name: Check out exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Assert exact checkout and retained ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor \
            07af67696bede4a809f3a61d1670609a5888b4fe \
            "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor \
            13792e342fe5b9fb494a8103e6d8936245bd05ff \
            "$EXPECTED_HEAD_SHA"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git merge-base --is-ancestor "$PR_BASE_SHA" "$EXPECTED_HEAD_SHA"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Execute B7F current-main aggregate
        shell: bash
        run: |
          set -o pipefail
          node scripts/lafea-template-b7f-current-main-qualification-check.mjs \
            2>&1 | tee lafea-b7f-current-main-qualification.log

      - name: Upload exact-head B7F evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-b7f-current-main-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            lafea-b7f-current-main-qualification.log
            reports/qualification/lafea-b7e-b7-gate-closure.json
            reports/qualification/lafea-b7f-current-main-qualification.json
          if-no-files-found: error
          retention-days: 30
