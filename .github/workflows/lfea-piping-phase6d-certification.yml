name: LFEA Piping Phase 6D Certification

on:
  pull_request:
    paths:
      - 'release-evidence/lfea-piping-release-evidence.json'
      - 'reports/lfea-piping-phase6d-internal-evidence-intake.json'
      - 'docs/LFEA_PIPING_PHASE6D_INTERNAL_EVIDENCE_INTAKE.md'
      - 'scripts/lfea-piping-release-readiness-check.mjs'
      - 'scripts/lfea-piping-internal-release-evidence-check.mjs'
      - 'scripts/lfea-piping-internal-release-evidence-check-check.mjs'
      - 'scripts/lfea-piping-phase6d-anti-drift-check.mjs'
      - '.github/workflows/lfea-piping-phase6d-certification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lfea-piping-phase6d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify-internal-evidence-intake:
    name: Certify internal exact-head evidence intake
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Verify exact checkout identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate unresolved internal policy mode
        run: node scripts/lfea-piping-internal-release-evidence-check.mjs

      - name: Validate complete Phase 6D analytical coverage
        run: node scripts/lfea-piping-internal-release-evidence-check-check.mjs

      - name: Validate Phase 6D containment and release-gate registration
        run: node scripts/lfea-piping-phase6d-anti-drift-check.mjs

      - name: Run fail-closed release policy chain
        run: npm run check:lfea-piping-release-policy

      - name: Validate phase-to-finding ledger
        run: node scripts/lfea-piping-phase-findings-check.mjs

      - name: Run full repository gate
        run: npm run gate

      - name: Verify clean exact-head checkout
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short)"
