name: LAFEA Bucket-01 Uniform 4096 Diagnostic

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  uniform-4096:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute uniform fourth-level qualification diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qualification
          context=lafea/uniform-4096
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context="$context" \
            -f description="Executing uniform 4096-element fourth level"

          python - <<'PY'
          from pathlib import Path

          supplemental = (
              "spec.meshLadder.push({ ordinal: 4, elementCount: 4096, "
              "meshSize: 0.0078125, radialDivisions: 16, "
              "circumferentialDivisions: 128, "
              "solverMethod: 'DETERMINISTIC_JACOBI_PCG', "
              "stiffnessStorage: 'CSR_FULL_SYMMETRIC' });"
          )
          spec_marker = "const spec = JSON.parse(fs.readFileSync(SPEC_PATH, 'utf8'));"

          for name in [
              'scripts/lafea-bucket-01-production-response-runner.mjs',
              'scripts/lafea-bucket-01-production-response-receipt.mjs',
              'scripts/lafea-bucket-01-production-lug-probe-receipt.mjs',
          ]:
              path = Path(name)
              text = path.read_text()
              if text.count(spec_marker) != 1:
                  raise RuntimeError(f'{name}: spec marker count={text.count(spec_marker)}')
              path.write_text(text.replace(spec_marker, spec_marker + '\n' + supplemental, 1))

          response_path = Path('src/workspace/lafea-bucket-01-production-response.js')
          response = response_path.read_text()
          replacements = [
              (
                  "const EXPECTED_ELEMENT_COUNTS = Object.freeze([64, 256, 1024]);",
                  "const EXPECTED_ELEMENT_COUNTS = Object.freeze([64, 256, 1024, 4096]);",
              ),
              (
                  "  'DETERMINISTIC_JACOBI_PCG',\n]);",
                  "  'DETERMINISTIC_JACOBI_PCG',\n  'DETERMINISTIC_JACOBI_PCG',\n]);",
              ),
              (
                  "    meshSizes: levels.map((row) => row.meshSize),\n    observations: levels.map((row) => row.totalStrainEnergy),",
                  "    meshSizes: levels.slice(-3).map((row) => row.meshSize),\n    observations: levels.slice(-3).map((row) => row.totalStrainEnergy),",
              ),
              (
                  "  if (!Array.isArray(value) || value.length !== 3) {\n    throw responseError('LAFEA_B01_PRODUCTION_RESPONSE_THREE_LEVELS_REQUIRED');",
                  "  if (!Array.isArray(value) || value.length !== 4) {\n    throw responseError('LAFEA_B01_PRODUCTION_RESPONSE_FOUR_LEVELS_REQUIRED');",
              ),
              (
                  "  if (!(levels[0].meshSize > levels[1].meshSize\n    && levels[1].meshSize > levels[2].meshSize)) {",
                  "  if (!(levels[0].meshSize > levels[1].meshSize\n    && levels[1].meshSize > levels[2].meshSize\n    && levels[2].meshSize > levels[3].meshSize)) {",
              ),
          ]
          for old, new in replacements:
              count = response.count(old)
              if count != 1:
                  raise RuntimeError(f'response marker count={count}: {old[:80]}')
              response = response.replace(old, new, 1)
          response_path.write_text(response)

          lug_path = Path('scripts/lafea-bucket-01-production-lug-probe-receipt.mjs')
          lug = lug_path.read_text()
          replacements = [
              ("    [64, 256, 1024],", "    [64, 256, 1024, 4096],"),
              ("  assert.equal(projectionValue.levels.length, 3);", "  assert.equal(projectionValue.levels.length, 4);"),
              ("  assert.equal(executionValue.controllerResult.levelResults.length, 3);", "  assert.equal(executionValue.controllerResult.levelResults.length, 4);"),
              ("  }, levels));", "  }, levels.slice(-3)));"),
              ("  evaluatePath(pathDefinition, levels));", "  evaluatePath(pathDefinition, levels.slice(-3)));"),
              ("    meshSizes: spec.meshLadder.map((row) => row.meshSize),", "    meshSizes: levelsValue.map((row) => row.definition.meshSize),"),
          ]
          for old, new in replacements:
              count = lug.count(old)
              if count != 1:
                  raise RuntimeError(f'lug marker count={count}: {old[:80]}')
              lug = lug.replace(old, new, 1)
          assertion = '''  assert.equal(
              convergence.status,
              'PASS',
              `${definition.probeId}: ${convergence.reasons.join(', ')}`,
            );'''
          diagnostic = '''  console.error(`UNIFORM_4096_PROBE=${JSON.stringify({
              probeId: definition.probeId,
              role: definition.role,
              zone: definition.zone,
              observations: probeEvidences.map((row) => row.authoritativeValue),
              convergence,
            })}`);
            assert.equal(
              convergence.status,
              'PASS',
              `${definition.probeId}: ${convergence.reasons.join(', ')}`,
            );'''
          if lug.count(assertion) != 1:
              raise RuntimeError(f'lug assertion marker count={lug.count(assertion)}')
          lug_path.write_text(lug.replace(assertion, diagnostic, 1))
          PY

          set +e
          node scripts/lafea-bucket-01-production-response-runner.mjs \
            > reports/qualification/uniform-4096-runner.stdout.log \
            2> reports/qualification/uniform-4096-runner.stderr.log
          runner_exit=$?
          if [[ "$runner_exit" == "0" ]]; then
            node scripts/lafea-bucket-01-production-response-receipt.mjs \
              > reports/qualification/uniform-4096-response.stdout.log \
              2> reports/qualification/uniform-4096-response.stderr.log
            response_exit=$?
            node scripts/lafea-bucket-01-production-lug-probe-receipt.mjs \
              > reports/qualification/uniform-4096-lug.stdout.log \
              2> reports/qualification/uniform-4096-lug.stderr.log
            lug_exit=$?
          else
            response_exit=99
            lug_exit=99
          fi
          set -e

          detail=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = (path) => fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : '';
          const json = (path) => fs.existsSync(path) ? JSON.parse(fs.readFileSync(path, 'utf8')) : null;
          const response = json('reports/qualification/lafea-bucket-01-production-response.json');
          const lug = json('reports/qualification/lafea-bucket-01-production-lug-fixed-probes.json');
          process.stdout.write(JSON.stringify({
            response: response ? {
              status: response.status,
              reasons: response.reasons,
              energies: response.levelEvidence.map((row) => row.totalStrainEnergy),
              energyConvergence: response.energyConvergence,
              momentConvergence: response.momentConvergence,
            } : null,
            lug: lug ? {
              status: lug.status,
              probes: lug.standaloneProbeReceipts.map((row) => ({
                probeId: row.probeId,
                observations: row.observations,
                convergence: row.convergence,
              })),
              paths: lug.pathReceipts.map((path) => ({
                pathId: path.pathId,
                stations: path.stationReceipts.map((row) => ({
                  probeId: row.probeId,
                  observations: row.observations,
                  convergence: row.convergence,
                })),
              })),
            } : null,
            runnerStderr: read('reports/qualification/uniform-4096-runner.stderr.log').slice(-3000),
            responseStderr: read('reports/qualification/uniform-4096-response.stderr.log').slice(-3000),
            lugStderr: read('reports/qualification/uniform-4096-lug.stderr.log').slice(-5000),
          }));
          NODE
          )
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
          if [[ "$runner_exit" == "0" && "$response_exit" == "0" && "$lug_exit" == "0" ]]; then
            state=success
            description="Uniform 4096 passed response and all fixed stress locations"
          else
            state=failure
            description="Uniform 4096 blocked; inspect retained metrics"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="$context" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_4096=${encoded}"
          exit $(( runner_exit || response_exit || lug_exit ))
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-uniform-4096-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
