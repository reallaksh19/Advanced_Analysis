name: Topology Edit Professional Interaction

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-professional-interaction.yml'
      - 'src/workspace/topology-edit-3d-interaction-controller.js'
      - 'src/workspace/viewport-interaction/**'
      - 'src/workspace/viewport-productivity/topology-edit-interaction-*.js'
      - 'tests/topology-edit-professional-interaction-*.test.mjs'
      - 'tests/topology-edit-professional-snap-resolver.test.mjs'
      - 'e2e/topology-edit-professional-interaction-flow.spec.js'
      - 'scripts/run-playwright.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  professional-interaction:
    name: Agent 1 complete interaction and browser qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BASE_REF: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact checkout and ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"
          git merge-base --is-ancestor "$BASE_REF" HEAD

      - name: Install dependencies
        run: npm ci

      - name: Syntax and module bounds
        run: |
          for file in src/workspace/viewport-interaction/*.js; do
            node --check "$file"
            test "$(wc -l < "$file")" -le 300
          done
          node --check src/workspace/topology-edit-3d-interaction-controller.js
          test "$(wc -l < src/workspace/topology-edit-3d-interaction-controller.js)" -le 300
          for file in src/workspace/viewport-productivity/topology-edit-interaction-*.js; do
            node --check "$file"
            test "$(wc -l < "$file")" -le 300
          done
          node --check e2e/topology-edit-professional-interaction-flow.spec.js

      - name: Focused interaction qualification
        run: |
          node --test \
            tests/topology-edit-professional-interaction-contracts.test.mjs \
            tests/topology-edit-professional-snap-resolver.test.mjs \
            tests/topology-edit-professional-snap-collector.test.mjs \
            tests/topology-edit-professional-interaction-containment.test.mjs \
            tests/topology-edit-professional-interaction-session.test.mjs \
            tests/topology-edit-professional-interaction-viewport.test.mjs \
            tests/topology-edit-professional-interaction-controller.test.mjs

      - name: Retain certified topology foundations
        run: |
          node --test \
            tests/topology-edit-wave1-pure-kernel.test.mjs \
            tests/topology-edit-wave1-candidate-certification.test.mjs \
            tests/topology-edit-wave1-journal-replay.test.mjs \
            tests/topology-edit-wave3a-checker.test.mjs \
            tests/topology-edit-wave3b-autofix.test.mjs \
            tests/topology-edit-wave3-exact-gap-modes.test.mjs

      - name: Anti-drift and production build
        run: |
          npm run syntax:strict
          npm run check:imports
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs
          npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Walk visible 3 mm and 20 mm interaction flows
        run: >-
          node scripts/run-playwright.mjs
          e2e/topology-edit-professional-interaction-flow.spec.js

      - name: Verify exact-head Track A browser evidence
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(
            'reports/qualification/topology-edit-professional-interaction.json',
            'utf8',
          ));
          if (report.status !== 'PASS_TRACK_A_VISIBLE_INTERACTION') {
            throw new Error(`Unexpected Track A status ${report.status}.`);
          }
          if (report.candidateHead !== process.env.TOPOLOGY_EDIT_TARGET_HEAD_SHA) {
            throw new Error('Track A browser evidence is not bound to the exact head.');
          }
          if (report.productionIntegrated !== false
              || report.scenarios?.length !== 2
              || report.scenarios[0].gapMm !== 3
              || report.scenarios[1].gapMm !== 20) {
            throw new Error('Track A browser evidence is incomplete.');
          }
          for (const scenario of report.scenarios) {
            if (!scenario.acceptanceHash
                || !scenario.certificationHash
                || !scenario.candidateDraftHash
                || scenario.manualGapMm !== 250) {
              throw new Error(`Track A ${scenario.gapMm} mm evidence is incomplete.`);
            }
          }
          NODE

      - name: Patch hygiene
        run: |
          git diff --check "$BASE_REF...HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload Track A evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-professional-interaction-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: |
            reports/qualification/topology-edit-professional-interaction.json
            test-results/**
          if-no-files-found: error
          retention-days: 30
