name: LAFEA B2 Target Compatibility

on:
  pull_request:
    paths:
      - '.github/workflows/lafea-template-b2-target-compatibility.yml'
      - 'src/core/lafea-application-templates/index.js'
      - 'src/core/lafea-application-templates/target-compatibility.js'
      - 'src/workspace/lafea-target-compatibility-authority.js'
      - 'scripts/lafea-template-b2-target-compatibility-check.mjs'
      - 'docs/LAFEA_Bucket_B2_Target_Compatibility_Receipt.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lafea-b2-target-compatibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: B2 current target authority compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Assert exact checkout and base ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$PR_BASE_SHA" "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run B2 compatibility and anti-drift checks
        run: node scripts/lafea-template-b2-target-compatibility-check.mjs

      - name: Run B1 retained contract check
        run: node scripts/lafea-template-b1-release-record-v2-check.mjs

      - name: Run strict syntax checks
        run: npm run syntax:strict

      - name: Run import checks
        run: npm run check:imports

      - name: Build production bundle
        run: npm run build

      - name: Verify patch hygiene and clean tracked tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PR_BASE_SHA...HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
