name: LAFEA NB-T6C Physical Problem Batch

on:
  pull_request:
    paths:
      - '.github/workflows/lafea-nb-t6c-physical-problem-batch.yml'
      - 'src/workspace/lafea-controlled-continuum-execution-public.js'
      - 'src/workspace/lafea-controlled-continuum-public.js'
      - 'src/workspace/lafea-lug-pinhole-physical-problem-*.js'
      - 'src/workspace/lafea-lug-pinhole-stage-projector.js'
      - 'src/workspace/lafea-lug-pinhole-mesh-ladder.js'
      - 'src/workspace/lafea-lug-pinhole-mapping-evidence.js'
      - 'src/workspace/lafea-controlled-continuum-controller.js'
      - 'src/core/lafea-meshing/**'
      - 'src/core/lafea-application-templates/**'
      - 'scripts/lafea-nb-t6c-*.mjs'
      - 'scripts/lafea-nonbucket-stack-check.mjs'
      - 'docs/LAFEA_NonBucket_NB-T6C_Physical_Problem_Batch.md'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lafea-nb-t6c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: NB-T6C physical-problem projection and B7D handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Assert exact checkout and ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git merge-base --is-ancestor "$PR_BASE_SHA" "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run NB-T6C batch qualification
        shell: bash
        run: |
          set -o pipefail
          node scripts/lafea-nb-t6c-physical-problem-batch-check.mjs \
            2>&1 | tee lafea-nb-t6c-physical-problem-batch.log

      - name: Run retained NB-T6B mesh-ladder qualification
        run: node scripts/lafea-nb-t6b-lug-pinhole-mesh-ladder-check.mjs

      - name: Run retained B7D controller qualification
        run: node scripts/lafea-template-b7d-controlled-continuum-controller-check.mjs

      - name: Run non-bucket aggregate
        run: npm run check:lafea-nonbucket-stack

      - name: Run strict syntax checks
        run: npm run syntax:strict

      - name: Run import checks
        run: npm run check:imports

      - name: Build production bundle
        run: npm run build

      - name: Verify patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PR_BASE_SHA...HEAD"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"

      - name: Upload exact-head NB-T6C evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-nb-t6c-${{ github.event.pull_request.head.sha || github.sha }}
          path: lafea-nb-t6c-physical-problem-batch.log
          if-no-files-found: error
          retention-days: 30
