name: M041 Coupled Contact Friction

on:
  push:
    branches:
      - agent/m041-coupled-contact-friction
  pull_request:
    branches:
      - agent/m040-bm4-friction-oracle

permissions:
  contents: read

jobs:
  contact-friction:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check M041 source
        run: |
          node --check src/core/linear-fea-contact-friction-solver/contact-friction-contract.js
          node --check src/core/linear-fea-contact-friction-solver/contact-response.js
          node --check src/core/linear-fea-contact-friction-solver/state-evaluation.js
          node --check src/core/linear-fea-contact-friction-solver/uniqueness.js
          node --check src/core/linear-fea-contact-friction-solver/iteration.js
          node --check src/core/linear-fea-contact-friction-solver/index.js
          node --check scripts/lfea-m041-contact-friction-check.mjs
          node --check scripts/lfea-m041-linear-kernel-bridge-check.mjs
      - name: Run M041 closed-form, coupled and uniqueness qualification
        run: node scripts/lfea-m041-contact-friction-check.mjs
      - name: Run M041 real linear-kernel bridge qualification
        run: node scripts/lfea-m041-linear-kernel-bridge-check.mjs
      - name: Preserve M040 source/oracle boundary
        run: node scripts/lfea-m040-bm4-friction-check.mjs
      - name: Preserve M036 frictionless unilateral qualification
        run: npm run check:lfea-m036
      - name: Enforce bounded M041 source files
        run: |
          for file in \
            src/core/linear-fea-contact-friction-solver/contact-friction-contract.js \
            src/core/linear-fea-contact-friction-solver/contact-response.js \
            src/core/linear-fea-contact-friction-solver/state-evaluation.js \
            src/core/linear-fea-contact-friction-solver/uniqueness.js \
            src/core/linear-fea-contact-friction-solver/iteration.js \
            src/core/linear-fea-contact-friction-solver/index.js \
            scripts/lfea-m041-contact-friction-check.mjs \
            scripts/lfea-m041-linear-kernel-bridge-check.mjs; do
            lines=$(wc -l < "$file")
            test "$lines" -le 300 || { echo "$file has $lines lines (>300)"; exit 1; }
          done
      - name: Verify clean worktree
        run: git diff --exit-code && git status --porcelain | tee /tmp/m041-status && test ! -s /tmp/m041-status
