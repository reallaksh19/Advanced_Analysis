name: Topology Edit Wave 3B

on:
  pull_request:
    paths:
      - '.github/workflows/topology-edit-wave3b.yml'
      - 'src/workspace/topology-edit/topology-edit-command-contract.js'
      - 'src/workspace/topology-edit/topology-edit-command-resolver.js'
      - 'src/workspace/topology-edit/topology-edit-pure-reducer.js'
      - 'src/workspace/topology-edit/topology-edit-command-effect-validator.js'
      - 'src/workspace/topology-edit/topology-edit-autofix-controller.js'
      - 'src/workspace/topology-edit/topology-edit-render-packet.js'
      - 'tests/topology-edit-wave3b-autofix.test.mjs'
      - 'tests/topology-edit-wave1-*.test.mjs'
      - 'tests/topology-edit-wave3a-checker.test.mjs'
      - 'scripts/topology-edit-*.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-autofix:
    name: W3B certified ghost and autofix authority
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TOPOLOGY_EDIT_TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$TOPOLOGY_EDIT_TARGET_HEAD_SHA"

      - name: Install dependencies
        run: npm ci

      - name: Syntax and Wave 3B contracts
        run: |
          node --check src/workspace/topology-edit/topology-edit-command-contract.js
          node --check src/workspace/topology-edit/topology-edit-command-resolver.js
          node --check src/workspace/topology-edit/topology-edit-pure-reducer.js
          node --check src/workspace/topology-edit/topology-edit-command-effect-validator.js
          node --check src/workspace/topology-edit/topology-edit-autofix-controller.js
          node --check src/workspace/topology-edit/topology-edit-render-packet.js
          node --test tests/topology-edit-wave3b-autofix.test.mjs

      - name: Retain Wave 1 certification authority
        run: >-
          node --test
          tests/topology-edit-wave1-pure-kernel.test.mjs
          tests/topology-edit-wave1-candidate-certification.test.mjs
          tests/topology-edit-wave1-journal-replay.test.mjs
          tests/topology-edit-wave1-production-integration.test.mjs

      - name: Retain Wave 3A detection authority
        run: node --test tests/topology-edit-wave3a-checker.test.mjs

      - name: Source, API, coding, and import authority
        run: |
          node scripts/topology-edit-source-drift-check.mjs
          node scripts/topology-edit-api-drift-check.mjs
          node scripts/topology-edit-wave1-coding-rules-check.mjs
          node scripts/topology-edit-prohibited-imports.mjs

      - name: Production build
        run: npm run build

      - name: Write exact-head Wave 3B evidence
        run: |
          mkdir -p reports/qualification
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (head !== process.env.TOPOLOGY_EDIT_TARGET_HEAD_SHA) throw new Error('Exact-head mismatch.');
          const paths = [
            'src/workspace/topology-edit/topology-edit-command-contract.js',
            'src/workspace/topology-edit/topology-edit-command-resolver.js',
            'src/workspace/topology-edit/topology-edit-pure-reducer.js',
            'src/workspace/topology-edit/topology-edit-command-effect-validator.js',
            'src/workspace/topology-edit/topology-edit-autofix-controller.js',
            'src/workspace/topology-edit/topology-edit-render-packet.js',
            'tests/topology-edit-wave3b-autofix.test.mjs',
          ];
          const files = Object.fromEntries(paths.map((path) => [
            path,
            createHash('sha256').update(readFileSync(path)).digest('hex'),
          ]));
          const evidence = {
            schema: 'TopologyEditWave3BCertifiedAutofixEvidence.v1',
            repository: process.env.GITHUB_REPOSITORY,
            commit: head,
            status: 'PASS_CERTIFIED_AUTOFIX_KERNEL',
            publicNativeCommandCount: 7,
            governedAutofixCommands: [
              'ADD_BEND_DEFINITION',
              'ADD_JUNCTION_DEFINITION',
              'TRIM_EDGE',
            ],
            candidateRegeneratedGhost: true,
            targetIssueMustResolve: true,
            newCheckerFindingsAllowed: false,
            workspaceMutationAuthorized: false,
            files,
          };
          writeFileSync('reports/qualification/topology-edit-wave3b.json', `${JSON.stringify(evidence, null, 2)}\n`);
          NODE

      - name: Upload exact-head evidence
        uses: actions/upload-artifact@v4
        with:
          name: topology-edit-wave3b-${{ env.TOPOLOGY_EDIT_TARGET_HEAD_SHA }}
          path: reports/qualification/topology-edit-wave3b.json
          if-no-files-found: error
          retention-days: 30
