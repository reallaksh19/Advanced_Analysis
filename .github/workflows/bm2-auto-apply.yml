name: BM2 Autonomous Fix

on:
  push:
    branches:
      - agent/bm2-restraint-axis-bend-flexibility
    paths:
      - '.github/workflows/bm2-auto-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply governed patch
        shell: bash
        run: |
          set -euo pipefail
          gzip --decompress --stdout .github/bm2-fix.patch.gz > /tmp/bm2-fix.patch
          git apply --check /tmp/bm2-fix.patch
          git apply /tmp/bm2-fix.patch
          rm -f .github/bm2-fix.patch.gz
          rm -f .github/workflows/bm2-auto-source-export.yml
          rm -f .github/workflows/bm2-auto-apply.yml
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Qualify BM2 correction
        run: |
          set -euo pipefail
          node scripts/lfea-m031-bm2-qualified-check.mjs
          node scripts/lfea-b3.26-bm2-solve-comparison-check.mjs
          node scripts/lfea-bm2-consolidated-latest-output-check.mjs --write
          npm run check:lfea-bm1-cii-comparison
          npm run check:lfea-linear-core
      - name: Commit exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'reallaksh19'
          git config user.email 'reallaksh19@gmail.com'
          git add -A
          git commit -m 'fix(bm2): resolve restraint axes and collapsed bend action custody'
          git push origin HEAD:agent/bm2-restraint-axis-bend-flexibility
