name: M031 Follow-up Governed Publication

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/m031-followup-source-export.yml'
      - 'staging/m031-followup/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: m031-followup-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify-and-publish:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: ${{ github.head_ref || 'agent/m031-bm2-strict-gaps' }}
      PATCH_SHA256: 78e5cf826fbc74677b3f2d41d3f13b55a89e633864f04a261e60a35de3e0e7af
      PATCH_GZIP_SHA256: b9249e56598c570e2cde46d5b08f6abddb2046f5c42e93f0677720b4873b5fcf
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 1

      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"
          test -z "$(git status --porcelain)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Reconstruct and verify governed patch
        shell: bash
        run: |
          set -euo pipefail
          cat staging/m031-followup/patch-*.b64 | base64 --decode > /tmp/m031-followup.patch.gz
          echo "$PATCH_GZIP_SHA256  /tmp/m031-followup.patch.gz" | sha256sum --check
          gzip --decompress --stdout /tmp/m031-followup.patch.gz > /tmp/m031-followup.patch
          echo "$PATCH_SHA256  /tmp/m031-followup.patch" | sha256sum --check
          git apply --check /tmp/m031-followup.patch
          git apply /tmp/m031-followup.patch
          git diff --check

      - name: M031 mechanics and strict custody
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/lfea-m031-bm2-qualified-runtime.mjs
          node --check scripts/lfea-m031-bm2-qualified-check.mjs
          node --check scripts/lfea-b3.26-bm2-output-comparison-runtime.mjs
          node --check scripts/lfea-b3.26-bm2-solve-fixtures.mjs
          node --check scripts/lfea-b3.29-bm2-bend-geometry-authority-v2.mjs
          node --check src/core/linear-fea-solver/solve.js
          node scripts/lfea-m031-bm2-qualified-check.mjs | tee /tmp/m031-followup-qualified.log
          node scripts/lfea-b3.26-bm2-solve-comparison-check.mjs
          node scripts/lfea-bm2-consolidated-latest-output-check.mjs --write | tee /tmp/m031-followup-strict.log

      - name: Cross-benchmark and full-core regressions
        shell: bash
        run: |
          set -euo pipefail
          npm run check:lfea-bm1-cii-comparison
          node scripts/lfea-m028-bm3-check.mjs
          node scripts/lfea-m029-bm3-hanger-check.mjs
          node scripts/lfea-bm3-consolidated-latest-output-check.mjs
          npm run check:lfea-linear-core

      - name: Deterministic evidence replay
        shell: bash
        run: |
          set -euo pipefail
          sha256sum reports/bm2-consolidated-latest-output.json > /tmp/m031-report.sha256
          node scripts/lfea-bm2-consolidated-latest-output-check.mjs --write > /tmp/m031-followup-strict-replay.log
          sha256sum --check /tmp/m031-report.sha256

      - name: Publish qualified source and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git restore reports || true
          git clean -fd reports
          rm -rf staging/m031-followup
          git add \
            scripts/lfea-b3.26-bm2-output-comparison-runtime.mjs \
            scripts/lfea-b3.26-bm2-solve-fixtures.mjs \
            scripts/lfea-b3.29-bm2-bend-geometry-authority-v2.mjs \
            scripts/lfea-m031-bm2-qualified-check.mjs \
            scripts/lfea-m031-bm2-qualified-runtime.mjs \
            src/core/linear-fea-solver/solve.js
          git add -u staging/m031-followup
          git diff --cached --check
          test -z "$(git status --porcelain | grep '^??' || true)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(m031): close BM2 restraint, conditioning, and reporting gaps"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: m031-followup-publication-${{ env.TARGET_HEAD_SHA }}
          path: |
            /tmp/m031-followup-qualified.log
            /tmp/m031-followup-strict.log
            /tmp/m031-report.sha256
          if-no-files-found: error
          retention-days: 30
