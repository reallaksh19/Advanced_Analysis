name: M031 Follow-up Source Export

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/m031-followup-source-export.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_HEAD_SHA }}
          fetch-depth: 1
      - name: Verify immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD_SHA"
          test -z "$(git status --porcelain)"
      - name: Archive exact source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/m031-followup-source.tar.gz HEAD
          sha256sum /tmp/m031-followup-source.tar.gz > /tmp/m031-followup-source.sha256
      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: m031-followup-source-${{ env.TARGET_HEAD_SHA }}
          path: |
            /tmp/m031-followup-source.tar.gz
            /tmp/m031-followup-source.sha256
          if-no-files-found: error
          retention-days: 1
