name: LAFEA Bucket-01 Mesh Pattern Diagnostic

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  pattern:
    strategy:
      fail-fast: false
      matrix:
        pattern:
          - checkerboard-odd
          - checkerboard-even
          - sector-odd
          - sector-even
          - ring-odd
          - ring-even
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute deterministic mesh-pattern experiment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          PATTERN: ${{ matrix.pattern }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qualification
          context="lafea/mesh-pattern/${PATTERN}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context="$context" \
            -f description="Executing ${PATTERN} annular diagonals"

          python - <<'PY'
          import os
          import re
          from pathlib import Path

          expressions = {
              'checkerboard-odd': '(ring + sector) % 2 === 1',
              'checkerboard-even': '(ring + sector) % 2 === 0',
              'sector-odd': 'sector % 2 === 1',
              'sector-even': 'sector % 2 === 0',
              'ring-odd': 'ring % 2 === 1',
              'ring-even': 'ring % 2 === 0',
          }
          expression = expressions[os.environ['PATTERN']]
          source_path = Path('src/core/lafea-meshing/lug-pinhole-t6.js')
          text = source_path.read_text()
          pattern = re.compile(
              r"(?P<indent>\s*)addT6Element\(state, `E-R\$\{ring\}-S\$\{sector\}-A`, \[\s*"
              r"innerA, outerA, outerB,\s*\]\);\s*"
              r"addT6Element\(state, `E-R\$\{ring\}-S\$\{sector\}-B`, \[\s*"
              r"innerA, outerB, innerB,\s*\]\);"
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise RuntimeError(f'element split structural match count={len(matches)}')
          indent = matches[0].group('indent').split('\n')[-1]
          ring_token = '{ring}'
          sector_token = '{sector}'
          replacement = '\n'.join([
              f'{indent}const alternateDiagonal = {expression};',
              f'{indent}if (alternateDiagonal) {{',
              f'{indent}  addT6Element(state, `E-R${ring_token}-S${sector_token}-A`, [',
              f'{indent}    innerA, outerA, innerB,',
              f'{indent}  ]);',
              f'{indent}  addT6Element(state, `E-R${ring_token}-S${sector_token}-B`, [',
              f'{indent}    outerA, outerB, innerB,',
              f'{indent}  ]);',
              f'{indent}}} else {{',
              f'{indent}  addT6Element(state, `E-R${ring_token}-S${sector_token}-A`, [',
              f'{indent}    innerA, outerA, outerB,',
              f'{indent}  ]);',
              f'{indent}  addT6Element(state, `E-R${ring_token}-S${sector_token}-B`, [',
              f'{indent}    innerA, outerB, innerB,',
              f'{indent}  ]);',
              f'{indent}}}',
          ])
          source_path.write_text(pattern.sub(lambda _: replacement, text, count=1))
          PY

          node scripts/lafea-bucket-01-production-response-runner.mjs \
            > "reports/qualification/${PATTERN}-runner.stdout.log" \
            2> "reports/qualification/${PATTERN}-runner.stderr.log"
          set +e
          node scripts/lafea-bucket-01-production-response-receipt.mjs \
            > "reports/qualification/${PATTERN}-receipt.stdout.log" \
            2> "reports/qualification/${PATTERN}-receipt.stderr.log"
          receipt_exit=$?
          set -e
          summary=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync(
            'reports/qualification/lafea-bucket-01-production-response.json',
            'utf8',
          ));
          const value = {
            pattern: process.env.PATTERN,
            status: report.status,
            fineGridGci: report.energyConvergence.fineGridGci,
            observedOrder: report.energyConvergence.observedOrder,
            energies: report.energyConvergence.observations,
            reasons: report.reasons,
          };
          process.stdout.write(JSON.stringify(value));
          NODE
          )
          gci=$(node -e "const r=JSON.parse(process.argv[1]);process.stdout.write(String(r.fineGridGci))" "$summary")
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$summary")
          if [[ "$receipt_exit" == "0" ]]; then
            state=success
            description="${PATTERN} passed; fine-grid GCI ${gci}"
          else
            state=failure
            description="${PATTERN} blocked; fine-grid GCI ${gci}"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="$context" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_pattern=${encoded}"
          exit "$receipt_exit"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-mesh-pattern-${{ matrix.pattern }}-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
