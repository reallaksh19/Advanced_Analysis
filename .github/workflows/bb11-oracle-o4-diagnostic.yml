name: BB-11 oracle O4 convergence diagnostic

on:
  push:
    branches:
      - fix/bb11-governed-oracle-interface-continuity

permissions:
  contents: read

jobs:
  diagnose-o4:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TZ: UTC
      LC_ALL: C
      BB11_DIAGNOSTICS: '1'
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bb11-governed-oracle-interface-continuity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Materialize repaired oracle and diagnostic O4
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/bb11-oracle-interface-bootstrap.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          exec(compile(dedent(workflow[start:end]), '<materializer>', 'exec'))

          path = Path('src/core/bucket-b/flange-hub-independent-oracle.js')
          source = path.read_text()
          old = "  Object.freeze({ levelId: 'O3', refinement: 8 }),\n]);"
          new = "  Object.freeze({ levelId: 'O3', refinement: 8 }),\n  Object.freeze({ levelId: 'O4', refinement: 16 }),\n]);"
          if source.count(old) != 1:
              raise SystemExit('ORACLE_O4_LEVEL_INSERTION_FAILED')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check src/core/bucket-b/flange-hub-independent-oracle.js

      - name: Execute O0-O4 oracle and print tails
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          timeout --signal=TERM --kill-after=60s 45m node --input-type=module <<'NODE' | tee reports/bb11-oracle-o4.json
          import { runIndependentFlangeHubOracle } from './src/core/bucket-b/flange-hub-independent-oracle.js';
          const output = [];
          for (const loadCaseId of ['FH-PRES-001', 'FH-AXIAL-001', 'FH-GASKET-001']) {
            const report = runIndependentFlangeHubOracle(loadCaseId);
            output.push({
              loadCaseId,
              status: report.status,
              rows: report.convergence.rows,
              levels: report.levels.map(({ levelId, nodeCount, elementCount, solver }) => ({
                levelId,
                nodeCount,
                elementCount,
                solver,
              })),
            });
          }
          process.stdout.write(`${JSON.stringify(output, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: bb11-oracle-o4-${{ github.sha }}
          path: reports
          retention-days: 30
