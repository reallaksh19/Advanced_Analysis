name: preproduction-thermal-liftoff-local-screen

on:
  pull_request:
    branches:
      - agent/preproduction-thermal-liftoff-prerequisites
    paths:
      - 'src/workspace/engineering-loads/preproduction-thermal-liftoff-local-screen-intake.js'
      - 'src/workspace/engineering-loads/preproduction-thermal-liftoff-local-screen.js'
      - 'scripts/preproduction-thermal-liftoff-local-screen-check.mjs'
      - 'scripts/preproduction-thermal-liftoff-local-screen-source-guard.mjs'
      - '.github/workflows/preproduction-thermal-liftoff-local-screen.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-preproduction-thermal-liftoff-local-screen:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact requested head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Prove exact head and clean worktree
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          fi
          git diff --exit-code

      - name: Enforce five-path TL-03 batch containment
        shell: bash
        run: |
          BASE_SHA="8b9704f780648ae9cc05f7f8f2d15e35027e8164"
          HEAD_SHA="$(git rev-parse HEAD)"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/tl03-paths.txt
          while IFS= read -r changed; do
            case "$changed" in
              src/workspace/engineering-loads/preproduction-thermal-liftoff-local-screen-intake.js|src/workspace/engineering-loads/preproduction-thermal-liftoff-local-screen.js|scripts/preproduction-thermal-liftoff-local-screen-check.mjs|scripts/preproduction-thermal-liftoff-local-screen-source-guard.mjs|.github/workflows/preproduction-thermal-liftoff-local-screen.yml) ;;
              *) echo "Forbidden changed path for TL-03 local-screen batch: $changed"; exit 1 ;;
            esac
          done < /tmp/tl03-paths.txt
          test "$(wc -l < /tmp/tl03-paths.txt)" -eq 5

      - name: Install dependencies
        run: npm ci

      - name: Syntax check TL-03 batch
        run: |
          node --check src/workspace/engineering-loads/preproduction-thermal-liftoff-local-screen-intake.js
          node --check src/workspace/engineering-loads/preproduction-thermal-liftoff-local-screen.js
          node --check scripts/preproduction-thermal-liftoff-local-screen-check.mjs
          node --check scripts/preproduction-thermal-liftoff-local-screen-source-guard.mjs

      - name: Requalify current-head support/contact authority
        run: |
          node scripts/preproduction-support-contact-source-guard.mjs
          node scripts/preproduction-support-contact-authority-check.mjs

      - name: Requalify TL-01 TL-02 and reaction-tolerance prerequisites
        run: node scripts/preproduction-thermal-liftoff-prerequisites-check.mjs

      - name: Requalify Appendix S benchmark evidence
        run: node scripts/empirical-appendix-s-vertical-benchmark.mjs

      - name: Enforce TL-03 source boundary
        run: node scripts/preproduction-thermal-liftoff-local-screen-source-guard.mjs

      - name: Qualify TL-03 local screen
        run: node scripts/preproduction-thermal-liftoff-local-screen-check.mjs

      - name: Import graph
        run: npm run check:imports

      - name: Production build
        run: npm run build
