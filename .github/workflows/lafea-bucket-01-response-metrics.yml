name: LAFEA Bucket-01 Production Response Metrics

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute production response and publish metrics
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qualification
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context=lafea/production-response-metrics \
            -f description="Executing retained production response"
          node scripts/lafea-bucket-01-production-response-runner.mjs \
            > reports/qualification/diagnostic-runner.stdout.log \
            2> reports/qualification/diagnostic-runner.stderr.log
          set +e
          node scripts/lafea-bucket-01-production-response-receipt.mjs \
            > reports/qualification/diagnostic-receipt.stdout.log \
            2> reports/qualification/diagnostic-receipt.stderr.log
          exit_code=$?
          set -e
          detail=$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'reports/qualification/lafea-bucket-01-production-response.json';
          const report = fs.existsSync(path)
            ? JSON.parse(fs.readFileSync(path, 'utf8'))
            : null;
          const compact = report ? {
            status: report.status,
            reasons: report.reasons ?? [],
            energyConvergence: report.energyConvergence ?? null,
            momentConvergence: report.momentConvergence ?? null,
            levels: (report.levelEvidence ?? []).map((row) => ({
              ordinal: row.ordinal,
              elementCount: row.elementCount,
              solverMethod: row.solverMethod,
              totalStrainEnergy: row.totalStrainEnergy,
              halfExternalWork: row.halfExternalWork,
              forceEquilibriumRelative: row.forceEquilibriumRelative,
              momentEquilibriumRelative: row.momentEquilibriumRelative,
              energyReconstructionRelative: row.energyReconstructionRelative,
              status: row.status,
              reasons: row.reasons ?? [],
            })),
          } : {
            status: 'REPORT_MISSING',
            stdout: fs.existsSync('reports/qualification/diagnostic-receipt.stdout.log')
              ? fs.readFileSync('reports/qualification/diagnostic-receipt.stdout.log', 'utf8').slice(-3000)
              : null,
            stderr: fs.existsSync('reports/qualification/diagnostic-receipt.stderr.log')
              ? fs.readFileSync('reports/qualification/diagnostic-receipt.stderr.log', 'utf8').slice(-3000)
              : null,
          };
          process.stdout.write(JSON.stringify(compact));
          NODE
          )
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
          description=$(node -e "const r=JSON.parse(process.argv[1]);const reason=r.reasons?.[0]??r.status??'unknown';process.stdout.write(String(reason).slice(0,135))" "$detail")
          if [[ "$exit_code" == "0" ]]; then state=success; else state=failure; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context=lafea/production-response-metrics \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_metrics=${encoded}"
          exit "$exit_code"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-production-response-metrics-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
