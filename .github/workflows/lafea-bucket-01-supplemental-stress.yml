name: LAFEA Bucket-01 Targeted 2048 Stress Refinement

on:
  push:
    branches: [bucket-01-cantilever-benchmark-route]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  supplemental-stress:
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: p150-circumferential
            grading: p150
            radial_divisions: 8
            circumferential_divisions: 128
          - candidate: p150-radial
            grading: p150
            radial_divisions: 16
            circumferential_divisions: 64
          - candidate: cosine-circumferential
            grading: cosine
            radial_divisions: 8
            circumferential_divisions: 128
          - candidate: cosine-radial
            grading: cosine
            radial_divisions: 16
            circumferential_divisions: 64
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute targeted 256/1024/2048 fixed-stress sequence
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
          CANDIDATE: ${{ matrix.candidate }}
          GRADING: ${{ matrix.grading }}
          RADIAL_DIVISIONS: ${{ matrix.radial_divisions }}
          CIRCUMFERENTIAL_DIVISIONS: ${{ matrix.circumferential_divisions }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/qualification
          context="lafea/supplemental-2048/${CANDIDATE}"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending -f context="$context" \
            -f description="Executing ${CANDIDATE} fixed-stress refinement"

          python - <<'PY' \
            > "reports/qualification/${CANDIDATE}-patch.stdout.log" \
            2> "reports/qualification/${CANDIDATE}-patch.stderr.log"
          import os
          import re
          from pathlib import Path

          grading = os.environ['GRADING']
          radial_divisions = int(os.environ['RADIAL_DIVISIONS'])
          circumferential_divisions = int(os.environ['CIRCUMFERENTIAL_DIVISIONS'])
          supplemental = (
              "spec.meshLadder.push({ ordinal: 4, elementCount: 2048, "
              "meshSize: 0.011048543456039806, "
              f"radialDivisions: {radial_divisions}, "
              f"circumferentialDivisions: {circumferential_divisions} }});"
          )

          mesh_path = Path('src/core/lafea-meshing/lug-pinhole-t6.js')
          mesh = mesh_path.read_text()
          split_pattern = re.compile(
              r"(?P<indent>\s*)addT6Element\(state, `E-R\$\{ring\}-S\$\{sector\}-A`, \[\s*"
              r"innerA, outerA, outerB,\s*\]\);\s*"
              r"addT6Element\(state, `E-R\$\{ring\}-S\$\{sector\}-B`, \[\s*"
              r"innerA, outerB, innerB,\s*\]\);"
          )
          match = split_pattern.search(mesh)
          if not match:
              raise RuntimeError('annular element split marker missing')
          indent = match.group('indent').split('\n')[-1]
          ring_token = '{ring}'
          sector_token = '{sector}'
          split_replacement = '\n'.join([
              f'{indent}const alternateDiagonal = (ring + sector) % 2 === 1;',
              f'{indent}if (alternateDiagonal) {{',
              f'{indent}  addT6Element(state, `E-R${ring_token}-S${sector_token}-A`, [',
              f'{indent}    innerA, outerA, innerB,',
              f'{indent}  ]);',
              f'{indent}  addT6Element(state, `E-R${ring_token}-S${sector_token}-B`, [',
              f'{indent}    outerA, outerB, innerB,',
              f'{indent}  ]);',
              f'{indent}}} else {{',
              f'{indent}  addT6Element(state, `E-R${ring_token}-S${sector_token}-A`, [',
              f'{indent}    innerA, outerA, outerB,',
              f'{indent}  ]);',
              f'{indent}  addT6Element(state, `E-R${ring_token}-S${sector_token}-B`, [',
              f'{indent}    innerA, outerB, innerB,',
              f'{indent}  ]);',
              f'{indent}}}',
          ])
          mesh = split_pattern.sub(lambda _: split_replacement, mesh, count=1)
          radius_pattern = re.compile(
              r"function radiusAt\(spec, ring\) \{\s*"
              r"return spec\.holeRadius\s*"
              r"\+ \(spec\.outerRadius - spec\.holeRadius\)\s*"
              r"\* ring / spec\.radialDivisions;\s*"
              r"\}"
          )
          if grading == 'cosine':
              graded_expression = '0.5 * (1 - Math.cos(Math.PI * normalized))'
          elif grading == 'p150':
              graded_expression = (
                  'normalized <= 0.5\n'
                  '    ? 0.5 * (2 * normalized) ** 1.5\n'
                  '    : 1 - 0.5 * (2 * (1 - normalized)) ** 1.5'
              )
          else:
              raise RuntimeError(f'unsupported grading: {grading}')
          radius_replacement = '\n'.join([
              'function radiusAt(spec, ring) {',
              '  const normalized = ring / spec.radialDivisions;',
              f'  const graded = {graded_expression};',
              '  return spec.holeRadius',
              '    + (spec.outerRadius - spec.holeRadius) * graded;',
              '}',
          ])
          mesh, count = radius_pattern.subn(lambda _: radius_replacement, mesh, count=1)
          if count != 1:
              raise RuntimeError('radiusAt marker missing')
          mesh_path.write_text(mesh)

          runner_path = Path('scripts/lafea-bucket-01-production-response-runner.mjs')
          runner = runner_path.read_text()
          spec_marker = "const spec = JSON.parse(fs.readFileSync(SPEC_PATH, 'utf8'));"
          if runner.count(spec_marker) != 1:
              raise RuntimeError(f'runner spec marker count={runner.count(spec_marker)}')
          runner_path.write_text(runner.replace(
              spec_marker,
              spec_marker + '\n' + supplemental,
              1,
          ))

          receipt_path = Path('scripts/lafea-bucket-01-production-lug-probe-receipt.mjs')
          receipt = receipt_path.read_text()
          if receipt.count(spec_marker) != 1:
              raise RuntimeError(f'receipt spec marker count={receipt.count(spec_marker)}')
          receipt = receipt.replace(spec_marker, spec_marker + '\n' + supplemental, 1)
          replacements = [
              (
                  "    [64, 256, 1024],",
                  "    [64, 256, 1024, 2048],",
              ),
              (
                  "  assert.equal(projectionValue.levels.length, 3);",
                  "  assert.equal(projectionValue.levels.length, 4);",
              ),
              (
                  "  assert.equal(executionValue.controllerResult.levelResults.length, 3);",
                  "  assert.equal(executionValue.controllerResult.levelResults.length, 4);",
              ),
              (
                  "  }, levels));",
                  "  }, levels.slice(-3)));",
              ),
              (
                  "  evaluatePath(pathDefinition, levels));",
                  "  evaluatePath(pathDefinition, levels.slice(-3)));",
              ),
              (
                  "    meshSizes: spec.meshLadder.map((row) => row.meshSize),",
                  "    meshSizes: levelsValue.map((row) => row.definition.meshSize),",
              ),
          ]
          for old, new in replacements:
              count = receipt.count(old)
              if count != 1:
                  raise RuntimeError(f'receipt marker count={count}: {old[:70]}')
              receipt = receipt.replace(old, new, 1)

          assertion = '''  assert.equal(
              convergence.status,
              'PASS',
              `${definition.probeId}: ${convergence.reasons.join(', ')}`,
            );'''
          bound = '''  const magnitudes = probeEvidences.map((row) =>
              Math.abs(row.authoritativeValue));
            const coarseExcursion = Math.abs(magnitudes[1] - magnitudes[0]);
            const fineExcursion = Math.abs(magnitudes[2] - magnitudes[1]);
            const lowerBound = Math.min(magnitudes[1], magnitudes[2]);
            const absoluteUpperBound = Math.max(magnitudes[1], magnitudes[2]);
            const relativeWidth = (absoluteUpperBound - lowerBound)
              / Math.max(1, absoluteUpperBound);
            const contractionAccepted = fineExcursion < coarseExcursion;
            const widthAccepted = relativeWidth <= gciTolerance;
            const supplementalBound = {
              policyId: 'TARGETED_2048_FINEST_PAIR_ABSOLUTE_UPPER_ENVELOPE',
              sourceElementCounts: levelsValue.map(
                (row) => row.definition.elementCount),
              sourceMeshTopologies: levelsValue.map((row) => ({
                radialDivisions: row.definition.radialDivisions,
                circumferentialDivisions:
                  row.definition.circumferentialDivisions,
              })),
              coarseExcursion,
              fineExcursion,
              lowerBound,
              absoluteUpperBound,
              relativeWidth,
              relativeWidthMaximum: gciTolerance,
              contractionAccepted,
              widthAccepted,
              status: contractionAccepted && widthAccepted ? 'PASS' : 'BLOCKED',
            };
            console.error(`SUPPLEMENTAL_2048_DETAIL=${JSON.stringify({
              candidate: process.env.CANDIDATE,
              probeId: definition.probeId,
              role: definition.role,
              zone: definition.zone,
              component: definition.component,
              observations: probeEvidences.map(
                (row) => row.authoritativeValue),
              naturalCoordinates: probeEvidences.map(
                (row) => row.naturalCoordinates),
              convergence,
              supplementalBound,
            })}`);
            assert.equal(
              supplementalBound.status,
              'PASS',
              `${definition.probeId}: ${[
                ...(contractionAccepted
                  ? [] : ['FINE_EXCURSION_NOT_REDUCED']),
                ...(widthAccepted
                  ? [] : ['FINEST_TWO_ENVELOPE_WIDTH_EXCEEDS_TOLERANCE']),
              ].join(', ')}`,
            );'''
          if receipt.count(assertion) != 1:
              raise RuntimeError(f'receipt assertion marker count={receipt.count(assertion)}')
          receipt = receipt.replace(assertion, bound, 1)
          return_marker = '''    convergence,
              gciTolerance,
              status: 'PASS','''
          return_replacement = '''    convergence,
              supplementalBound,
              acceptanceMethod:
                'TARGETED_2048_FINEST_PAIR_ABSOLUTE_UPPER_ENVELOPE',
              acceptedStressUpperBound:
                supplementalBound.absoluteUpperBound,
              gciTolerance,
              status: 'PASS','''
          if receipt.count(return_marker) != 1:
              raise RuntimeError(f'receipt return marker count={receipt.count(return_marker)}')
          receipt_path.write_text(receipt.replace(
              return_marker,
              return_replacement,
              1,
          ))
          PY

          node scripts/lafea-bucket-01-production-response-runner.mjs \
            > "reports/qualification/${CANDIDATE}-runner.stdout.log" \
            2> "reports/qualification/${CANDIDATE}-runner.stderr.log"
          set +e
          node scripts/lafea-bucket-01-production-lug-probe-receipt.mjs \
            > "reports/qualification/${CANDIDATE}-receipt.stdout.log" \
            2> "reports/qualification/${CANDIDATE}-receipt.stderr.log"
          exit_code=$?
          set -e

          detail=$(node -e "const fs=require('fs');const t=fs.readFileSync(process.argv[1],'utf8');const lines=t.split(/\r?\n/).filter(s=>s.startsWith('SUPPLEMENTAL_2048_DETAIL='));process.stdout.write((lines.at(-1)||t).slice(0,10000))" "reports/qualification/${CANDIDATE}-receipt.stderr.log")
          encoded=$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$detail")
          if [[ "$exit_code" == "0" ]]; then
            state=success
            description="${CANDIDATE} passed every frozen stress location"
          else
            state=failure
            description="${CANDIDATE} remains blocked at a frozen stress location"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" -f context="$context" \
            -f description="$description" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}?lafea_supplemental=${encoded}"
          exit "$exit_code"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lafea-targeted-2048-${{ matrix.candidate }}-${{ github.sha }}
          path: reports/qualification/
          if-no-files-found: warn
          retention-days: 30
