name: CII Import Boundary Certification

on:
  pull_request:
    paths:
      - 'scripts/import-check.mjs'
      - 'src/calc-workspace/cii-standalone-port/xml-cii-table-trace-table.js'
      - '.github/workflows/cii-import-boundary-certification.yml'
      - 'scripts/cii-import-boundary-workflow-check.mjs'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact correction head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate dedicated workflow contract
        run: node scripts/cii-import-boundary-workflow-check.mjs

      - name: Detect issue 93 correction package
        id: correction
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only "$PR_BASE_SHA...HEAD" | sort)"
          expected="$(printf '%s\n' \
            'scripts/import-check.mjs' \
            'src/calc-workspace/cii-standalone-port/xml-cii-table-trace-table.js' | sort)"
          if [[ "$actual" == "$expected" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm workflow-only bootstrap scope
        if: steps.correction.outputs.present != 'true'
        run: echo 'Workflow bootstrap only; issue #93 behavior is not qualified on this head.'

      - name: Install repository dependencies
        if: steps.correction.outputs.present == 'true'
        run: npm ci

      - name: Execute repository import boundary
        if: steps.correction.outputs.present == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run check:imports 2>&1 | tee cii-import-boundary.log

      - name: Execute strict syntax gate
        if: steps.correction.outputs.present == 'true'
        run: npm run syntax:strict

      - name: Validate restored trace field contract
        if: steps.correction.outputs.present == 'true'
        run: |
          node --input-type=module -e "import('./src/calc-workspace/cii-standalone-port/xml-cii-table-trace-table.js').then(({ REQUIRED_TRACE_TABLE_FIELD_NAMES: value }) => { const expected = ['componentRef','lineId','nps','wt']; if (!Object.isFrozen(value) || JSON.stringify(value) !== JSON.stringify(expected)) process.exit(1); })"

      - name: Build exact correction head
        if: steps.correction.outputs.present == 'true'
        run: npm run build

      - name: Check exact base-to-head diff
        if: steps.correction.outputs.present == 'true'
        run: git diff --check "$PR_BASE_SHA...HEAD"

      - name: Require clean checkout
        if: steps.correction.outputs.present == 'true'
        run: test -z "$(git status --short)"

      - name: Upload import boundary log
        if: always() && steps.correction.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cii-import-boundary-certification
          path: cii-import-boundary.log
          if-no-files-found: error
          retention-days: 7
